<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ライセンス | Agent Cockpit</title>
  <link rel="icon" type="image/png" href="assets/app-icon-256.png">
  <style>
    :root { color-scheme: dark; --bg: #1a1a18; --panel: #252523; --text: #faf9f5; --muted: #b7b5a9; --link: #f2a78e; --line: #3c3c37; --code-bg: #2f2f2c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: "Yu Gothic UI", "Meiryo", system-ui, sans-serif; font-size: 15px; line-height: 1.75; }
    main { width: min(100% - 2rem, 54rem); margin: 4rem auto; }
    article { padding: clamp(1.25rem, 5vw, 3.5rem); background: var(--panel); border: 1px solid var(--line); border-radius: 1.25rem; }
    h1 { margin-top: 0; font-size: clamp(2rem, 6vw, 3.25rem); line-height: 1.2; }
    h2 { margin-top: 2.5rem; font-size: 1.35rem; }
    p, li { max-width: 68ch; }
    a { color: var(--link); overflow-wrap: anywhere; }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 4px; }
    code { background: var(--code-bg); border: 1px solid var(--line); border-radius: .35rem; padding: 0 .3rem; font-size: .9em; }
    .page-links { margin: 0 0 12px; }
    nav { margin-top: 2rem; display: flex; flex-wrap: wrap; gap: 1rem; }
    @media (max-width: 640px) { main { margin: 1rem auto; } }
  </style>
</head>
<body><main><article>
  <p class="page-links"><a href="./">トップページ</a> | <a href="https://github.com/ktysne/agent-cockpit">GitHub</a></p>
  <h1>ライセンス情報</h1>
  <p>Agent Cockpit 本体と、配布物に含むソフトウェアのライセンスを示します。</p>

  <h2>Agent Cockpit</h2>
  <p>Agent Cockpit の著作権は作者 ktysne に帰属します。</p>

  <h2>第三者のソフトウェア</h2>
  <p>Agent Cockpit は外部のパッケージを使わず、第三者のソフトウェアを同梱していません。動かすときは、利用者が入れた Node.js を使います。</p>

  <nav aria-label="Agent Cockpit のページ">
    <a href="./">トップページ</a>
    <a href="https://github.com/ktysne/agent-cockpit">GitHub</a>
  </nav>
</article></main></body>
</html>
