<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{DOCUMENT_TITLE}}</title>
<link rel="stylesheet" href="assets/manual.css">
{{HELP_ANCHORS}}
<script defer src="assets/search-index.js"></script>
<script defer src="assets/manual.js"></script>
</head>
<body>
<a class="skip-link" href="#main-content">本文へ</a>
<header class="site-header">
  <a class="brand" href="index.html">Agent Cockpit</a>
  <span class="brand-sub">利用者向けマニュアル</span>
  <search>
  <form class="manual-search" autocomplete="off" data-site-root="./">
    <label class="sr-only" for="manual-search-input">マニュアルを検索</label>
    <input id="manual-search-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="manual-search-results" aria-describedby="manual-search-status" placeholder="マニュアルを検索">
    <ul id="manual-search-results" class="manual-search-results" role="listbox" aria-label="検索結果" hidden></ul>
    <div id="manual-search-status" class="sr-only" role="status" aria-live="polite"></div>
  </form>
  </search>
</header>
<div class="page-wrap">
  <div class="page-columns">
    <nav class="toc pages-toc" aria-label="ページ一覧">
      <h2>ページ一覧</h2>
      <ol class="nav-groups">
{{NAV_LINKS}}
      </ol>
    </nav>
    <main id="main-content" tabindex="-1">
      <details class="toc mobile-pages-toc">
        <summary>ページ一覧</summary>
        <ol class="nav-groups">
{{NAV_LINKS}}
        </ol>
      </details>
      <details class="toc mobile-page-toc">
        <summary>このページの内容</summary>
        <ol>{{SECTION_LINKS}}</ol>
      </details>
{{CONTENT}}
{{PAGE_NAV}}
    </main>
    <nav class="toc page-toc" aria-label="このページの内容">
      <h2>このページの内容</h2>
      <ol>{{SECTION_LINKS}}</ol>
    </nav>
  </div>
</div>
<footer>Agent Cockpit 利用者向けマニュアル</footer>
</body>
</html>
