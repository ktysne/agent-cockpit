}

function renderToolLine(tool) {
  const separator = tool.indexOf(': ');
  const name = separator < 0 ? '' : tool.slice(0, separator);
  const content = separator < 0 ? tool : tool.slice(separator + 2);
  return '<div class="tool-line">' + (name ? '<span class="tool-name" title="' + esc(name) + '">' + esc(name) + '</span>' : '') + '<span class="tool-content">' + esc(content) + '</span></div>';
}

const closedAgentKey = (session, agent) => `${session.id}::${agent.id || agent.type}`;
// メイン直下の背景 Codex は、メインのターンが終わっても動き続けるので稼働中のまま出し、画面から閉じられるようにする。
const isMainBackgroundCodex = agent => agent.isCodex === true && agent.backgrounded === true && !agent.parent_agent_id && agent.state === 'busy';
const isClosedByUser = (session, agent) => ui.closedAgents.includes(closedAgentKey(session, agent));
const isBusyAgent = (session, agent) => agent.state === 'busy' && !isClosedByUser(session, agent);
const isClosable = (session, agent) => (!!agent.unconfirmed || isMainBackgroundCodex(agent)) && !isClosedByUser(session, agent);
const isUnconfirmed = (session, agent) => !!agent.unconfirmed && !isClosedByUser(session, agent);
const isEndedAgent = (session, agent) => (agent.state === 'done' || isClosedByUser(session, agent)) && !isClosable(session, agent);

function isFinishedSession(session) {
  return session.status === 'wait'
    && session.tasks.every(task => taskState(session, task) === 'done')
    && session.decisions.every(decision => ['resolved', 'withdrawn'].includes(effectiveDecisionState(decision)))
    && session.perms.length === 0
    && !session.subagents.some(agent => !isEndedAgent(session, agent));
}

function agentRow(p, session, agent, withTag) {
  const state = isClosedByUser(session, agent) ? ['終了', 'done'] : isBusyAgent(session, agent) ? ['稼働中', 'busy'] : isUnconfirmed(session, agent) ? ['終了未確認', 'wait'] : ['終了', 'done'];
  const close = isClosable(session, agent) ? `<button type="button" class="link-btn close-agent" data-close-agent="${esc(closedAgentKey(session, agent))}">終了にする</button>` : '';
  return `<div class="agent-row">
    <div class="who"><span class="dot ${state[1]}"></span>サブエージェント${sessionTag(p, session, withTag)}<span class="agent-name"><span class="badge ${state[1]}">${state[0]}</span><b>${esc(agent.type)}</b>${close}</span></div>
    <div>${esc(agent.text)}${modelLine(agent, routeTag(agent))}</div><div class="since">${esc(agent.since)}</div></div>`;
}

function endedAgentToggle(session) {
  if (ui.hideFinished) return '';
  const ended = session.subagents.filter(agent => isEndedAgent(session, agent));
  if (!ended.length) return '';
  const expanded = ui.expandedEndedAgents.includes(session.id);
  const label = expanded ? '終了済みを隠す' : '終了済みを表示';
  return `<button type="button" class="ended-toggle" data-ended-agents="${esc(session.id)}" aria-expanded="${expanded}">${label} (${ended.length} 件)</button>`;
}

function agentSection(p, session, withTag) {
  const expanded = !ui.hideFinished && ui.expandedEndedAgents.includes(session.id);
  const agents = visibleSubagents(session).filter(agent => !isEndedAgent(session, agent) || expanded)
    .sort((a, b) => ageMinutes(a) - ageMinutes(b));
  const rows = agents.map(agent => agentRow(p, session, agent, withTag)).join('');
  const hasEnded = !ui.hideFinished && session.subagents.some(agent => isEndedAgent(session, agent));
  const toggle = endedAgentToggle(session);
  if (!isShown('agents') && !rows && !toggle) return '';
  const empty = hasEnded ? '稼働中のサブエージェントはありません。' : 'サブエージェントはありません。';
  const hiddenRunning = session.subagents.some(agent => isBusyAgent(session, agent) && !isShown('agents'));
  return `<h3 class="sub">サブエージェント</h3>${rows ? `<div class="agent-list">${rows}</div>` : hiddenRunning ? '' : `<div class="empty">${empty}</div>`}${toggle}`;
}

// 画面で完了にしたタスクは常駐サーバーが覚え、セッションがそのタスクの状態を変えるまで完了として出す。
const closedTaskKey = (session, t) => `${session.id}::${t.title}`;
const taskState = (session, t) => ui.closedTasks.includes(closedTaskKey(session, t)) ? 'done' : t.state;

function scheduleTaskClose(key) {
  if (pendingClosedTasks.has(key)) return;
  const timer = setTimeout(() => {
    if (pendingClosedTasks.get(key) !== timer) return;
    pendingClosedTasks.delete(key);
    if (!ui.closedTasks.includes(key)) ui.closedTasks.push(key);
    save();
    render();
  }, 5_000);
  pendingClosedTasks.set(key, timer);
  render();
}

function cancelTaskClose(key) {
  const timer = pendingClosedTasks.get(key);
  if (timer === undefined) return;
  clearTimeout(timer);
  pendingClosedTasks.delete(key);
  render();
}

function taskItem(p, session, t, withTag) {
  const state = taskState(session, t);
  const label = { done: '完了', doing: '作業中', todo: '未着手' }[state];
  const met = t.criteria.filter(c => c.met).length;
  const closedHere = state === 'done' && t.state !== 'done';
  const key = closedTaskKey(session, t);
  const pending = pendingClosedTasks.has(key);
  const close = state === 'done' ? '' : pending
    ? `<button type="button" class="link-btn" data-cancel-close-task="${esc(key)}">取り消す</button><span class="meta">5 秒後に完了にします。</span>`
    : `<button type="button" class="link-btn" data-close-task="${esc(key)}">完了にする</button>`;
  return `<li class="task ${state}">
    <div class="line"><span class="state ${state}">${label}</span>${sessionTag(p, session, withTag)}
      <span class="title">${esc(t.title)}</span><span class="meta">完了条件 ${met}/${t.criteria.length}${closedHere ? '、画面で完了にした' : ''}</span>${close}</div>
    <ul class="criteria">${t.criteria.map(c => `<li class="${c.met ? 'met' : ''}">${esc(c.t)}</li>`).join('')}</ul></li>`;
}

function isLongWait(minutes) {
  return Number.isFinite(minutes) && minutes > ui.longWaitMinutes;
}
const waitLabel = m => {
  const duration = Number.isFinite(m) ? durationLabel(Date.now() - m * 60_000) : '時刻不明';
  return `<span class="wait ${isLongWait(m) ? 'stale' : ''}">${duration === '時刻不明' ? duration : `${duration}待機中`}</span>`;
};
const isNew = (p, item) => !!item.isNew && !ui.seen.includes(p.id);

// 許可待ち: Notification フックで受ける。許可そのものはデスクトップアプリで出す
function permCard(p, session, x, withTag) {
  const long = isLongWait(x.waitMin);
  return `<article class="decision blocking perm ${long ? 'long-wait' : ''}">
    <div class="dhead">${sessionTag(p, session, withTag)}<span class="dtitle">${esc(x.who)}がツールの実行許可を待っている</span>
      <span class="chip danger">許可待ち</span>${waitLabel(x.waitMin)}</div>
    <div class="ctx">${esc(x.tool)}: <code>${esc(x.detail)}</code></div>
    <div class="meta">${esc(p.name)} 「${esc(sessionDisplayName(session))}」</div>
  </article>`;
}
const visiblePerms = session => [...visiblePermissions(session)].sort((a, b) => ageMinutes(a) - ageMinutes(b));

// 離席中の期間に起きた変化だけを常駐サーバーが返し、画面は最後に見た時刻と比べる想定。
// 「離席中のみ」では、離席中でない間は「前回見てから」が無いものとして扱う。既読の時刻は進めない。
const sinceSeenVisible = () => ui.sinceSeenMode !== 'never' && (ui.sinceSeenMode !== 'away' || ui.away);
function newsBox(p, withTag) {
  if (!sinceSeenVisible() || !p.news.length || ui.seen.includes(p.id)) return '';
  return `<div class="news"><div class="nhead">${withTag ? `<span class="prod-tag">${esc(p.name)}</span>` : ''}前回見てから (${p.news.length} 件)
    <button type="button" class="link-btn" data-seen="${p.id}">既読にする</button></div>
    <ul>${p.news.map(n => `<li>${esc(n.t)}</li>`).join('')}</ul></div>`;
}

function decisionCard(p, session, d, withTag) {
  const a = answerOf(d.id);
  const state = effectiveDecisionState(d);
  const stateClass = { waiting: 'blocking', provisional: 'provisional', resolved: 'state-ok', withdrawn: 'withdrawn' }[state];
  const stateLabel = { waiting: '止めて待っている', provisional: '仮に推奨案で進行中', resolved: '解決済み', withdrawn: '取り下げ' }[state];
  const stateTone = { waiting: 'danger', provisional: 'warn', resolved: 'ok', withdrawn: 'mute' }[state];
  const stateChip = state === 'waiting'
    ? `<span class="badge permission">${stateLabel}</span>`
    : `<span class="chip ${stateTone}">${stateLabel}</span>`;
  // ダイアログを出している質問は外から答えられないので、回答欄の代わりに案内を出す。
  // awaitingMin は、離席中に出た質問でフックが回答を待っているときの、推奨に進むまでの残り分。
  const viaDialog = state === 'waiting' && !Number.isFinite(d.awaitingMin);
  const recommended = d.options.find(o => o.rec);
  const picked = picksOf(a).map(i => d.options[i].t);
  const answerMeta = picked.length ? `送る答え: ${esc(picked.join('、'))}`
    : recommended ? `OK で送る答え: ${esc(recommended.t)}` : '';
  const sentKind = s => s.choice === 'ok' ? '推奨案で OK' : s.choice === 'pick' ? `「${picksOf(s).map(i => d.options[i].t).join('」「')}」を選択` : '指示のみ';
  const sentLine = a.sent
    ? `<span class="sent answer-status">${esc(absoluteTimeLabel(a.sent.at, Date.now(), a.sent.at))} に送信済み: ${sentKind(a.sent)}${a.sent.note ? ' (指示あり)' : ''}${a.sent.deliveredAt ? `、${esc(absoluteTimeLabel(a.sent.deliveredAt, Date.now(), a.sent.deliveredAt))} に渡した` : ''}</span>`
    : state === 'waiting' || state === 'provisional' ? '<span class="sent">未送信</span>' : '';
  const dirty = answerDirty(a);
  const answerError = answerErrors.get(answerDraftKey(session.id, d.id)) || '';
  const statusLine = a.sent && dirty ? '<span class="sent answer-status">変更は未送信</span>' : sentLine;
  const long = state === 'waiting' && !a.sent && isLongWait(d.waitMin);
  const active = (state === 'waiting' && !viaDialog) || state === 'provisional';
  const chosen = Array.isArray(d.resolution?.chosen) ? d.resolution.chosen.join('、') : d.resolution?.chosen;
  const summary = [
    chosen ? `<span class="meta">選択: ${esc(chosen)}</span>` : '',
    d.resolution?.note ? `<span class="meta">${esc(d.resolution.note)}</span>` : '',
    !active && !viaDialog ? sentLine : '',
  ].filter(Boolean).join('');
  const elapsed = state === 'waiting' ? `${waitLabel(d.waitMin)}${viaDialog ? '' : `<span class="wait">あと ${d.awaitingMin} 分で推奨に進む</span>`}` : state === 'provisional' ? `<span class="wait">仮適用から ${durationLabel(Date.now() - d.waitMin * 60_000)}</span>` : '';
  return `<article class="decision ${stateClass} ${long ? 'long-wait' : ''}" data-id="${d.id}" data-session-id="${esc(session.id)}">
    <div class="dhead">${isNew(p, d) ? '<span class="new-mark">新着</span>' : ''}${sessionTag(p, session, withTag)}<span class="dtitle">${esc(d.title)}</span>${stateChip}${elapsed}</div>
    <div class="ctx">${esc(d.ctx)}</div>
    <ul class="options">${d.options.map((o, i) => {
      const body = `${o.rec ? '<span class="tag">推奨</span>' : ''}${esc(o.t)}<span class="why">${esc(o.why)}</span>`;
      // 答えられるあいだは、選択肢そのものを押して答えに選べる。複数選択の質問だけ複数を選べる。
      return active
        ? `<li class="pickable ${o.rec ? 'rec' : ''}"><label class="pick"><input type="${d.multi ? 'checkbox' : 'radio'}" name="pick-${d.id}" data-pick="${i}" ${picksOf(a).includes(i) ? 'checked' : ''}><span class="body">${body}</span></label></li>`
        : `<li class="${o.rec ? 'rec' : ''}">${body}</li>`;
    }).join('')}</ul>
    ${active ? `<div class="answer">
      <div class="checks">
        <label class="check ok"><input type="checkbox" data-choice="ok" ${a.choice === 'ok' ? 'checked' : ''} ${recommended ? '' : 'disabled'}>推奨案で OK</label>
      </div>
      ${answerMeta ? `<div class="meta">${answerMeta}</div>` : ''}
      <textarea data-note placeholder="指示があれば書く (例: 2 番目の案で。理由は…)">${esc(a.note)}</textarea>
      <div class="answer-foot">
        <button type="button" class="primary" data-send ${!canSend(a) || !dirty ? 'disabled' : ''}>回答を送る</button>
        ${statusLine}
      </div>
      ${answerError ? `<div class="answer-error" role="alert">${esc(answerError)}</div>` : ''}
    </div>` : viaDialog ? `<div class="meta">${esc(p.name)} 「${esc(sessionDisplayName(session))}」</div>` : ''}
    ${!active && answerError ? `<div class="answer-error" role="alert">${esc(answerError)}</div>` : ''}
    ${summary ? `<div class="decision-summary">${summary}</div>` : ''}</article>`;
}

const CROSS_REVIEW_MAX_ROUNDS = 3;
// 「レビュー済み」は、主セッションが記録した結論が converged で、その SHA が今の head のときだけ言う。
// 結論の記録が無いか往復の数が合わなければ、最後にレビューに回した head との比較だけを出す。
function crossReviewState(pr) {
  if (pr.xr === undefined) return { cls: 'mute', text: '', warn: null };
  if (pr.xr?.notRequired === true) return { cls: 'mute', text: 'レビュー不要', warn: null };
  if (!pr.xr) return { cls: 'warn', text: 'レビュー未実施', warn: 'クロスレビューの記録が無い' };
  const t = pr.xr.triage && pr.xr.triage.round <= pr.xr.round ? pr.xr.triage : null;
  if (t && pr.xr.round > t.round) return { cls: 'warn', text: `${pr.xr.round} 往復目の結論待ち`, warn: `クロスレビューの ${pr.xr.round} 往復目の結論がまだ出ていない` };
  if (t && t.outcome === 'fixing') return { cls: 'warn', text: '指摘の対応中', warn: `クロスレビューの ${t.round} 往復目の指摘に対応している途中` };
  if (t && t.outcome === 'halted') return { cls: 'warn', text: '開発者の判断待ち', warn: 'クロスレビューは開発者の判断を待って止まっている' };
  if (t && t.outcome === 'converged') {
    if (t.sha === pr.sha) return { cls: 'ok', text: 'レビュー済み', warn: null };
    return { cls: 'warn', text: `収束の後に変更あり (収束 ${t.sha})`, warn: `head ${pr.sha} はクロスレビューの収束の後に変更されている (収束は ${t.sha})` };
  }
  if (pr.xr.reviewedSha !== pr.sha) return { cls: 'warn', text: `レビューの後に変更あり (レビュー済み ${pr.xr.reviewedSha})`, warn: `head ${pr.sha} はクロスレビューの後に変更されている (レビュー済みは ${pr.xr.reviewedSha})` };
  return { cls: 'mute', text: 'この head をレビューに回した', warn: null };
}

function crossReviewLine(p, pr) {
  if (pr.xr === undefined) return '';
  const key = prKey(p, pr.number);
  const skip = ui.reviewSkips[key];
  if (skip?.sha === pr.sha) {
    return `<div class="xr">クロスレビュー <span class="badge mute" title="${esc(skip.reason)}">レビュー不要</span>
      <button type="button" class="link-btn" data-review-skip="clear" data-review-key="${esc(key)}">レビュー不要を取り消す</button></div>`;
  }
  const state = crossReviewState(pr);
  if (pr.xr?.notRequired === true) {
    const reason = pr.xr.reason ? ` title="${esc(pr.xr.reason)}"` : '';
    const action = pr.xr.source === 'recorded'
      ? `<button type="button" class="link-btn" data-review-skip="clear" data-review-key="${esc(key)}">レビュー不要を取り消す</button>` : '';
    return `<div class="xr">クロスレビュー <span class="badge mute"${reason}>レビュー不要</span>${action}</div>`;
  }
  if (!pr.xr) return `<div class="xr">クロスレビュー <span class="badge ${state.cls}">${state.text}</span>
    <button type="button" class="link-btn" data-review-skip="set" data-review-key="${esc(key)}">レビュー不要にする</button></div>`;
  const rounds = Array.from({ length: CROSS_REVIEW_MAX_ROUNDS }, (_, i) => `<span class="${i < pr.xr.round ? 'used' : ''}"></span>`).join('');
  return `<div class="xr">クロスレビュー <span class="rounds" aria-hidden="true">${rounds}</span>
    <span>${pr.xr.round} / ${CROSS_REVIEW_MAX_ROUNDS} 往復、非対応 ${pr.xr.dismissed}</span><span class="badge ${state.cls}">${esc(state.text)}</span>
    <button type="button" class="link-btn" data-review-skip="set" data-review-key="${esc(key)}">レビュー不要にする</button></div>`;
}


// ---- プルリクエスト(スタック) ----
// 常駐サーバーは gh pr list --json で取得し、base と head の対応からスタックを組み立てる想定。
const prKey = (p, n) => `${p.id}#${n}`;
const isMerged = (p, pr) => !!ui.merged[prKey(p, pr.number)];
const openPrs = p => p.prs.filter(pr => !isMerged(p, pr));
const prByHead = (p, head) => p.prs.find(pr => pr.head === head);

// マージ済みの PR を base にしていたものは、その PR の base へ付け替わったとみなす。
// squash で入った PR の上に積んでいたものは、積み直すまで下の PR のコミットが差分に残る。
function effective(p, pr) {
  let base = pr.base, retargetedFrom = null, squashedUnder = null;
  for (let m = prByHead(p, base); m && isMerged(p, m); m = prByHead(p, base)) {
    retargetedFrom = retargetedFrom || m;
    if (ui.merged[prKey(p, m.number)].method === 'squash') squashedUnder = squashedUnder || m;
    base = m.base;
  }
  const needsRestack = !!squashedUnder && !ui.restacked[prKey(p, pr.number)];
  return { base, retargetedFrom, squashedUnder, needsRestack };
}

function parentPr(p, pr) {
  const b = effective(p, pr).base;
  return openPrs(p).find(x => x.head === b) || null;
}
const childPrs = (p, pr) => openPrs(p).filter(x => parentPr(p, x) === pr);

// 下から数えた位置と、スタック全体の段数
function stackPos(p, pr) {
  let depth = 1; for (let x = parentPr(p, pr); x; x = parentPr(p, x)) depth++;
  let root = pr; while (parentPr(p, root)) root = parentPr(p, root);
  const height = (x) => 1 + Math.max(0, ...childPrs(p, x).map(height));
  return { depth, total: height(root) };
}

function mergeBaseConflictBlocker(p, pr) {
  const e = effective(p, pr);
  const parent = parentPr(p, pr);
  if (parent) return `下の #${parent.number} のマージ待ち`;
  if (e.base !== p.repo.defaultBranch) return `base の ${e.base} に対応する PR が見つからない`;
  if (pr.draft) return 'ドラフト';
  if (e.needsRestack) return `積み直し待ち (squash で入った #${e.squashedUnder.number} のコミットが差分に残っている)`;
  if (pr.conflict) return 'コンフリクトあり';
  return null;
}

function mergeReviewBlocker(pr) {
  if (pr.review === 'changes') return '変更を求められている';
  if (pr.review === 'required') return 'レビューの承認待ち';
  return null;
}

function mergeOperationBlocker(p, pr) {
  return mergeBaseConflictBlocker(p, pr) || mergeReviewBlocker(pr);
}

function mergeBlocker(p, pr) {
  const baseConflictBlocker = mergeBaseConflictBlocker(p, pr);
  if (baseConflictBlocker) return baseConflictBlocker;
  if (pr.ci === 'fail') return 'CI が失敗';
  if (pr.ci === 'pending') return 'CI 実行中';
  return mergeReviewBlocker(pr);
}

function crossReviewSettled(p, pr) {
  if (pr.xr?.notRequired === true || ui.reviewSkips[prKey(p, pr.number)]?.sha === pr.sha) return true;
  const triage = pr.xr?.triage;
  return Boolean(triage && triage.round === pr.xr.round && triage.outcome === 'converged' && triage.sha === pr.sha);
}

function crossReviewWaitReason(p, pr) {
  const review = pr.xr;
  if (review?.notRequired === true || ui.reviewSkips[prKey(p, pr.number)]?.sha === pr.sha) return null;
  if (review?.unavailable === true) return 'クロスレビューの状態を確認できない';
  if (!review) return 'クロスレビュー未実施';

  const triage = review.triage;
  if (review.round > 0 && triage?.round !== review.round) return 'クロスレビュー対応中';
  if (triage?.outcome === 'halted') return 'クロスレビューが開発者の判断待ち';
  if (triage?.outcome === 'fixing') return 'クロスレビュー対応中';
  if (triage?.outcome === 'converged' && triage.sha !== pr.sha) return 'クロスレビュー後に push あり';
  return review.round > 0 ? 'クロスレビュー対応中' : 'クロスレビュー未実施';
}

function reservationWait(p, pr) {
  const triage = pr.xr?.triage;
  const convergedAtHead = Number.isSafeInteger(pr.xr?.round) && triage?.round === pr.xr.round &&
    triage.outcome === 'converged' && triage.sha === pr.sha;
  const waiting = [];
  if (!convergedAtHead) waiting.push(triage?.outcome === 'converged' && triage.sha !== pr.sha
    ? '収束後に push あり。現在の head の収束待ち' : 'クロスレビューの収束待ち');
  if (pr.ci !== 'pass') waiting.push(pr.ci === 'pending' ? 'CI 待ち' : pr.ci === 'fail' ? 'CI 失敗' : 'CI 状態不明');
  const blocker = mergeOperationBlocker(p, pr);
  if (pr.review !== 'approved' && !['レビューの承認待ち', '変更を求められている'].includes(blocker)) waiting.push('GitHub のレビュー承認待ち');
  if (blocker) waiting.push(`マージ条件待ち: ${blocker}`);
  return waiting.length ? waiting : ['次の状態更新でマージ'];
}

function mergeConditionWaits(p, pr) {
  if (ui.mergeableCondition === 'operation') return [];
  const waiting = [];
  if (pr.ci !== 'pass') waiting.push(pr.ci === 'pending' ? 'CI 実行中' : pr.ci === 'fail' ? 'CI が失敗' : 'CI 状態不明');
  if (ui.mergeableCondition === 'cross-review' && !crossReviewSettled(p, pr)) waiting.push(crossReviewWaitReason(p, pr));
  return waiting;
}

function pullRequestMergeable(p, pr) {
  return !mergeOperationBlocker(p, pr) && mergeConditionWaits(p, pr).length === 0;
}

const METHOD_LABEL = { merge: 'マージコミット', squash: 'スカッシュ', rebase: 'リベース' };

function pullRequestMergeResultLine(result) {
  const parts = [`${METHOD_LABEL[result.method] || result.method} でマージしました`, result.autoDeleteBranch ? 'ブランチの削除は GitHub の自動削除の設定に任せた (結果は未確認)' : result.branchDeleted ? 'ブランチを削除しました' : 'ブランチは削除していません'];
  if (result.retargetedBase) {
    const numbers = result.retargetedNumbers?.length ? `${result.retargetedNumbers.map(number => `#${number}`).join('、')} の ` : '';
    parts.push(`${numbers}base を ${result.retargetedBase} に付け替えました`);
  }
  if (result.warning) parts.push(result.warning);
  return parts.join('。') + '。';
}

function rememberPullRequestMergeResult(product, result) {
  const results = pullRequestMergeResults.get(product.repo.name) || [];
  results.push({ id: String(++nextPullRequestMergeResultId), productId: product.id, recordedAt: Date.now(), ...result });
  pullRequestMergeResults.set(product.repo.name, results);
}

function pullRequestMergeResultHasWarning(result) {
  return result.headMismatch === true || (typeof result.warning === 'string' && result.warning.length > 0);
}

function pullRequestMergeResultVisible(result, now = Date.now()) {
  if (result.closedAt) return false;
  if (pullRequestMergeResultHasWarning(result)) return true;
  const recordedAt = typeof result.recordedAt === 'number' ? result.recordedAt : Date.parse(result.recordedAt || '');
  return !Number.isFinite(recordedAt) || now < recordedAt || now - recordedAt < ui.mergeResultHideMinutes * 60_000;
}

function hasPullRequestMergeResults(product) {
  return (pullRequestMergeResults.get(product.repo.name) || []).some(result => result.productId === product.id && pullRequestMergeResultVisible(result));
}

function closePullRequestMergeResult(id) {
  for (const [key, results] of pullRequestMergeResults) {
    const remaining = results.filter(result => result.id !== id);
    if (remaining.length === results.length) continue;
    if (remaining.length) pullRequestMergeResults.set(key, remaining);
    else pullRequestMergeResults.delete(key);
    return;
  }
}

function finishMockMerge(product, pullRequest, options, automatic = false) {
  const key = prKey(product, pullRequest.number);
  const children = childPrs(product, pullRequest).map(child => child.number);
  const at = absoluteTimeLabel(new Date());
  ui.lastMethod[product.repo.name] = options.method;
  ui.merged[key] = { method: options.method, del: options.del, at, auto: automatic };
  rememberPullRequestMergeResult(product, {
    number: pullRequest.number,
    method: options.method,
    branchDeleted: options.del,
    autoDeleteBranch: product.repo.autoDeleteBranch === true && pullRequest.isCrossRepository !== true,
    ...(children.length ? { retargetedBase: product.repo.defaultBranch, retargetedNumbers: children } : {}),
    ...(pullRequest.headMismatch === true ? { warning: '予約時と異なる head SHA がマージされました' } : {}),
  });
  if (automatic) delete ui.reserved[key];
  ui.confirm = null;
  save();
  render();
}

function startMockMerge(product, pullRequest, options) {
  const key = prKey(product, pullRequest.number);
  if (pullRequestMergeInFlight.has(key)) return;
  pullRequestMergeInFlight.add(key);
  render();
  setTimeout(() => {
    if (!pullRequestMergeInFlight.delete(key)) return;
    finishMockMerge(product, pullRequest, options);
  }, 700);
}
function mergeOpts(p, pr) {
  const k = prKey(p, pr.number);
  const last = ui.lastMethod[p.repo.name];
  const method = p.repo.methods.includes(last) ? last : p.repo.methods[0];
  return { method, del: !p.repo.autoDeleteBranch, mergeAfterReview: ui.mergeAfterReviewDefault, ...ui.mergeOpts[k] };
}

function prBadges(p, pr) {
  const e = effective(p, pr);
  const ci = { pass: ['ok', 'CI 成功'], pending: ['warn', 'CI 実行中'], fail: ['danger', 'CI 失敗'] }[pr.ci];
  const rv = { approved: ['ok', '承認済み'], required: ['mute', '承認待ち'], none: ['mute', '承認は任意'], changes: ['danger', '変更要求'] }[pr.review];
  return [
    pr.draft ? '<span class="badge mute">ドラフト</span>' : '',
    `<span class="badge ${ci[0]}">${ci[1]}</span>`,
    `<span class="badge ${rv[0]}">${rv[1]}</span>`,
    pr.conflict ? '<span class="badge danger">コンフリクト</span>' : '',
    e.retargetedFrom ? `<span class="badge accent long">base を ${esc(e.base)} に付け替え済み</span>` : '',
    e.needsRestack ? '<span class="badge warn">積み直しが必要</span>' : '',
  ].join('');
}

function mergeConfirm(p, pr) {
  const o = mergeOpts(p, pr);
  const merging = pullRequestMergeInFlight.has(prKey(p, pr.number));
  const waiting = mergeConditionWaits(p, pr);
  const conditionPending = waiting.length > 0;
  const kids = childPrs(p, pr);
  const kidNames = kids.map(k => `#${k.number}`).join('、');
  const reviewWarning = crossReviewState(pr).warn;
  const effects = [
    reviewWarning ? `<span>${esc(reviewWarning)}</span>` : '',
    `照合する head SHA: ${o.mergeAfterReview ? 'クロスレビューの収束記録' : shortShaLabel(pr.sha)}`,
    kids.length && ['squash', 'rebase'].includes(o.method) ? `<span>スカッシュまたはリベースでは ${kidNames} に #${pr.number} のコミットが残るため、セッションに積み直しを依頼する</span>` : '',
  ].filter(Boolean);
  return `<div class="merge-confirm ${conditionPending ? 'pending' : ''}" data-pr="${prKey(p, pr.number)}">
    <div><strong>#${pr.number}</strong> を <code>${esc(p.repo.defaultBranch)}</code> へ${o.mergeAfterReview ? 'レビュー収束後に' : ''}マージする</div>
    ${waiting.length ? `<p class="merge-condition-warning" role="status">選択した条件の未達: ${waiting.map(esc).join('、')}</p>` : ''}
    <div class="methods" role="radiogroup" aria-label="マージの方式">${p.repo.methods.map(m =>
      `<label><input type="radio" name="m-${prKey(p, pr.number)}" data-method="${m}" ${o.method === m ? 'checked' : ''}>${METHOD_LABEL[m]}</label>`).join('')}
      ${p.repo.methods.length === 1 ? '<span class="meta">リポジトリの設定で許可されている方式だけを出す</span>' : ''}</div>
    <label class="opt"><input type="checkbox" data-review-merge ${o.mergeAfterReview ? 'checked' : ''}>レビュー収束後マージ</label>
    ${p.repo.autoDeleteBranch ? '' : `<label class="opt"><input type="checkbox" data-del ${o.del ? 'checked' : ''}>マージ後にブランチを削除する</label>`}
    <ul class="effects">${effects.map(x => `<li class="${x.startsWith('<span>') ? 'warn' : ''}">${x}</li>`).join('')}</ul>
    <div class="row"><button type="button" class="merge-go ${conditionPending ? 'outline' : ''}" data-merge-go="${prKey(p, pr.number)}" ${merging ? 'disabled' : ''}>${merging ? '処理中…' : o.mergeAfterReview ? '予約する' : 'マージを実行'}</button>
      <button type="button" class="ghost" data-merge-cancel>やめる</button></div>
  </div>`;
}

function setMergeConfirmation(key, action) {
  if (action !== 'manual') return;
  ui.confirm = { key, action };
}

// 衝突の解消は PR を登録したセッションに頼む。ダッシュボードはマージ以外の変更を自分では行わない。
function conflictConfirm(p, pr) {
  const k = prKey(p, pr.number);
  const e = effective(p, pr);
  const effects = [
    `${esc(pr.requestSession.name)} のセッションに、base の <code>${esc(e.base)}</code> を取り込んで衝突を解消し、push するよう依頼する`,
    'セッションにはマージしないよう伝える。解消した後に、このカードからマージする',
    `head が ${shortShaLabel(pr.sha)} から変わると、依頼済みの表示を消す`,
  ];
  return `<div class="merge-confirm conflict" data-pr="${k}">
    <div><strong>#${pr.number}</strong> の衝突の解消を依頼する</div>
    <ul class="effects">${effects.map(x => `<li>${x}</li>`).join('')}</ul>
    <div class="row"><button type="button" class="merge-go conflict-go" data-conflict-go="${k}">依頼を送る</button>
      <button type="button" class="ghost" data-merge-cancel>やめる</button></div>
  </div>`;
}

function conflictButton(p, pr) {
  if (!pr.conflict || !pr.requestSession) return '';
  const k = prKey(p, pr.number);
  const label = ui.conflictRequested[k] ? 'もう一度依頼する' : 'コンフリクト解決';
  const disabled = !pr.requestSession.alive || ui.confirm === `conflict:${k}`;
  return `<button type="button" class="conflict-btn" data-conflict="${k}" ${disabled ? 'disabled' : ''}>${label}</button>`;
}

function conflictStatus(p, pr) {
  if (!pr.conflict || !pr.requestSession) return '';
  const k = prKey(p, pr.number);
  if (!pr.requestSession.alive) return `<div class="why-not">衝突の解消を依頼できない理由: 依頼先の ${esc(pr.requestSession.name)} のセッションが終了している</div>`;
  const at = ui.conflictRequested[k];
  return at ? `<div class="badges"><span class="badge accent long">${esc(absoluteTimeLabel(at, Date.now(), at))} に ${esc(pr.requestSession.name)} のセッションへ衝突の解消を依頼した</span></div>` : '';
}

function prItem(p, pr) {
  const k = prKey(p, pr.number);
  const confirmManual = ui.confirm?.key === k && ui.confirm.action === 'manual';
  const operationBlocker = mergeOperationBlocker(p, pr);
  const waiting = operationBlocker ? [] : mergeConditionWaits(p, pr);
  const conditionMet = !operationBlocker && waiting.length === 0;
  const mergeIntent = Boolean(pr.mergeIntent);
  const pos = stackPos(p, pr);
  const e = effective(p, pr);
  const rsv = ui.reserved[k];
  return `<div class="pr ${rsv ? 'reserved' : conditionMet ? 'can-merge' : !operationBlocker ? 'merge-pending' : ''}">
    <div class="pline">
      ${pos.total > 1 ? `<span class="pos" title="下から数えた位置">${pos.depth}/${pos.total}</span>` : ''}
      <span class="num">#${pr.number}</span><span>${esc(pr.title)}</span>
      ${mergeIntent ? `<span class="badge accent">マージキューに追加済み (未マージ)</span><button type="button" class="link-btn" data-queue-left="${k}" title="GitHub でキューから外れたときに押すと、マージの操作に戻る">キューから外れた</button>` : ''}
      ${!mergeIntent && conditionMet ? '<span class="badge ok">マージできます</span>' : !mergeIntent && !operationBlocker ? '<span class="badge mute">マージ操作は可能</span>' : ''}
      ${!mergeIntent && !operationBlocker ? `<button type="button" class="merge-btn ${conditionMet ? '' : 'outline'}" data-merge="${k}" data-merge-action="manual" ${confirmManual ? 'disabled' : ''}>マージする</button>` : ''}
      ${conflictButton(p, pr)}
    </div>
    <div class="branch"><code>${esc(pr.head)}</code> → <code>${esc(e.base)}</code></div>
    <div class="badges">${prBadges(p, pr)}</div>
    ${crossReviewLine(p, pr)}
    ${rsv ? `<div class="badges"><span class="badge accent long">レビュー収束後にマージ予約中 (${METHOD_LABEL[rsv.method]}、予約時 ${esc(absoluteTimeLabel(rsv.at, Date.now(), rsv.at))}、${esc(reservationWait(p, pr).join('、'))})</span>
      <button type="button" class="link-btn" data-unreserve="${k}">予約を取り消す</button>
      <button type="button" class="link-btn" data-ready-merge="${k}">モック: 待機条件を満たす</button></div>` : ''}
    ${operationBlocker && !rsv && !mergeIntent ? `<div class="why-not">マージできない理由: ${esc(operationBlocker)}
      ${e.needsRestack ? ` <button type="button" class="link-btn" data-restack="${k}">モック: 積み直しの完了を再現する</button>` : ''}</div>` : ''}
    ${waiting.length && !rsv && !mergeIntent ? `<div class="why-not">待ち: ${waiting.map(esc).join('、')}</div>` : ''}
    ${conflictStatus(p, pr)}
    ${ui.confirm === `conflict:${k}` && pr.conflict ? conflictConfirm(p, pr) : ''}
    ${ui.reservationNotices[k] ? `<div class="merge-result" role="status">${esc(ui.reservationNotices[k])}</div>` : ''}
    ${confirmManual && !operationBlocker && !rsv ? mergeConfirm(p, pr) : ''}
  </div>`;
}

function prTree(p, pr) {
  const kids = childPrs(p, pr);
  return prItem(p, pr) + (kids.length ? `<div class="stack-level">${kids.map(k => prTree(p, k)).join('')}</div>` : '');
}

const MERGED_VISIBLE_COUNT = 5;
function prBlock(p, withTag) {
  const roots = openPrs(p).filter(pr => !parentPr(p, pr));
  const merged = p.prs.filter(pr => isMerged(p, pr));
  const tag = withTag ? `<span class="prod-tag">${esc(p.name)}</span>` : '';
  const headingTag = withTag ? 'h3' : 'h4';
  const head = `<header class="prs-head"><${headingTag} class="pr-repo-title"><strong>${esc(p.repo.name)}</strong></${headingTag}>${tag}<span class="meta">GitHub から ${esc(p.repo.fetched)}に取得</span></header>`;
  const stacks = roots.map(r => `<div class="stack">
      <div class="stack-base"><code>${esc(effective(p, r).base)}</code>${childPrs(p, r).length ? `<span>スタック ${stackPos(p, r).total} 段</span>` : ''}</div>
      ${prTree(p, r)}</div>`).join('');
  const mergedNewestFirst = merged.map(pr => ({ pr, m: ui.merged[prKey(p, pr.number)] }))
    .sort((a, b) => b.m.at.localeCompare(a.m.at) || b.pr.number - a.pr.number);
  const visibleMerged = ui.hideFinished ? mergedNewestFirst.filter(({ pr }) => pr.headMismatch === true) : mergedNewestFirst;
  const mergedLine = foldedPrLine(p, 'merged', 'マージ済み (24 時間)', visibleMerged.map(({ pr, m }) =>
    `<span class="badge long ${pr.headMismatch === true ? 'warn' : 'mute'}">#${pr.number} (${METHOD_LABEL[m.method]}、${esc(absoluteTimeLabel(m.at, Date.now(), m.at))}${m.auto ? '、予約で自動' : ''}${pr.headMismatch === true ? `、警告: 予約時に確認した ${shortShaLabel(pr.reservedHeadRefOid)} とは異なる ${shortShaLabel(pr.mergedHeadRefOid)} がマージされました` : ''})</span>`), true);
  const closed = p.closedPrs || [];
  const closedLine = foldedPrLine(p, 'closed', 'クローズ済み', closed.map(pr =>
    `<a class="badge mute" href="https://github.com/${esc(p.repo.name)}/pull/${pr.number}" target="_blank" rel="noopener noreferrer" aria-label="GitHub で PR #${pr.number} を開く" title="${esc(pr.title)}">#${pr.number}</a>`));
  const empty = !roots.length
    ? p.repo.loading ? `<div class="empty">GitHub から取得しています</div>`
      : merged.length || closed.length ? `<div class="empty">オープンの PR はありません</div>` : ''
    : '';
  const results = (pullRequestMergeResults.get(p.repo.name) || [])
    .filter(result => result.productId === p.id && pullRequestMergeResultVisible(result))
    .map(result => `<div class="merge-result" role="status"><span>PR #${result.number}: ${pullRequestMergeResultLine(result)}</span><button type="button" class="link-btn" data-close-merge-result="${esc(result.id)}">閉じる</button></div>`).join('');
  return `<section class="group-frame pr-repo-group">${head}<div class="pr-repo-content">${stacks || empty}${mergedLine}${closedLine}${results}</div></section>`;
}

// 新しい順に並べた badges のうち MERGED_VISIBLE_COUNT 件を出し、古いものはボタンの下に畳む。
function foldedPrLine(p, kind, label, badges, visibleWhileHidden = false) {
  if (!badges.length || (ui.hideFinished && !visibleWhileHidden)) return '';
  const key = `${kind}:${p.id}`;
  const expanded = ui.expandedMerged.includes(key);
  const olderCount = Math.max(0, badges.length - MERGED_VISIBLE_COUNT);
  const visible = expanded ? badges : badges.slice(0, MERGED_VISIBLE_COUNT);
  const toggle = olderCount
    ? `<button type="button" class="ended-toggle" data-older-merged="${esc(key)}" aria-expanded="${expanded}">${expanded ? `古い${label}を隠す` : `古い${label}を表示`} (${olderCount} 件)</button>`
    : '';
  return `<div class="merged-list">${label}: ${visible.join('')}${toggle}</div>`;
}

function endedDecisionToggle(session) {
  if (ui.hideFinished) return '';
  const ended = session.decisions.filter(d => ['resolved', 'withdrawn'].includes(effectiveDecisionState(d)));
  if (!ended.length) return '';
  const expanded = ui.expandedEndedDecisions.includes(session.id);
  return `<button type="button" class="ended-toggle" data-ended-decisions="${esc(session.id)}" aria-expanded="${expanded}">${expanded ? '解決済みと取り下げを隠す' : '解決済みと取り下げを表示'} (${ended.length} 件)</button>`;
}

function decisionSessionBlock(p, session, withTag) {
  const active = visibleDecisions(session).sort((a, b) => ageMinutes(a) - ageMinutes(b));
  const ended = ui.hideFinished ? [] : session.decisions.filter(d => ['resolved', 'withdrawn'].includes(effectiveDecisionState(d)));
  const expanded = !ui.hideFinished && ui.expandedEndedDecisions.includes(session.id);
  const visible = expanded ? [...active, ...ended].sort((a, b) => ageMinutes(a) - ageMinutes(b)) : active;
  const cards = visible.map(d => decisionCard(p, session, d, withTag)).join('');
  const empty = ended.length ? '未解決の判断事項はありません。' : 'ありません';
  // 許可待ちのカードが出ているときは、判断事項が無くても「ありません」と出さない。
  const showEmpty = !cards && !visiblePerms(session).length && !hasHiddenJudgmentItems(session);
  return `${cards}${showEmpty ? `<div class="empty">${empty}</div>` : ''}${endedDecisionToggle(session)}`;
}

// 作業中のタスクがあるときは未着手を畳み、作業中だけを先に見せる。未着手しか無ければ畳まない。
function taskVisibility(session, showTodo, showDone) {
  const states = session.tasks.map(task => taskState(session, task));
  const foldTodo = states.includes('doing');
  const visible = session.tasks.filter((task, i) => states[i] === 'done' ? showDone : states[i] === 'todo' && foldTodo ? showTodo : true);
  return {
    todoCount: foldTodo ? states.filter(state => state === 'todo').length : 0,
    doneCount: states.filter(state => state === 'done').length,
    visible,
  };
}

function taskSessionBlock(p, session, withTag) {
  const showTodo = ui.expandedTodoTasks.includes(session.id);
  const expanded = ui.expandedDoneTasks.includes(session.id);
  const { todoCount, doneCount, visible } = taskVisibility(session, showTodo, expanded);
  const updated = `最終更新 ${session.tasksUpdatedMin} 分前`;
  const items = visible.map(task => taskItem(p, session, task, withTag)).join('');
  const todoToggle = todoCount
    ? `<button type="button" class="ended-toggle" data-todo-tasks="${esc(session.id)}" aria-expanded="${showTodo}">${showTodo ? '未着手のタスクを隠す' : '未着手のタスクを表示'} (${todoCount} 件)</button>`
    : '';
  const toggle = todoToggle + (doneCount
    ? `<button type="button" class="ended-toggle" data-done-tasks="${esc(session.id)}" aria-expanded="${expanded}">${expanded ? '完了したタスクを隠す' : '完了したタスクを表示'} (${doneCount} 件)</button>`
    : '');
  const empty = session.tasks.length ? '未完了のタスクはありません。' : 'タスクはありません。';
  return `<h3 class="sub">タスクと完了条件 <span class="meta">${updated}</span></h3>${items ? `<ul class="tasks">${items}</ul>` : `<div class="empty">${empty}</div>`}${toggle}`;
}

function kindTaskSessionBlock(p, session, expanded) {
  const { doneCount, visible } = taskVisibility(session, ui.expandedKindTodoTasks, expanded);
  const updated = Number.isFinite(session.tasksUpdatedMin) ? `最終更新 ${session.tasksUpdatedMin} 分前` : '最終更新 時刻不明';
  const items = visible.map(task => taskItem(p, session, task, false)).join('');
  const empty = session.tasks.length ? '未完了のタスクはありません。' : 'タスクはありません。';
  return {
    doneCount,
    html: `<section class="kind-session-tasks group-frame"><h3 class="kind-task-head">${sessionTag(p, session, true, true)}<span class="meta">${updated}</span></h3>${items ? `<ul class="tasks">${items}</ul>` : `<div class="empty">${empty}</div>`}</section>`,
  };
}

function kindToggleLabel(label, expanded, count) {
  return expanded ? `${label}を畳む` : `${label}を表示 (${count} 件)`;
}

function kindToggle(key, label, count, expanded) {
  return `<button type="button" class="ended-toggle" data-kind-toggle="${key}" aria-expanded="${expanded}">${kindToggleLabel(label, expanded, count)}</button>`;
}

function kindEndedDecisionEntries(sessions) {
  if (ui.hideFinished) return [];
  return sessions.flatMap(({ p, session }) => session.decisions
    .filter(d => ['resolved', 'withdrawn'].includes(effectiveDecisionState(d)))
    .map(decision => ({ p, session, decision })))
    .sort((a, b) => ageMinutes(a.decision) - ageMinutes(b.decision));
}

function kindEndedAgentCount(sessions) {
  if (ui.hideFinished) return 0;
  return sessions.reduce((count, { session }) => count + session.subagents.filter(agent => isEndedAgent(session, agent)).length, 0);
}

function kindDoneTaskCount(sessions) {
  return sessions.reduce((count, { session }) => count + taskVisibility(session, true, true).doneCount, 0);
}

function kindTodoTaskCount(sessions) {
  return sessions.reduce((count, { session }) => count + taskVisibility(session, true, true).todoCount, 0);
}

// 会話の記録の最後の行から推定する。tool はツールの呼び出しで止まっている、model はユーザーの行で終わっている状態。
const ESTIMATE_WAITING = { input: 'はい', tool: 'いいえ (許可待ちかツールの実行中)', model: 'いいえ (応答の生成中)' };

function unknownSessionControls(session) {
  if (session.status !== 'unknown') return '';
  const estimate = ui.estimatedSessions.includes(session.id)
    ? session.estimate?.canEstimate
      ? `<div class="estimate"><p>最後の記録: ${esc(absoluteTimeLabel(session.estimate.recordedAt))}、最後のツール: ${esc(session.estimate.lastTool ?? session.estimate.tool ?? 'なし')}</p><p>入力待ちらしい: ${ESTIMATE_WAITING[session.estimate.state]}</p></div>`
      : '<div class="estimate">推定できませんでした</div>'
    : '';
  return `<div class="session-extra"><div class="session-actions"><button type="button" class="ended-toggle" data-estimate="${esc(session.id)}">状態を推定</button><button type="button" class="ended-toggle" data-hide-session="${esc(session.id)}">一覧から外す</button></div>${estimate}</div>`;
}

function sessionBlock(p, session) {
  const multiple = p.sessions.length > 1;
  const groupTag = multiple ? 'section' : 'div';
  const decisions = visibleDecisions(session).length;
  const permissions = visiblePerms(session).length;
  const showJudgment = decisions + permissions > 0
    || (!ui.hideFinished && session.decisions.some(d => ['resolved', 'withdrawn'].includes(effectiveDecisionState(d))))
    || !hasHiddenJudgmentItems(session);
  return `<${groupTag} class="session-group ${multiple ? '' : 'single'}">
    ${multiple ? `<div class="session-head"><h3>${esc(session.title)}</h3>${sharedBranch(p) || !session.branch ? '' : `<span class="meta">${esc(session.branch)}</span>`}</div>` : ''}
    <div class="session-body">
      ${multiple ? '' : `<div class="session-tag session-context">${esc(sessionDisplayName(session))}</div>`}
      ${orderedSectionKeys(['judgment', 'tasks', 'now']).map(key => ({
        judgment: showJudgment ? `<h3 class="sub">あなたの判断が必要なこと <span class="count">(${decisions + permissions} 件)</span></h3>
      ${visiblePerms(session).map(wait => permCard(p, session, wait, false)).join('')}
      ${decisionSessionBlock(p, session, false)}` : '',
        tasks: taskSessionBlock(p, session, false),
        now: `<h3 class="sub">今やっていること</h3><div class="now">${mainRow(p, session, false)}</div>
      ${agentSection(p, session, false)}`,
      })[key]).join('')}
    </div>
  </${groupTag}>`;
}

// セッションが全部同じブランチならプロダクトの見出しに出し、分かれていればセッションの頭に出す。
function sharedBranch(p) {
  const branches = new Set(p.sessions.map(session => session.branch).filter(Boolean));
  return branches.size === 1 ? [...branches][0] : '';
}

function renderConnectionNote() {
  const note = document.getElementById('connection-note');
  note.hidden = !DATA.connection.lost;
  note.textContent = DATA.connection.lost
    ? `常駐サーバーに接続できません。表示は ${DATA.connection.lastAt} 時点のものです。`
    : '';
}

function renderReloadNote() {
  const note = document.getElementById('reload-note');
  note.hidden = !DATA.uiUpdatePending;
  note.innerHTML = DATA.uiUpdatePending
    ? '<span>画面が新しくなりました。書きかけの回答を送るか消すと、読み込み直します。</span><button type="button" class="link-btn" data-reload-now>今すぐ読み込み直す</button>'
    : '';
}
document.getElementById('reload-note').addEventListener('click', e => {
  if (e.target.closest('[data-reload-now]')) location.reload();
});

function orderControls(p, idx, total, pinnedCount) {
  const pinned = ui.pinned.includes(p.id);
  const collapsed = ui.collapsed.includes(p.id);
  const canMoveUp = pinned ? idx > 0 : idx > pinnedCount;
  const canMoveDown = pinned ? idx < pinnedCount - 1 : idx < total - 1;
  return `<div class="order">
    <button type="button" class="icon-btn" data-collapse="${p.id}" aria-expanded="${!collapsed}">${collapsed ? '開く' : '畳む'}</button>
    <button type="button" class="icon-btn" data-pin="${p.id}" aria-pressed="${pinned}" title="最上部に固定">${pinned ? '固定中' : '固定'}</button>
    <button type="button" class="icon-btn" data-move="${p.id}" data-dir="-1" ${canMoveUp ? '' : 'disabled'} aria-label="${esc(p.name)} を上へ">↑</button>
    <button type="button" class="icon-btn" data-move="${p.id}" data-dir="1" ${canMoveDown ? '' : 'disabled'} aria-label="${esc(p.name)} を下へ">↓</button>
  </div>`;
}

// 「×」は外すセッションがあるときだけ出す。セッションの無いカードは、PR が閉じるか未読を既読にすれば消える。
function productCloseButton(p, describedById) {
  if (!visibleSessions(p).length) return '';
  return `<button type="button" class="icon-btn" data-close-product="${p.id}" aria-label="このプロダクトのセッションを一覧から外す" aria-describedby="${describedById}" title="このプロダクトのセッションを一覧から外す">×</button>`;
}

function renderProductMode() {
  const ps = orderedProducts();
  if (!ps.length) {
    const hidden = finishedHiddenCounts();
    return `<div class="empty">${hidden.sessions || hidden.pullRequests
      ? '終わったものを隠しています。下の「表示する」から表示できます。'
      : idleHiddenSessions().length
        ? '更新の無いセッションを隠しています。下の「表示する」から表示できます。'
      : '表示するセッションがありません。Claude Code でセッションを開始すると、ここに表示されます。'}</div>`;
  }
  const pinnedCount = ps.filter(p => ui.pinned.includes(p.id)).length;
  return ps.map((p, i) => {
    const pend = pendingDecisions(p);
    const sessions = sessionsByActivity(p);
    const permissionCount = sessions.reduce((total, session) => total + session.perms.length, 0);
    return `<section class="section ${ui.pinned.includes(p.id) ? 'pinned' : ''}">
      <div class="head">
        <h2 id="product-heading-${i}" tabindex="-1">${esc(p.name)}</h2>${sharedBranch(p) ? `<span class="meta">${esc(sharedBranch(p))}</span>` : ''}
        ${permissionCount ? `<span class="chip danger">許可待ち (${permissionCount} 件)</span>` : ''}
        ${pend.length ? `<span class="chip danger" title="${esc(decisionCountTitle(pend))}">判断待ち (${pend.length} 件)</span>` : ''}
        ${(n => n ? `<span class="chip ok">マージできる PR (${n} 件)</span>` : '')(openPrs(p).filter(pr => pullRequestMergeable(p, pr)).length)}
        ${orderControls(p, i, ps.length, pinnedCount)}
        ${productCloseButton(p, `product-heading-${i}`) ? `<div class="product-remove">${productCloseButton(p, `product-heading-${i}`)}</div>` : ''}
      </div>
      <div class="body" ${ui.collapsed.includes(p.id) ? 'hidden' : ''}>
        ${newsBox(p, false)}
        ${sessions.map(session => sessionBlock(p, session)).join('')}
        ${isShown('prs') ? `<div class="product-pr-divider"></div><h3 class="sub">プルリクエスト <span class="count">(${openPrs(p).length} 件)</span></h3>${prBlock(p, false)}` : ''}
      </div></section>`;
  }).join('');
}

function renderKindMode() {
  const ps = orderedProducts();
  if (!ps.length) {
    const hidden = finishedHiddenCounts();
    return `<div class="empty">${hidden.sessions || hidden.pullRequests
      ? '終わったものを隠しています。下の「表示する」から表示できます。'
      : idleHiddenSessions().length
        ? '更新の無いセッションを隠しています。下の「表示する」から表示できます。'
      : '表示するセッションがありません。Claude Code でセッションを開始すると、ここに表示されます。'}</div>`;
  }
  const sessions = ps.flatMap(p => sessionsByActivity(p).map(session => ({ p, session })));
  const section = (title, body, extra = '', emptyCount = 0) => body
    ? `<section class="section"><div class="head"><h2>${title}</h2>${extra}</div><div class="body">${body}</div></section>`
    : `<section class="kind-empty"><h2>${title}<span class="count">${emptyCount ? `(${emptyCount} 件)` : '（なし）'}</span></h2>${extra}</section>`;
  // 種類別では、許可待ちと判断事項をまとめて待ちの長い順に並べる(送信済みは後ろ)
  const waits = sessions.flatMap(({ p, session }) => [
    ...visiblePerms(session).map(wait => ({ age: wait.waitMin, html: permCard(p, session, wait, true) })),
    ...visibleDecisions(session).map(d => ({ age: answerOf(d.id).sent ? -1 : (d.waitMin || 0), html: decisionCard(p, session, d, true) })),
  ]).sort((a, b) => b.age - a.age);
  const visibleDecisionItems = waits.map(x => x.html).join('');
  const hiddenJudgmentItems = sessions.some(({ session }) => hasHiddenJudgmentItems(session));
  const endedDecisionEntries = kindEndedDecisionEntries(sessions);
  const endedDecisionCards = ui.expandedKindDecisions
    ? endedDecisionEntries.map(({ p, session, decision }) => decisionCard(p, session, decision, true)).join('')
    : '';
  const endedDecisionToggle = endedDecisionEntries.length
    ? kindToggle('decisions', '解決済みと取り下げ', endedDecisionEntries.length, ui.expandedKindDecisions)
    : '';
  const decisionItems = visibleDecisionItems + endedDecisionCards;
  const decisionControls = endedDecisionToggle ? `<div class="kind-section-controls">${endedDecisionToggle}</div>` : '';
  const decisions = decisionItems;
  const showJudgment = Boolean(decisionItems || endedDecisionToggle) || !hiddenJudgmentItems;
  const news = ps.map(p => newsBox(p, true)).join('');
  const showEndedAgents = ui.expandedKindAgents && !ui.hideFinished;
  const nowRowsByAge = sessions.flatMap(({ p, session }) => {
    const agents = visibleSubagents(session).filter(agent => !isEndedAgent(session, agent) || showEndedAgents);
    return [
      { age: ageMinutes(session.main), html: mainRow(p, session, true) },
      ...agents.map(agent => ({ age: ageMinutes(agent), html: agentRow(p, session, agent, true) })),
    ];
  }).sort((a, b) => a.age - b.age);
  const endedAgentCount = kindEndedAgentCount(sessions);
  const endedAgentToggle = endedAgentCount
    ? kindToggle('agents', '終了済み', endedAgentCount, showEndedAgents)
    : '';
  const now = nowRowsByAge.length ? `<div class="now">${nowRowsByAge.map(row => row.html).join('')}</div>` : '';
  const activityControls = endedAgentToggle ? `<div class="kind-section-controls">${endedAgentToggle}</div>` : '';
  const taskSessions = sessions.filter(({ session }) => session.tasks.length > 0);
  const taskGroups = taskSessions.map(({ p, session }) => kindTaskSessionBlock(p, session, ui.expandedKindTasks));
  const doneTaskCount = kindDoneTaskCount(sessions);
  const doneTaskToggle = doneTaskCount
    ? kindToggle('tasks', '完了したタスク', doneTaskCount, ui.expandedKindTasks)
    : '';
  const todoTaskCount = kindTodoTaskCount(sessions);
  const todoTaskToggle = todoTaskCount
    ? kindToggle('todoTasks', '未着手のタスク', todoTaskCount, ui.expandedKindTodoTasks)
    : '';
  const tasks = taskGroups.map(group => group.html).join('');
  const taskControls = todoTaskToggle || doneTaskToggle
    ? `<div class="kind-section-controls">${todoTaskToggle}${doneTaskToggle}</div>`
    : '';
  const prs = ps.filter(p => ui.hideFinished ? openPrs(p).length > 0 : p.prs.length || (p.closedPrs || []).length).map(p => prBlock(p, true)).join('');
  const sections = {
    sinceSeen: news ? section('前回見てから', news) : '',
    judgment: showJudgment ? section('あなたの判断が必要なこと', decisions, decisionControls, waits.length + endedDecisionEntries.length) : '',
    tasks: section('タスクと完了条件', tasks, taskControls, todoTaskCount + doneTaskCount),
    now: section('今やっていること', now, activityControls, nowRowsByAge.length + endedAgentCount),
    prs: isShown('prs') ? section('プルリクエスト', prs) : '',
  };
  return orderedSectionKeys(DEFAULT_SECTION_ORDER).map(key => sections[key]).join('');
}

function render() {
  const active = document.activeElement;
  const focusAttribute = ['data-ended-agents', 'data-ended-decisions', 'data-done-tasks', 'data-kind-toggle', 'data-older-merged'].find(attribute => active?.hasAttribute(attribute));
  const focusData = focusAttribute ? { attribute: focusAttribute, value: active.getAttribute(focusAttribute) }
    : active?.dataset?.reviewSkip ? { kind: 'review-skip', key: active.dataset.reviewKey, action: active.dataset.reviewSkip }
       : active?.dataset?.showFinished ? { kind: 'show-finished' }
       : active?.dataset?.showIdle ? { kind: 'show-idle' }
      : active?.dataset?.closeMergeResult ? { kind: 'close-merge-result', id: active.dataset.closeMergeResult }
        : active?.dataset?.cancelCloseTask ? { kind: 'task-close', key: active.dataset.cancelCloseTask }
          : active?.dataset?.closeTask ? { kind: 'task-close', key: active.dataset.closeTask }
            : active?.dataset?.mergeGo ? { kind: 'merge-go', key: active.dataset.mergeGo } : null;
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === ui.mode)));
  renderSummary();
  renderConnectionNote();
  renderReloadNote();
  renderRouting();
  document.getElementById('root').innerHTML = ui.mode === 'product' ? renderProductMode() : renderKindMode();
  if (focusData?.attribute) {
    [...document.querySelectorAll(`[${focusData.attribute}]`)].find(button => button.getAttribute(focusData.attribute) === focusData.value)?.focus({ preventScroll: true });
  } else if (focusData?.kind === 'show-finished') {
    (document.querySelector('[data-show-finished]') || document.querySelector('[data-mode="' + ui.mode + '"]'))?.focus({ preventScroll: true });
  } else if (focusData?.kind === 'show-idle') {
    document.querySelector('[data-show-idle]')?.focus({ preventScroll: true });
  } else if (focusData?.kind === 'close-merge-result') {
    (document.querySelector(`[data-close-merge-result="${CSS.escape(focusData.id)}"]`)
      || document.querySelector('[data-close-merge-result]')
      || document.querySelector('[data-mode="' + ui.mode + '"]'))?.focus({ preventScroll: true });
  } else if (focusData?.kind === 'task-close') {
    (document.querySelector(`[data-cancel-close-task="${CSS.escape(focusData.key)}"]`)
      || document.querySelector(`[data-close-task="${CSS.escape(focusData.key)}"]`))?.focus({ preventScroll: true });
  } else if (focusData?.kind === 'merge-go') {
    document.querySelector(`[data-merge-go="${CSS.escape(focusData.key)}"]`)?.focus({ preventScroll: true });
  } else if (focusData?.kind === 'review-skip') {
    const controls = [...document.querySelectorAll('[data-review-skip]')];
    (controls.find(button => button.dataset.reviewKey === focusData.key && button.dataset.reviewSkip === focusData.action)
      || controls.find(button => button.dataset.reviewKey === focusData.key && button.dataset.reviewSkip !== focusData.action))?.focus({ preventScroll: true });
  }
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.mode) { ui.mode = t.dataset.mode; }
  else if (t.hasAttribute('data-show-idle')) {
    showIdleSessions = !showIdleSessions;
    render();
    return;
  }
  else if (t.hasAttribute('data-show-finished')) {
    const previous = captureDisplayPreferences();
    ui.hideFinished = false;
    hideFinishedInput.checked = false;
    if (saveDisplayPreferences(previous)) render();
    return;
  }
  else if (t.dataset.filter) {
    const k = t.dataset.filter;
    ui.hidden = ui.hidden.includes(k) ? ui.hidden.filter(x => x !== k) : [...ui.hidden, k];
  }
  else if (t.hasAttribute('data-show-all')) { ui.hidden = []; }
  else if (t.hasAttribute('data-show-hidden-sessions')) { ui.hiddenSessions = []; hiddenSessionsUndo = null; }
  else if (t.hasAttribute('data-undo-hidden-sessions')) {
    if (hiddenSessionsUndo) {
      const restored = new Set(hiddenSessionsUndo.sessionIds);
      ui.hiddenSessions = ui.hiddenSessions.filter(id => !restored.has(id));
      hiddenSessionsUndo = null;
    }
  }
  else if (t.dataset.kindToggle) {
    const stateKey = { decisions: 'expandedKindDecisions', agents: 'expandedKindAgents', tasks: 'expandedKindTasks', todoTasks: 'expandedKindTodoTasks' }[t.dataset.kindToggle];
    if (!stateKey) return;
    ui[stateKey] = !ui[stateKey];
  }
  else if (t.dataset.endedAgents) {
    const id = t.dataset.endedAgents;
    ui.expandedEndedAgents = ui.expandedEndedAgents.includes(id) ? ui.expandedEndedAgents.filter(x => x !== id) : [...ui.expandedEndedAgents, id];
  } else if (t.dataset.endedDecisions) {
    const id = t.dataset.endedDecisions;
    ui.expandedEndedDecisions = ui.expandedEndedDecisions.includes(id) ? ui.expandedEndedDecisions.filter(x => x !== id) : [...ui.expandedEndedDecisions, id];
  } else if (t.dataset.olderMerged) {
    const id = t.dataset.olderMerged;
    ui.expandedMerged = ui.expandedMerged.includes(id) ? ui.expandedMerged.filter(x => x !== id) : [...ui.expandedMerged, id];
  } else if (t.dataset.todoTasks) {
    const id = t.dataset.todoTasks;
    ui.expandedTodoTasks = ui.expandedTodoTasks.includes(id) ? ui.expandedTodoTasks.filter(x => x !== id) : [...ui.expandedTodoTasks, id];
  } else if (t.dataset.doneTasks) {
    const id = t.dataset.doneTasks;
    ui.expandedDoneTasks = ui.expandedDoneTasks.includes(id) ? ui.expandedDoneTasks.filter(x => x !== id) : [...ui.expandedDoneTasks, id];
  } else if (t.dataset.closeAgent) {
    if (!ui.closedAgents.includes(t.dataset.closeAgent)) ui.closedAgents.push(t.dataset.closeAgent);
  } else if (t.dataset.closeTask) {
    scheduleTaskClose(t.dataset.closeTask);
    return;
  } else if (t.dataset.cancelCloseTask) {
    cancelTaskClose(t.dataset.cancelCloseTask);
    return;
  } else if (t.dataset.estimate) {
    const id = t.dataset.estimate;
    if (!ui.estimatedSessions.includes(id)) ui.estimatedSessions.push(id);
  } else if (t.dataset.hideSession) {
    const id = t.dataset.hideSession;
    hiddenSessionsUndo = null;
    if (!ui.hiddenSessions.includes(id)) ui.hiddenSessions.push(id);
  } else if (t.dataset.closeProduct) {
    const product = byId(t.dataset.closeProduct);
    if (product) {
      const sessionIds = visibleSessions(product).map(session => session.id);
      hiddenSessionsUndo = { productName: product.name, sessionIds };
      ui.hiddenSessions = [...new Set([
        ...ui.hiddenSessions,
        ...sessionIds,
      ])];
    }
  }
  else if (t.dataset.collapse) {
    const id = t.dataset.collapse;
    ui.collapsed = ui.collapsed.includes(id) ? ui.collapsed.filter(x => x !== id) : [...ui.collapsed, id];
  }
  else if (t.dataset.pin) {
    const id = t.dataset.pin;
    ui.pinned = ui.pinned.includes(id) ? ui.pinned.filter(x => x !== id) : [...ui.pinned, id];
  } else if (t.dataset.move) {
    const vis = orderedProducts().map(p => p.id);
    const i = vis.indexOf(t.dataset.move), j = i + Number(t.dataset.dir);
    const pinnedCount = vis.filter(id => ui.pinned.includes(id)).length;
    const pinned = ui.pinned.includes(t.dataset.move);
    const canMove = pinned
      ? j >= 0 && j < pinnedCount
      : j >= pinnedCount && j < vis.length;
    if (!canMove) return;
    const a = ui.order.indexOf(vis[i]), b = ui.order.indexOf(vis[j]);
    [ui.order[a], ui.order[b]] = [ui.order[b], ui.order[a]];
  } else if (t.dataset.reviewSkip) {
    const key = t.dataset.reviewKey;
    const [pid, number] = key.split('#');
    const pr = byId(pid)?.prs.find(item => String(item.number) === number);
    if (!pr || !['set', 'clear'].includes(t.dataset.reviewSkip)) return;
    if (t.dataset.reviewSkip === 'set') {
      ui.reviewSkips[key] = { sha: pr.sha, reason: '開発者がダッシュボードでこの head のレビューを不要と判断した' };
    } else {
      delete ui.reviewSkips[key];
      if (pr.xr?.notRequired && pr.xr.source === 'recorded') pr.xr = null;
    }
  } else if (t.dataset.merge) {
    setMergeConfirmation(t.dataset.merge, t.dataset.mergeAction);
  } else if (t.dataset.conflict) {
    ui.confirm = `conflict:${t.dataset.conflict}`;
  } else if (t.dataset.conflictGo) {
    const now = new Date();
    ui.conflictRequested[t.dataset.conflictGo] = absoluteTimeLabel(now);
    ui.confirm = null;
  } else if (t.hasAttribute('data-merge-cancel')) {
    ui.confirm = null;
  } else if (t.dataset.queueLeft) {
    const [pid, n] = t.dataset.queueLeft.split('#');
    const pr = byId(pid).prs.find(x => String(x.number) === n);
    if (pr) pr.mergeIntent = false;
  } else if (t.dataset.mergeGo) {
    const k = t.dataset.mergeGo;
    const [pid, n] = k.split('#');
    const p = byId(pid), pr = p.prs.find(x => String(x.number) === n);
    const o = mergeOpts(p, pr);
    if (o.mergeAfterReview) {
      ui.lastMethod[p.repo.name] = o.method;
      ui.reserved[k] = { method: o.method, del: o.del, at: new Date().toISOString() };
      delete ui.reservationNotices[k];
      ui.confirm = null;
      save();
      render();
      return;
    }
    startMockMerge(p, pr, o);
    return;
  } else if (t.dataset.unreserve) {
    const k = t.dataset.unreserve;
    delete ui.reserved[k];
    ui.reservationNotices[k] = 'レビュー収束後マージの予約を取り消しました。';
  } else if (t.dataset.readyMerge) {
    const k = t.dataset.readyMerge;
    const [pid, n] = k.split('#');
    const p = byId(pid), pr = p.prs.find(x => String(x.number) === n);
    const triage = pr.xr?.triage;
    const round = Number.isSafeInteger(triage?.round) ? Math.max(pr.xr?.round || 1, triage.round) : Math.max(pr.xr?.round || 1, 1);
    pr.xr = { ...(pr.xr && !pr.xr.notRequired ? pr.xr : {}), round, reviewedSha: pr.sha, dismissed: pr.xr?.dismissed || 0, triage: { round, sha: pr.sha, outcome: 'converged' } };
    pr.review = 'approved';
    pr.ci = 'pass';
    finishMockMerge(p, pr, ui.reserved[k], true);
    return;
  } else if (t.dataset.closeMergeResult) {
    closePullRequestMergeResult(t.dataset.closeMergeResult);
  } else if (t.dataset.seen) {
    ui.seen = [...new Set([...ui.seen, t.dataset.seen])];
  } else if (t.dataset.route) {
    ui.routing = { ...ui.routing, [t.dataset.route]: t.dataset.v };
  } else if (t.dataset.restack) {
    ui.restacked[t.dataset.restack] = true;
  } else if (t.hasAttribute('data-send')) {
    const card = t.closest('.decision');
    const id = card.dataset.id;
    const key = answerDraftKey(card.dataset.sessionId, id);
    const a = answerOf(id);
    const now = new Date();
    const at = absoluteTimeLabel(now);
    // 渡した時刻は常駐サーバーがフックへ渡したときに付く。モックでは送ってすぐ渡したものとして出す。
    a.sent = { choice: a.choice, picks: picksOf(a), note: a.note, at, deliveredAt: at };
    ui.answers[id] = a;
    answerErrors.delete(key);
  } else return;
  save(); render();
});

document.addEventListener('change', e => {
  const mc = e.target.closest('.merge-confirm');
  if (mc) {
    const k = mc.dataset.pr;
    const [pid, n] = k.split('#');
    const p = byId(pid), pr = p.prs.find(x => String(x.number) === n);
    const o = mergeOpts(p, pr);
    if (e.target.dataset.method) o.method = e.target.dataset.method;
    if (e.target.hasAttribute('data-del')) o.del = e.target.checked;
    if (e.target.hasAttribute('data-review-merge')) o.mergeAfterReview = e.target.checked;
    ui.mergeOpts[k] = o;
    save(); render();
    return;
  }
  const pick = e.target.closest('input[data-pick]');
  if (pick) {
    const card = pick.closest('.decision');
    const id = card.dataset.id;
    const key = answerDraftKey(card.dataset.sessionId, id);
    const a = answerOf(id);
    const previous = { ...a, picks: [...picksOf(a)] };
    const i = Number(pick.dataset.pick);
    const rest = picksOf(a).filter(x => x !== i);
    a.picks = pick.type === 'radio' ? [i] : pick.checked ? [...rest, i].sort((x, y) => x - y) : rest;
    a.choice = a.picks.length ? 'pick' : null;
    ui.answers[id] = a;
    clearAnswerErrorWhenDraftChanges(key, previous, a);
    save(); render();
    return;
  }
  const cb = e.target.closest('input[data-choice]');
  if (!cb) return;
  const card = cb.closest('.decision');
  const id = card.dataset.id;
  const key = answerDraftKey(card.dataset.sessionId, id);
  const a = answerOf(id);
  const previous = { ...a, picks: [...picksOf(a)] };
  a.choice = cb.checked ? cb.dataset.choice : null;
  a.picks = [];
  ui.answers[id] = a;
  clearAnswerErrorWhenDraftChanges(key, previous, a);
  save(); render();
});

document.addEventListener('input', e => {
  if (!e.target.matches('textarea[data-note]')) return;
  const card = e.target.closest('.decision');
  const a = answerOf(card.dataset.id);
  const key = answerDraftKey(card.dataset.sessionId, card.dataset.id);
  const previous = { ...a, picks: [...picksOf(a)] };
  a.note = e.target.value;
  ui.answers[card.dataset.id] = a;
  clearAnswerErrorWhenDraftChanges(key, previous, a, card);
  save();
  card.querySelector('[data-send]').disabled = !canSend(a) || !answerDirty(a);
});

render();
setInterval(render, 60_000);
</script>
</body>
</html>
