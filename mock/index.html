<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Agent Cockpit</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --border: #dfe2e8;
  --text: #1d2129;
  --text-2: #5b6372;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --warn: #b35c00;
  --warn-soft: #fff1df;
  --danger: #c92a2a;
  --danger-soft: #ffe8e8;
  --ok: #2b8a3e;
  --ok-soft: #e3f6e8;
  --hold: #6741d9;
  --hold-soft: #efe9ff;
  --on-accent: #ffffff;
  --on-ok: #ffffff;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
    --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
    --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
    --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
  --on-accent: #ffffff; --on-ok: #1f1e1d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
  --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
  --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
  --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
  --on-accent: #ffffff; --on-ok: #1f1e1d;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.6 "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
button, textarea, input { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

header.top {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.top[data-away="true"] { background: var(--warn-soft); border-bottom-color: var(--warn); }
.top-inner { position: relative; max-width: 1100px; margin: 0 auto; padding: 10px 64px 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.top h1 { font-size: 16px; margin: 0; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.settings-button, .settings-dialog button, .settings-dialog select { min-height: 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
.settings-button { position: absolute; top: 10px; right: 16px; display: inline-flex; align-items: center; justify-content: center; width: 40px; min-height: 40px; padding: 0; cursor: pointer; color: var(--text-2); }
.settings-button:hover { color: var(--text); }
.settings-button:focus-visible, .settings-dialog button:focus-visible, .settings-dialog select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.away-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; white-space: nowrap; }
.away-toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--warn); }
.away-toggle:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.route-indicator { color: var(--text-2); font-size: 12px; }
.route-indicator[hidden] { display: none; }
.settings-dialog { width: min(680px, calc(100vw - 32px)); max-width: calc(100vw - 32px); padding: 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; }
.settings-dialog::backdrop { background: rgb(0 0 0 / 55%); }
.settings-dialog h2 { margin: 0; font-size: 18px; }
.settings-dialog section { margin-top: 16px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); }
.settings-dialog h3 { margin: 0 0 10px; font-size: 14px; }
.settings-theme-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
.settings-dialog select { max-width: 100%; padding: 4px 8px; }
.settings-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
.settings-dialog button { padding: 4px 12px; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.chip strong { color: var(--text); font-size: 13px; }
.chip.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.hold { background: var(--hold-soft); border-color: transparent; color: var(--hold); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
button.chip { cursor: pointer; font: inherit; font-size: 12px; min-height: 28px; }
button.chip[aria-pressed="false"] { background: transparent; border: 1px dashed var(--border); color: var(--text-2); text-decoration: line-through; opacity: .7; }
button.chip[aria-pressed="false"] strong { color: var(--text-2); }
.filter-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 10px; margin: 0 0 12px; }
.filter-note[hidden] { display: none; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 12px; text-decoration: underline; }
.spacer { flex: 1; }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
.section > .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.section > .head h2 { font-size: 15px; margin: 0; }
.section > .body { padding: 6px 14px 14px; }
.section.pinned { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.meta { color: var(--text-2); font-size: 12px; }
.session-group { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
.session-group.single { border-top: 0; padding-top: 0; margin-top: 0; }
.session-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0 8px; }
.session-head h3 { margin: 0; font-size: 14px; }
.session-tag { font-size: 11px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.session-body { padding-bottom: 6px; }

.order { display: inline-flex; gap: 4px; margin-left: auto; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; min-width: 32px; height: 32px; padding: 0 8px; cursor: pointer; color: var(--text-2); }
.icon-btn:hover { color: var(--text); border-color: var(--text-2); }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.icon-btn:disabled { opacity: .35; cursor: default; }

h3.sub { font-size: 13px; color: var(--text-2); margin: 14px 0 6px; display: flex; align-items: center; gap: 6px; }
h3.sub .count { font-weight: normal; }

.now { display: grid; gap: 6px; }
.now-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.now-row .who { font-size: 12px; color: var(--text-2); }
.now-row .who .prod-tag { display: table; margin: 2px 0; }
.now-row .who b { color: var(--text); font-weight: 600; display: block; font-size: 13px; }
.now-row .since { font-size: 12px; color: var(--text-2); white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--text-2); }
.dot.busy { background: var(--ok); animation: pulse 1.6s infinite; }
.dot.wait { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }

.models { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 4px; }
.model { display: inline-flex; gap: 6px; align-items: baseline; font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--border); white-space: nowrap; }
.model i { font-style: normal; color: var(--text-2); font-size: 11px; }
.model.claude { background: var(--warn-soft); border-color: transparent; }
.model.gpt { background: var(--ok-soft); border-color: transparent; }
.model.off { color: var(--text-2); white-space: normal; }
.arrow { color: var(--text-2); font-size: 12px; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.task { padding: 6px 10px; border-radius: 8px; }
.task:hover { background: var(--surface-2); }
.task .line { display: flex; gap: 8px; align-items: baseline; }
.state { font-size: 11px; padding: 0 8px; border-radius: 999px; white-space: nowrap; }
.state.done { background: var(--ok-soft); color: var(--ok); }
.state.doing { background: var(--accent-soft); color: var(--accent); }
.state.todo { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.task.done .title { color: var(--text-2); }
.criteria { margin: 4px 0 0 0; padding-left: 20px; font-size: 12px; color: var(--text-2); }
.criteria li.met { color: var(--ok); }
.criteria li.met::marker { content: "✓ "; }
.criteria li::marker { content: "・"; }

.decision { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; background: var(--surface); }
.decision.blocking { border-left: 4px solid var(--danger); }
.decision.provisional { border-left: 4px solid var(--warn); }
.decision.state-ok { border-left: 4px solid var(--ok); }
.decision.state-hold { border-left: 4px solid var(--hold); }
.decision.withdrawn { border-left: 4px solid var(--border); }
.decision .dhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.decision .dtitle { font-weight: 600; }
.decision .ctx { font-size: 13px; color: var(--text-2); margin: 4px 0 8px; }
.options { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 4px; }
.options li { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.options li.rec { background: var(--accent-soft); }
.options li .tag { font-size: 11px; color: var(--accent); font-weight: 600; margin-right: 6px; }
.options li .why { display: block; color: var(--text-2); font-size: 12px; }
.answer { display: grid; gap: 8px; }
.checks { display: flex; gap: 8px; flex-wrap: wrap; }
.check { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; user-select: none; min-height: 40px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.check.ok:has(input:checked) { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.check.hold:has(input:checked) { background: var(--hold-soft); border-color: var(--hold); color: var(--hold); }
.check.hold input { accent-color: var(--hold); }
.check.ok input { accent-color: var(--ok); }
textarea { width: 100%; min-height: 56px; resize: vertical; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
.answer-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; min-height: 40px; }
.primary:disabled { opacity: .4; cursor: default; }
.sent { font-size: 12px; color: var(--text-2); }

.review { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.stat .k { font-size: 12px; color: var(--text-2); }
.stat .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rounds { display: flex; gap: 4px; margin-top: 4px; }
.rounds span { width: 22px; height: 6px; border-radius: 3px; background: var(--border); }
.rounds span.used { background: var(--accent); }

.prod-tag { font-size: 11px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.empty { color: var(--text-2); font-size: 13px; padding: 6px 10px; }
.note { color: var(--text-2); font-size: 12px; margin: 0 0 12px; }

.prs-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.stack { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 8px; background: var(--surface); }
.stack-base { font-size: 12px; color: var(--text-2); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.stack-base code, .pr code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.stack-level { margin-left: 10px; padding-left: 12px; border-left: 2px solid var(--border); }
.pr { padding: 8px 0 4px; }
.pr .pline { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pr .num { font-weight: 600; }
.pr .pos { font-size: 11px; color: var(--text-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; }
.pr .branch { color: var(--text-2); font-size: 12px; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
.badge { font-size: 11px; padding: 0 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.mute { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.busy { background: var(--accent-soft); color: var(--accent); }
.badge.wait { background: var(--warn-soft); color: var(--warn); }
.badge.done { background: var(--ok-soft); color: var(--ok); }
.pr .why-not { font-size: 12px; color: var(--text-2); }
.pr.can-merge { background: var(--ok-soft); margin: 4px -6px; padding: 8px 6px 6px; border-radius: 8px; }
.merge-btn { background: var(--ok); color: var(--on-ok); border: 0; border-radius: 8px; padding: 4px 12px; cursor: pointer; min-height: 32px; margin-left: auto; }
.merge-confirm { margin-top: 8px; border: 1px solid var(--ok); border-radius: 8px; padding: 10px 12px; background: var(--surface); display: grid; gap: 8px; font-size: 13px; }
.merge-confirm .methods { display: flex; gap: 6px; flex-wrap: wrap; }
.merge-confirm .opt { justify-self: start; }
.merge-confirm .methods label, .merge-confirm .opt { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; min-height: 32px; }
.merge-confirm .effects { margin: 0; padding-left: 20px; color: var(--text-2); font-size: 12px; }
.merge-confirm .effects li.warn { color: var(--warn); }
.merge-confirm .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ghost { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; cursor: pointer; min-height: 40px; }
.merge-go { background: var(--ok); color: var(--on-ok); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; min-height: 40px; }
.merged-list { font-size: 12px; color: var(--text-2); margin-top: 6px; }
.merged-list .badge { margin-right: 4px; }

.routing { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; display: grid; gap: 8px; container-type: inline-size; }
.routing .rgroup { display: grid; grid-template-columns: max-content max-content; gap: 8px 10px; align-items: center; }
.routing .rgroup .rrow { display: contents; }
@container (min-width: 560px) {
  .routing .rgroup { grid-template-columns: repeat(4, max-content); }
  .routing .rgroup .rrow + .rrow .rlabel { margin-left: 22px; }
}
.routing .rrow { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.routing .rlabel { font-size: 13px; font-weight: 600; }
.routing .seg button { padding: 4px 10px; font-size: 13px; min-height: 32px; }
.route-tag { font-size: 11px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.route-tag.stale { border-style: dashed; color: var(--warn); }
.settings-dialog .routing { margin: 0; padding: 0; border: 0; background: transparent; }
.settings-dialog .routing .rgroup { grid-template-columns: max-content max-content; }
.settings-dialog .routing .rrow + .rrow .rlabel { margin-left: 0; }
@container (min-width: 560px) {
  .settings-dialog .routing .rgroup { grid-template-columns: repeat(4, max-content); }
  .settings-dialog .routing .rrow + .rrow .rlabel { margin-left: 22px; }
}
.settings-dialog .routing .seg button { padding: 4px 10px; font-size: 13px; min-height: 32px; }
.badge.unknown, .state.unknown { background: var(--surface-2); color: var(--text-2); border: 1px dashed var(--border); }
.agent-list { display: grid; gap: 6px; }
.agent-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.agent-row .who { font-size: 12px; color: var(--text-2); }
.agent-row .who b { color: var(--text); font-weight: 600; display: block; font-size: 13px; }
.agent-row .since { font-size: 12px; color: var(--text-2); white-space: nowrap; }
.ended-toggle { margin-top: 6px; min-height: 32px; padding: 2px 10px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; color: var(--text-2); font: inherit; font-size: 12px; cursor: pointer; }
.ended-toggle:hover { color: var(--text); }
.ended-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.estimate { display: grid; gap: 6px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 12px; }
.estimate p { margin: 0; }
.session-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.excluded-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 10px; margin: 0 0 12px; }
.excluded-note[hidden] { display: none; }
.wait { font-size: 12px; color: var(--text-2); white-space: nowrap; }
.wait.stale { color: var(--danger); font-weight: 600; }
.decision.long-wait { background: var(--danger-soft); }
.perm code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
.news { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin: 10px 0 4px; font-size: 13px; }
.news .nhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 600; color: var(--accent); }
.news ul { margin: 4px 0 0; padding-left: 20px; }
.new-mark { font-size: 10px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 4px; padding: 0 5px; }
.auto-btn { background: none; color: var(--ok); border: 1px solid var(--ok); border-radius: 8px; padding: 4px 12px; cursor: pointer; min-height: 32px; margin-left: auto; }
.pr.reserved { background: var(--accent-soft); margin: 4px -6px; padding: 8px 6px 6px; border-radius: 8px; }
.merge-confirm.auto { border-color: var(--accent); }
.merge-confirm.auto .merge-go { background: var(--accent); }

@media (max-width: 640px) {
  .now-row { grid-template-columns: 1fr; gap: 2px; }
  .agent-row { grid-template-columns: 1fr; gap: 2px; }
  .order { margin-left: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Agent Cockpit</h1>
    <div class="summary" id="summary"></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="表示モード">
      <button type="button" data-mode="product" aria-pressed="true">プロダクト別</button>
      <button type="button" data-mode="kind" aria-pressed="false">種類別</button>
    </div>
    <span class="route-indicator" id="route-indicator" hidden></span>
    <label class="away-toggle" for="away-toggle"><input id="away-toggle" type="checkbox">離席中</label>

const ui = Object.assign({ mode: 'product', order: DATA.products.map(p => p.id), pinned: [], collapsed: [], hidden: [], hiddenSessions: [], estimatedSessions: [], expandedEndedAgents: [], expandedEndedDecisions: [], expandedDoneTasks: [], answers: {}, merged: {}, restacked: {}, mergeOpts: {}, confirm: null, reserved: {}, seen: [], routing: { agents: 'default', review: 'default' }, theme: 'dark', away: false, lastMethod: {} }, load());

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const settingsClose = document.getElementById('settings-close');

const awayToggle = document.getElementById('away-toggle');
const topBar = document.querySelector('header.top');

function applyTheme(theme) {
  const selected = ['light', 'dark', 'system'].includes(theme) ? theme : 'dark';
  if (selected === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = selected;
  themeSelect.value = selected;
  ui.theme = selected;
}

function applyAway(away) {
  ui.away = away === true;
  awayToggle.checked = ui.away;
  topBar.dataset.away = String(ui.away);
}

applyTheme(ui.theme);
applyAway(ui.away);
themeSelect.addEventListener('change', () => { applyTheme(themeSelect.value); save(); });
awayToggle.addEventListener('change', () => { applyAway(awayToggle.checked); save(); });
settingsButton.addEventListener('click', () => settingsDialog.showModal());
settingsClose.addEventListener('click', () => settingsDialog.close());
settingsDialog.addEventListener('click', event => {
  const box = settingsDialog.getBoundingClientRect();
  const isOutside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
  if (event.target === settingsDialog && isOutside) settingsDialog.close();
});
settingsDialog.addEventListener('close', () => settingsButton.focus());

function orderedProducts() {
  const pinned = ui.order.filter(id => ui.pinned.includes(id));
  const rest = ui.order.filter(id => !ui.pinned.includes(id));
  return [...pinned, ...rest].map(byId).filter(Boolean);
}

function answerOf(id) { return ui.answers[id] || { choice: null, note: '', sent: null }; }

const allSessions = () => DATA.products.flatMap(p => p.sessions);
const visibleSessions = p => p.sessions.filter(s => !ui.hiddenSessions.includes(s.id));
const effectiveDecisionState = d => answerOf(d.id).sent?.choice === 'ok' && ['waiting', 'provisional'].includes(d.kind) ? 'resolved' : d.kind;
const pendingDecisions = p => visibleSessions(p).flatMap(s => s.decisions).filter(d => {
  const a = answerOf(d.id);
  return ['waiting', 'provisional'].includes(effectiveDecisionState(d)) && (!a.sent || a.sent.choice === 'hold');
});

const FILTERS = [
  { key: 'permission', label: '許可待ち', cls: 'danger' },
  { key: 'blocking', label: '止めて待っている', cls: 'danger' },
  { key: 'provisional', label: '仮に推奨案で進行中', cls: 'warn' },
  { key: 'held', label: '保留中', cls: 'hold' },
  { key: 'agents', label: '稼働中のサブエージェント', cls: 'accent' },
  { key: 'prs', label: 'マージできる PR', cls: 'ok' },
];

function decisionCategory(d) {
  const a = answerOf(d.id);
  const state = effectiveDecisionState(d);
  if (state === 'resolved' || state === 'withdrawn') return state;
  if (!a.sent) return state === 'waiting' ? 'blocking' : state;
  return a.sent.choice === 'hold' ? 'held' : 'answered';
}
const isShown = key => !ui.hidden.includes(key);
const visibleDecisions = s => s.decisions.filter(d => ['waiting', 'provisional'].includes(effectiveDecisionState(d)) && isShown(decisionCategory(d)));
const visibleSubagents = s => s.subagents.filter(agent => agent.state !== 'busy' || isShown('agents'));
const visiblePermissions = s => isShown('permission') ? s.perms : [];

function countHidden() {
  const hiddenRows = allSessions().filter(s => !ui.hiddenSessions.includes(s.id)).reduce((n, s) => n
    + s.decisions.filter(d => ['waiting', 'provisional'].includes(effectiveDecisionState(d)) && !isShown(decisionCategory(d))).length
    + s.subagents.filter(agent => agent.state === 'busy' && !isShown('agents')).length
    + (isShown('permission') ? 0 : s.perms.length), 0);
  return hiddenRows + (isShown('prs') ? 0 : DATA.products.reduce((n, p) => n + openPrs(p).length, 0));
}

function renderSummary() {
  const sessions = allSessions().filter(s => !ui.hiddenSessions.includes(s.id));
  const all = sessions.flatMap(s => s.decisions.map(d => ({ d, a: answerOf(d.id) })));
  const blocking = all.filter(x => effectiveDecisionState(x.d) === 'waiting' && !x.a.sent).length;
  const provisional = all.filter(x => effectiveDecisionState(x.d) === 'provisional' && !x.a.sent).length;
  const held = all.filter(x => x.a.sent && x.a.sent.choice === 'hold').length;
  const agents = sessions.flatMap(s => s.subagents).filter(agent => agent.state === 'busy').length;
  const prs = DATA.products.reduce((n, p) => n + openPrs(p).filter(pr => !mergeBlocker(p, pr)).length, 0);
  const permission = sessions.reduce((n, s) => n + s.perms.length, 0);
  const counts = { permission, blocking, provisional, held, agents, prs };
  // タブのタイトルに、開発者の手が要る件数(許可待ちと、止めて待っている判断)を出す
  const need = permission + blocking;
  document.title = need ? `(${need}) Agent Cockpit` : 'Agent Cockpit';
  document.getElementById('summary').innerHTML = FILTERS.map(x =>
    `<button type="button" class="chip ${x.cls}" data-filter="${x.key}" aria-pressed="${isShown(x.key)}" title="${isShown(x.key) ? '押すと非表示にする' : '押すと表示に戻す'}">${x.label} <strong>${counts[x.key]}</strong></button>`).join('');
  const hiddenCount = countHidden();
  const note = document.getElementById('filter-note');
  note.hidden = ui.hidden.length === 0;
  note.innerHTML = `<span>非表示: ${FILTERS.filter(x => !isShown(x.key)).map(x => x.label).join('、')}(${hiddenCount} 件)</span><button type="button" class="link-btn" data-show-all>すべて表示する</button>`;
  const excluded = document.getElementById('excluded-note');
  const hiddenSessions = allSessions().filter(s => ui.hiddenSessions.includes(s.id));
  excluded.hidden = hiddenSessions.length === 0;
  excluded.innerHTML = `<span>外したセッション ${hiddenSessions.length} 件</span><button type="button" class="link-btn" data-show-hidden-sessions>すべて表示する</button>`;
}

function modelLine(s) {

  document.getElementById('routing').innerHTML = `<div class="rgroup">${row('agents')}${row('review')}</div>`;
  const changed = Object.keys(ROUTE).filter(key => ui.routing[key] !== 'default');
  const indicator = document.getElementById('route-indicator');
  indicator.hidden = changed.length === 0;
  indicator.textContent = changed.length ? `経路: ${changed.map(key => `${ROUTE[key].label} ${routeName(key, ui.routing[key])}`).join(' / ')}` : '';
}

function ageMinutes(item) {
  if (Number.isFinite(item.sinceMin)) return item.sinceMin;
  if (Number.isFinite(item.waitMin)) return item.waitMin;
  const match = String(item.since || '').match(/(\d+)\s*分前/);
  return match ? Number(match[1]) : Number.POSITIVE_INFINITY;
}

const sessionsByActivity = p => visibleSessions(p).sort((a, b) => ageMinutes(a.main) - ageMinutes(b.main));

function sessionTag(p, session, withTag) {
  if (!withTag) return '';
  const product = `<span class="prod-tag">${esc(p.name)}</span>`;
  const title = p.sessions.length > 1 ? `<span class="session-tag">${esc(session.title)}</span>` : '';
  return `${product}${title}`;
}

function mainRow(p, session, withTag) {
  const taskTitle = session.tasks.find(task => task.state === 'doing')?.title || '';
  const status = session.status === 'busy' ? '作業中' : session.status === 'wait' ? '待機中' : '状態不明';
  const stateClass = session.status === 'unknown' ? 'unknown' : session.status;
  const tool = session.main.tool || '—';
  return `<div class="now-row">
      <div class="who"><span class="dot ${stateClass}"></span>メイン${sessionTag(p, session, withTag)}<b>${status}</b></div>
      <div>${taskTitle ? esc(taskTitle) : ''}<div class="meta">${esc(tool)}</div></div>
      <div class="since">${esc(session.main.since || '')}</div></div>`;
}

function agentRow(p, session, agent, withTag) {
  const state = agent.state === 'busy' ? ['稼働中', 'busy'] : agent.unconfirmed ? ['終了未確認', 'wait'] : ['終了', 'done'];
  return `<div class="agent-row">
    <div class="who"><span class="dot ${agent.unconfirmed ? 'wait' : agent.state}"></span>サブエージェント${sessionTag(p, session, withTag)}<b>${esc(agent.type)}</b><span class="badge ${state[1]}">${state[0]}</span></div>
    <div>${esc(agent.text)}${modelLine(agent)}${routeTag(agent)}</div><div class="since">${esc(agent.since)}</div></div>`;
}

function endedAgentToggle(session) {
  const ended = session.subagents.filter(agent => agent.state === 'done' && !agent.unconfirmed);
  if (!ended.length) return '';
  const expanded = ui.expandedEndedAgents.includes(session.id);
  const label = expanded ? '終了済みを隠す' : '終了済みを表示';
  return `<button type="button" class="ended-toggle" data-ended-agents="${esc(session.id)}" aria-expanded="${expanded}">${label}(${ended.length} 件)</button>`;
}

function agentSection(p, session, withTag) {
  const expanded = ui.expandedEndedAgents.includes(session.id);
  const agents = visibleSubagents(session).filter(agent => agent.state !== 'done' || agent.unconfirmed || expanded)
    .sort((a, b) => ageMinutes(a) - ageMinutes(b));
  const rows = agents.map(agent => agentRow(p, session, agent, withTag)).join('');
  const hasEnded = session.subagents.some(agent => agent.state === 'done' && !agent.unconfirmed);
  const empty = hasEnded ? '稼働中のサブエージェントはありません。' : 'サブエージェントはありません。';
  return `${rows ? `<div class="agent-list">${rows}</div>` : `<div class="empty">${empty}</div>`}${endedAgentToggle(session)}`;
}

function taskItem(p, session, t, withTag) {
  const label = { done: '完了', doing: '作業中', todo: '未着手' }[t.state];
  const met = t.criteria.filter(c => c.met).length;
  return `<li class="task ${t.state}">
    <div class="line"><span class="state ${t.state}">${label}</span>${sessionTag(p, session, withTag)}
      <span class="title">${esc(t.title)}</span><span class="meta">完了条件 ${met}/${t.criteria.length}</span></div>
    <ul class="criteria">${t.criteria.map(c => `<li class="${c.met ? 'met' : ''}">${esc(c.t)}</li>`).join('')}</ul></li>`;
}

// 一定時間を超えて放置された待ちは強調する。閾値は判断待ち(計画書)
const LONG_WAIT_MIN = 15;
const waitLabel = m => `<span class="wait ${m > LONG_WAIT_MIN ? 'stale' : ''}">${m} 分待機中${m > LONG_WAIT_MIN ? '(長い)' : ''}</span>`;
const isNew = (p, item) => !!item.isNew && !ui.seen.includes(p.id);

// 許可待ち: Notification フックで受ける。許可そのものはデスクトップアプリで出す
function permCard(p, session, x, withTag) {
  const long = x.waitMin > LONG_WAIT_MIN;
  return `<article class="decision blocking perm ${long ? 'long-wait' : ''}">
    <div class="dhead">${sessionTag(p, session, withTag)}<span class="dtitle">${esc(x.who)}がツールの実行許可を待っている</span>
      <span class="chip danger">許可待ち</span>${waitLabel(x.waitMin)}</div>
    <div class="ctx">${esc(x.tool)}: <code>${esc(x.detail)}</code></div>
    <div class="meta">許可はデスクトップアプリの ${esc(p.name)} のセッションで出す。ダッシュボードからは出せない。</div>
  </article>`;
}
const visiblePerms = session => [...visiblePermissions(session)].sort((a, b) => ageMinutes(a) - ageMinutes(b));

// 前回見てからの変化。常駐サーバーが項目ごとの更新時刻を持ち、画面は最後に見た時刻と比べる想定
function newsBox(p, withTag) {
  if (!p.news.length || ui.seen.includes(p.id)) return '';
  return `<div class="news"><div class="nhead">${withTag ? `<span class="prod-tag">${esc(p.name)}</span>` : ''}前回見てから ${p.news.length} 件
    <button type="button" class="link-btn" data-seen="${p.id}">既読にする</button></div>
    <ul>${p.news.map(n => `<li>${esc(n.t)}</li>`).join('')}</ul></div>`;
}

function decisionCard(p, session, d, withTag) {
  const a = answerOf(d.id);
  const state = effectiveDecisionState(d);
  const stateClass = { waiting: 'blocking', provisional: 'provisional', resolved: 'state-ok', withdrawn: 'withdrawn' }[state];
  const stateLabel = { waiting: '止めて待っている', provisional: '推奨で仮に進行中', resolved: '解決済み', withdrawn: '取り下げ' }[state];
  const stateTone = { waiting: 'danger', provisional: 'warn', resolved: 'ok', withdrawn: 'mute' }[state];
  const stateChip = `<span class="chip ${stateTone}">${stateLabel}</span>`;
  const sentLine = a.sent
    ? `<span class="sent">${a.sent.at} に送信済み: ${a.sent.choice === 'ok' ? '推奨案で OK' : a.sent.choice === 'hold' ? '判断を保留' : '指示のみ'}${a.sent.note ? '(指示あり)' : ''}</span>`
    : state === 'waiting' || state === 'provisional' ? '<span class="sent">未送信</span>' : '';
  const dirty = !a.sent || a.sent.choice !== a.choice || a.sent.note !== a.note;
  const long = state === 'waiting' && !a.sent && d.waitMin > LONG_WAIT_MIN;
  const active = state === 'waiting' || state === 'provisional';
  const elapsed = state === 'waiting' ? waitLabel(d.waitMin) : state === 'provisional' ? `<span class="wait">仮適用から ${d.waitMin} 分</span>` : '';
  return `<article class="decision ${stateClass} ${long ? 'long-wait' : ''}" data-id="${d.id}">
    <div class="dhead">${isNew(p, d) ? '<span class="new-mark">新着</span>' : ''}${sessionTag(p, session, withTag)}<span class="dtitle">${esc(d.title)}</span>${stateChip}${elapsed}</div>
    <div class="ctx">${esc(d.ctx)}</div>
    <ul class="options">${d.options.map(o => `<li class="${o.rec ? 'rec' : ''}">${o.rec ? '<span class="tag">推奨</span>' : ''}${esc(o.t)}<span class="why">${esc(o.why)}</span></li>`).join('')}</ul>
    ${active ? `<div class="answer">
      <div class="checks">
        <label class="check ok"><input type="checkbox" data-choice="ok" ${a.choice === 'ok' ? 'checked' : ''}>推奨案で OK</label>
        <label class="check hold"><input type="checkbox" data-choice="hold" ${a.choice === 'hold' ? 'checked' : ''}>判断を保留する</label>
      </div>
      <textarea data-note placeholder="指示があれば書く(例: 2 番目の案で。理由は…)">${esc(a.note)}</textarea>
      <div class="answer-foot">
        <button type="button" class="primary" data-send ${(!a.choice && !a.note.trim()) || !dirty ? 'disabled' : ''}>回答を送る</button>
        ${sentLine}
      </div>
    </div>` : sentLine ? `<div class="answer-foot">${sentLine}</div>` : ''}</article>`;
}

function reviewBlock(p, withTag) {
  const r = p.review;
  const rounds = Array.from({ length: r.max }, (_, i) => `<span class="${i < r.round ? 'used' : ''}"></span>`).join('');
  return `<div class="review">
    <div class="stat"><div class="k">${withTag ? `<span class="prod-tag">${esc(p.name)}</span> ` : ''}往復(上限 ${r.max})</div><div class="v">${r.round} / ${r.max}</div><div class="rounds">${rounds}</div></div>
    <div class="stat"><div class="k">非対応</div><div class="v">${r.dismissed}</div></div>
  </div>`;
}


// ---- プルリクエスト(スタック) ----
// 常駐サーバーは gh pr list --json で取得し、base と head の対応からスタックを組み立てる想定。
const prKey = (p, n) => `${p.id}#${n}`;
const isMerged = (p, pr) => !!ui.merged[prKey(p, pr.number)];
const openPrs = p => p.prs.filter(pr => !isMerged(p, pr));
const prByHead = (p, head) => p.prs.find(pr => pr.head === head);

// マージ済みの PR を base にしていたものは、その PR の base へ付け替わったとみなす。
// squash で入った PR の上に積んでいたものは、積み直すまで下の PR のコミットが差分に残る。
function effective(p, pr) {
  let base = pr.base, retargetedFrom = null, squashedUnder = null;
  for (let m = prByHead(p, base); m && isMerged(p, m); m = prByHead(p, base)) {
    retargetedFrom = retargetedFrom || m;
    if (ui.merged[prKey(p, m.number)].method === 'squash') squashedUnder = squashedUnder || m;
    base = m.base;
  }
  const needsRestack = !!squashedUnder && !ui.restacked[prKey(p, pr.number)];
  return { base, retargetedFrom, squashedUnder, needsRestack };
}

function parentPr(p, pr) {
  const b = effective(p, pr).base;
  return openPrs(p).find(x => x.head === b) || null;
}
const childPrs = (p, pr) => openPrs(p).filter(x => parentPr(p, x) === pr);

// 下から数えた位置と、スタック全体の段数
function stackPos(p, pr) {
  let depth = 1; for (let x = parentPr(p, pr); x; x = parentPr(p, x)) depth++;
  let root = pr; while (parentPr(p, root)) root = parentPr(p, root);
  const height = (x) => 1 + Math.max(0, ...childPrs(p, x).map(height));
  return { depth, total: height(root) };
}

function mergeBlocker(p, pr) {
  const e = effective(p, pr);
  const parent = parentPr(p, pr);
  if (parent) return `下の #${parent.number} のマージ待ち`;
  if (e.base !== p.repo.defaultBranch) return `base の ${e.base} に対応する PR が見つからない`;
  if (pr.draft) return 'ドラフト';
  if (e.needsRestack) return `積み直し待ち(squash で入った #${e.squashedUnder.number} のコミットが差分に残っている)`;
  if (pr.conflict) return 'コンフリクトあり';
  if (pr.ci === 'fail') return 'CI が失敗';
  if (pr.ci === 'pending') return 'CI 実行中';
  if (pr.review === 'changes') return '変更を求められている';
  if (pr.review === 'required') return 'レビューの承認待ち';
  return null;
}

const METHOD_LABEL = { merge: 'マージコミット', squash: 'スカッシュ', rebase: 'リベース' };
function mergeOpts(p, pr) {
  const k = prKey(p, pr.number);
  const last = ui.lastMethod[p.repo.name];
  const method = p.repo.methods.includes(last) ? last : p.repo.methods[0];
  return ui.mergeOpts[k] || { method, del: true };
}

function prBadges(p, pr) {
  const e = effective(p, pr);
  const ci = { pass: ['ok', 'CI 成功'], pending: ['warn', 'CI 実行中'], fail: ['danger', 'CI 失敗'] }[pr.ci];
  const rv = { approved: ['ok', '承認済み'], required: ['mute', '承認待ち'], none: ['mute', '承認は任意'], changes: ['danger', '変更要求'] }[pr.review];
  return [
    pr.draft ? '<span class="badge mute">ドラフト</span>' : '',
    `<span class="badge ${ci[0]}">${ci[1]}</span>`,
    `<span class="badge ${rv[0]}">${rv[1]}</span>`,
    pr.conflict ? '<span class="badge danger">コンフリクト</span>' : '',
    e.retargetedFrom ? `<span class="badge accent">base を ${esc(e.base)} に付け替え済み</span>` : '',
    e.needsRestack ? '<span class="badge warn">積み直しが必要</span>' : '',
  ].join('');
}

// CI 実行中だけが理由のときは「CI が通ったらマージ」を予約できる(gh pr merge --auto)
// 承認待ちや変更要求が残る PR は CI が通ってもマージされないので、予約を出さない。
const canReserve = (p, pr) => mergeBlocker(p, pr) === 'CI 実行中' && (pr.review === 'approved' || pr.review === 'none');

function mergeConfirm(p, pr, auto) {
  const o = mergeOpts(p, pr);
  const kids = childPrs(p, pr);
  const kidNames = kids.map(k => `#${k.number}`).join('、');
  const effects = [
    `head が ${esc(pr.sha)} のときだけマージする(画面を見たあとに push されていたら中止する)`,
    kids.length ? `先に ${kidNames} の base を ${esc(p.repo.defaultBranch)} に付け替える` : '',
    o.del ? `リモートのブランチ ${esc(pr.head)} を削除する(手元の worktree には触れない)` : '',
    kids.length && o.method === 'squash' ? `<span>スカッシュのため ${kidNames} には #${pr.number} のコミットが残る。セッションに積み直しを依頼する</span>` : '',
    `結果を ${esc(p.name)} のセッションに知らせる`,
    auto ? `予約のあとに push されたら、予約を取り消して知らせる` : '',
  ].filter(Boolean);
  return `<div class="merge-confirm ${auto ? 'auto' : ''}" data-pr="${prKey(p, pr.number)}">
    <div><strong>#${pr.number}</strong> を <code>${esc(p.repo.defaultBranch)}</code> へ${auto ? '、CI が通ったら自動で' : ''}マージする</div>
    <div class="methods" role="radiogroup" aria-label="マージの方式">${p.repo.methods.map(m =>
      `<label><input type="radio" name="m-${prKey(p, pr.number)}" data-method="${m}" ${o.method === m ? 'checked' : ''}>${METHOD_LABEL[m]}</label>`).join('')}
      ${p.repo.methods.length === 1 ? '<span class="meta">リポジトリの設定で許可されている方式だけを出す</span>' : ''}</div>
    <label class="opt"><input type="checkbox" data-del ${o.del ? 'checked' : ''}>マージ後にブランチを削除する</label>
    <ul class="effects">${effects.map(x => `<li class="${x.startsWith('<span>') ? 'warn' : ''}">${x}</li>`).join('')}</ul>
    <div class="row"><button type="button" class="merge-go" ${auto ? 'data-reserve-go' : 'data-merge-go'}="${prKey(p, pr.number)}">${auto ? '予約する' : 'マージする'}</button>
      <button type="button" class="ghost" data-merge-cancel>やめる</button></div>
  </div>`;
}

function prItem(p, pr) {
  const k = prKey(p, pr.number);
  const blocker = mergeBlocker(p, pr);
  const pos = stackPos(p, pr);
  const e = effective(p, pr);
  const rsv = ui.reserved[k];
  const reservable = !rsv && canReserve(p, pr);
  return `<div class="pr ${blocker ? (rsv ? 'reserved' : '') : 'can-merge'}">
    <div class="pline">
      ${pos.total > 1 ? `<span class="pos" title="下から数えた位置">${pos.depth}/${pos.total}</span>` : ''}
      <span class="num">#${pr.number}</span><span>${esc(pr.title)}</span>
      ${blocker ? '' : `<button type="button" class="merge-btn" data-merge="${k}" ${ui.confirm === k ? 'disabled' : ''}>マージ…</button>`}
      ${reservable ? `<button type="button" class="auto-btn" data-merge="${k}" ${ui.confirm === k ? 'disabled' : ''}>CI が通ったらマージ…</button>` : ''}
    </div>
    <div class="branch"><code>${esc(pr.head)}</code> → <code>${esc(e.base)}</code></div>
    <div class="badges">${prBadges(p, pr)}</div>
    ${rsv ? `<div class="badges"><span class="badge accent">マージ予約中(${METHOD_LABEL[rsv.method]}、${esc(rsv.at)} に予約、head ${esc(pr.sha)})</span>
      <button type="button" class="link-btn" data-unreserve="${k}">予約を取り消す</button>
      <button type="button" class="link-btn" data-ci-pass="${k}">モック: CI の成功を再現する</button></div>` : ''}
    ${blocker && !rsv ? `<div class="why-not">マージできない理由: ${esc(blocker)}
      ${e.needsRestack ? ` <button type="button" class="link-btn" data-restack="${k}">モック: 積み直しの完了を再現する</button>` : ''}</div>` : ''}
    ${ui.confirm === k && !blocker ? mergeConfirm(p, pr, false) : ''}
    ${ui.confirm === k && reservable ? mergeConfirm(p, pr, true) : ''}
  </div>`;
}

function prTree(p, pr) {
  const kids = childPrs(p, pr);
  return prItem(p, pr) + (kids.length ? `<div class="stack-level">${kids.map(k => prTree(p, k)).join('')}</div>` : '');
}

function prBlock(p, withTag) {
  const roots = openPrs(p).filter(pr => !parentPr(p, pr));
  const merged = p.prs.filter(pr => isMerged(p, pr));
  const tag = withTag ? `<span class="prod-tag">${esc(p.name)}</span>` : '';
  const head = `<div class="prs-head meta">${tag}<span>${esc(p.repo.name)}</span><span>GitHub から ${esc(p.repo.fetched)}に取得</span></div>`;
  const stacks = roots.map(r => `<div class="stack">
      <div class="stack-base"><code>${esc(effective(p, r).base)}</code>${childPrs(p, r).length ? `<span>スタック ${stackPos(p, r).total} 段</span>` : ''}</div>
      <div class="stack-level">${prTree(p, r)}</div></div>`).join('');
  const mergedLine = merged.length ? `<div class="merged-list">マージ済み: ${merged.map(pr => {
      const m = ui.merged[prKey(p, pr.number)];
      return `<span class="badge mute">#${pr.number}(${METHOD_LABEL[m.method]}、${esc(m.at)}${m.auto ? '、予約で自動' : ''})</span>`; }).join('')}</div>` : '';
  if (!roots.length && !merged.length) return head + '<div class="empty">このセッションが作った PR はありません</div>';
  return head + (stacks || '<div class="empty">オープンの PR はありません</div>') + mergedLine;
}

function endedDecisionToggle(session) {
  const ended = session.decisions.filter(d => ['resolved', 'withdrawn'].includes(effectiveDecisionState(d)));
  if (!ended.length) return '';
  const expanded = ui.expandedEndedDecisions.includes(session.id);
  return `<button type="button" class="ended-toggle" data-ended-decisions="${esc(session.id)}" aria-expanded="${expanded}">${expanded ? '解決済みと取り下げを隠す' : '解決済みと取り下げを表示'}(${ended.length} 件)</button>`;
}

function decisionSessionBlock(p, session, withTag) {
  const active = visibleDecisions(session).sort((a, b) => ageMinutes(a) - ageMinutes(b));
  const ended = session.decisions.filter(d => ['resolved', 'withdrawn'].includes(effectiveDecisionState(d)));
  const expanded = ui.expandedEndedDecisions.includes(session.id);
  const visible = expanded ? [...active, ...ended].sort((a, b) => ageMinutes(a) - ageMinutes(b)) : active;
  const cards = visible.map(d => decisionCard(p, session, d, withTag)).join('');
  const empty = ended.length ? '未解決の判断事項はありません。' : 'ありません';
  return `${cards || `<div class="empty">${empty}</div>`}${endedDecisionToggle(session)}`;
}

function taskSessionBlock(p, session, withTag) {
  const done = session.tasks.filter(task => task.state === 'done');
  const expanded = ui.expandedDoneTasks.includes(session.id);
  const visible = expanded ? session.tasks : session.tasks.filter(task => task.state !== 'done');
  const updated = `最終更新 ${session.tasksUpdatedMin} 分前`;
  const items = visible.map(task => taskItem(p, session, task, withTag)).join('');
  const toggle = done.length
    ? `<button type="button" class="ended-toggle" data-done-tasks="${esc(session.id)}" aria-expanded="${expanded}">${expanded ? '完了したタスクを隠す' : '完了したタスクを表示'}(${done.length} 件)</button>`
    : '';
  const empty = session.tasks.length ? '未完了のタスクはありません。' : 'タスクはありません。';
  return `<h3 class="sub">タスクと完了条件 <span class="meta">${updated}</span></h3>${items ? `<ul class="tasks">${items}</ul>` : `<div class="empty">${empty}</div>`}${toggle}`;
}

function unknownSessionControls(session) {
  if (session.status !== 'unknown') return '';
  const estimate = ui.estimatedSessions.includes(session.id)
    ? session.estimate?.canEstimate
      ? `<div class="estimate"><p>最後の記録: ${esc(session.estimate.recordedAt)}、最後のツール: ${esc(session.estimate.tool)}</p><p>入力待ちらしい: ${session.estimate.inputWaiting ? 'はい' : 'いいえ'}</p></div>`
      : '<div class="estimate">推定できませんでした</div>'
    : '';
  return `<div class="session-actions"><button type="button" class="ended-toggle" data-estimate="${esc(session.id)}">状態を推定</button><button type="button" class="ended-toggle" data-hide-session="${esc(session.id)}">一覧から外す</button></div>${estimate}`;
}

function sessionBlock(p, session) {
  const multiple = p.sessions.length > 1;
  const status = session.status === 'busy' ? ['作業中', 'busy'] : session.status === 'wait' ? ['待機中', 'wait'] : ['状態不明', 'unknown'];
  const decisions = visibleDecisions(session).length;
  const permissions = visiblePerms(session).length;
  return `<div class="session-group ${multiple ? '' : 'single'}">
    ${multiple ? `<div class="session-head"><h3>${esc(session.title)}</h3><span class="badge ${status[1]}">${status[0]}</span></div>` : ''}
    <div class="session-body">
      <h3 class="sub">あなたの判断が必要なこと <span class="count">${decisions + permissions}</span></h3>
      ${visiblePerms(session).map(wait => permCard(p, session, wait, false)).join('')}
      ${decisionSessionBlock(p, session, false)}
      <h3 class="sub">今やっていること</h3><div class="now">${mainRow(p, session, false)}</div>
      <h3 class="sub">サブエージェント</h3>${agentSection(p, session, false)}
      ${taskSessionBlock(p, session, false)}
      ${unknownSessionControls(session)}
    </div>
  </div>`;
}

function orderControls(p, idx, total) {
  const pinned = ui.pinned.includes(p.id);
  const collapsed = ui.collapsed.includes(p.id);
  return `<div class="order">
    <button type="button" class="icon-btn" data-collapse="${p.id}" aria-expanded="${!collapsed}">${collapsed ? '開く' : '畳む'}</button>
    <button type="button" class="icon-btn" data-pin="${p.id}" aria-pressed="${pinned}" title="最上部に固定">${pinned ? '固定中' : '固定'}</button>
    <button type="button" class="icon-btn" data-move="${p.id}" data-dir="-1" ${idx === 0 ? 'disabled' : ''} aria-label="${esc(p.name)} を上へ">↑</button>
    <button type="button" class="icon-btn" data-move="${p.id}" data-dir="1" ${idx === total - 1 ? 'disabled' : ''} aria-label="${esc(p.name)} を下へ">↓</button>
  </div>`;
}

function renderProductMode() {
  const ps = orderedProducts();
  return ps.map((p, i) => {
    const pend = pendingDecisions(p);
    const sessions = sessionsByActivity(p);
    const permissionCount = sessions.reduce((total, session) => total + session.perms.length, 0);
    return `<section class="section ${ui.pinned.includes(p.id) ? 'pinned' : ''}">
      <div class="head">
        <h2>${esc(p.name)}</h2><span class="meta">${esc(p.branch)}</span>
        ${permissionCount ? `<span class="chip danger">許可待ち ${permissionCount}</span>` : ''}
        ${pend.length ? `<span class="chip danger">判断待ち ${pend.length}</span>` : ''}
        ${(n => n ? `<span class="chip ok">マージできる PR ${n}</span>` : '')(openPrs(p).filter(pr => !mergeBlocker(p, pr)).length)}
        ${orderControls(p, i, ps.length)}
      </div>
      <div class="body" ${ui.collapsed.includes(p.id) ? 'hidden' : ''}>
        ${newsBox(p, false)}
        ${sessions.map(session => sessionBlock(p, session)).join('')}
        ${isShown('prs') ? `<h3 class="sub">プルリクエスト <span class="count">${openPrs(p).length}</span></h3>${prBlock(p, false)}` : ''}
        <h3 class="sub">レビュー</h3>
        ${reviewBlock(p, false)}
      </div></section>`;
  }).join('');
}

function renderKindMode() {
  const ps = orderedProducts();
  const sessions = ps.flatMap(p => sessionsByActivity(p).map(session => ({ p, session })));
  const section = (title, body, extra = '') => `<section class="section"><div class="head"><h2>${title}</h2>${extra}</div><div class="body">${body}</div></section>`;
  // 種類別では、許可待ちと判断事項をまとめて待ちの長い順に並べる(送信済みは後ろ)
  const waits = sessions.flatMap(({ p, session }) => [
    ...visiblePerms(session).map(wait => ({ age: wait.waitMin, html: permCard(p, session, wait, true) })),
    ...visibleDecisions(session).map(d => ({ age: answerOf(d.id).sent ? -1 : (d.waitMin || 0), html: decisionCard(p, session, d, true) })),
  ]).sort((a, b) => b.age - a.age);
  const decisions = waits.map(x => x.html).join('') || '<div class="empty">ありません</div>';
  const endedDecisions = sessions.map(({ p, session }) => {
    const ended = session.decisions.filter(d => ['resolved', 'withdrawn'].includes(effectiveDecisionState(d)));
    if (!ended.length) return '';
    const expanded = ui.expandedEndedDecisions.includes(session.id);
    const cards = expanded ? ended.map(d => decisionCard(p, session, d, true)).join('') : '';
    return `${endedDecisionToggle(session)}${cards}`;
  }).join('');
  const news = ps.map(p => newsBox(p, true)).join('');
  const nowRowsByAge = sessions.flatMap(({ p, session }) => {
    const expanded = ui.expandedEndedAgents.includes(session.id);
    const agents = visibleSubagents(session).filter(agent => agent.state !== 'done' || agent.unconfirmed || expanded);
    return [
      { age: ageMinutes(session.main), html: mainRow(p, session, true) },
      ...agents.map(agent => ({ age: ageMinutes(agent), html: agentRow(p, session, agent, true) })),
    ];
  }).sort((a, b) => a.age - b.age);
  const agentToggles = sessions.map(({ session }) => endedAgentToggle(session)).join('');
  const unknownActions = sessions.filter(({ session }) => session.status === 'unknown')
    .map(({ p, session }) => `<div class="kind-unknown"><div class="meta">${sessionTag(p, session, true)}</div>${unknownSessionControls(session)}</div>`).join('');
  const now = `<div class="now">${nowRowsByAge.map(row => row.html).join('') || '<div class="empty">ありません</div>'}</div>${agentToggles}${unknownActions}`;
  const tasks = sessions.map(({ p, session }) => `<div class="kind-session-tasks"><div class="meta">${sessionTag(p, session, true)}</div>${taskSessionBlock(p, session, true)}</div>`).join('');
  const reviews = ps.map(p => reviewBlock(p, true)).join('<div style="height:8px"></div>');
  const prs = ps.map(p => prBlock(p, true)).join('<div style="height:12px"></div>');
  const orderBar = `<div class="order">${ps.map((p, i) => `<span class="prod-tag">${i + 1}. ${esc(p.name)}</span>`).join(' ')}</div>`;
  return (news ? section('前回見てから', news) : '')
    + section('あなたの判断が必要なこと(待ちの長い順)', decisions + endedDecisions, orderBar)
    + section('今やっていること', now)
    + section('タスクと完了条件', tasks)
    + (isShown('prs') ? section('プルリクエスト', prs) : '')
    + section('レビュー', reviews);
}

function render() {
  const active = document.activeElement;
  const focusAttribute = ['data-ended-agents', 'data-ended-decisions', 'data-done-tasks'].find(attribute => active?.hasAttribute(attribute));
  const focusValue = focusAttribute ? active.getAttribute(focusAttribute) : null;
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === ui.mode)));
  renderSummary();
  renderRouting();
  document.getElementById('root').innerHTML = ui.mode === 'product' ? renderProductMode() : renderKindMode();
  if (focusAttribute) [...document.querySelectorAll(`[${focusAttribute}]`)].find(button => button.getAttribute(focusAttribute) === focusValue)?.focus({ preventScroll: true });
}

document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.mode) { ui.mode = t.dataset.mode; }
  else if (t.dataset.filter) {
    const k = t.dataset.filter;
    ui.hidden = ui.hidden.includes(k) ? ui.hidden.filter(x => x !== k) : [...ui.hidden, k];
  }
  else if (t.hasAttribute('data-show-all')) { ui.hidden = []; }
  else if (t.hasAttribute('data-show-hidden-sessions')) { ui.hiddenSessions = []; }
  else if (t.dataset.endedAgents) {
    const id = t.dataset.endedAgents;
    ui.expandedEndedAgents = ui.expandedEndedAgents.includes(id) ? ui.expandedEndedAgents.filter(x => x !== id) : [...ui.expandedEndedAgents, id];
  } else if (t.dataset.endedDecisions) {
    const id = t.dataset.endedDecisions;
    ui.expandedEndedDecisions = ui.expandedEndedDecisions.includes(id) ? ui.expandedEndedDecisions.filter(x => x !== id) : [...ui.expandedEndedDecisions, id];
  } else if (t.dataset.doneTasks) {
    const id = t.dataset.doneTasks;
    ui.expandedDoneTasks = ui.expandedDoneTasks.includes(id) ? ui.expandedDoneTasks.filter(x => x !== id) : [...ui.expandedDoneTasks, id];
  } else if (t.dataset.estimate) {
    const id = t.dataset.estimate;
    ui.estimatedSessions = ui.estimatedSessions.includes(id) ? ui.estimatedSessions.filter(x => x !== id) : [...ui.estimatedSessions, id];
  } else if (t.dataset.hideSession) {
    const id = t.dataset.hideSession;
    if (!ui.hiddenSessions.includes(id)) ui.hiddenSessions.push(id);
  }
  else if (t.dataset.collapse) {
    const id = t.dataset.collapse;
    ui.collapsed = ui.collapsed.includes(id) ? ui.collapsed.filter(x => x !== id) : [...ui.collapsed, id];
  }
  else if (t.dataset.pin) {
    const id = t.dataset.pin;
    ui.pinned = ui.pinned.includes(id) ? ui.pinned.filter(x => x !== id) : [...ui.pinned, id];
  } else if (t.dataset.move) {
    const vis = orderedProducts().map(p => p.id);
    const i = vis.indexOf(t.dataset.move), j = i + Number(t.dataset.dir);
    if (j < 0 || j >= vis.length) return;
    [vis[i], vis[j]] = [vis[j], vis[i]];
    ui.order = vis;
    const pi = ui.pinned.includes(vis[i]), pj = ui.pinned.includes(vis[j]);
    if (pi !== pj) ui.pinned = pj ? [...ui.pinned.filter(x => x !== vis[j]), vis[i]] : [...ui.pinned.filter(x => x !== vis[i]), vis[j]];
  } else if (t.dataset.merge) {
    ui.confirm = t.dataset.merge;
  } else if (t.hasAttribute('data-merge-cancel')) {
    ui.confirm = null;
  } else if (t.dataset.mergeGo) {
    const k = t.dataset.mergeGo;
    const [pid, n] = k.split('#');
    const p = byId(pid), pr = p.prs.find(x => String(x.number) === n);
    const o = mergeOpts(p, pr);
    const now = new Date();
    ui.lastMethod[p.repo.name] = o.method;
    ui.merged[k] = { method: o.method, del: o.del, at: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}` };
    ui.confirm = null;
  } else if (t.dataset.reserveGo) {
    const k = t.dataset.reserveGo;
    const [pid, n] = k.split('#');
    const p = byId(pid), pr = p.prs.find(x => String(x.number) === n);
    const o = mergeOpts(p, pr);
    const now = new Date();
    ui.lastMethod[p.repo.name] = o.method;
    ui.reserved[k] = { method: o.method, del: o.del, at: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}` };
    ui.confirm = null;
  } else if (t.dataset.unreserve) {
    delete ui.reserved[t.dataset.unreserve];
  } else if (t.dataset.ciPass) {
    const k = t.dataset.ciPass;
    const now = new Date();
    ui.merged[k] = { ...ui.reserved[k], auto: true, at: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}` };
    delete ui.reserved[k];
  } else if (t.dataset.seen) {
    ui.seen = [...new Set([...ui.seen, t.dataset.seen])];
  } else if (t.dataset.route) {
    ui.routing = { ...ui.routing, [t.dataset.route]: t.dataset.v };
  } else if (t.dataset.restack) {
    ui.restacked[t.dataset.restack] = true;
  } else if (t.hasAttribute('data-send')) {
    const id = t.closest('.decision').dataset.id;
    const a = answerOf(id);
    const now = new Date();
    a.sent = { choice: a.choice, note: a.note, at: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}` };
    ui.answers[id] = a;
  } else return;
  save(); render();
});

document.addEventListener('change', e => {
  const mc = e.target.closest('.merge-confirm');
  if (mc) {
    const k = mc.dataset.pr;
    const [pid, n] = k.split('#');
    const p = byId(pid), pr = p.prs.find(x => String(x.number) === n);
    const o = mergeOpts(p, pr);
    if (e.target.dataset.method) o.method = e.target.dataset.method;
    if (e.target.hasAttribute('data-del')) o.del = e.target.checked;
    ui.mergeOpts[k] = o;
    save(); render();
    return;
  }
  const cb = e.target.closest('input[data-choice]');
  if (!cb) return;
  const id = cb.closest('.decision').dataset.id;
  const a = answerOf(id);
  a.choice = cb.checked ? cb.dataset.choice : null;
  ui.answers[id] = a;
  save(); render();
});

document.addEventListener('input', e => {
  if (!e.target.matches('textarea[data-note]')) return;
  const card = e.target.closest('.decision');
  const a = answerOf(card.dataset.id);
  a.note = e.target.value;
  ui.answers[card.dataset.id] = a;
  save();
  const dirty = !a.sent || a.sent.choice !== a.choice || a.sent.note !== a.note;
  card.querySelector('[data-send]').disabled = (!a.choice && !a.note.trim()) || !dirty;
});

render();
</script>
</body>
</html>
