<title>Agent Cockpit</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --border: #dfe2e8;
  --text: #1d2129;
  --text-2: #5b6372;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --warn: #b35c00;
  --warn-soft: #fff1df;
  --danger: #c92a2a;
  --danger-soft: #ffe8e8;
  --ok: #2b8a3e;
  --ok-soft: #e3f6e8;
  --hold: #6741d9;
  --hold-soft: #efe9ff;
  --on-accent: #ffffff;
  --on-ok: #ffffff;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
    --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
    --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
    --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
  --on-accent: #ffffff; --on-ok: #1f1e1d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
  --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
  --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
  --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
  --on-accent: #ffffff; --on-ok: #1f1e1d;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.6 "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
button, textarea, input { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

header.top {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.top[data-away="true"] { background: var(--warn-soft); border-bottom-color: var(--warn); }
.top-inner { position: relative; max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
/* 設定のボタンは右上に重ねて置くので、その分の余白はタイトルの行だけに取り、2 行目からは全幅を使う。 */
.top h1 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 0; }
.title-row { flex: 1 1 100%; display: flex; align-items: center; gap: 8px 12px; min-height: 40px; padding-right: 48px; }
.title-row .away-toggle { margin-left: auto; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.settings-button, .settings-dialog button, .settings-dialog select, .settings-dialog input[type="number"] { min-height: 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
.settings-button { position: absolute; top: 10px; right: 16px; display: inline-flex; align-items: center; justify-content: center; width: 40px; min-height: 40px; padding: 0; cursor: pointer; color: var(--text-2); }
.settings-button:hover { color: var(--text); }
.settings-button:focus-visible, .settings-dialog button:focus-visible, .settings-dialog select:focus-visible, .settings-dialog input[type="number"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.away-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); cursor: pointer; white-space: nowrap; }
.away-toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--warn); }
.away-toggle:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.settings-dialog { width: min(440px, calc(100vw - 32px)); max-width: calc(100vw - 32px); padding: 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; }
.settings-dialog::backdrop { background: rgb(0 0 0 / 55%); }
.settings-dialog h2 { margin: 0; font-size: 18px; }
.settings-dialog section { margin-top: 16px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); }
.settings-dialog h3 { margin: 0 0 10px; font-size: 14px; }
.settings-theme-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
.settings-dialog select { max-width: 100%; padding: 4px 8px; }
.settings-dialog input[type="number"] { width: 88px; padding: 4px 8px; text-align: right; }
.settings-section-order { margin-top: 14px; }
.settings-section-order h4 { margin: 0 0 4px; font-size: 13px; }
.section-order-list { margin: 8px 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.section-order-list li { display: flex; align-items: center; gap: 8px; }
.section-order-list .section-order-label { flex: 1; min-width: 0; }
.section-order-list button { min-width: 36px; padding: 4px 8px; }
.settings-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
.settings-dialog button { padding: 4px 12px; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.chip strong { color: var(--text); font-size: 13px; }
.chip.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.hold { background: var(--hold-soft); border-color: transparent; color: var(--hold); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.chip.accent { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
button.chip { cursor: pointer; font: inherit; font-size: 12px; min-height: 28px; }
button.chip[aria-pressed="false"] { background: transparent; border: 1px dashed var(--border); color: var(--text-2); text-decoration: line-through; opacity: .7; }
button.chip[aria-pressed="false"] strong { color: var(--text-2); }
.filter-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 10px; margin: 0 0 12px; }
.filter-note[hidden] { display: none; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 4px 0; font-size: 12px; text-decoration: underline; }
.spacer { flex: 1; }

.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 16px; }
.section > .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.section > .head h2 { font-size: 15px; margin: 0; }
.section > .body { padding: 6px 14px 14px; }
.section.pinned { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.meta { color: var(--text-2); font-size: 12px; }
.session-group { border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px; }
.session-group.single { border-top: 0; padding-top: 0; margin-top: 0; }
.session-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0 8px; }
.session-head h3 { margin: 0; font-size: 14px; }
.session-tag { font-size: 11px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.session-body { padding-bottom: 6px; }

.order { display: inline-flex; gap: 4px; margin-left: auto; }
.product-order { min-width: 0; max-width: 100%; flex-wrap: wrap; }
.kind-order { display: flex; justify-content: flex-end; margin-bottom: 14px; }
.product-order-item { display: inline-flex; align-items: center; gap: 2px; min-width: 0; max-width: 100%; }
.product-order-item .prod-tag { display: inline-block; min-width: 0; max-width: calc(100% - 34px); line-height: 20px; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 6px; min-width: 32px; height: 32px; padding: 0 8px; cursor: pointer; color: var(--text-2); }
.icon-btn:hover { color: var(--text); border-color: var(--text-2); }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.icon-btn:disabled { opacity: .35; cursor: default; }

h3.sub { font-size: 13px; color: var(--text-2); margin: 14px 0 6px; display: flex; align-items: center; gap: 6px; }
h3.sub .count { font-weight: normal; }

.now { display: grid; gap: 6px; }
.now-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.now-row > :nth-child(2) { min-width: 0; }
.tool-line { display: flex; flex-wrap: nowrap; align-items: baseline; gap: 4px 8px; margin-top: 2px; }
.tool-name { flex: none; min-height: 20px; padding: 0 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text-2); font-size: 11px; }
.tool-content { min-width: 0; flex: 1 1 auto; overflow: hidden; color: var(--text-2); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.now-row .who { font-size: 12px; color: var(--text-2); }
.now-row .who .prod-tag { display: table; margin: 2px 0; }
.now-row .who b { color: var(--text); font-weight: 600; display: block; font-size: 13px; }
.now-row .since { font-size: 12px; color: var(--text-2); white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--text-2); }
.dot.busy { background: var(--ok); animation: pulse 1.6s infinite; }
.dot.wait { background: var(--warn); }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }

.models { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin-top: 4px; }
.model { display: inline-flex; gap: 6px; align-items: baseline; font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--border); white-space: nowrap; }
.model i { font-style: normal; color: var(--text-2); font-size: 11px; }
.model.claude { background: var(--warn-soft); border-color: transparent; }
.model.gpt { background: var(--ok-soft); border-color: transparent; }
.model.off { color: var(--text-2); white-space: normal; }
.arrow { color: var(--text-2); font-size: 12px; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.kind-session-tasks + .kind-session-tasks { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
.kind-task-head { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; margin: 4px 0 8px; }
.task { padding: 6px 10px; border-radius: 8px; }
.task:hover { background: var(--surface-2); }
.task .line { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; min-width: 0; }
.task .line .title { min-width: 0; overflow-wrap: anywhere; }
.state { font-size: 11px; padding: 0 8px; border-radius: 999px; white-space: nowrap; }
.state.done { background: var(--ok-soft); color: var(--ok); }
.state.doing { background: var(--accent-soft); color: var(--accent); }
.state.todo { background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.task.done .title { color: var(--text-2); }
.task .line .link-btn { margin-left: auto; flex: none; color: var(--text-2); font-size: 12px; }
.task .line .link-btn:hover { color: var(--text); }
.close-agent { margin-left: auto; color: var(--text-2); font-size: 12px; }
.close-agent:hover { color: var(--text); }
.criteria { margin: 4px 0 0 0; padding-left: 20px; font-size: 12px; color: var(--text-2); }
.criteria li.met { color: var(--ok); }
.criteria li.met::marker { content: "✓ "; }
.criteria li::marker { content: "・"; }

.decision { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; background: var(--surface); }
.decision.blocking { border-left: 4px solid var(--danger); }
.decision.provisional { border-left: 4px solid var(--warn); }
.decision.state-ok { border-left: 4px solid var(--ok); }
.decision.state-hold { border-left: 4px solid var(--hold); }
.decision.withdrawn { border-left: 4px solid var(--border); }
.decision .dhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.decision .dtitle { font-weight: 600; }
.decision .ctx { font-size: 13px; color: var(--text-2); margin: 4px 0 8px; }
.options { list-style: none; padding: 0; margin: 0 0 10px; display: grid; gap: 4px; }
.options li { padding: 6px 10px; border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.options li.rec { background: var(--accent-soft); }
.options li .tag { font-size: 11px; color: var(--accent); font-weight: 600; margin-right: 6px; }
.options li .why { display: block; color: var(--text-2); font-size: 12px; }
.options li.pickable { padding: 0; background: none; }
.options .pick { display: flex; align-items: flex-start; gap: 8px; padding: 6px 10px; border: 1px solid transparent; border-radius: 8px; background: var(--surface-2); cursor: pointer; }
.options li.rec .pick { background: var(--accent-soft); }
.options .pick:hover { border-color: var(--border); }
.options .pick input { width: 16px; height: 16px; margin: 2px 0 0; flex: none; accent-color: var(--accent); }
.options .pick:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.options .pick:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.options .pick .body { min-width: 0; }
.answer { display: grid; gap: 8px; }
.checks { display: flex; gap: 8px; flex-wrap: wrap; }
.check { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; user-select: none; min-height: 40px; }
.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.check.ok:has(input:checked) { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.check.hold:has(input:checked) { background: var(--hold-soft); border-color: var(--hold); color: var(--hold); }
.check.hold input { accent-color: var(--hold); }
.check.ok input { accent-color: var(--ok); }
textarea { width: 100%; min-height: 56px; resize: vertical; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-2); }
.answer-foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.decision-summary { display: flex; align-items: baseline; gap: 6px 8px; flex-wrap: wrap; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; min-height: 40px; }
.primary:disabled { opacity: .4; cursor: default; }
.sent { font-size: 12px; color: var(--text-2); }

.pr .xr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.rounds { display: inline-flex; gap: 4px; }
.rounds span { width: 22px; height: 6px; border-radius: 3px; background: var(--border); }
.rounds span.used { background: var(--accent); }

.prod-tag { display: inline-flex; align-items: center; min-height: 20px; font-size: 11px; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.empty { color: var(--text-2); font-size: 13px; padding: 6px 10px; }
.note { color: var(--text-2); font-size: 12px; margin: 0 0 12px; }

.prs-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.stack { border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 10px; margin-bottom: 8px; background: var(--surface); }
.stack-base { font-size: 12px; color: var(--text-2); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.stack-base code, .pr code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.stack-level { margin-left: 10px; padding-left: 12px; border-left: 2px solid var(--border); }
.pr { padding: 8px 0 4px; }
.pr .pline { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pr .num { font-weight: 600; }
.pr .pos { font-size: 11px; color: var(--text-2); border: 1px solid var(--border); border-radius: 999px; padding: 0 6px; }
.pr .branch { color: var(--text-2); font-size: 12px; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
.badge { font-size: 11px; padding: 0 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.danger { background: var(--danger-soft); color: var(--danger); }
.badge.mute { background: var(--surface-2); color: var(--text-2); border-color: var(--border); }
.badge.accent { background: var(--accent-soft); color: var(--accent); }
.badge.busy { background: var(--accent-soft); color: var(--accent); }
.badge.wait { background: var(--warn-soft); color: var(--warn); }
.badge.done { background: var(--ok-soft); color: var(--ok); }
.badge.permission { margin-bottom: 10px; border: 1px solid var(--border); border-left: 4px solid var(--danger); border-radius: var(--radius); padding: 12px; background: var(--surface); }
.pr .why-not { font-size: 12px; color: var(--text-2); }
.pr.can-merge { background: var(--ok-soft); margin: 4px -6px; padding: 8px 6px 6px; border-radius: 8px; }
.merge-btn { background: var(--ok); color: var(--on-ok); border: 0; border-radius: 8px; padding: 4px 12px; cursor: pointer; min-height: 32px; margin-left: auto; }
.merge-confirm { margin-top: 8px; border: 1px solid var(--ok); border-radius: 8px; padding: 10px 12px; background: var(--surface); display: grid; gap: 8px; font-size: 13px; }
.merge-confirm .methods { display: flex; gap: 6px; flex-wrap: wrap; }
.merge-confirm .opt { justify-self: start; }
.merge-confirm .methods label, .merge-confirm .opt { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; min-height: 32px; }
.merge-confirm .effects { margin: 0; padding-left: 20px; color: var(--text-2); font-size: 12px; }
.merge-confirm .effects li.warn { color: var(--warn); }
.merge-confirm .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ghost { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; cursor: pointer; min-height: 40px; }
.merge-go { background: var(--ok); color: var(--on-ok); border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; min-height: 40px; }
.merged-list { font-size: 12px; color: var(--text-2); margin-top: 6px; }
.merged-list .badge { margin-right: 4px; }

.routing { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 12px; display: grid; gap: 8px; }
.routing[hidden], .control-row:has(> .routing[hidden]) { display: none; }
.routing .rgroup { display: grid; grid-template-columns: max-content max-content; gap: 8px 10px; align-items: center; }
.routing .rgroup .rrow { display: contents; }
/* 横に並べるかは、ラベルと 3 択の実際の幅が収まるかを layoutRouting で測って決める。 */
.routing .rgroup.side-by-side { grid-template-columns: repeat(4, max-content); }
.routing .rgroup.side-by-side .rrow + .rrow .rlabel { margin-left: 12px; }
.routing .rrow { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.routing .rlabel { font-size: 13px; font-weight: 600; justify-self: start; }
.routing .seg button:disabled { cursor: default; opacity: .55; }
.routing .seg .rstatus { display: inline-flex; align-items: center; padding: 0 8px; border-left: 1px solid var(--border); color: var(--text-2); font-size: 12px; white-space: nowrap; }
.routing .seg button { padding: 4px 10px; font-size: 13px; min-height: 32px; }
/* 上部のバーでは経路を枠で囲まず、離席中と同じ行の左に置く。 */
.control-row { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.top-inner .routing { flex: 1 1 auto; min-width: 0; margin: 0; padding: 0; border: 0; background: none; }
.mode-row { margin: 0 0 12px; }
.top-inner .routing .seg button { padding: 3px 7px; font-size: 12px; min-height: 30px; }
.route-tag { font-size: 11px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.route-tag.stale { border-style: dashed; color: var(--warn); }
.badge.unknown, .state.unknown { background: var(--surface-2); color: var(--text-2); border: 1px dashed var(--border); }
.agent-list { display: grid; gap: 6px; }
.agent-row { display: grid; grid-template-columns: 130px 1fr auto; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; background: var(--surface-2); }
.agent-row .who { font-size: 12px; color: var(--text-2); }
.agent-row .who b { color: var(--text); font-weight: 600; display: block; font-size: 13px; }
.agent-row .agent-name { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.agent-row .since { font-size: 12px; color: var(--text-2); white-space: nowrap; }
.ended-toggle { margin-top: 6px; min-height: 32px; padding: 2px 10px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; color: var(--text-2); font: inherit; font-size: 12px; cursor: pointer; }
.ended-toggle:hover { color: var(--text); }
.ended-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.session-extra { display: grid; grid-column: 1 / -1; gap: 8px; margin-top: -2px; }
.session-extra .session-actions { margin-top: 0; }
.estimate { display: grid; gap: 6px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 12px; }
.estimate p { margin: 0; }
.session-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.excluded-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 10px; margin: 0 0 12px; }
.excluded-note[hidden] { display: none; }
.wait { font-size: 12px; color: var(--text-2); white-space: nowrap; }
.wait.stale { color: var(--danger); font-weight: 600; }
.decision.long-wait { background: var(--danger-soft); }
.perm code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--surface-2); padding: 2px 6px; border-radius: 4px; }
.news { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; margin: 10px 0 4px; font-size: 13px; }
.news .nhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-weight: 600; color: var(--accent); }
.news ul { margin: 4px 0 0; padding-left: 20px; }
.new-mark { font-size: 10px; font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 4px; padding: 0 5px; }
.auto-btn { background: none; color: var(--ok); border: 1px solid var(--ok); border-radius: 8px; padding: 4px 12px; cursor: pointer; min-height: 32px; margin-left: auto; }
.pr.reserved { background: var(--accent-soft); margin: 4px -6px; padding: 8px 6px 6px; border-radius: 8px; }
.merge-confirm.auto { border-color: var(--accent); }
.conflict-btn { background: none; color: var(--danger); border: 1px solid var(--danger); border-radius: 8px; padding: 4px 12px; cursor: pointer; min-height: 32px; margin-left: auto; }
.conflict-btn:disabled { cursor: default; opacity: .55; }
.merge-confirm.conflict { border-color: var(--danger); }
.merge-confirm .conflict-go { background: var(--danger); color: var(--on-ok); }
.merge-confirm.auto .merge-go { background: var(--accent); }

@media (max-width: 640px) {
  .now-row { grid-template-columns: 1fr; gap: 2px; }
  .agent-row { grid-template-columns: 1fr; gap: 2px; }
  .order { margin-left: 0; }
}
.app-icon { width: 28px; height: 28px; flex: none; }
</style>
</head>
<body>
<header class="top">

function applyTheme(theme) {

  else document.documentElement.dataset.theme = selected;

function changeDisplaySetting(key, input, minimum, maximum) {
  const value = input.valueAsNumber;
  if (!Number.isInteger(value) || value < minimum || value > maximum) {
    input.value = String(ui[key]);
    return false;
  }
  ui[key] = value;
  input.value = String(value);
  save();
  render();
  return true;
}

const SECTION_KINDS = [
  { key: 'sinceSeen', label: '前回見てから' },
  { key: 'judgment', label: 'あなたの判断が必要なこと' },
  { key: 'tasks', label: 'タスクと完了条件' },

];
const DEFAULT_SECTION_ORDER = SECTION_KINDS.map(kind => kind.key);
// 保存した順に知らない種類や欠けた種類があっても、既定の順で補って 5 つすべてを並べる。
function normalizeSectionOrder(order) {
  const known = (Array.isArray(order) ? order : []).filter((key, index, list) => DEFAULT_SECTION_ORDER.includes(key) && list.indexOf(key) === index);
  return [...known, ...DEFAULT_SECTION_ORDER.filter(key => !known.includes(key))];
}
const sectionOrderList = document.getElementById('settings-section-order');
function renderSectionOrder(focusKey, focusDirection) {
  ui.sectionOrder = normalizeSectionOrder(ui.sectionOrder);
  sectionOrderList.innerHTML = ui.sectionOrder.map((key, index) => {
    const label = SECTION_KINDS.find(kind => kind.key === key).label;
    return `<li><span class="section-order-label">${index + 1}. ${esc(label)}</span>
      <button type="button" data-section-move="${key}" data-dir="-1" ${index === 0 ? 'disabled' : ''} aria-label="${esc(label)}を上へ">↑</button>
      <button type="button" data-section-move="${key}" data-dir="1" ${index === ui.sectionOrder.length - 1 ? 'disabled' : ''} aria-label="${esc(label)}を下へ">↓</button></li>`;
  }).join('');
  if (!focusKey) return;
  const target = sectionOrderList.querySelector(`[data-section-move="${focusKey}"][data-dir="${focusDirection}"]:not([disabled])`)
    || sectionOrderList.querySelector(`[data-section-move="${focusKey}"]:not([disabled])`);
  target?.focus();
}
sectionOrderList.addEventListener('click', event => {
  const button = event.target.closest('[data-section-move]');
  if (!button) return;
  const order = normalizeSectionOrder(ui.sectionOrder);
  const index = order.indexOf(button.dataset.sectionMove);
  const target = index + Number(button.dataset.dir);
  if (index < 0 || target < 0 || target >= order.length) return;
  [order[index], order[target]] = [order[target], order[index]];
  ui.sectionOrder = order;
  save();
  renderSectionOrder(button.dataset.sectionMove, button.dataset.dir);
  render();
});
document.getElementById('settings-section-order-reset').addEventListener('click', () => {
  ui.sectionOrder = [...DEFAULT_SECTION_ORDER];
  save();
  renderSectionOrder();
  render();
});

const picksOf = a => a.choice === 'pick' ? (a.picks || []) : [];

const answerDirty = a => !a.sent || a.sent.choice !== a.choice || a.sent.note !== a.note || picksOf(a.sent).join() !== picksOf(a).join();

  const a = answerOf(d.id);
  const state = effectiveDecisionState(d);
  if (state === 'resolved' || state === 'withdrawn') return state;
  if (!a.sent) return state === 'waiting' ? 'blocking' : state;
  return a.sent.choice === 'hold' ? 'held' : 'answered';
}
const isShown = key => !ui.hidden.includes(key);
const visibleDecisions = s => s.decisions.filter(d => ['waiting', 'provisional'].includes(effectiveDecisionState(d)) && isShown(decisionCategory(d)));
const visibleSubagents = s => s.subagents.filter(agent => agent.state !== 'busy' || isShown('agents'));
const visiblePermissions = s => isShown('permission') ? s.perms : [];
const hasHiddenJudgmentItems = s => (!isShown('permission') && s.perms.length > 0)
  || s.decisions.some(d => ['waiting', 'provisional'].includes(effectiveDecisionState(d)) && !isShown(decisionCategory(d)));

function countHidden() {
  const hiddenRows = allSessions().filter(s => !ui.hiddenSessions.includes(s.id)).reduce((n, s) => n
    + s.decisions.filter(d => ['waiting', 'provisional'].includes(effectiveDecisionState(d)) && !isShown(decisionCategory(d))).length
    + s.subagents.filter(agent => agent.state === 'busy' && !isShown('agents')).length
    + (isShown('permission') ? 0 : s.perms.length), 0);
  return hiddenRows + (isShown('prs') ? 0 : DATA.products.reduce((n, p) => n + openPrs(p).length, 0));
}

function renderSummary() {
  const sessions = allSessions().filter(s => !ui.hiddenSessions.includes(s.id));
  const all = sessions.flatMap(s => s.decisions.map(d => ({ d, a: answerOf(d.id) })));
  const blocking = all.filter(x => effectiveDecisionState(x.d) === 'waiting' && !x.a.sent).length;
  const provisional = all.filter(x => effectiveDecisionState(x.d) === 'provisional' && !x.a.sent).length;
  const held = all.filter(x => ['waiting', 'provisional'].includes(effectiveDecisionState(x.d)) && x.a.sent && x.a.sent.choice === 'hold').length;
  const agents = sessions.flatMap(s => s.subagents).filter(agent => agent.state === 'busy').length;
  const prs = DATA.products.reduce((n, p) => n + openPrs(p).filter(pr => !mergeBlocker(p, pr)).length, 0);
  const permission = sessions.reduce((n, s) => n + s.perms.length, 0);
  const counts = { permission, blocking, provisional, held, agents, prs };
  // タブのタイトルに、開発者の手が要る件数(許可待ちと、止めて待っている判断)を出す
  const need = permission + blocking;
  document.title = need ? `(${need}) Agent Cockpit` : 'Agent Cockpit';
  document.getElementById('summary').innerHTML = FILTERS.map(x =>
    `<button type="button" class="chip ${x.cls}" data-filter="${x.key}" aria-pressed="${isShown(x.key)}" title="${isShown(x.key) ? '押すと非表示にする' : '押すと表示に戻す'}">${x.label} <strong>${counts[x.key]}</strong></button>`).join('');
  const hiddenCount = countHidden();
  const note = document.getElementById('filter-note');
  note.hidden = ui.hidden.length === 0;
  note.innerHTML = `<span>非表示: ${FILTERS.filter(x => !isShown(x.key)).map(x => x.label).join('、')} (${hiddenCount} 件)</span><button type="button" class="link-btn" data-show-all>すべて表示する</button>`;
  const excluded = document.getElementById('excluded-note');
  const hiddenSessions = allSessions().filter(s => ui.hiddenSessions.includes(s.id));
  excluded.hidden = hiddenSessions.length === 0;
  const hiddenPermissionCount = hiddenSessions.reduce((n, s) => n + s.perms.length, 0);
  const hiddenDecisionCount = hiddenSessions.reduce((n, s) => n + s.decisions.filter(d => effectiveDecisionState(d) === 'waiting' && !answerOf(d.id).sent).length, 0);
  const pendingCounts = [
    hiddenPermissionCount ? `許可待ち ${hiddenPermissionCount} 件` : '',
    hiddenDecisionCount ? `止めて待っている ${hiddenDecisionCount} 件` : '',
  ].filter(Boolean);
  const countNote = pendingCounts.length ? `、うち${pendingCounts.join('、')}` : '';
  excluded.innerHTML = `<span>外したセッション (${hiddenSessions.length} 件)${countNote}</span><button type="button" class="link-btn" data-show-hidden-sessions>すべて表示する</button>`;
}

// Claude のモデルが分からないサブエージェントでも、GPT の札だけは出す。
function modelLine(s, lead = '') {
  if (!s.model && !s.gpt && !lead) return '';
  const claude = s.model ? `<span class="model claude">Claude ${esc(s.model.name)}<i>effort ${esc(s.model.effort)}</i></span>` : '';
  const arrow = s.model ? '<span class="arrow">→</span>' : '';
  let gpt = '';
  if (s.gpt && s.gpt.unavailable) gpt = `${arrow}<span class="model off">GPT 不使用<i>${esc(s.gpt.unavailable)}</i></span>`;
  else if (s.gpt) gpt = `${arrow}<span class="model gpt" title="${esc(s.gpt.home)}">GPT ${esc(s.gpt.name)}<i>effort ${esc(s.gpt.effort)}</i></span>`;
  return `<div class="models">${lead}${claude}${gpt}</div>`;
}

const ROUTE = {
  agents: {
    label: 'サブエージェント',
    opts: [
      { v: 'default', t: '既定' },
      { v: 'codex', t: 'Codex' },
      { v: 'claude', t: 'Claude' },
    ],
  },
  review: {
    label: 'クロスレビュー',
    opts: [
      { v: 'default', t: '既定' },
      { v: 'codex', t: 'Codex' },
      { v: 'claude', t: 'Claude' },
    ],
  },
};
const routeName = (k, v) => ROUTE[k].opts.find(o => o.v === v).t;

function routeTag(s) {
  if (!DATA.integrations.codexAgent || !s.route || s.state !== 'busy') return '';
  const stale = s.route !== ui.routing.agents;
  return `<span class="route-tag ${stale ? 'stale' : ''}" title="起動時に効いていた経路の設定">経路: ${esc(routeName('agents', s.route))}${stale ? ' (変更前)' : ''}</span>`;
}

function renderRouting() {
  const routing = document.getElementById('routing');
  const keys = ['agents', 'review'].filter(k => k === 'agents' ? DATA.integrations.codexAgent : DATA.integrations.crossReview);
  routing.hidden = keys.length === 0;
  if (routing.hidden) { routing.innerHTML = ''; return; }
  const row = k => `<div class="rrow"><span class="rlabel">${ROUTE[k].label}</span>
      <div class="seg" role="group" aria-label="${ROUTE[k].label}の経路">${ROUTE[k].opts.map(o =>
        `<button type="button" data-route="${k}" data-v="${o.v}" aria-pressed="${o.v === ui.routing[k]}">${o.t}</button>`).join('')}</div>
      </div>`;
