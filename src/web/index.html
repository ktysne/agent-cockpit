<title>Agent Cockpit</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --border: #dfe2e8;
  --text: #1d2129;
  --text-2: #5b6372;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --warn: #b35c00;
  --warn-text: #8a4300;
  --warn-soft: #fff1df;
  --danger: #c92a2a;
  --danger-soft: #ffe8e8;
  --ok: #2b8a3e;
  --ok-text: #236b31;
  --ok-soft: #e3f6e8;
  --on-accent: #ffffff;
  --accent-text: #3b5bdb;
  --on-ok: #000000;
  --on-danger: #ffffff;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
    --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22; --accent-text: #f2a78e;
    --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
    --ok: #8cc391; --ok-soft: #233526;
    --warn-text: #e3b341; --ok-text: #8cc391; --on-accent: #1f1e1d; --on-ok: #1f1e1d; --on-danger: #1f1e1d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
  --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22; --accent-text: #f2a78e;
  --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
  --ok: #8cc391; --ok-soft: #233526;
  --warn-text: #e3b341; --ok-text: #8cc391; --on-accent: #1f1e1d; --on-ok: #1f1e1d; --on-danger: #1f1e1d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
.top { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--border); }
.top[data-away="true"] { background: var(--warn-soft); border-bottom-color: var(--warn); }
.top-inner { position: relative; max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
/* 設定のボタンは右上に重ねて置くので、その分の余白はタイトルの行だけに取り、2 行目からは全幅を使う。 */
.top h1 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 0; }
.title-row { flex: 1 1 100%; display: flex; align-items: center; gap: 8px 12px; min-height: 40px; padding-right: 48px; }
.title-row .away-toggle { margin-left: auto; }
.mode-row { margin: 0 0 12px; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.control-row { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.routing { display: grid; gap: 8px; min-width: 0; flex: 1 1 auto; }
.routing[hidden], .control-row:has(> .routing[hidden]) { display: none; }
.routing .rgroup { display: grid; grid-template-columns: max-content max-content; gap: 8px 10px; align-items: center; }
.routing .rgroup .rrow { display: contents; }
.routing .rgroup.side-by-side { grid-template-columns: repeat(4, max-content); }
.routing .rgroup.side-by-side .rrow + .rrow .rlabel { margin-left: 12px; }
.routing .rrow { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.routing .rlabel { font-size: 13px; font-weight: 600; justify-self: start; }
.routing .seg button { padding: 4px 10px; font-size: 13px; min-height: 32px; }
.top-inner .routing { min-width: 0; margin: 0; padding: 0; border: 0; background: none; }
.top-inner .routing .seg button { padding: 3px 7px; font-size: 12px; min-height: 30px; }
.route-tag { display: inline-flex; align-items: center; min-height: 20px; padding: 0 6px; border: 1px solid var(--border); border-radius: 6px; color: var(--text-2); font-size: 11px; white-space: nowrap; }
.route-tag.stale { border-style: dashed; color: var(--warn); }
.chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.chip strong { color: var(--text); font-size: 13px; margin-left: 4px; }
.chip.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn-text); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok-text); }
.summary button.chip { border-color: var(--text-2); }
.meta { color: var(--text-2); font-size: 12px; }
#connection-note { color: var(--danger); }
.settings-button, .settings-dialog button, .settings-dialog select, .settings-dialog input[type="number"] { min-height: 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
.settings-button { position: absolute; top: 10px; right: 16px; display: inline-flex; align-items: center; justify-content: center; width: 40px; min-height: 40px; padding: 0; cursor: pointer; color: var(--text-2); }
.settings-button:hover { color: var(--text); }
.ended-toggle { margin-top: 6px; min-height: 32px; padding: 2px 10px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; color: var(--text-2); font: inherit; font-size: 12px; cursor: pointer; }
.ended-toggle:hover { color: var(--text); }
.ended-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.away-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
.away-toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--warn); }
.away-toggle:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.settings-button:focus-visible, .settings-dialog button:focus-visible, .settings-dialog select:focus-visible, .settings-dialog input[type="number"]:focus-visible, .settings-dialog .settings-manual-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.merge-confirm button:focus-visible, .merge-confirm input:focus-visible, .merge-btn:focus-visible, .conflict-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.merge-confirm button:disabled { cursor: wait; opacity: .65; }
.pr.reserved { background: var(--accent-soft); margin: 4px -6px; padding: 8px 6px 6px; border-radius: 8px; }
.merge-error { color: var(--danger); font-size: 12px; }
.merged-list { margin-top: 6px; color: var(--text-2); font-size: 12px; }
.merged-list .badge { margin-right: 4px; }
.rounds { display: inline-flex; gap: 4px; }
.rounds span { width: 22px; height: 6px; border-radius: 3px; background: var(--border); }
.rounds span.used { background: var(--accent); }
.decision-card { margin-bottom: 10px; padding: 10px 12px; border: 1px solid var(--border); border-left: 4px solid var(--danger); border-radius: var(--radius); background: var(--surface); overflow-wrap: anywhere; }
.decision-card.provisional { border-left-color: var(--warn); }
.decision-card.resolved { border-left-color: var(--ok); }
.decision-card.withdrawn { border-left-color: var(--border); }
.decision-card.long-wait, .permission.long-wait { background: var(--danger-soft); }
.decision-head { display: flex; align-items: baseline; gap: 6px 8px; flex-wrap: wrap; }
.decision-title { font-weight: 600; }
.decision-context { margin: 4px 0 8px; color: var(--text-2); }
.decision-question { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.decision-question-title { margin-top: 4px; font-weight: 600; }
.decision-options { display: grid; gap: 4px; margin: 6px 0 0; padding: 0; list-style: none; }
.decision-option { padding: 6px 8px; border-radius: 6px; overflow-wrap: anywhere; }
.decision-option.recommended { background: var(--accent-soft); }
.decision-option-description { display: block; color: var(--text-2); font-size: 12px; }
.wait { color: var(--text-2); font-size: 12px; white-space: nowrap; }
.wait.stale { color: var(--danger); font-weight: 600; }
.permission code { padding: 2px 6px; border-radius: 4px; background: var(--surface-2); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.ended-toggle { min-height: 32px; margin-top: 6px; padding: 2px 10px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; color: var(--text-2); cursor: pointer; font: inherit; font-size: 12px; }
.ended-toggle:hover { color: var(--text); }
.ended-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.session-extra { display: grid; grid-column: 1 / -1; gap: 8px; margin-top: -2px; }
.session-extra .session-actions { margin-top: 0; }
.estimate { display: grid; gap: 6px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); font-size: 12px; }
.estimate p { margin: 0; }
.session-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.excluded-note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px dashed var(--border); border-radius: 8px; padding: 6px 10px; margin: 0 0 12px; }
.excluded-note[hidden] { display: none; }
.record-deletion { margin-left: auto; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.record-delete-icon { display: inline-flex; align-items: center; justify-content: center; min-width: 32px; min-height: 32px; }
.record-delete-icon svg { width: 16px; height: 16px; }
.record-deletion [aria-disabled="true"] { opacity: .6; cursor: wait; }
.product-remove { margin-left: 12px; }
/* .session-tag の nowrap より強くするため、2 つのクラスで指定する */
.session-tag.session-context { width: fit-content; max-width: 100%; margin-bottom: 4px; white-space: normal; overflow-wrap: anywhere; }
.kind-empty { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.kind-empty h2 { margin: 0; color: var(--text-2); font-size: 15px; }
@media (max-width: 640px) {
  .order { margin-left: 0; }
  .session-head { align-items: flex-start; }
}
/* これより狭いと、札と操作を同じ行に残したときに題が数文字の幅しか残らないため、要素ごとに折り返す。 */
@media (max-width: 480px) {
  .task-head { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { .dot.busy { animation: none; } }
</style>
</head>

<script>
'use strict';

const POLL_INTERVAL_MS = 2000;
const WAIT_REFRESH_INTERVAL_MS = 60_000;
const DEFAULT_LONG_WAIT_MINUTES = 15;
const DEFAULT_AWAY_ANSWER_WAIT_MINUTES = 5;
const DEFAULT_IDLE_HIDE_MINUTES = 30;
const DEFAULT_MERGE_RESULT_HIDE_MINUTES = 5;
const summary = document.getElementById('summary');
const root = document.getElementById('root');
const liveStatus = document.getElementById('live-status');
const initialUiVersion = document.querySelector('meta[name="cockpit-ui-version"]')?.content || '';
const themeSelect = document.getElementById('settings-theme-select');
const sinceSeenSelect = document.getElementById('settings-since-seen-select');
const longWaitMinutesInput = document.getElementById('settings-long-wait-minutes');
const awayAnswerWaitMinutesInput = document.getElementById('settings-away-answer-wait-minutes');
const idleHideMinutesInput = document.getElementById('settings-idle-hide-minutes');
const mergeResultHideMinutesInput = document.getElementById('settings-merge-result-hide-minutes');
const longWaitMinutesError = document.getElementById('settings-long-wait-error');
const awayAnswerWaitMinutesError = document.getElementById('settings-away-answer-wait-error');
const idleHideMinutesError = document.getElementById('settings-idle-hide-error');

const DISPLAY_MINUTE_SETTINGS = [
  { key: 'longWaitMinutes', input: longWaitMinutesInput, error: longWaitMinutesError, min: 1, max: 120, default: DEFAULT_LONG_WAIT_MINUTES },
  { key: 'awayAnswerWaitMinutes', input: awayAnswerWaitMinutesInput, error: awayAnswerWaitMinutesError, min: 1, max: 30, default: DEFAULT_AWAY_ANSWER_WAIT_MINUTES },
  { key: 'idleHideMinutes', input: idleHideMinutesInput, error: idleHideMinutesError, min: 5, max: 1440, default: DEFAULT_IDLE_HIDE_MINUTES },
  { key: 'mergeResultHideMinutes', input: mergeResultHideMinutesInput, error: mergeResultHideMinutesError, min: 1, max: 60, default: DEFAULT_MERGE_RESULT_HIDE_MINUTES },
];
for (const { input, min, max } of DISPLAY_MINUTE_SETTINGS) {
  input.min = String(min);
  input.max = String(max);
}
const hideFinishedInput = document.getElementById('settings-hide-finished');
const mergeableConditionInputs = [...document.querySelectorAll('input[name="mergeableCondition"]')];
const sectionOrderList = document.getElementById('settings-section-order');
const settingsButton = document.getElementById('settings-button');
const awayToggle = document.getElementById('away-toggle');
const connectionNote = document.getElementById('connection-note');
const reloadNote = document.getElementById('reload-note');
const header = document.querySelector('header.top');
const settingsDialog = document.getElementById('settings-dialog');
const settingsClose = document.getElementById('settings-close');
const settingsSaveError = document.getElementById('settings-save-error');
const THEME_STORAGE_KEY = 'agent-cockpit.theme';
const SINCE_SEEN_STORAGE_KEY = 'agent-cockpit.since-seen';
const DISPLAY_STORAGE_KEY = 'agent-cockpit.display';
const FILTERS = [
  { key: 'permission', label: '許可待ち', color: 'danger' },
  { key: 'blocking', label: '止めて待っている', color: 'danger' },
  { key: 'provisional', label: '仮に推奨案で進行中', color: 'warn' },
  { key: 'agents', label: '稼働中のサブエージェント', color: 'accent' },
  { key: 'prs', label: 'マージできる PR', color: 'ok' },
];
const ROUTE = {
  agents: { label: 'サブエージェント', opts: [{ v: 'default', t: '既定' }, { v: 'codex', t: 'Codex' }, { v: 'claude', t: 'Claude' }] },
  review: { label: 'クロスレビュー', opts: [{ v: 'default', t: '既定' }, { v: 'codex', t: 'Codex' }, { v: 'claude', t: 'Claude' }] },
};
const ROUTE_VALUES = new Set(['default', 'codex', 'claude']);
let lastVersion = null;
let lastState = null;
let sinceSeenMode = 'always';
let showIdleSessions = false;
let hasRenderedState = false;
let answerNoteComposing = false;
let deferredRenderPending = false;
let connectionLost = false;
let lastStateAt = new Date();
let writeErrorUntil = 0;
let writeErrorMessage = '';
let writeErrorTimer = null;
const expandedEndedSessions = new Set();
const expandedEndedDecisions = new Set();
const expandedTodoTasks = new Set();
const expandedDoneTasks = new Set();
const expandedPrLines = new Set();
const expandedKindSections = new Set();
const answerDrafts = new Map();
const answerErrors = new Map();
const decisionAnswerInFlight = new Set();
const pendingTaskCloseActions = new Map();
const taskCloseActionsInFlight = new Set();
const pullRequestMergeResults = new Map();
const pullRequestMergeResultCloseInFlight = new Set();
const TRANSIENT_NOTICE_MS = 60_000;
let renderedPullRequestExpirySignature = '';
let nextPullRequestMergeResultId = 0;
let hiddenSessionsUndo = null;
const recordDeletionTargets = new Map();
const recordDeletionConfirmations = new Map();
let uiUpdatePending = false;
const pullRequestMergeConfirmations = new Map();
const pullRequestMergeOptions = new Map();
const pullRequestMergeMessages = new Map();
const pullRequestReservationPending = new Map();
// 常駐サーバーはキューに入れた時点でマージの意図を消し、キューの所属も取れないので、キューに入れた PR は画面で覚えておく。
// GitHub でキューから外れても分からないため、head が変わったときと、利用者が外れたと知らせたときに忘れる。
const queuedPullRequestMerges = new Map();

function queuedPullRequestMerge(pullRequest) {
  const key = pullRequestMergeKey(pullRequest);
  const queued = queuedPullRequestMerges.get(key);
  if (!queued) return null;
  if (queued.headRefOid && pullRequest.headRefOid && queued.headRefOid !== pullRequest.headRefOid) {
    queuedPullRequestMerges.delete(key);
    return null;
  }
  return queued;
}
const pullRequestMergeInFlight = new Set();
const pullRequestReviewSkipInFlight = new Set();
const pullRequestConflictConfirmations = new Set();
const pullRequestConflictMessages = new Map();
const pullRequestConflictInFlight = new Set();
let routing = { agents: 'default', review: 'default' };
const routingInFlight = new Set();
let codexAgentAvailable = false;
let crossReviewAvailable = false;

const SECTION_KINDS = [
  { key: 'sinceSeen', label: '前回見てから' },
  { key: 'judgment', label: 'あなたの判断が必要なこと' },
  { key: 'tasks', label: 'タスクと完了条件' },
  { key: 'now', label: '今やっていること' },
  { key: 'prs', label: 'プルリクエスト' },
];
const DEFAULT_SECTION_ORDER = SECTION_KINDS.map(({ key }) => key);

function normalizeSectionOrder(order) {
  const known = (Array.isArray(order) ? order : []).filter((key, index, list) => (
    DEFAULT_SECTION_ORDER.includes(key) && list.indexOf(key) === index
  ));
  return [...known, ...DEFAULT_SECTION_ORDER.filter((key) => !known.includes(key))];
}

function normalizeDisplayMinutes(value, minimum, maximum, fallback) {
  return Number.isInteger(value) && value >= minimum && value <= maximum ? value : fallback;
}

function renderSectionOrder(focusKey, focusDirection) {
  // 別の画面の変更を同期して作り直すときも、一覧の中のフォーカスを同じ種類のボタンへ戻す。
  const active = document.activeElement;
  if (!focusKey && active?.dataset?.sectionMove && sectionOrderList.contains(active)) {
    focusKey = active.dataset.sectionMove;
    focusDirection = active.dataset.dir;
  }
  displayPreferences.sectionOrder = normalizeSectionOrder(displayPreferences.sectionOrder);
  const lastIndex = displayPreferences.sectionOrder.length - 1;
  const buttons = [];
  sectionOrderList.replaceChildren(...displayPreferences.sectionOrder.map((key, index) => {
    const { label } = SECTION_KINDS.find((kind) => kind.key === key);
    const item = element('li');
    item.append(element('span', 'section-order-label', `${index + 1}. ${label}`));
    for (const [direction, text, disabled, action] of [['-1', '↑', index === 0, '上へ'], ['1', '↓', index === lastIndex, '下へ']]) {
      const button = element('button', '', text);
      button.type = 'button';
      button.dataset.sectionMove = key;
      button.dataset.dir = direction;
      button.disabled = disabled;
      button.setAttribute('aria-label', `${label}を${action}`);
      item.append(button);
      buttons.push(button);
    }
    return item;
  }));
  if (!focusKey) return;
  const candidates = buttons.filter((button) => button.dataset.sectionMove === focusKey && !button.disabled);
  (candidates.find((button) => button.dataset.dir === focusDirection) || candidates[0])?.focus();
}

function orderedSectionKeys(keys) {
  return normalizeSectionOrder(displayPreferences.sectionOrder).filter((key) => keys.includes(key));
}

function readDisplayPreferences() {
  try {
    return normalizeDisplayPreferences(JSON.parse(localStorage.getItem(DISPLAY_STORAGE_KEY) || '{}'));
  } catch {
    return normalizeDisplayPreferences(null);
  }
}

function normalizeDisplayPreferences(value) {
  const uniqueStrings = (items) => [...new Set(Array.isArray(items) ? items.filter((item) => typeof item === 'string').slice(0, 200) : [])];
  return {
    mode: value?.mode === 'kind' ? 'kind' : 'product',
    order: uniqueStrings(value?.order),
    pinned: uniqueStrings(value?.pinned),
    collapsed: uniqueStrings(value?.collapsed),
    hidden: [...new Set(Array.isArray(value?.hidden) ? value.hidden.filter((item) => FILTERS.some((filter) => filter.key === item)) : [])],
    sectionOrder: normalizeSectionOrder(value?.sectionOrder),
    ...Object.fromEntries(DISPLAY_MINUTE_SETTINGS.map(({ key, min, max, default: fallback }) => (
      [key, normalizeDisplayMinutes(value?.[key], min, max, fallback)]
    ))),
    hideFinished: value?.hideFinished !== false,
    mergeableCondition: ['operation', 'ci', 'cross-review'].includes(value?.mergeableCondition) ? value.mergeableCondition : 'cross-review',
  };
}

let displayPreferences = normalizeDisplayPreferences(null);
renderSectionOrder();
renderDisplaySettings();
let displayPreferencesReady = false;
let displayMigrationPending = false;
let displayMigrationData = null;
let pendingDisplayChanges = {};
let pendingDisplayRequests = 0;
let displayWriteTail = Promise.resolve();
const displayPreferenceSaveStates = new Map();

// 入力中の欄を定期の同期で上書きすると、確定前の値が消えるため、フォーカス中の欄は飛ばす。
function renderDisplaySettings() {
  for (const { input, key } of DISPLAY_MINUTE_SETTINGS) {
    if (document.activeElement === input) continue;
    input.value = String(displayPreferences[key]);
  }
  if (document.activeElement !== hideFinishedInput) hideFinishedInput.checked = displayPreferences.hideFinished;
  if (!mergeableConditionInputs.includes(document.activeElement)) {
    for (const input of mergeableConditionInputs) input.checked = input.value === displayPreferences.mergeableCondition;
  }
}

function setDisplaySettingInput(input, value) {
  if (input.type === 'checkbox') input.checked = value === true;
  else input.value = String(value);
}

function settleDisplaySaves(saves, saved) {
  let sectionOrderWasRestored = false;
  for (const { key, state, sequence, value } of saves) {
    if (saved) state.savedValue = value;
    if (state.sequence !== sequence) continue;
    if (!saved) {
      displayPreferences[key] = state.savedValue;
      sectionOrderWasRestored ||= key === 'sectionOrder';
    }
    if (state.input) setDisplaySettingInput(state.input, displayPreferences[key]);
    displayPreferenceSaveStates.delete(key);
  }
  if (sectionOrderWasRestored) renderSectionOrder();
}

async function sendDisplayPatch(changes) {
  try {
    const response = await postUiAction('/api/display', changes);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return true;
  } catch {
    showWriteError('表示の設定を保存できませんでした');
    return false;
  }
}

function enqueueDisplayPatch(changes) {
  pendingDisplayRequests += 1;
  const run = displayWriteTail.then(() => sendDisplayPatch(changes)).finally(() => { pendingDisplayRequests -= 1; });
  displayWriteTail = run.catch(() => false);
  return run;
}

function saveDisplayPreferences(changes, settingInput = null) {
  const saves = Object.entries(changes).map(([key, value]) => {
    const state = displayPreferenceSaveStates.get(key) || { savedValue: displayPreferences[key], sequence: 0 };
    state.sequence += 1;
    state.latestValue = value;
    if (settingInput?.key === key) state.input = settingInput.input;
    displayPreferenceSaveStates.set(key, state);
    return { key, state, sequence: state.sequence, value };
  });
  Object.assign(displayPreferences, changes);
  if (settingInput && settingInput.key in changes) {
    setDisplaySettingInput(settingInput.input, changes[settingInput.key]);
    if (lastState) render(lastState);
  }
  if (!displayPreferencesReady) {
    Object.assign(pendingDisplayChanges, changes);
    return Promise.resolve(true);
  }
  return enqueueDisplayPatch(changes).then((saved) => {
    settleDisplaySaves(saves, saved);
    if (!saved) {
      renderDisplaySettings();
      if (saves.some(({ key }) => key === 'mergeableCondition')) {
        for (const input of mergeableConditionInputs) input.checked = input.value === displayPreferences.mergeableCondition;
      }
      if (lastState) render(lastState);
    }
    return saved;
  });
}

function displaySettingError(key) {
  return DISPLAY_MINUTE_SETTINGS.find((setting) => setting.key === key)?.error || null;
}

function changeDisplaySetting(key, input) {
  const setting = DISPLAY_MINUTE_SETTINGS.find((item) => item.key === key);
  const value = input.type === 'checkbox' ? input.checked : input.valueAsNumber;
  if (setting && input.type !== 'checkbox' && (!Number.isInteger(value) || value < setting.min || value > setting.max)) {
    const error = displaySettingError(key);
    error.textContent = `${setting.min}〜${setting.max} 分の値を入力してください。`;
    error.hidden = false;
    setDisplaySettingInput(input, displayPreferences[key]);
    return Promise.resolve(false);
  }
  if (setting) {
    const error = displaySettingError(key);
    error.textContent = '';
    error.hidden = true;
  }
  if (value === displayPreferences[key]) return Promise.resolve(true);
  return saveDisplayPreferences({ [key]: value }, { key, input });
}

function clearLegacyDisplayPreferences() {
  try {
    localStorage.removeItem(DISPLAY_STORAGE_KEY);
  } catch {
  }
}

async function syncDisplayPreferences(serverDisplay) {
  if (!displayPreferencesReady) {
    const current = serverDisplay === null
      ? readDisplayPreferences()
      : normalizeDisplayPreferences(serverDisplay);
    for (const [key, state] of displayPreferenceSaveStates) state.savedValue = current[key] ?? state.savedValue;
    displayPreferences = { ...current, ...pendingDisplayChanges };
    renderSectionOrder();
    renderDisplaySettings();
    displayPreferencesReady = true;
    const patch = serverDisplay === null ? displayPreferences : pendingDisplayChanges;
    const pendingSaves = [...displayPreferenceSaveStates].map(([key, state]) => ({ key, state, sequence: state.sequence, value: state.latestValue }));
    pendingDisplayChanges = {};
    if (Object.keys(patch).length) {
      const saved = await enqueueDisplayPatch(patch);
      settleDisplaySaves(pendingSaves, saved);
      if (!saved) {
        renderDisplaySettings();
        if (lastState) render(lastState);
      }
      if (serverDisplay === null) {
        displayMigrationPending = !saved;
        displayMigrationData = displayPreferences;
        if (saved) clearLegacyDisplayPreferences();
      }
    } else if (serverDisplay !== null) {
      clearLegacyDisplayPreferences();
    }
    return;
  }
  if (serverDisplay === null && displayMigrationPending) {
    const saved = await enqueueDisplayPatch(displayMigrationData);
    displayMigrationPending = !saved;
    if (saved) clearLegacyDisplayPreferences();
    return;
  }
  if (serverDisplay !== null && pendingDisplayRequests === 0) {
    const previousSectionOrder = displayPreferences.sectionOrder;
    displayPreferences = normalizeDisplayPreferences(serverDisplay);
    if (previousSectionOrder.some((key, index) => key !== displayPreferences.sectionOrder[index])) renderSectionOrder();
    renderDisplaySettings();
    displayMigrationPending = false;
    displayMigrationData = null;
    clearLegacyDisplayPreferences();
  }
}

document.querySelectorAll('[data-action="mode"]').forEach((button) => {
  button.addEventListener('click', () => {
    saveDisplayPreferences({ mode: button.dataset.mode });
    if (lastState) render(lastState);
  });
});

function applyTheme(theme) {
  const selectedTheme = ['light', 'dark', 'system'].includes(theme) ? theme : 'dark';
  if (selectedTheme === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = selectedTheme;
  themeSelect.value = selectedTheme;
  return selectedTheme;
}

function storedTheme() {
  try {
    const theme = localStorage.getItem(THEME_STORAGE_KEY);
    if (['light', 'dark', 'system'].includes(theme)) return theme;
  } catch {
  }
  return 'dark';
}

applyTheme(storedTheme());
themeSelect.addEventListener('change', () => {
  const theme = applyTheme(themeSelect.value);
  try {
    localStorage.setItem(THEME_STORAGE_KEY, theme);
  } catch {
  }
});

function applySinceSeenMode(mode) {
  sinceSeenMode = ['always', 'away', 'never'].includes(mode) ? mode : 'always';
  sinceSeenSelect.value = sinceSeenMode;
}

function storedSinceSeenMode() {
  try {
    const mode = localStorage.getItem(SINCE_SEEN_STORAGE_KEY);
    if (mode === 'always' || mode === 'away' || mode === 'never') return mode;
  } catch {
  }
  return 'always';
}

function visibleSinceSeen(state) {
  if (sinceSeenMode === 'never' || (sinceSeenMode === 'away' && header.dataset.away !== 'true')) return [];
  return Array.isArray(state?.sinceSeen) ? state.sinceSeen : [];
}

function setSinceSeenMode(mode) {
  applySinceSeenMode(mode);
  try {
    localStorage.setItem(SINCE_SEEN_STORAGE_KEY, sinceSeenMode);
  } catch {
  }
  if (lastState) render(lastState);
}

applySinceSeenMode(storedSinceSeenMode());
sinceSeenSelect.addEventListener('change', () => setSinceSeenMode(sinceSeenSelect.value));

sectionOrderList.addEventListener('click', (event) => {
  const button = event.target.closest('[data-section-move]');
  if (!button) return;
  const order = normalizeSectionOrder(displayPreferences.sectionOrder);
  const index = order.indexOf(button.dataset.sectionMove);
  const target = index + Number(button.dataset.dir);
  if (index < 0 || target < 0 || target >= order.length) return;
  [order[index], order[target]] = [order[target], order[index]];
  saveDisplayPreferences({ sectionOrder: order });
  renderSectionOrder(button.dataset.sectionMove, button.dataset.dir);
  if (lastState) render(lastState);
});
document.getElementById('settings-section-order-reset').addEventListener('click', () => {
  saveDisplayPreferences({ sectionOrder: [...DEFAULT_SECTION_ORDER] });
  renderSectionOrder();
  if (lastState) render(lastState);
});

for (const { key, input } of DISPLAY_MINUTE_SETTINGS) {
  input.addEventListener('change', () => changeDisplaySetting(key, input));
}
hideFinishedInput.addEventListener('change', () => changeDisplaySetting('hideFinished', hideFinishedInput));
for (const input of mergeableConditionInputs) {
  input.addEventListener('change', () => {
    if (!input.checked || !['operation', 'ci', 'cross-review'].includes(input.value)) return;
    void saveDisplayPreferences({ mergeableCondition: input.value });
    if (lastState) render(lastState);
  });
}

settingsButton.addEventListener('click', () => {
  settingsDialog.showModal();
  settingsSaveError.textContent = Date.now() < writeErrorUntil ? writeErrorMessage : '';
  settingsSaveError.hidden = !settingsSaveError.textContent;
});
settingsClose.addEventListener('click', () => settingsDialog.close());
settingsDialog.addEventListener('click', (event) => {
  // 内側の余白を押しても target はダイアログ自身になるので、位置で背景かを判定する。
  const box = settingsDialog.getBoundingClientRect();
  const isOutside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
  if (event.target === settingsDialog && isOutside) settingsDialog.close();
});
settingsDialog.addEventListener('close', () => {
  settingsSaveError.textContent = '';
  settingsSaveError.hidden = true;
  settingsButton.focus();
});

function applyAwayState(away) {
  const enabled = away?.enabled === true;
  if (!awayToggle.disabled) awayToggle.checked = enabled;
  header.dataset.away = String(enabled);
}

function updateConnectionNote() {
  if (connectionLost) {
    const time = absoluteTimeLabel(lastStateAt);
    connectionNote.textContent = `常駐サーバーに接続できません。表示は ${time} 時点のものです。`;
    connectionNote.hidden = false;
  } else if (Date.now() < writeErrorUntil) {
    connectionNote.textContent = writeErrorMessage;
    connectionNote.hidden = false;
  } else {
    connectionNote.textContent = '';
    connectionNote.hidden = true;
  }
}

function showWriteError(message) {
  writeErrorMessage = message;
  writeErrorUntil = Date.now() + 10_000;
  if (settingsDialog.open) {
    settingsSaveError.textContent = message;
    settingsSaveError.hidden = false;
  }
  clearTimeout(writeErrorTimer);
  writeErrorTimer = setTimeout(updateConnectionNote, 10_000);
  updateConnectionNote();
}

async function postUiAction(url, body) {
  const send = () => fetch(url, {
    method: 'POST',
    cache: 'no-store',
    headers: {
      'Content-Type': 'application/json',
      'X-Cockpit-Secret': document.querySelector('meta[name="cockpit-secret"]').content,
    },
    body: JSON.stringify(body),
  });
  let response = await send();
  if (response.status === 401) {
    await refreshUiSecret();
    response = await send();
  }
  return response;
}

async function openExternalLink(url) {
  try {
    const response = await postUiAction('/api/open-url', { url });
    if (response.status === 204) return;
  } catch {
  }
  window.open(url, '_blank', 'noopener,noreferrer');
}

function defaultBrowserUrl(link) {
  try {
    const url = new URL(link.href, window.location.href);
    const isExternalHttps = url.protocol === 'https:' && url.origin !== window.location.origin;
    const isManual = url.protocol === 'http:' && url.origin === window.location.origin && url.pathname.startsWith('/manual/');
    return isExternalHttps || isManual ? url.href : null;
  } catch {
    return null;
  }
}

function handleExternalLink(event) {
  const link = event.target.closest?.('a[target="_blank"]');
  if (!link) return false;
  const url = defaultBrowserUrl(link);
  if (!url) return false;
  event.preventDefault();
  void openExternalLink(url);
  return true;
}

function postAway(enabled) {
  return postUiAction('/api/away', { enabled });
}

function routeName(key, value) {
  return ROUTE[key].opts.find((option) => option.v === value)?.t || ROUTE[key].opts[0].t;
}

const ROUTING_PAIR_GAP_PX = 12;
function layoutRouting() {
  const group = document.querySelector('#routing .rgroup');
  if (!group) return;
  const columnGap = parseFloat(getComputedStyle(group).columnGap) || 0;
  const widths = [...group.querySelectorAll('.rlabel, .seg')].map((node) => node.getBoundingClientRect().width);
  const needed = widths.reduce((sum, width) => sum + width, 0) + columnGap * (widths.length - 1) + ROUTING_PAIR_GAP_PX;
  group.classList.toggle('side-by-side', widths.length > 2 && needed <= group.clientWidth);
}

function renderRouting(settings = {}, integrations = {}) {
  routing = {
    agents: ROUTE_VALUES.has(settings.agents) ? settings.agents : 'default',
    review: ROUTE_VALUES.has(settings.review) ? settings.review : 'default',
  };
  codexAgentAvailable = integrations.codexAgent === true;
  crossReviewAvailable = integrations.crossReview === true;
  const root = document.getElementById('routing');
  const keys = [
    ...(codexAgentAvailable ? ['agents'] : []),
    ...(crossReviewAvailable ? ['review'] : []),
  ];
  root.hidden = keys.length === 0;
  if (root.hidden) {
    root.innerHTML = '';
    root.dataset.routes = '';
    return;
  }
  const routeSignature = keys.join(',');
  if (root.dataset.routes !== routeSignature) {
    const row = (key) => `<div class="rrow"><span class="rlabel">${ROUTE[key].label}</span><div class="seg" role="group" aria-label="${ROUTE[key].label}の経路">${ROUTE[key].opts.map((option) => `<button type="button" data-route="${key}" data-v="${option.v}" aria-pressed="false">${option.t}</button>`).join('')}</div></div>`;
    root.innerHTML = `<div class="rgroup">${keys.map(row).join('')}</div>`;
    root.dataset.routes = routeSignature;
  }
  for (const button of root.querySelectorAll('[data-route]')) {
    button.setAttribute('aria-pressed', String(button.dataset.v === routing[button.dataset.route]));
    button.disabled = routingInFlight.has(button.dataset.route);
  }
  layoutRouting();
}

if ('ResizeObserver' in window) new ResizeObserver(layoutRouting).observe(document.getElementById('routing'));
renderRouting(routing);

async function updateRouting(button) {
  const { route: key, v: value } = button.dataset;
  if (routingInFlight.has(key)) return;
  routingInFlight.add(key);
  try {
    renderRouting(routing, { codexAgent: codexAgentAvailable, crossReview: crossReviewAvailable });
    const response = await postUiAction('/api/routing', { key, value });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const updated = await response.json();
    renderRouting(updated, { codexAgent: codexAgentAvailable, crossReview: crossReviewAvailable });
    if (lastState) {
      lastState.routing = updated;
      render(lastState);
    }
    liveStatus.textContent = '経路の設定を保存しました。';
  } catch {
    showWriteError('経路の設定を保存できませんでした。');
  } finally {
    routingInFlight.delete(key);
    renderRouting(routing, { codexAgent: codexAgentAvailable, crossReview: crossReviewAvailable });
  }
}

async function refreshUiSecret() {
  const response = await fetch('/', { cache: 'no-store' });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const page = new DOMParser().parseFromString(await response.text(), 'text/html');
  const secret = page.querySelector('meta[name="cockpit-secret"]')?.content;
  if (!secret) throw new Error('secret unavailable');
  document.querySelector('meta[name="cockpit-secret"]').content = secret;
}

awayToggle.addEventListener('change', async () => {
  const requested = awayToggle.checked;
  const previous = lastState?.away?.enabled === true;
  awayToggle.disabled = true;
  try {
    const response = await postAway(requested);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const away = await response.json();
    applyAwayState(away);
    if (lastState) render(lastState);
    liveStatus.textContent = '離席状態を更新しました。';
  } catch {
    awayToggle.checked = previous;
    applyAwayState({ enabled: previous });
    liveStatus.textContent = '離席中を切り替えられませんでした';
    showWriteError('離席中を切り替えられませんでした');
  } finally {
    awayToggle.disabled = false;
  }
});

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function badge(text, className = '') {
  return element('span', `badge ${className}`.trim(), text);
}

function durationLabel(startedAt, now = Date.now()) {
  const start = Date.parse(startedAt);
  if (!Number.isFinite(start)) return '時刻不明';
  const minutes = Math.max(0, Math.floor((now - start) / 60_000));
  if (minutes < 1) return '1 分以内';
  if (minutes < 60) return `${minutes} 分`;
  const hours = Math.floor(minutes / 60);
  const remainder = minutes % 60;
  return remainder ? `${hours} 時間 ${remainder} 分` : `${hours} 時間`;
}

function absoluteTimeLabel(value, now = Date.now(), invalidLabel = '未取得') {
  const date = value instanceof Date ? value : value === null || value === undefined || value === '' ? null : new Date(value);
  if (!date || !Number.isFinite(date.getTime())) return invalidLabel;
  const current = new Date(now);
  const time = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
  return date.getFullYear() === current.getFullYear()
    && date.getMonth() === current.getMonth()
    && date.getDate() === current.getDate()
    ? time
    : `${date.getMonth() + 1}/${date.getDate()} ${time}`;
}

function relativeTimeElement(value, className, label, now = Date.now()) {
  const time = element('time', className, label);
  const date = value instanceof Date ? value : value === null || value === undefined || value === '' ? null : new Date(value);
  if (date && Number.isFinite(date.getTime())) {
    time.dateTime = date.toISOString();
    time.title = absoluteTimeLabel(date, now);
  }
  return time;
}

function durationAgoLabel(startedAt, now = Date.now()) {
  const label = durationLabel(startedAt, now);
  return ['時刻不明', '1 分以内'].includes(label) ? label : `${label}前`;
}

function appendToolLine(target, tool) {
  if (!tool) return;
  const line = element('div', 'tool-line');
  if (tool.tool_name) {
    const name = badge(tool.tool_name, 'tool-name');

    line.append(name);

}

function routeTag(agent) {
  if (!codexAgentAvailable || !agent.active || !ROUTE_VALUES.has(agent.route)) return null;
  const stale = agent.route !== routing.agents;
  const tag = element('span', `route-tag${stale ? ' stale' : ''}`, `経路: ${routeName('agents', agent.route)}${stale ? ' (変更前)' : ''}`);
  tag.title = '起動時に効いていた経路の設定';

}

// セッションにモデル名が無いときは、非対話の実行を API として札に出す。
function appendSessionModelLine(target, session) {

function appendModelLine(target, agent) {
  const claudeModel = !agent.isCodex && agent.model ? (agent.modelName || agent.model) : '';
  const gpt = agent.isCodex
    ? { model: agent.model, effort: agent.effort, codex_home: agent.codex_home, unavailable: agent.unavailable }

    if (gpt.unavailable) gptBadge.append(element('i', '', gpt.unavailable));

    if (gpt.codex_home) gptBadge.title = gpt.codex_home;
    models.append(gptBadge);

function updateTitle(sessions) {
  const judgments = countJudgments(sessions);
  const pendingCount = judgments.permission + judgments.blocking;
  document.title = pendingCount ? `(${pendingCount}) Agent Cockpit` : 'Agent Cockpit';
}

function isActiveDecision(decision) {
  return decision.state === 'waiting' || decision.state === 'provisional';
}

function isEndedDecision(decision) {
  return decision.state === 'resolved' || decision.state === 'withdrawn';
}

function isPendingDecision(decision) {
  return decision.state === 'waiting' && !hasEffectiveAnswer(decision);
}

// 回答を送ったものはセッションの反映を待つだけなので数えない。
function isAwaitingDecision(decision) {
  return isActiveDecision(decision) && !hasEffectiveAnswer(decision);
}

function countJudgments(sessions) {
  const counts = { permission: 0, blocking: 0, provisional: 0 };
  for (const session of sessions) {
    counts.permission += session.permissionWaits.length;
    for (const decision of session.decisions) {
      if (!isAwaitingDecision(decision)) continue;
      counts[isPendingDecision(decision) ? 'blocking' : 'provisional'] += 1;
    }
  }
  counts.decisions = counts.blocking + counts.provisional;
  counts.total = counts.permission + counts.decisions;
  return counts;
}

function decisionCountTitle(decisions) {
  const judgmentCounts = countJudgments([{ permissionWaits: [], decisions }]);
  const counts = [
    ['止めて待っている', judgmentCounts.blocking],
    ['仮に推奨案で進行中', judgmentCounts.provisional],
  ];
  return counts.filter(([, count]) => count > 0).map(([label, count]) => `${label} ${count} 件`).join('、');
}

// 0 件で消えた札の代わりに、並びで次にある札を返す。後ろに無ければ直前の札を返す。
function filterFocusFallback(buttons, key) {
  const position = (item) => FILTERS.findIndex((filter) => filter.key === item.dataset.filter);
  const removed = FILTERS.findIndex((filter) => filter.key === key);
  const chips = buttons.filter((item) => item.dataset.filter && position(item) >= 0);
  return chips.find((item) => position(item) > removed) || chips.at(-1) || null;
}

function renderSummary(sessions, pullRequestGroups = []) {
  const judgmentCounts = countJudgments(sessions);
  const agentCount = sessions.reduce((total, session) => total + session.agents.filter((agent) => agent.active).length, 0);
  const counts = {
    permission: judgmentCounts.permission,
    blocking: judgmentCounts.blocking,
    provisional: judgmentCounts.provisional,
    agents: agentCount,
    prs: pullRequestMergeableCount(pullRequestGroups),
  };
  // 隠している種類は 0 件でも札を残す。札を押すことが、その種類を個別に表示へ戻す手段であるため。
  const shownFilters = FILTERS.filter(({ key }) => counts[key] > 0 || displayPreferences.hidden.includes(key));
  summary.replaceChildren(...shownFilters.map(({ key, label, color }) => {
    const button = element('button', `chip ${color}`.trim());
    button.type = 'button';
    button.dataset.filter = key;
    button.setAttribute('aria-pressed', String(!displayPreferences.hidden.includes(key)));
    button.title = displayPreferences.hidden.includes(key) ? '押すと表示に戻す' : '押すと非表示にする';
    const count = String(counts[key]);
    button.append(document.createTextNode(`${label} `), element('strong', '', count));
    return button;
  }));

  const hiddenKinds = FILTERS.filter(({ key }) => displayPreferences.hidden.includes(key));
  // PR の種類を隠すとプロダクトごとの PR の欄が隠れるので、隠れる行の数(オープンの PR の数)で数える。
  const hiddenRowCounts = { ...counts, prs: pullRequestOpenCount(pullRequestGroups) };
  const hiddenCount = hiddenKinds.reduce((total, { key }) => total + hiddenRowCounts[key], 0);
  const note = document.getElementById('filter-note');
  note.hidden = hiddenKinds.length === 0;
  if (hiddenKinds.length) {
    const showAll = element('button', 'link-btn', '隠した種類をすべて表示する');
    showAll.type = 'button';
    showAll.dataset.showAll = 'true';
    showAll.addEventListener('click', () => {
      saveDisplayPreferences({ hidden: [] });
      render(lastState);
    });
    note.replaceChildren(
      element('span', '', `非表示: ${hiddenKinds.map(({ label }) => label).join('、')} (${hiddenCount} 件)`),
      showAll,
    );
  } else {
    note.replaceChildren();
  }
}

function renderExcludedNote(sessions) {
  const note = document.getElementById('excluded-note');
  const hiddenSessions = sessions.filter((session) => session.hidden === true && !isIdleHiddenSession(session));
  const hiddenCount = hiddenSessions.length;
  note.hidden = hiddenCount === 0 && !hiddenSessionsUndo && !recordDeletionConfirmations.has('excluded');
  if (note.hidden) {
    note.replaceChildren();
    return;
  }
  const children = [];
  if (hiddenSessionsUndo) {
    const undo = element('button', 'link-btn', '元に戻す');
    undo.type = 'button';
    undo.dataset.undoHiddenSessions = 'true';
    children.push(element('span', '', `${hiddenSessionsUndo.productName} を一覧から外しました。`), undo);
  }
  if (hiddenCount) {
    const showAll = element('button', 'link-btn', '外したセッションを戻す');
    showAll.type = 'button';
    showAll.dataset.clearHiddenSessions = 'true';
    const judgmentCounts = countJudgments(hiddenSessions);
    const pendingCounts = [
      judgmentCounts.permission ? `許可待ち ${judgmentCounts.permission} 件` : '',
      judgmentCounts.blocking ? `止めて待っている ${judgmentCounts.blocking} 件` : '',
    ].filter(Boolean);
    const countNote = pendingCounts.length ? `、うち${pendingCounts.join('、')}` : '';
    children.push(element('span', '', `外したセッション (${hiddenCount} 件)${countNote}`), showAll);
  }
  note.replaceChildren(...children);
  appendRecordDeletion(note, 'excluded', { session_ids: hiddenSessions.map((session) => session.session_id) }, hiddenCount);
}

function finishedDeletionTargets(sessions, groups) {
  const targets = { session_ids: [], merge_history: [], closed_pull_requests: [] };
  if (!displayPreferences.hideFinished) return targets;
  targets.session_ids = sessions.filter((session) => session.hidden !== true && isFinishedSession(session)).map((session) => session.session_id);
  for (const [field, source] of [['merge_history', 'mergeHistory'], ['closed_pull_requests', 'merged']]) {
    const seen = new Set();
    for (const group of groups) {
      for (const record of group[source] || []) {
        const visibleAutomaticResult = record.automatic === true && record.automaticResult
          && pullRequestMergeResultVisible(record, record.mergedAt);
        if (field === 'merge_history' ? record.headMismatch === true || visibleAutomaticResult : record.state !== 'closed') continue;
        const key = `${group.owner}/${group.repo}#${record.number}`.toLowerCase();
        if (seen.has(key)) continue;
        seen.add(key);
        targets[field].push({ owner: group.owner, repo: group.repo, number: record.number });
      }
    }
  }
  return targets;
}

function recordDeletionTargetKey(field, target) {
  if (field === 'session_ids') return target;
  return `${target.owner}/${target.repo}#${target.number}`.toLowerCase();
}

function intersectRecordDeletionTargets(selected, current) {
  return Object.fromEntries(Object.keys(selected).map((field) => {
    const currentKeys = new Set((current[field] || []).map((target) => recordDeletionTargetKey(field, target)));
    return [field, (selected[field] || []).filter((target) => currentKeys.has(recordDeletionTargetKey(field, target)))];
  }));
}

function countRecordDeletionTargets(targets) {
  return Object.values(targets).reduce((total, items) => total + items.length, 0);
}

function appendRecordDeletion(note, band, targets, count) {
  recordDeletionTargets.set(band, targets);
  let confirmation = recordDeletionConfirmations.get(band);
  if (confirmation && !confirmation.pending
    && !countRecordDeletionTargets(intersectRecordDeletionTargets(confirmation.targets, targets))) {
    recordDeletionConfirmations.delete(band);
    confirmation = null;
    // 確認を開いていたために出していた帯は、対象が無くなったら閉じる。
    if (!count && !(band === 'excluded' && hiddenSessionsUndo)) note.hidden = true;
  }
  if (!count && !confirmation) return;
  const controls = element('span', 'record-deletion');
  const buttonFor = (action, label) => {
    const button = element('button', 'link-btn', label);
    button.type = 'button';
    button.dataset.recordBand = band;
    button.dataset.recordAction = action;
    button.setAttribute('aria-disabled', String(confirmation?.pending === true));
    return button;
  };
  if (confirmation) {
    confirmation.count = countRecordDeletionTargets(intersectRecordDeletionTargets(
      confirmation.targets, recordDeletionTargets.get(band),
    ));
    controls.append(element('span', '', `${confirmation.count} 件の記録を削除します。元に戻せません`));
    if (confirmation.error) {
      const error = element('span', 'error', confirmation.error);
      error.setAttribute('role', 'alert');
      controls.append(error);
    }
    const remove = buttonFor('confirm', confirmation.pending ? '削除中…' : '削除する');
    const cancel = buttonFor('cancel', 'やめる');
    remove.addEventListener('click', () => { void deleteNoteRecords(band); });
    cancel.addEventListener('click', () => {
      if (confirmation.pending) return;
      recordDeletionConfirmations.delete(band);
      render(lastState);
      focusRecordDeletion(band, 'open');
    });
    controls.append(remove, cancel);
  } else {
    const open = buttonFor('open', '');
    open.classList.add('record-delete-icon');
    open.setAttribute('aria-label', `この ${count} 件の記録を削除する`);
    open.title = `この ${count} 件の記録を削除する`;
    open.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';
    open.addEventListener('click', () => {
      recordDeletionConfirmations.set(band, { targets, count, pending: false, error: '' });
      render(lastState);
      focusRecordDeletion(band, 'cancel');
    });
    controls.append(open);
  }
  note.append(controls);
}

function focusRecordDeletion(band, action) {
  const controls = [...document.querySelectorAll('[data-record-band]')];
  (controls.find((button) => button.dataset.recordBand === band && button.dataset.recordAction === action)
    || document.querySelector('[data-action="mode"][data-mode="' + displayPreferences.mode + '"]'))?.focus({ preventScroll: true });
}

async function deleteNoteRecords(band) {
  const confirmation = recordDeletionConfirmations.get(band);
  if (!confirmation || confirmation.pending) return;
  const targets = intersectRecordDeletionTargets(confirmation.targets, recordDeletionTargets.get(band) || {});
  if (!countRecordDeletionTargets(targets)) {
    recordDeletionConfirmations.delete(band);
    render(lastState);
    focusRecordDeletion(band, 'open');
    return;
  }
  confirmation.count = countRecordDeletionTargets(targets);
  confirmation.pending = true;
  confirmation.error = '';
  render(lastState);
  let deleted = 0;
  try {
    const batches = Math.ceil(Math.max(...Object.values(targets).map((items) => items.length)) / 50);
    for (let index = 0; index < batches; index += 1) {
      const body = Object.fromEntries(Object.entries(targets).map(([key, items]) => [key, items.slice(index * 50, (index + 1) * 50)]));
      const response = await postUiAction('/api/record-deletions', body);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const result = await response.json();
      deleted += result.deleted.sessions + result.deleted.pullRequests;
      if (hiddenSessionsUndo) {
        const ids = new Set(body.session_ids || []);
        hiddenSessionsUndo.sessionIds = hiddenSessionsUndo.sessionIds.filter((id) => !ids.has(id));
        if (!hiddenSessionsUndo.sessionIds.length) hiddenSessionsUndo = null;
      }
    }
    recordDeletionConfirmations.delete(band);
    await refresh();
    render(lastState);
    focusRecordDeletion(band, 'open');
    liveStatus.textContent = `${deleted} 件の記録を削除しました。`;
  } catch {
    confirmation.error = '記録を削除できませんでした。もう一度お試しください。';
    liveStatus.textContent = confirmation.error;
  } finally {
    confirmation.pending = false;
    render(lastState);
  }
}

function finishedHiddenCounts(sessions, groups) {
  if (!displayPreferences.hideFinished) return { sessions: 0, pullRequests: 0 };
  const hiddenPullRequests = new Set();
  for (const group of groups) {
    const repository = `${group.owner}/${group.repo}`.toLowerCase();
    for (const record of group.mergeHistory || []) {
      const visibleAutomaticResult = record.automatic === true && record.automaticResult
        && pullRequestMergeResultVisible(record, record.mergedAt);
      if (record.headMismatch !== true && !visibleAutomaticResult) hiddenPullRequests.add(`${repository}#${record.number}`);
    }
    for (const pullRequest of group.merged || []) {
      if (pullRequest.state === 'closed') hiddenPullRequests.add(`${repository}#${pullRequest.number}`);
    }
  }
  return {
    sessions: sessions.filter((session) => session.hidden !== true && isFinishedSession(session)).length,
    pullRequests: hiddenPullRequests.size,
  };
}

function renderFinishedNote(counts, targets) {
  const note = document.getElementById('finished-note');
  const parts = [
    counts.sessions ? `セッション ${counts.sessions} 件` : '',
    counts.pullRequests ? `PR ${counts.pullRequests} 件` : '',
  ].filter(Boolean);
  note.hidden = parts.length === 0 && !recordDeletionConfirmations.has('finished');
  if (note.hidden) {
    note.replaceChildren();
    return;
  }
  const show = element('button', 'link-btn', '表示する');
  show.type = 'button';
  show.dataset.showFinished = 'true';
  show.addEventListener('click', () => {
    hideFinishedInput.checked = false;
    void changeDisplaySetting('hideFinished', hideFinishedInput);
  });
  note.replaceChildren(element('span', '', `終わったものを隠しています (${parts.join('、')})`), show);
  appendRecordDeletion(note, 'finished', targets, counts.sessions + counts.pullRequests);
}

function isIdleHiddenSession(session, now = Date.now()) {
  // 非対話の実行中は作業中として見せるので、更新時刻が古くても隠さない。
  if (session.status === '作業中' || (session.status === '不明' && session.nonInteractive)
    || (session.permissionWaits || []).length > 0) return false;
  if ((session.decisions || []).some(isActiveDecision)) return false;
  if ((session.agents || []).some((agent) => !isEndedAgent(agent))) return false;
  const lastUpdatedAt = Date.parse(session.lastUpdatedAt || session.sessionFileUpdatedAt || '');
  const hiddenAt = session.hidden === true ? Date.parse(session.hiddenAt || '') : NaN;
  const updatedAt = Number.isFinite(hiddenAt) ? Math.max(Number.isFinite(lastUpdatedAt) ? lastUpdatedAt : hiddenAt, hiddenAt) : lastUpdatedAt;
  return Number.isFinite(updatedAt) && now - updatedAt > displayPreferences.idleHideMinutes * 60_000;
}

function idleHiddenSessions(sessions, now = Date.now()) {
  return sessions.filter((session) => !(session.hidden !== true && displayPreferences.hideFinished && isFinishedSession(session))
    && isIdleHiddenSession(session, now));
}

function sessionsAfterIdleFilter(sessions) {
  if (showIdleSessions) return sessions;
  const hiddenSessionIds = new Set(idleHiddenSessions(sessions).map((session) => session.session_id));
  return sessions.filter((session) => !hiddenSessionIds.has(session.session_id));
}

function renderIdleNote(hiddenCount, sessions) {
  const note = document.getElementById('idle-note');
  note.hidden = hiddenCount === 0 && !recordDeletionConfirmations.has('idle');
  if (note.hidden) {
    note.replaceChildren();
    return;
  }
  const toggle = element('button', 'link-btn', showIdleSessions ? '隠す' : '表示する');
  toggle.type = 'button';
  toggle.dataset.showIdle = 'true';
  toggle.addEventListener('click', () => {
    showIdleSessions = !showIdleSessions;
    if (lastState) render(lastState);
  });
  const message = showIdleSessions
    ? '更新の無いセッションを表示しています'
    : `更新の無いセッションを隠しています (${hiddenCount} 件)`;
  note.replaceChildren(element('span', '', message), toggle);
  appendRecordDeletion(note, 'idle', { session_ids: sessions.map((session) => session.session_id) }, hiddenCount);
}

function isFilterShown(key) {
  return !displayPreferences.hidden.includes(key);
}

function toggleFilter(key) {
  const hidden = isFilterShown(key)
    ? [...displayPreferences.hidden, key]
    : displayPreferences.hidden.filter((item) => item !== key);
  saveDisplayPreferences({ hidden });
  if (lastState) render(lastState);
}

function hasEffectiveAnswer(decision) {
  return Boolean(decision.answer?.sentAt && !decision.answer.ignoredAt);
}

function isLongWait(ageMs) {
  return Number.isFinite(ageMs) && ageMs > displayPreferences.longWaitMinutes * 60_000;
}

function shownPermissions(session) {
  return isFilterShown('permission') ? session.permissionWaits : [];
}

function shownActiveDecisions(session) {
  return session.decisions.filter((decision) => {
    if (!isActiveDecision(decision)) return false;
    if (hasEffectiveAnswer(decision)) return true;
    return decision.state === 'waiting' ? isFilterShown('blocking') : isFilterShown('provisional');
  });
}

function hasHiddenJudgmentItems(session) {
  return (!isFilterShown('permission') && session.permissionWaits.length > 0)
    || session.decisions.some((decision) => (
      isActiveDecision(decision) && !shownActiveDecisions(session).includes(decision)
    ));
}

function pullRequestOpenCount(groups) {
  return groups.reduce((total, group) => total + (group.openCount || 0), 0);
}

function pullRequestRepositoryKey(group) {
  const repository = `${group.owner}/${group.repo}`.toLowerCase();
  return group.product?.key ? `${repository}\0${group.product.key}` : repository;
}

function hasPullRequestMergeResults(group) {
  return (pullRequestMergeResults.get(pullRequestRepositoryKey(group)) || [])
    .some((result) => pullRequestMergeResultVisible(result, result.recordedAt));
}

function rememberPullRequestMergeResult(group, result) {
  const key = pullRequestRepositoryKey(group);
  const results = pullRequestMergeResults.get(key) || [];
  results.push({ id: String(++nextPullRequestMergeResultId), recordedAt: Date.now(), ...result, autoDeleteBranch: group.autoDeleteBranch === true && result.isCrossRepository !== true });
  pullRequestMergeResults.set(key, results);
}

function pullRequestMergeResultHasWarning(result) {
  const details = result.automaticResult ? { ...result, ...result.automaticResult } : result;
  return details.headMismatch === true || (typeof details.warning === 'string' && details.warning.length > 0);
}

function pullRequestTimestampExpired(startedAt, durationMs, now = Date.now()) {
  const timestamp = typeof startedAt === 'number' ? startedAt : Date.parse(startedAt || '');
  return Number.isFinite(timestamp) && now >= timestamp && now - timestamp >= durationMs;
}

function pullRequestTransientNoticeExpired(at, now = Date.now()) {
  return pullRequestTimestampExpired(at, TRANSIENT_NOTICE_MS, now);
}

function recordPullRequestTransientMessage(messages, key, message) {
  messages.set(key, { message, shownAt: Date.now() });
}

function pullRequestMergeResultExpired(result, startedAt, now = Date.now()) {
  if (result.mergeResultClosedAt || pullRequestMergeResultHasWarning(result)) return false;
  return pullRequestTimestampExpired(startedAt, displayPreferences.mergeResultHideMinutes * 60_000, now);
}

function pullRequestMergeResultVisible(result, startedAt = result.recordedAt, now = Date.now()) {
  return !result.mergeResultClosedAt && !pullRequestMergeResultExpired(result, startedAt, now);
}

function pullRequestExpirySignature(groups, now = Date.now()) {
  const expired = [];
  for (const group of groups || []) {
    const groupKey = pullRequestRepositoryKey(group);
    for (const notice of group.reservationNotices || []) {
      const state = pullRequestTransientNoticeExpired(notice.at, now) ? 'expired' : 'visible';
      expired.push(`${groupKey}:reservation:${notice.number}:${notice.at}:${state}`);
    }
    for (const result of group.mergeHistory || []) {
      if (result.automatic === true && result.automaticResult && pullRequestMergeResultExpired(result, result.mergedAt, now)) {
        expired.push(`${groupKey}:automatic:${result.number}:${result.mergedAt}`);
      }
    }
    for (const result of pullRequestMergeResults.get(groupKey) || []) {
      if (pullRequestMergeResultExpired(result, result.recordedAt, now)) expired.push(`${groupKey}:manual:${result.id}`);
    }
  }
  for (const [key, message] of pullRequestMergeMessages) {
    if (pullRequestTransientNoticeExpired(message.shownAt, now)) expired.push(`merge:${key}`);
  }
  for (const [key, message] of pullRequestConflictMessages) {
    if (pullRequestTransientNoticeExpired(message.shownAt, now)) expired.push(`conflict:${key}`);
  }
  return expired.sort().join('|');
}

function removePullRequestMergeResult(id) {
  for (const [key, results] of pullRequestMergeResults) {
    const remaining = results.filter((result) => result.id !== id);
    if (remaining.length === results.length) continue;
    if (remaining.length) pullRequestMergeResults.set(key, remaining);
    else pullRequestMergeResults.delete(key);
    return true;
  }
  return false;
}

function pullRequestGroupHasVisibleContent(group) {
  return group.openCount > 0 || group.openStateUnknown || group.error || group.loading || group.trees?.length
    || group.mergeHistory?.some((record) => record.headMismatch === true
      || (record.automatic === true && record.automaticResult && pullRequestMergeResultVisible(record, record.mergedAt)))
      || group.reservationNotices?.some((notice) => !pullRequestTransientNoticeExpired(notice.at)) || hasPullRequestMergeResults(group);
}

function visiblePullRequestGroups(groups) {
  if (!displayPreferences.hideFinished) return groups;
  return groups.filter(pullRequestGroupHasVisibleContent);
}

// 同じ PR が複数のプロダクトの PR 群に載ることがあるので、owner、repo、番号で重複を除いて数える。
function pullRequestKeys(groups, includes) {
  const keys = new Set();
  const visit = (group, pullRequest) => {
    if (includes(pullRequest)) keys.add(`${group.owner}/${group.repo}#${pullRequest.number}`.toLowerCase());
    for (const child of pullRequest.children || []) visit(group, child);
  };
  for (const group of groups) for (const tree of group.trees || []) visit(group, tree);
  return keys;
}

function pullRequestMergeableCount(groups) {
  return pullRequestKeys(groups, (pullRequest) => pullRequest.canMerge === true &&
    pullRequestMergeConditionWaits(pullRequest).length === 0 && Boolean(pullRequest.mergeSessionId)).size;
}

function decisionElapsedLabel(decision) {
  if (decision.state === 'waiting') {
    const age = Date.now() - Date.parse(decision.createdAt);
    const duration = durationLabel(decision.createdAt);
    const stale = isLongWait(age) && !hasEffectiveAnswer(decision);
    return {
      className: `wait ${stale ? 'stale' : ''}`.trim(),
      label: duration === '時刻不明' ? duration : `${duration}待機中`,
      stale,
    };
  }
  if (decision.state === 'provisional') {
    return { className: 'since', label: `仮適用から ${durationLabel(decision.provisionalAt || decision.updatedAt)}`, stale: false };
  }
  return null;
}

function appendPullRequestBadges(target, pullRequest) {
  const ci = CI_LABELS[pullRequest.ci] || CI_LABELS.unknown;
  const review = {
    approved: ['ok', '承認済み'],
    required: ['mute', '承認待ち'],
    none: ['mute', '承認は任意'],
    changes: ['danger', '変更要求'],
  }[pullRequest.review] || ['mute', 'レビュー状態不明'];
  if (pullRequest.draft) target.append(badge('ドラフト', 'mute'));
  target.append(badge(ci.badge, ci.tone), badge(review[1], review[0]));
  if (pullRequest.conflict) target.append(badge('コンフリクト', 'danger'));
  if (pullRequest.retargetedFrom) target.append(badge(`base を ${pullRequest.effectiveBase} に付け替え済み`, 'accent long'));
  if (pullRequest.needsRestack) target.append(badge('積み直しが必要', 'warn'));
}

const MERGE_METHOD_LABELS = { merge: 'マージコミット', squash: 'スカッシュ', rebase: 'リベース' };
const MERGED_VISIBLE_COUNT = 5;
const CI_LABELS = {
  pass: { tone: 'ok', badge: 'CI 成功', wait: 'CI 成功' },
  pending: { tone: 'warn', badge: 'CI 実行中', wait: 'CI 実行中' },
  fail: { tone: 'danger', badge: 'CI 失敗', wait: 'CI が失敗' },
  unknown: { tone: 'mute', badge: 'CI 状態不明', wait: 'CI 状態不明' },
};

function convergedAtHead(pullRequest) {
  const review = pullRequest.crossReview;
  const triage = review?.triage;
  const head = pullRequest.headRefOid;
  return Number.isSafeInteger(review?.round) && triage?.round === review.round && triage.outcome === 'converged' &&
    isCompleteCommitSha(triage.sha) && isCompleteCommitSha(head) && triage.sha.toLowerCase() === head.toLowerCase();
}

function pushedAfterConvergence(pullRequest) {
  const triage = pullRequest.crossReview?.triage;
  const head = pullRequest.headRefOid;
  return triage?.outcome === 'converged' && isCompleteCommitSha(triage.sha) && isCompleteCommitSha(head) &&
    triage.sha.toLowerCase() !== head.toLowerCase();
}

function pullRequestCrossReviewSettled(pullRequest) {
  const review = pullRequest.crossReview;
  if (review?.notRequired === true) return true;
  return convergedAtHead(pullRequest);
}

function pullRequestCrossReviewWaitReason(pullRequest) {
  const review = pullRequest.crossReview;
  if (review?.notRequired === true) return null;
  if (review?.unavailable === true) return 'クロスレビューの状態を確認できない';
  if (!review) return 'クロスレビュー未実施';

  const triage = review.triage;
  if (review.round > 0 && triage?.round !== review.round) return 'クロスレビュー対応中';
  if (triage?.outcome === 'halted') return 'クロスレビューが開発者の判断待ち';
  if (triage?.outcome === 'fixing') return 'クロスレビュー対応中';
  if (pushedAfterConvergence(pullRequest)) return 'クロスレビュー後に push あり';
  return review.round > 0 ? 'クロスレビュー対応中' : 'クロスレビュー未実施';
}

function pullRequestMergeConditionWaits(pullRequest) {
  const condition = displayPreferences.mergeableCondition;
  if (condition === 'operation') return [];
  const waiting = [];
  if (pullRequest.ci !== 'pass') waiting.push((CI_LABELS[pullRequest.ci] || CI_LABELS.unknown).wait);
  if (condition === 'cross-review' && !pullRequestCrossReviewSettled(pullRequest)) {
    waiting.push(pullRequestCrossReviewWaitReason(pullRequest));
  }
  return waiting;
}

function pullRequestReservationWaitReasons(pullRequest, group = null, method = null) {
  const waiting = [];
  if (pullRequest.crossReview?.notRequired === true || !convergedAtHead(pullRequest)) {
    waiting.push(pushedAfterConvergence(pullRequest) ? '収束後に push あり。現在の head の収束待ち' : 'クロスレビューの収束待ち');
  }
  if (pullRequest.ci !== 'pass') waiting.push((CI_LABELS[pullRequest.ci] || CI_LABELS.unknown).wait);
  if (!['approved', 'none'].includes(pullRequest.review) && !['レビューの承認待ち', '変更を求められている'].includes(pullRequest.operationBlocker)) {
    waiting.push('GitHub のレビュー承認待ち');
  }
  const mergeBlocker = pullRequest.operationBlocker;
  if (mergeBlocker) waiting.push(`マージ条件待ち: ${mergeBlocker}`);
  else if (pullRequest.canMerge !== true) waiting.push('マージできる状態を確認できない');
  if (group) {
    if (group.openStateUnknown === true) waiting.push('PR の状態を確認できない');
    if (!group.defaultBranch) waiting.push('既定ブランチを確認できない');
    else if (pullRequest.baseRefName !== group.defaultBranch || pullRequest.effectiveBase !== group.defaultBranch) {
      waiting.push(`既定ブランチ ${group.defaultBranch} へのマージ待ち`);
    }
    if (!Array.isArray(group.mergeMethods) || !group.mergeMethods.length) waiting.push('リポジトリのマージ方式を確認できない');
    else if (method && !group.mergeMethods.includes(method)) waiting.push('選んだマージ方式が許可されていない');
  }
  return waiting;
}

function pullRequestReservationWaits(pullRequest, group = null, method = null) {
  const waiting = pullRequestReservationWaitReasons(pullRequest, group, method);
  return waiting.length ? waiting : ['次の状態更新でマージ'];
}

function shortShaElement(value) {
  const sha = typeof value === 'string' && value ? value : '不明な SHA';
  const code = element('code', '', sha.slice(0, 7));
  code.title = sha;
  return code;
}

function isCompleteCommitSha(value) {
  return typeof value === 'string' && /^(?:[a-fA-F0-9]{40}|[a-fA-F0-9]{64})$/.test(value);
}

// 未収束の往復状態を優先し、収束済みなら収束 SHA、それ以外の比較可能な記録なら reviewed SHA を現在の head と比べる。
function crossReviewState(pullRequest) {
  const review = pullRequest.crossReview;
  if (review === undefined) return { cls: 'mute', text: '', warn: null };
  if (review === null) return { cls: 'warn', text: 'レビュー未実施', warn: 'クロスレビューの記録が無い' };
  if (review.notRequired === true) return { cls: 'mute', text: 'レビュー不要', warn: null };
  if (review.unavailable === true) return { cls: 'warn', text: '状態を確認できない', warn: 'クロスレビューの状態を確認できない' };
  const triage = review.triage && review.triage.round <= review.round ? review.triage : null;
  if (triage && review.round > triage.round) return { cls: 'warn', text: `${review.round} 往復目の結論待ち`, warn: `クロスレビューの ${review.round} 往復目の結論がまだ出ていない` };
  if (triage && triage.outcome === 'fixing') return { cls: 'warn', text: '指摘の対応中', warn: `クロスレビューの ${triage.round} 往復目の指摘に対応している途中` };
  if (triage && triage.outcome === 'halted') return { cls: 'warn', text: '開発者の判断待ち', warn: 'クロスレビューは開発者の判断を待って止まっている' };
  if (triage && triage.outcome === 'converged') {
    if (!isCompleteCommitSha(pullRequest.headRefOid) || !isCompleteCommitSha(triage.sha)) {
      return { cls: 'mute', text: 'head を確かめられない', warn: 'head を確かめられない' };
    }
    const triageSha = triage.sha.toLowerCase();
    const headSha = pullRequest.headRefOid.toLowerCase();
    if (convergedAtHead(pullRequest)) return { cls: 'ok', text: 'レビュー済み', warn: null };
    if (!pushedAfterConvergence(pullRequest)) return { cls: 'mute', text: 'head を確かめられない', warn: 'head を確かめられない' };
    const triageShortSha = triageSha.slice(0, 7);
    return {
      cls: 'warn',
      text: `収束の後に変更あり (収束 ${triageShortSha})`,
      warn: `head ${headSha.slice(0, 7)} はクロスレビューの収束の後に変更されている (収束は ${triageShortSha})`,
    };
  }
  if (!isCompleteCommitSha(review.reviewedSha) || !isCompleteCommitSha(pullRequest.headRefOid)) {
    return { cls: 'mute', text: 'head を確かめられない', warn: 'head を確かめられない' };
  }
  const reviewedSha = review.reviewedSha.toLowerCase();
  const headSha = pullRequest.headRefOid.toLowerCase();
  if (reviewedSha !== headSha) {
    const reviewedShortSha = reviewedSha.slice(0, 7);
    return {
      cls: 'warn',
      text: `レビューの後に変更あり (レビュー済み ${reviewedShortSha})`,
      warn: `head ${headSha.slice(0, 7)} はクロスレビューの後に変更されている (レビュー済みは ${reviewedShortSha})`,
    };
  }
  return { cls: 'mute', text: 'この head をレビューに回した', warn: null };
}

function crossReviewLine(pullRequest) {
  const review = pullRequest.crossReview;
  if (review === undefined) return null;
  const state = crossReviewState(pullRequest);
  const line = element('div', 'xr');
  line.append(document.createTextNode('クロスレビュー '));
  if (!review || review.unavailable === true) {
    line.append(badge(state.text, state.cls));
    if (state.cls === 'warn') appendCrossReviewSkipControl(line, pullRequest, false);
    return line;
  }
  if (review.notRequired === true) {
    const stateBadge = badge(state.text, state.cls);
    if (review.reason) stateBadge.title = review.reason;
    line.append(stateBadge);
    if (review.source === 'recorded') appendCrossReviewSkipControl(line, pullRequest, true);
    return line;
  }
  const rounds = element('span', 'rounds');
  rounds.setAttribute('aria-hidden', 'true');
  for (let index = 0; index < review.max; index += 1) {
    rounds.append(element('span', index < review.round ? 'used' : ''));
  }
  line.append(
    rounds,
    element('span', '', `${review.round} / ${review.max} 往復、非対応 ${review.dismissed}`),
    document.createTextNode(' '),
    badge(state.text, state.cls),
  );
  // 不要の記録はレビューが要る状態(warn)でだけ意味を持つ。済みや判定できない状態で記録しても表示もマージ条件も変わらない。
  if (state.cls === 'warn') appendCrossReviewSkipControl(line, pullRequest, false);
  return line;
}

function appendCrossReviewSkipControl(target, pullRequest, skipped) {
  if (!pullRequest.mergeRecordKey || !pullRequest.headRefOid) return;
  const button = element('button', 'link-btn', skipped ? 'レビュー不要を取り消す' : 'レビュー不要にする');
  button.type = 'button';
  button.dataset.reviewSkip = skipped ? 'clear' : 'set';
  button.dataset.mergeKey = pullRequest.mergeRecordKey;
  button.disabled = pullRequestReviewSkipInFlight.has(pullRequest.mergeRecordKey);
  target.append(button);
}

function pullRequestMergeKey(pullRequest) {
  return pullRequest.mergeRecordKey || '';
}

function pullRequestMergeOptionsFor(group, pullRequest) {
  const key = pullRequestMergeKey(pullRequest);
  const methods = Array.isArray(group.mergeMethods) ? group.mergeMethods : [];
  const previous = pullRequestMergeOptions.get(key);
  const method = methods.includes(previous?.method) ? previous.method
    : methods.includes(group.lastMethod) ? group.lastMethod
      : methods[0] || '';
  return {
    method,
    deleteBranch: pullRequest.isCrossRepository || group.autoDeleteBranch === true ? false : previous?.deleteBranch ?? true,
  };
}

function appendPullRequestMergeConfirmation(target, group, pullRequest) {
  const key = pullRequestMergeKey(pullRequest);
  const options = pullRequestMergeOptionsFor(group, pullRequest);
  const waiting = pullRequestMergeConditionWaits(pullRequest);
  const conditionPending = waiting.length > 0;
  // 実行中に方式や削除の選択を変えると、送った内容と画面の表示が食い違う。
  const merging = pullRequestMergeInFlight.has(key);
  const panel = element('section', `merge-confirm ${conditionPending ? 'pending' : ''}`.trim());
  panel.dataset.mergeConfirm = key;
  panel.setAttribute('aria-label', `PR #${pullRequest.number} のマージ確認`);
  const heading = element('div');
  heading.append(element('strong', '', `#${pullRequest.number}`), document.createTextNode(` を `), element('code', '', group.defaultBranch || ''), document.createTextNode(' へマージする'));
  panel.append(heading);
  if (waiting.length) {
    const warning = element('p', 'merge-condition-warning', `選択した条件の未達: ${waiting.join('、')}`);
    warning.setAttribute('role', 'status');
    panel.append(warning);
  }

  const methods = element('div', 'methods');
  methods.setAttribute('role', 'radiogroup');
  methods.setAttribute('aria-label', 'マージの方式');
  for (const method of group.mergeMethods || []) {
    const label = element('label');
    const input = element('input');
    input.type = 'radio';
    input.name = `merge-${key}`;
    input.value = method;
    input.checked = options.method === method;
    input.disabled = merging;
    input.dataset.mergeMethod = method;
    input.dataset.mergeKey = key;
    label.append(input, document.createTextNode(MERGE_METHOD_LABELS[method] || method));
    methods.append(label);
  }
  if ((group.mergeMethods || []).length === 1) methods.append(element('span', 'meta', 'リポジトリで許可されている方式です'));
  panel.append(methods);

  if (group.autoDeleteBranch !== true) {
    const branchChoice = element('label', 'opt');
    const deleteBranch = element('input');
    deleteBranch.type = 'checkbox';
    deleteBranch.checked = pullRequest.isCrossRepository ? false : options.deleteBranch;
    deleteBranch.disabled = pullRequest.isCrossRepository === true || merging;
    deleteBranch.dataset.mergeDelete = 'true';
    deleteBranch.dataset.mergeKey = key;
    branchChoice.append(deleteBranch, document.createTextNode('マージ後にリモートブランチを削除する'));
    if (pullRequest.isCrossRepository) branchChoice.append(element('span', 'meta', 'fork のブランチは登録先から削除できません'));
    panel.append(branchChoice);
  }

  const effects = element('ul', 'effects');
  const review = crossReviewState(pullRequest);
  const childNumbers = (pullRequest.children || []).map((child) => `#${child.number}`).join('、');
  const branchDeleted = !pullRequest.isCrossRepository && (group.autoDeleteBranch === true || options.deleteBranch);
  const effectItems = [
    review.warn ? { text: review.warn, warn: true } : null,
    { headSha: true },
    pullRequest.isCrossRepository ? { text: 'fork の head ブランチは登録先リポジトリから削除しない。', warn: true } : null,
    childNumbers ? { text: branchDeleted
      ? `${childNumbers} の base を ${group.defaultBranch} に付け替える`
      : `ブランチを残すので、${childNumbers} の base は ${pullRequest.headRefName} のまま付け替えない` } : null,
    childNumbers && !branchDeleted && ['squash', 'rebase'].includes(options.method)
      ? { text: `次に ${pullRequest.headRefName} を既定ブランチへマージするときは、同じ変更が再び差分に入らないようマージコミットを推奨します。`, warn: true } : null,
    childNumbers && branchDeleted && ['squash', 'rebase'].includes(options.method)
      ? { text: `スカッシュまたはリベースでは ${childNumbers} に #${pullRequest.number} のコミットが残るため、セッションに積み直しを依頼する。`, warn: true } : null,
  ].filter(Boolean);
  for (const effect of effectItems) {
    if (effect.headSha) {
      const item = element('li');
      item.append(document.createTextNode('照合する head SHA: '));
      item.append(shortShaElement(pullRequest.headRefOid));
      effects.append(item);
    } else {
      effects.append(element('li', effect.warn ? 'warn' : '', effect.text));
    }
  }
  panel.append(effects);

  const row = element('div', 'row');
  const go =element('button', `merge-go ${conditionPending ? 'outline' : ''}`.trim(), merging ? '処理中…' : 'マージを実行');
  go.type = 'button';
  go.dataset.mergeGo = key;
  go.dataset.mergeKey = key;
  go.disabled = pullRequestMergeInFlight.has(key) || !(group.mergeMethods || []).length;
  const cancel = element('button', 'ghost', 'やめる');
  cancel.type = 'button';
  cancel.disabled = merging;
  cancel.dataset.mergeCancel = key;
  cancel.dataset.mergeKey = key;
  row.append(go, cancel);
  panel.append(row);
  target.append(panel);
}

function pullRequestConflictUiKey(group, pullRequest) {
  return `${group.owner.toLowerCase()}/${group.repo.toLowerCase()}#${pullRequest.number}`;
}

function pullRequestConflictSessionNames(sessionIds) {
  const sessions = Array.isArray(lastState?.sessions) ? lastState.sessions : [];
  return [...new Set((Array.isArray(sessionIds) ? sessionIds : []).map((sessionId) => {
    const session = sessions.find((item) => item.session_id === sessionId);
    return session?.title || session?.session_id || sessionId;
  }))];
}

function pullRequestConflictTargetNames(pullRequest, aliveOnly = false) {
  return pullRequestConflictSessionNames((pullRequest.conflictRequestTargets || [])
    .filter((target) => !aliveOnly || target.alive)
    .map((target) => target.sessionId));
}

function appendPullRequestConflictConfirmation(target, group, pullRequest, uiKey) {
  const panel = element('section', 'merge-confirm conflict');
  panel.dataset.conflictConfirm = uiKey;
  panel.setAttribute('aria-label', `PR #${pullRequest.number} の衝突解消依頼の確認`);
  const heading = element('div');
  heading.append(element('strong', '', `#${pullRequest.number}`), document.createTextNode(' の衝突の解消を依頼する'));
  panel.append(heading);

  const names = pullRequestConflictTargetNames(pullRequest, true);
  const effects = element('ul', 'effects');
  const targetInstruction = element('li');
  targetInstruction.append(document.createTextNode(`${names.length ? `${names.join('、')} のセッション` : 'PR を登録したセッション'}に、base の `));
  targetInstruction.append(element('code', '', pullRequest.effectiveBase || pullRequest.baseRefName || group.defaultBranch || ''));
  targetInstruction.append(document.createTextNode(' を取り込んで衝突を解消し、push するよう依頼する'));
  effects.append(targetInstruction);
  effects.append(element('li', '', 'セッションにはマージしないよう伝える。解消した後に、このカードからマージする'));
  const headEffect = element('li');
  headEffect.append(document.createTextNode('head が '), shortShaElement(pullRequest.headRefOid), document.createTextNode(' から変わると、依頼済みの表示を消す'));
  effects.append(headEffect);
  panel.append(effects);

  const row = element('div', 'row');
  const go = element('button', 'merge-go conflict-go', '依頼を送る');
  go.type = 'button';
  go.dataset.conflictGo = uiKey;
  go.disabled = !names.length || !pullRequest.conflictRequestKey || pullRequestConflictInFlight.has(uiKey);
  const cancel = element('button', 'ghost', 'やめる');
  cancel.type = 'button';
  cancel.dataset.conflictCancel = uiKey;
  cancel.disabled = pullRequestConflictInFlight.has(uiKey);
  row.append(go, cancel);
  panel.append(row);
  target.append(panel);
}

function appendPullRequestConflictControls(actions, text, details, group, pullRequest) {
  if (!pullRequest.conflict) return;
  const uiKey = pullRequestConflictUiKey(group, pullRequest);
  const names = pullRequestConflictTargetNames(pullRequest, true);
