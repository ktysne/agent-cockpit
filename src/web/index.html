<title>Agent Cockpit</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --border: #dfe2e8;
  --text: #1d2129;
  --text-2: #5b6372;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --warn: #b35c00;
  --warn-soft: #fff1df;
  --danger: #c92a2a;
  --danger-soft: #ffe8e8;
  --ok: #2b8a3e;
  --ok-soft: #e3f6e8;
  --hold: #6741d9;
  --hold-soft: #efe9ff;
  --on-accent: #ffffff;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
    --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
    --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
    --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
  --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
  --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
  --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
.top { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--border); }
.top[data-away="true"] { background: var(--warn-soft); border-bottom-color: var(--warn); }
.top-inner { position: relative; max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
/* 設定のボタンは右上に重ねて置くので、その分の余白はタイトルの行だけに取り、2 行目からは全幅を使う。 */
.top h1 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 0; }
.title-row { flex: 1 1 100%; display: flex; align-items: center; gap: 8px 12px; min-height: 40px; padding-right: 48px; }
.title-row .away-toggle { margin-left: auto; }
.mode-row { margin: 0 0 12px; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.chip strong { color: var(--text); font-size: 13px; margin-left: 4px; }
.chip.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.hold { background: var(--hold-soft); border-color: transparent; color: var(--hold); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.meta { color: var(--text-2); font-size: 12px; }
#connection-note { color: var(--danger); }
.settings-button, .settings-dialog button, .settings-dialog select { min-height: 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
.settings-button { position: absolute; top: 10px; right: 16px; display: inline-flex; align-items: center; justify-content: center; width: 40px; min-height: 40px; padding: 0; cursor: pointer; color: var(--text-2); }
.settings-button:hover { color: var(--text); }
.ended-toggle { margin-top: 6px; min-height: 32px; padding: 2px 10px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; color: var(--text-2); font: inherit; font-size: 12px; cursor: pointer; }
.ended-toggle:hover { color: var(--text); }
.ended-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.away-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
.away-toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--warn); }
.away-toggle:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.settings-button:focus-visible, .settings-dialog button:focus-visible, .settings-dialog select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      order: Array.isArray(value.order) ? value.order.filter((item) => typeof item === 'string') : [],
      pinned: Array.isArray(value.pinned) ? value.pinned.filter((item) => typeof item === 'string') : [],
      collapsed: Array.isArray(value.collapsed) ? value.collapsed.filter((item) => typeof item === 'string') : [],
      hidden: Array.isArray(value.hidden) ? value.hidden.filter((item) => FILTERS.some((filter) => filter.key === item)) : [],
    };
  } catch {
    return { mode: 'product', order: [], pinned: [], collapsed: [], hidden: [] };
  }
}

let displayPreferences = readDisplayPreferences();

function saveDisplayPreferences() {
  try {
    localStorage.setItem(DISPLAY_STORAGE_KEY, JSON.stringify(displayPreferences));
  } catch {
  }
}

document.querySelectorAll('[data-action="mode"]').forEach((button) => {

function applyTheme(theme) {
  const selectedTheme = ['light', 'dark', 'system'].includes(theme) ? theme : 'dark';
  if (selectedTheme === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = selectedTheme;
  themeSelect.value = selectedTheme;
  return selectedTheme;
}

function storedTheme() {
  try {
    const theme = localStorage.getItem(THEME_STORAGE_KEY);
    if (['light', 'dark', 'system'].includes(theme)) return theme;
  } catch {
  }
  return 'dark';
}

applyTheme(storedTheme());
themeSelect.addEventListener('change', () => {
  const theme = applyTheme(themeSelect.value);
  try {
    localStorage.setItem(THEME_STORAGE_KEY, theme);
  } catch {
  }
});

settingsButton.addEventListener('click', () => settingsDialog.showModal());
settingsClose.addEventListener('click', () => settingsDialog.close());
settingsDialog.addEventListener('click', (event) => {
  // 内側の余白を押しても target はダイアログ自身になるので、位置で背景かを判定する。
  const box = settingsDialog.getBoundingClientRect();
  const isOutside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
  if (event.target === settingsDialog && isOutside) settingsDialog.close();
});
settingsDialog.addEventListener('close', () => settingsButton.focus());

function applyAwayState(away) {
  const enabled = away?.enabled === true;
  if (!awayToggle.disabled) awayToggle.checked = enabled;
  header.dataset.away = String(enabled);
}

function updateConnectionNote() {
  if (connectionLost) {
    const time = `${String(lastStateAt.getHours()).padStart(2, '0')}:${String(lastStateAt.getMinutes()).padStart(2, '0')}`;
    connectionNote.textContent = `常駐サーバーに接続できません。表示は ${time} 時点のものです。`;
    connectionNote.hidden = false;
  } else if (Date.now() < writeErrorUntil) {
    connectionNote.textContent = writeErrorMessage;
    connectionNote.hidden = false;
  } else {
    connectionNote.textContent = '';
    connectionNote.hidden = true;
  }
}

function showWriteError(message) {
  writeErrorMessage = message;
  writeErrorUntil = Date.now() + 10_000;
  clearTimeout(writeErrorTimer);
  writeErrorTimer = setTimeout(updateConnectionNote, 10_000);
  updateConnectionNote();
}

async function postUiAction(url, body) {
  const send = () => fetch(url, {
    method: 'POST',
    cache: 'no-store',
    headers: {
      'Content-Type': 'application/json',
      'X-Cockpit-Secret': document.querySelector('meta[name="cockpit-secret"]').content,
    },
    body: JSON.stringify(body),
  });
  let response = await send();
  if (response.status === 401) {
    await refreshUiSecret();
    response = await send();
  }
  return response;
}

function postAway(enabled) {
  return postUiAction('/api/away', { enabled });
}

async function refreshUiSecret() {
  const response = await fetch('/', { cache: 'no-store' });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const page = new DOMParser().parseFromString(await response.text(), 'text/html');
  const secret = page.querySelector('meta[name="cockpit-secret"]')?.content;
  if (!secret) throw new Error('secret unavailable');
  document.querySelector('meta[name="cockpit-secret"]').content = secret;
}

awayToggle.addEventListener('change', async () => {
  const requested = awayToggle.checked;
  const previous = lastState?.away?.enabled === true;
  awayToggle.disabled = true;
  try {
    const response = await postAway(requested);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const away = await response.json();
    applyAwayState(away);
    liveStatus.textContent = '離席状態を更新しました。';
  } catch {
    awayToggle.checked = previous;
    applyAwayState({ enabled: previous });
    liveStatus.textContent = '離席中を切り替えられませんでした';
    showWriteError('離席中を切り替えられませんでした');
  } finally {
    awayToggle.disabled = false;
  }
});

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function badge(text, className = '') {
  return element('span', `badge ${className}`.trim(), text);
}

function durationLabel(startedAt, now = Date.now()) {
  const start = Date.parse(startedAt);
  if (!Number.isFinite(start)) return '時刻不明';
  const minutes = Math.max(0, Math.floor((now - start) / 60_000));
  if (minutes < 1) return '1 分以内';
  if (minutes < 60) return `${minutes} 分`;
  const hours = Math.floor(minutes / 60);
  const remainder = minutes % 60;
  return remainder ? `${hours} 時間 ${remainder} 分` : `${hours} 時間`;
}

function durationAgoLabel(startedAt, now = Date.now()) {
  const label = durationLabel(startedAt, now);
  return ['時刻不明', '1 分以内'].includes(label) ? label : `${label}前`;
}

function appendToolLine(target, tool) {
  if (!tool) return;
  const line = element('div', 'tool-line');
  if (tool.tool_name) line.append(badge(tool.tool_name, 'tool-name'));
  if (tool.summary && tool.summary !== tool.tool_name) line.append(element('span', 'tool-content', tool.summary));
  target.append(line);
}

function appendModelLine(target, agent) {
  const claudeModel = !agent.isCodex && agent.model ? (agent.modelName || agent.model) : '';
  const gpt = agent.isCodex
    ? { model: agent.model, effort: agent.effort, codex_home: agent.codex_home, unavailable: agent.unavailable }
    : agent.gpt;
  if (!claudeModel && !(gpt?.model || gpt?.unavailable)) return;

  const models = element('div', 'models');
  if (claudeModel) {
    const claude = element('span', 'model claude', `Claude ${claudeModel}`);
    if (agent.effort) claude.append(element('i', '', `effort ${agent.effort}`));
    models.append(claude);
  }
  if (gpt?.model || gpt?.unavailable) {
    if (claudeModel) models.append(element('span', 'arrow', '→'));
    const gptLabel = gpt.unavailable ? 'GPT 不使用' : `GPT ${gpt.model}`;
    const gptBadge = element('span', `model ${gpt.unavailable ? 'off' : 'gpt'}`, gptLabel);
    if (gpt.unavailable) gptBadge.append(element('i', '', gpt.unavailable));
    else if (gpt.effort) gptBadge.append(element('i', '', `effort ${gpt.effort}`));
    if (gpt.codex_home) gptBadge.title = gpt.codex_home;
    models.append(gptBadge);
  }
  target.append(models);
}

function updateTitle(sessions) {
  const permissionCount = sessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  const decisionCount = sessions.reduce((total, session) => total + session.decisions.filter(isPendingDecision).length, 0);
  const pendingCount = permissionCount + decisionCount;
  document.title = pendingCount ? `(${pendingCount}) Agent Cockpit` : 'Agent Cockpit';
}

function isPendingDecision(decision) {
  return decision.state === 'waiting' && !hasEffectiveAnswer(decision);
}

function isHeldDecision(decision) {
  return ['waiting', 'provisional'].includes(decision.state) && decision.answer?.choice === 'hold' && !decision.answer.ignoredAt;
}

function renderSummary(sessions) {
  const permissionCount = sessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  const decisions = sessions.flatMap((session) => session.decisions);
  const blockingCount = decisions.filter(isPendingDecision).length;
  const provisionalCount = decisions.filter((decision) => decision.state === 'provisional' && !hasEffectiveAnswer(decision)).length;
  const heldCount = decisions.filter(isHeldDecision).length;
  const agentCount = sessions.reduce((total, session) => total + session.agents.filter((agent) => agent.active).length, 0);
  const counts = { permission: permissionCount, blocking: blockingCount, provisional: provisionalCount, held: heldCount, agents: agentCount };
  summary.replaceChildren(...FILTERS.map(({ key, label, color }) => {
    const button = element('button', `chip ${color}`.trim());
    button.type = 'button';
    button.dataset.filter = key;
    button.setAttribute('aria-pressed', String(!displayPreferences.hidden.includes(key)));
    button.title = displayPreferences.hidden.includes(key) ? '押すと表示に戻す' : '押すと非表示にする';
    button.append(document.createTextNode(`${label} `), element('strong', '', String(counts[key])));
    return button;
  }));

  const hiddenKinds = FILTERS.filter(({ key }) => displayPreferences.hidden.includes(key));
  const hiddenCount = hiddenKinds.reduce((total, { key }) => total + counts[key], 0);
  const note = document.getElementById('filter-note');
  note.hidden = hiddenKinds.length === 0;
  if (hiddenKinds.length) {
    const showAll = element('button', 'link-btn', 'すべて表示する');
    showAll.type = 'button';
    showAll.dataset.showAll = 'true';
    showAll.addEventListener('click', () => {
      displayPreferences.hidden = [];
      saveDisplayPreferences();
      render(lastState);
    });
    note.replaceChildren(
      element('span', '', `非表示: ${hiddenKinds.map(({ label }) => label).join('、')}(${hiddenCount} 件)`),
      showAll,
    );
  } else {
    note.replaceChildren();
  }
}

function renderExcludedNote(sessions) {
  const note = document.getElementById('excluded-note');
  const hiddenSessions = sessions.filter((session) => session.hidden === true);
  const hiddenCount = hiddenSessions.length;
  note.hidden = hiddenCount === 0;
  if (!hiddenCount) {
    note.replaceChildren();
    return;
  }
  const showAll = element('button', 'link-btn', 'すべて表示する');
  showAll.type = 'button';
  showAll.dataset.clearHiddenSessions = 'true';
  const permissionCount = hiddenSessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  const decisionCount = hiddenSessions.reduce((total, session) => total + session.decisions.filter(isPendingDecision).length, 0);
  const pendingCounts = [
    permissionCount ? `許可待ち ${permissionCount} 件` : '',
    decisionCount ? `止めて待っている ${decisionCount} 件` : '',
  ].filter(Boolean);
  const countNote = pendingCounts.length ? `(うち${pendingCounts.join('、')})` : '';
  note.replaceChildren(element('span', '', `外したセッション ${hiddenCount} 件${countNote}`), showAll);
}

function isFilterShown(key) {
  return !displayPreferences.hidden.includes(key);
}

function hasEffectiveAnswer(decision) {
  return Boolean(decision.answer?.sentAt && !decision.answer.ignoredAt);
}

function shownPermissions(session) {
  return isFilterShown('permission') ? session.permissionWaits : [];
}

function shownActiveDecisions(session) {
  return session.decisions.filter((decision) => {
    if (!['waiting', 'provisional'].includes(decision.state)) return false;
    if (decision.answer?.choice === 'hold' && !decision.answer.ignoredAt) return isFilterShown('held');
    if (hasEffectiveAnswer(decision)) return true;
    return decision.state === 'waiting' ? isFilterShown('blocking') : isFilterShown('provisional');
  });
}

function hasHiddenJudgmentItems(session) {
  return (!isFilterShown('permission') && session.permissionWaits.length > 0)
    || session.decisions.some((decision) => (
      ['waiting', 'provisional'].includes(decision.state) && !shownActiveDecisions(session).includes(decision)
    ));
}

function productGroups(sessions) {
  const groups = new Map();
  for (const session of sessions) {
    const product = session.product || {};
    const key = product.key || product.name || 'product-unknown';
    let group = groups.get(key);
    if (!group) {
      group = { key, name: product.name || 'プロダクト不明', branches: new Set(), sessions: [] };
      groups.set(key, group);
    }
    if (product.branch) group.branches.add(product.branch);
    group.sessions.push(session);
  }
  return [...groups.values()];
}

function sessionActivityTime(session) {
  const mainTool = session.tools.filter((tool) => !tool.agent_id).reduce((latest, tool) => {
    const time = Date.parse(tool.startedAt);
    return Number.isFinite(time) ? Math.max(latest, time) : latest;
  }, -Infinity);
  const lastActivity = Date.parse(session.lastActivityAt);
  return Math.max(mainTool, Number.isFinite(lastActivity) ? lastActivity : -Infinity);
}

function orderedProducts(sessions) {
  const products = productGroups(sessions);
  const ids = products.map((product) => product.key);
  const visibleKeys = new Set(ids);
  const nextOrder = [...displayPreferences.order];
  for (const key of ids) if (!nextOrder.includes(key)) nextOrder.push(key);
  if (nextOrder.length > 200) {
    let excess = nextOrder.length - 200;
    const retained = nextOrder.filter((key) => {
      if (excess > 0 && !visibleKeys.has(key)) {
        excess -= 1;
        return false;
      }
      return true;
    });
    nextOrder.length = 0;
    for (const key of retained) nextOrder.push(key);
  }
  if (nextOrder.length !== displayPreferences.order.length || nextOrder.some((key, index) => key !== displayPreferences.order[index])) {
    displayPreferences.order = nextOrder;
    saveDisplayPreferences();
  }
  const orderIndex = new Map(nextOrder.map((key, index) => [key, index]));
  return products
    .map((product) => ({
      ...product,
      sessions: [...product.sessions].sort((left, right) => sessionActivityTime(right) - sessionActivityTime(left)),
    }))
    .sort((left, right) => {
      const leftPinned = displayPreferences.pinned.includes(left.key);
      const rightPinned = displayPreferences.pinned.includes(right.key);
      if (leftPinned !== rightPinned) return leftPinned ? -1 : 1;
      return orderIndex.get(left.key) - orderIndex.get(right.key);
    });
}

function activityStatus(session) {
  if (session.status === '作業中') return { label: '作業中', tone: 'busy' };
  if (session.status === '不明') return { label: '状態不明', tone: 'unknown' };
  return { label: '待機中', tone: 'wait' };
}

function mainRow(session, product, withTags = false, multipleSessions = false) {
  const status = activityStatus(session);
  const mainTool = newestFirst(session.tools.filter((tool) => !tool.agent_id))[0];
  const doingTask = session.tasks.find((task) => task.state === 'doing');
  const row = element('div', 'now-row main-row');
  const who = element('div', 'who');
  who.append(element('span', `dot ${status.tone}`), document.createTextNode('メイン'));
  appendContextTags(who, product, session, withTags, multipleSessions);
  who.append(element('strong', '', status.label));
  const detail = element('div', 'detail');
  if (doingTask) detail.append(element('div', 'activity-title', doingTask.title));
  if (mainTool) appendToolLine(detail, mainTool);
  const elapsedAt = mainTool?.startedAt || session.lastActivityAt;
  const elapsed = element('time', 'since', durationAgoLabel(elapsedAt));
  row.append(who, detail, elapsed);
  return row;
}

function appendAgents(body, session, product, withTags = false, multipleSessions = false) {
  if (!session.agents.length) {
    if (!isFilterShown('agents')) return;
    body.append(element('h3', 'sub', 'サブエージェント'));
    body.append(element('div', 'empty', 'サブエージェントはありません。'));
    return;
  }
  const agents = newestFirst(session.agents);
  const runningAgents = agents.filter((agent) => !isEndedAgent(agent) && (!agent.active || isFilterShown('agents')));
  const endedAgents = agents.filter(isEndedAgent);
  const showEnded = expandedEndedSessions.has(session.session_id);
  const visibleAgents = showEnded ? [...runningAgents, ...endedAgents] : runningAgents;
  const hiddenRunningAgents = agents.some((agent) => agent.active && !isFilterShown('agents'));
  if (!visibleAgents.length && !endedAgents.length && !isFilterShown('agents')) return;
  body.append(element('h3', 'sub', 'サブエージェント'));
  if (!visibleAgents.length && !hiddenRunningAgents) body.append(element('div', 'empty', '稼働中のサブエージェントはありません。'));
  const list = element('div', 'agent-list');
  for (const agent of visibleAgents) {
    const row = element('div', 'agent-row');
    row.dataset.startedAt = agent.startedAt || '';
    const who = element('div', 'who');
    const agentState = agent.active ? ['稼働中', 'busy'] : agent.unconfirmed ? ['終了未確認', 'wait'] : ['終了', 'done'];
    who.append(element('span', `dot ${agent.unconfirmed ? 'wait' : agentState[1]}`));
    appendContextTags(who, product, session, withTags, multipleSessions);
    const name = element('span', 'agent-name');
    name.append(badge(agentState[0], agentState[1]), element('strong', '', agent.agent_type || agent.agent_id));
    who.append(name);
    const detail = element('div', 'detail');
    if (agent.description) detail.append(element('div', 'agent-description', agent.description));
    else if (agent.lastTool) appendToolLine(detail, agent.lastTool);
    appendModelLine(detail, agent);
    row.append(who, detail, element('time', 'since', agent.startedAt ? durationLabel(agent.startedAt) : ''));
    list.append(row);
  }
  if (visibleAgents.length) body.append(list);
  if (endedAgents.length) {
    const toggle = element('button', 'ended-toggle', showEnded ? `終了済みを隠す(${endedAgents.length} 件)` : `終了済みを表示(${endedAgents.length} 件)`);
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(showEnded));
    toggle.addEventListener('click', () => {
      if (showEnded) expandedEndedSessions.delete(session.session_id);
      else expandedEndedSessions.add(session.session_id);
      if (lastState) render(lastState);
      root.querySelector(`[data-ended-toggle="${CSS.escape(session.session_id)}"]`)?.focus({ preventScroll: true });
    });
    toggle.dataset.endedToggle = session.session_id;
    body.append(toggle);
  }
}

// 「終了未確認」はまだ動いている可能性があるので、終了済みに含めない。
function isEndedAgent(agent) {
  return !agent.active && !agent.unconfirmed;
}

function newestFirst(items) {
  const timestampOf = (item) => {
    const time = Date.parse(item.createdAt || item.startedAt || item.updatedAt);
    return Number.isFinite(time) ? time : -Infinity;
  };
  return [...items].sort((a, b) => timestampOf(b) - timestampOf(a));
}

function appendContextTags(target, product, session, withTags, multipleSessions) {
  if (!withTags) return;
  target.append(element('span', 'prod-tag', product.name));
  if (multipleSessions) target.append(element('span', 'session-tag', session.title || session.session_id));
}

function appendPermissionWaits(body, session, product, withTags = false, multipleSessions = false) {
  const waits = shownPermissions(session);
  if (!waits.length) return;
  const list = element('div', 'permission-list');
  for (const wait of newestFirst(waits)) {
    const age = Date.now() - Date.parse(wait.startedAt);
    const minutes = Number.isFinite(age) ? Math.max(0, Math.floor(age / 60_000)) : null;
    const isLong = Number.isFinite(age) && age > LONG_WAIT_MS;
    const card = element('article', `permission ${age > LONG_WAIT_MS ? 'long-wait' : ''}`.trim());
    const header = element('div', 'permission-head');
    appendContextTags(header, product, session, withTags, multipleSessions);
    const agent = session.agents.find((item) => item.agent_id === wait.agent_id);
    const who = wait.agent_id ? (agent?.agent_type || 'サブエージェント') : 'メイン';
    header.append(element('strong', '', `${who}がツールの実行許可を待っている`));
    header.append(badge('許可待ち', 'permission-chip'));
    header.append(element('span', `wait ${isLong ? 'stale' : ''}`.trim(), minutes === null ? '時刻不明' : `${minutes} 分待機中`));
    card.append(header);
    if (wait.tool_name || wait.summary) {
      const context = element('div', 'decision-context permission-tool');
      if (wait.tool_name) context.append(document.createTextNode(wait.tool_name));
      if (wait.summary && wait.summary !== wait.tool_name) {
        context.append(document.createTextNode(wait.tool_name ? ': ' : ''));
        context.append(element('code', '', wait.summary));
      }
      card.append(context);
    }
    card.append(element('div', 'meta', `許可はデスクトップアプリの ${product.name} のセッションで出す。ダッシュボードからは出せない。`));
    list.append(card);
  }
  body.append(list);
}

function decisionStateLabel(state) {
  return {
    waiting: '止めて待っている',
    provisional: '推奨で仮に進行中',
    resolved: '解決済み',
    withdrawn: '取り下げ',
  }[state] || state;
}

function answerDraftFor(decision, session) {
  const key = `${session.session_id}\0${decision.id}`;
  const saved = answerDrafts.get(key);
  return saved || { choice: decision.answer?.choice ?? null, note: decision.answer?.note || '' };
}

function displayRecommendedLabel(label) {
  return label.replace(/(?:\(推奨\)|（推奨）|\(recommended\)|（recommended）)/ig, '').replace(/\s+/g, ' ').trim();
}

function answerTimeLabel(value) {
  const date = new Date(value);
  if (!Number.isFinite(date.getTime())) return '';
  return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function answerStatusText(answer) {
  if (!answer?.sentAt) return '未送信';
  const label = answer.choice === 'ok' ? '推奨案で OK' : answer.choice === 'hold' ? '判断を保留' : '指示のみ';
  const status = [`${answerTimeLabel(answer.sentAt)} に送信済み: ${label}${answer.note ? '(指示あり)' : ''}`];
  if (answer.deliveredAt) status.push(`${answerTimeLabel(answer.deliveredAt)} に渡した`);
  if (answer.reflectedAt) status.push(`${answerTimeLabel(answer.reflectedAt)} に反映された`);
  return status.join('、');
}

function appendDecisionAnswer(card, decision, product, session) {
  const questions = decision.questions || [];
  const duplicateQuestions = new Set(questions.map((question) => question.question)).size !== questions.length;
  const waitingForAnswer = decision.state === 'waiting' && Boolean(decision.awaitingAnswerUntil);
  const hasSentAnswer = Boolean(decision.answer?.sentAt);
  const active = decision.state === 'provisional' || waitingForAnswer || (decision.state === 'waiting' && hasSentAnswer);
  const viaDialog = duplicateQuestions || (decision.state === 'waiting' && !waitingForAnswer && !hasSentAnswer);
  if (viaDialog) {
    card.append(element('div', 'meta dialog-note', `質問はデスクトップアプリの ${product.name} のセッションで答える。`));
    return;
  }
  if (!active) {
    if (decision.answer?.sentAt) card.append(element('div', 'answer-status', answerStatusText(decision.answer)));
    return;
  }

  const answer = decision.answer;
  const draft = answerDraftFor(decision, session);
  const originalChoice = answer?.choice ?? null;
  const originalNote = answer?.note || '';
  const dirty = !answer?.sentAt || draft.choice !== originalChoice || draft.note !== originalNote;
  const recommendations = questions.map((question) => {
    if (question.multiSelect) return null;
    const options = question.options.filter((option) => option.recommended === true);
    return options.length === 1 ? options[0] : null;
  });
  const canUseRecommendation = recommendations.length > 0 && recommendations.every(Boolean);
  const answerBox = element('div', 'decision-answer');
  answerBox.dataset.decisionId = decision.id;
  answerBox.dataset.sessionId = session.session_id;
  const choices = element('div', 'answer-choices');
  for (const [choice, label, disabled] of [
    ['ok', '推奨案で OK', !canUseRecommendation],
    ['hold', '判断を保留する', false],
  ]) {
    const control = document.createElement('label');
    control.className = `answer-choice ${choice}`;
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.dataset.answerChoice = choice;
    checkbox.dataset.sessionId = session.session_id;
    checkbox.dataset.decisionId = decision.id;
    checkbox.checked = draft.choice === choice;
    checkbox.disabled = disabled;
    control.append(checkbox, document.createTextNode(label));
    choices.append(control);
  }
  answerBox.append(choices);
  const optionNames = recommendations.map((option) => option && displayRecommendedLabel(option.label)).filter(Boolean);
  answerBox.append(element('div', 'meta', canUseRecommendation
    ? `OK で送る答え: ${optionNames.join('、')}`
    : '推奨の無い質問があるので、指示の欄に答えを書く'));
  const note = document.createElement('textarea');
  note.dataset.answerNote = 'true';
  note.dataset.sessionId = session.session_id;
  note.dataset.decisionId = decision.id;
  note.maxLength = 2000;
  note.setAttribute('aria-label', '指示');
  note.placeholder = '指示があれば書く(例: 2 番目の案で。理由は…)';
  note.value = draft.note;
  answerBox.append(note);
  const foot = element('div', 'answer-foot');
  const send = element('button', 'primary', '回答を送る');
  send.type = 'button';
  send.dataset.sendAnswer = decision.id;
  send.dataset.sessionId = session.session_id;
  send.disabled = (!draft.choice && !draft.note.trim()) || !dirty;
  foot.append(send, element('span', 'answer-status', answerStatusText(answer)));
  const error = element('div', 'answer-error');
  error.setAttribute('role', 'alert');
  answerBox.append(foot, error);
  card.append(answerBox);
}

function appendDecisionCard(list, decision, product, session, withTags = false, multipleSessions = false) {
  const age = Date.now() - Date.parse(decision.createdAt);
  const longWait = decision.state === 'waiting' && age > LONG_WAIT_MS && !hasEffectiveAnswer(decision);
  const card = element('article', `decision-card ${decision.state} ${longWait ? 'long-wait' : ''}`.trim());
  const header = element('div', 'decision-head');
  appendContextTags(header, product, session, withTags, multipleSessions);
  header.append(
    element('span', 'decision-title', decision.title),
    badge(decisionStateLabel(decision.state), decision.state === 'waiting' ? 'permission' : decision.state === 'provisional' ? 'wait' : decision.state === 'resolved' ? 'done' : ''),
  );
  const elapsed = decision.state === 'waiting'
    ? `待ち時間 ${durationLabel(decision.createdAt)}`
    : decision.state === 'provisional'
      ? `仮適用から ${durationLabel(decision.updatedAt)}`
      : `更新 ${durationLabel(decision.updatedAt)}`;
  header.append(element('time', 'since', elapsed));
  if (decision.state === 'waiting' && decision.awaitingAnswerUntil) {
    const remaining = Math.max(0, Math.ceil((Date.parse(decision.awaitingAnswerUntil) - Date.now()) / 60_000));
    header.append(element('span', 'wait awaiting-min', `あと ${remaining} 分で推奨に進む`));
  }
  // id はモデルが cockpit_update_decision で使う値なので、本文に出さずマウスを重ねたときだけ出す。
  card.title = `id: ${decision.id}`;
  card.append(header);
  if (decision.context) card.append(element('p', 'decision-context', decision.context));

  for (const question of decision.questions || []) {
    const questionBox = element('section', 'decision-question');
    if (question.header) questionBox.append(element('div', 'meta', question.header));
    if (question.question !== decision.title) questionBox.append(element('div', 'decision-question-title', question.question));
    if (question.multiSelect) questionBox.append(element('div', 'meta', '複数選択できます。'));
    if (question.options?.length) {
      const options = element('ul', 'decision-options');
      for (const option of question.options) {
        const row = element('li', `decision-option ${option.recommended ? 'recommended' : ''}`.trim());
        const label = option.recommended ? displayRecommendedLabel(option.label) : option.label;
        row.append(element('span', '', label));
        if (option.recommended) row.append(badge('推奨', 'busy'));
        if (option.description) row.append(element('span', 'decision-option-description', option.description));
        options.append(row);
      }
      questionBox.append(options);
    }
    card.append(questionBox);
  }

  if (decision.resolution) {
    const choices = Array.isArray(decision.resolution.chosen)
      ? decision.resolution.chosen.join('、')
      : decision.resolution.chosen;
    if (choices) card.append(element('div', 'meta', `選択: ${choices}`));
    if (decision.resolution.note) card.append(element('div', 'meta', decision.resolution.note));
  }
  appendDecisionAnswer(card, decision, product, session);
  list.append(card);
}

function appendPlanToggle(body, kind, sessionId, expanded, count, label, expandedSet) {
  const key = `${kind}:${sessionId}`;
  const toggle = element('button', 'ended-toggle', `${expanded ? `${label}を隠す` : `${label}を表示`}(${count} 件)`);
  toggle.type = 'button';
  toggle.setAttribute('aria-expanded', String(expanded));
  toggle.dataset.planToggle = key;
  toggle.addEventListener('click', () => {
    if (expanded) expandedSet.delete(sessionId);
    else expandedSet.add(sessionId);
    if (lastState) render(lastState);
    [...root.querySelectorAll('[data-plan-toggle]')].find((button) => button.dataset.planToggle === key)?.focus({ preventScroll: true });
  });
  body.append(toggle);
}

function appendDecisions(body, session, product, withTags = false, multipleSessions = false) {
  const decisions = newestFirst(session.decisions);
  const active = newestFirst(shownActiveDecisions(session));
  const ended = decisions.filter((decision) => ['resolved', 'withdrawn'].includes(decision.state));
  const expanded = expandedEndedDecisions.has(session.session_id);
  const visible = expanded ? newestFirst([...active, ...ended]) : active;
  if (visible.length) {
    const list = element('div', 'decision-list');
    for (const decision of visible) appendDecisionCard(list, decision, product, session, withTags, multipleSessions);
    body.append(list);
  } else if (!shownPermissions(session).length && !hasHiddenJudgmentItems(session)) body.append(element('div', 'empty', ended.length ? '未解決の判断事項はありません。' : 'ありません'));
  if (ended.length) appendPlanToggle(body, 'decisions', session.session_id, expanded, ended.length, '解決済みと取り下げ', expandedEndedDecisions);
}

function appendTaskItem(list, task, product, session, withTags = false, multipleSessions = false) {
  const labels = { todo: '未着手', doing: '作業中', done: '完了' };
  const item = element('li', `task-item ${task.state}`);
  const header = element('div', 'task-head');
  appendContextTags(header, product, session, withTags, multipleSessions);
  header.append(element('span', 'task-title', task.title), badge(labels[task.state] || task.state, task.state === 'done' ? 'done' : task.state === 'doing' ? 'busy' : ''));
  const met = task.criteria.filter((criterion) => criterion.met).length;
  header.append(element('span', 'meta', `完了条件 ${met}/${task.criteria.length}`));
  item.append(header);
  if (task.criteria.length) {
    const criteria = element('ul', 'criteria-list');
    for (const criterion of task.criteria) {
      const row = element('li', criterion.met ? 'met' : '', criterion.text);
      criteria.append(row);
    }
    item.append(criteria);
  }
  list.append(item);
}

function appendTasks(body, session, product, withTags = false, multipleSessions = false) {
  const tasks = session.tasks;
  const heading = element('h3', 'sub', 'タスクと完了条件 ');
  if (session.tasksUpdatedAt) heading.append(element('span', 'meta', `最終更新 ${durationAgoLabel(session.tasksUpdatedAt)}`));
  body.append(heading);
  if (!tasks.length) {
    body.append(element('div', 'empty', 'タスクはありません。'));
    return;
  }
  const done = tasks.filter((task) => task.state === 'done');
  const expanded = expandedDoneTasks.has(session.session_id);
  const visible = expanded ? tasks : tasks.filter((task) => task.state !== 'done');
  if (!visible.length) body.append(element('div', 'empty', '未完了のタスクはありません。'));
  else {
    const list = element('ul', 'task-list');
    for (const task of visible) appendTaskItem(list, task, product, session, withTags, multipleSessions);
    body.append(list);
  }
  if (done.length) appendPlanToggle(body, 'tasks', session.session_id, expanded, done.length, '完了したタスク', expandedDoneTasks);
}

// 状態不明のセッションは古い記録を持つことが多いので、今日でなければ日付も出す。
function estimateTimeLabel(date) {
  const time = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
  return date.toDateString() === new Date().toDateString() ? time : `${date.getMonth() + 1}/${date.getDate()} ${time}`;
}

function appendUnknownSessionControls(body, session) {
  if (session.status !== '不明') return;
  const actions = element('div', 'session-actions');
  const estimateButton = element('button', 'ended-toggle', '状態を推定');
  estimateButton.type = 'button';
  estimateButton.dataset.estimateSession = session.session_id;
  const hideButton = element('button', 'ended-toggle', '一覧から外す');
  hideButton.type = 'button';
  hideButton.dataset.hideSession = session.session_id;
  actions.append(estimateButton, hideButton);
  body.append(actions);

  if (!session.estimate) return;
  const panel = element('div', 'estimate');
  if (!session.estimate.canEstimate) {
    panel.textContent = '推定できませんでした';
  } else {
    const timestamp = Date.parse(session.estimate.recordedAt);
    const recordedAt = Number.isFinite(timestamp) ? estimateTimeLabel(new Date(timestamp)) : '時刻不明';
    panel.append(element('p', '', `最後の記録: ${recordedAt}、最後のツール: ${session.estimate.lastTool ?? 'なし'}`));
    const waiting = session.estimate.state === 'input'
      ? 'はい'
      : session.estimate.state === 'tool'
        ? 'いいえ(許可待ちかツールの実行中)'
        : 'いいえ(応答の生成中)';
    panel.append(element('p', '', `入力待ちらしい: ${waiting}`));
  }
  body.append(panel);
}

function unknownSessionControls(session, product, multipleSessions) {
  if (session.status !== '不明') return null;
  const block = element('div', 'kind-unknown');
  const tags = element('div', 'meta');
  appendContextTags(tags, product, session, true, multipleSessions);
  block.append(tags);
  appendUnknownSessionControls(block, session);
  return block;
}

function productStatusBadge(session) {
  const status = activityStatus(session);
  return badge(status.label, status.tone);
}

function sessionBlock(product, session, multipleSessions) {
  const block = element('div', `session-group ${multipleSessions ? '' : 'single'}`.trim());
  if (multipleSessions) {
    const head = element('div', 'session-head');
    head.append(element('h3', '', session.title || session.session_id));
    if (!sharedBranch(product) && session.product?.branch) head.append(element('span', 'meta branch', session.product.branch));
    head.append(productStatusBadge(session));
    block.append(head);
  }

  const body = element('div', 'session-body');
  const judgmentCount = shownPermissions(session).length + shownActiveDecisions(session).length;
  const hasEndedDecisions = session.decisions.some((decision) => ['resolved', 'withdrawn'].includes(decision.state));
  const showJudgment = judgmentCount > 0 || hasEndedDecisions || !hasHiddenJudgmentItems(session);
  if (showJudgment) {
    const judgmentHeading = element('h3', 'sub', 'あなたの判断が必要なこと');
    judgmentHeading.append(element('span', 'count', String(judgmentCount)));
    body.append(judgmentHeading);
    appendPermissionWaits(body, session, product);
    appendDecisions(body, session, product);
  }
  appendTasks(body, session, product);
  body.append(element('h3', 'sub', '今やっていること'));
  const now = element('div', 'now');
  now.append(mainRow(session, product));
  body.append(now);
  appendAgents(body, session, product);
  appendUnknownSessionControls(body, session);
  block.append(body);
  return block;
}

function productControls(product, index, total, pinnedCount, headingId) {
  const pinned = displayPreferences.pinned.includes(product.key);
  const collapsed = displayPreferences.collapsed.includes(product.key);
  const controls = element('div', 'order');
  const collapse = element('button', 'icon-btn', collapsed ? '開く' : '畳む');
  collapse.type = 'button';
  collapse.dataset.productAction = 'collapse';
  collapse.dataset.productKey = product.key;
  collapse.setAttribute('aria-expanded', String(!collapsed));
  collapse.setAttribute('aria-label', `${product.name}を${collapsed ? '開く' : '畳む'}`);
  const pin = element('button', 'icon-btn', pinned ? '固定中' : '固定');
  pin.type = 'button';
  pin.dataset.productAction = 'pin';
  pin.dataset.productKey = product.key;
  pin.setAttribute('aria-pressed', String(pinned));
  pin.title = pinned ? '固定を解除' : '最上部に固定';
  const moveUp = element('button', 'icon-btn', '↑');
  moveUp.type = 'button';
  moveUp.dataset.productAction = 'move';
  moveUp.dataset.productKey = product.key;
  moveUp.dataset.direction = '-1';
  moveUp.disabled = pinned ? index === 0 : index === pinnedCount;
  moveUp.setAttribute('aria-label', `${product.name}を上へ`);
  const moveDown = element('button', 'icon-btn', '↓');
  moveDown.type = 'button';
  moveDown.dataset.productAction = 'move';
  moveDown.dataset.productKey = product.key;
  moveDown.dataset.direction = '1';
  moveDown.disabled = pinned ? index === pinnedCount - 1 : index === total - 1;
  moveDown.setAttribute('aria-label', `${product.name}を下へ`);
  const close = productCloseButton(product, headingId);
  controls.append(collapse, pin, moveUp, moveDown, close);
  return controls;
}

function productCloseButton(product, describedById) {
  const close = element('button', 'icon-btn', '×');
  close.type = 'button';
  close.dataset.productAction = 'close';
  close.dataset.productKey = product.key;
  close.setAttribute('aria-label', 'このプロダクトを閉じる');
  if (describedById) close.setAttribute('aria-describedby', describedById);
  close.title = 'このプロダクトを閉じる';
  return close;
}

// セッションが全部同じブランチならプロダクトの見出しに出し、分かれていればセッションの頭に出す。
function sharedBranch(product) {
  return product.branches.size === 1 ? [...product.branches][0] : '';
}

function productSection(product, index, products, pinnedCount) {
  const pinned = displayPreferences.pinned.includes(product.key);
  const section = element('section', `section ${pinned ? 'pinned' : ''}`.trim());
  const head = element('div', 'head');
  const heading = element('h2', '', product.name);
  heading.id = `product-heading-${index}`;
  head.append(heading);
  const branch = sharedBranch(product);
  if (branch) head.append(element('span', 'meta branch', branch));

  const permissionCount = product.sessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  const decisionCount = product.sessions.reduce((total, session) => total + session.decisions.filter((decision) => ['waiting', 'provisional'].includes(decision.state)).length, 0);
  if (permissionCount) head.append(element('span', 'chip danger', `許可待ち ${permissionCount}`));
  if (decisionCount) head.append(element('span', 'chip danger', `判断待ち ${decisionCount}`));
  head.append(productControls(product, index, products.length, pinnedCount, heading.id));
  section.append(head);

  const body = element('div', 'body');
  body.hidden = displayPreferences.collapsed.includes(product.key);
  const multipleSessions = product.sessions.length > 1;
  for (const session of product.sessions) body.append(sessionBlock(product, session, multipleSessions));
  section.append(body);
  return section;
}

function kindSection(title, content, extra) {
  const section = element('section', 'section kind-section');
  const head = element('div', 'head');
  head.append(element('h2', '', title));
  if (extra) head.append(extra);
  section.append(head, content);
  content.classList.add('body');
  return section;
}

function sessionReferences(products) {
  return products.flatMap((product) => product.sessions.map((session) => ({
    product,
    session,
    multipleSessions: product.sessions.length > 1,
  })));
}

function kindProductOrder(products) {
  const productOrder = element('div', 'order product-order kind-order');
  products.forEach((product, index) => {
    const item = element('div', 'product-order-item');
    const tag = element('span', 'prod-tag', `${index + 1}. ${product.name}`);
    tag.id = `kind-product-order-${index}`;
    item.append(tag, productCloseButton(product, tag.id));
    productOrder.append(item);
  });
  return productOrder;
}

function renderKindSections(products) {
  const references = sessionReferences(products);
  const waitingItems = [];
  const endedDecisions = element('div', 'kind-ended');
  let hasEndedDecisions = false;
  for (const { product, session, multipleSessions } of references) {
    for (const wait of shownPermissions(session)) {
      const holder = element('div');
      appendPermissionWaits(holder, { ...session, permissionWaits: [wait] }, product, true, multipleSessions);
      const card = holder.firstElementChild?.firstElementChild;
      if (card) waitingItems.push({ age: Date.now() - Date.parse(wait.startedAt), card });
    }
    for (const decision of shownActiveDecisions(session)) {
      const list = element('div', 'decision-list');
      appendDecisionCard(list, decision, product, session, true, multipleSessions);
      waitingItems.push({
        age: Date.now() - Date.parse(decision.state === 'waiting' ? decision.createdAt : decision.updatedAt),
        card: list.firstElementChild,
      });
    }

    const ended = session.decisions.filter((decision) => ['resolved', 'withdrawn'].includes(decision.state));
    if (ended.length) {
      hasEndedDecisions = true;
      appendPlanToggle(endedDecisions, 'decisions', session.session_id, expandedEndedDecisions.has(session.session_id), ended.length, '解決済みと取り下げ', expandedEndedDecisions);
      if (expandedEndedDecisions.has(session.session_id)) {
        const list = element('div', 'decision-list');
        for (const decision of newestFirst(ended)) appendDecisionCard(list, decision, product, session, true, multipleSessions);
        endedDecisions.append(list);
      }
    }
  }
  waitingItems.sort((left, right) => right.age - left.age);
  const judgment = element('div', 'body');
  for (const item of waitingItems) if (item.card) judgment.append(item.card);
  const hasHiddenJudgments = references.some(({ session }) => hasHiddenJudgmentItems(session));
  if (!waitingItems.length && !hasEndedDecisions && !hasHiddenJudgments) judgment.append(element('div', 'empty', 'ありません'));
  if (hasEndedDecisions) judgment.append(endedDecisions);
  const productOrder = kindProductOrder(products);

  const activityItems = [];
  const agentToggles = element('div', 'kind-toggles');
  for (const { product, session, multipleSessions } of references) {
    activityItems.push({ age: sessionActivityTime(session), row: mainRow(session, product, true, multipleSessions) });
    const holder = element('div');
    appendAgents(holder, session, product, true, multipleSessions);
    const list = holder.querySelector('.agent-list');
    if (list) for (const row of [...list.children]) {
      const startedAt = Date.parse(row.dataset.startedAt);
      activityItems.push({ age: Number.isFinite(startedAt) ? startedAt : -Infinity, row });
    }
    for (const toggle of holder.querySelectorAll('[data-ended-toggle]')) agentToggles.append(toggle);
  }
  activityItems.sort((left, right) => right.age - left.age);
  const activity = element('div', 'body');
  const activityList = element('div', 'now');
  for (const item of activityItems) activityList.append(item.row);
  activity.append(activityList, agentToggles);
  for (const { product, session, multipleSessions } of references) {
    const controls = unknownSessionControls(session, product, multipleSessions);
    if (controls) activity.append(controls);
  }

  const tasks = element('div', 'body');
  for (const { product, session, multipleSessions } of references) {
    if (!session.tasks.length) continue;
    const sessionTasks = element('div', 'kind-session-tasks');
    const tags = element('div', 'meta');
    appendContextTags(tags, product, session, true, true);
    sessionTasks.append(tags);
    appendTasks(sessionTasks, session, product, true, multipleSessions);
    tasks.append(sessionTasks);
  }
  if (!tasks.children.length) tasks.append(element('div', 'empty', 'ありません'));

  const sections = [productOrder];
  if (waitingItems.length || hasEndedDecisions || !hasHiddenJudgments) {
    sections.push(kindSection('あなたの判断が必要なこと(待ちの長い順)', judgment));
  }
  sections.push(
    kindSection('タスクと完了条件', tasks),
    kindSection('今やっていること', activity),
  );
  return sections;
}

function render(state) {
  if (answerNoteComposing) {
    deferredRenderPending = true;
    return;
  }
  deferredRenderPending = false;
  const allSessions = Array.isArray(state.sessions) ? state.sessions : [];
  const sessions = allSessions.filter((session) => session.hidden !== true);
  const active = document.activeElement;
  const activeAnswerNote = active instanceof HTMLTextAreaElement && active.hasAttribute('data-answer-note') ? active : null;
  const toggleAttribute = ['data-ended-toggle', 'data-plan-toggle', 'data-estimate-session', 'data-hide-session'].find((attribute) => active?.hasAttribute(attribute));
  const focusData = toggleAttribute ? { kind: 'toggle', attribute: toggleAttribute, value: active.getAttribute(toggleAttribute) }
    : active?.dataset?.filter ? { kind: 'filter', key: active.dataset.filter }
      : active?.dataset?.productAction ? { kind: 'product', action: active.dataset.productAction, key: active.dataset.productKey, direction: active.dataset.direction || '' }
        : active?.dataset?.answerChoice ? { kind: 'answer-choice', sessionId: active.dataset.sessionId, decisionId: active.dataset.decisionId, choice: active.dataset.answerChoice }
          : activeAnswerNote ? { kind: 'answer-note', sessionId: activeAnswerNote.dataset.sessionId, decisionId: activeAnswerNote.dataset.decisionId, start: activeAnswerNote.selectionStart, end: activeAnswerNote.selectionEnd, direction: activeAnswerNote.selectionDirection }
            : active?.dataset?.sendAnswer ? { kind: 'answer-submit', sessionId: active.dataset.sessionId, decisionId: active.dataset.sendAnswer }
        : active?.hasAttribute('data-show-all') ? { kind: 'show-all' }
          : active?.hasAttribute('data-clear-hidden-sessions') ? { kind: 'clear-hidden' } : null;
  renderSummary(sessions);
  renderExcludedNote(allSessions);
  updateTitle(sessions);
  document.querySelectorAll('[data-action="mode"]').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.dataset.mode === displayPreferences.mode));
  });
  if (!sessions.length) {
    root.replaceChildren(element('section', 'section empty', '表示するセッションがありません。Claude Code でセッションを開始すると、ここに表示されます。'));
    return;
  }

  const products = orderedProducts(sessions);
  if (displayPreferences.mode === 'product') {
    const pinnedCount = products.filter((product) => displayPreferences.pinned.includes(product.key)).length;
    root.replaceChildren(...products.map((product, index) => productSection(product, index, products, pinnedCount)));
  } else {
    root.replaceChildren(...renderKindSections(products));
  }

  if (focusData) {
    if (['answer-choice', 'answer-note', 'answer-submit'].includes(focusData.kind)) {
      const control = [...root.querySelectorAll('[data-answer-choice], [data-answer-note], [data-send-answer]')].find((item) => (
        item.dataset.sessionId === focusData.sessionId &&
        (item.dataset.decisionId || item.dataset.sendAnswer) === focusData.decisionId &&
        (focusData.kind !== 'answer-choice' || item.dataset.answerChoice === focusData.choice) &&
        (focusData.kind !== 'answer-note' || item.hasAttribute('data-answer-note')) &&
        (focusData.kind !== 'answer-submit' || item.hasAttribute('data-send-answer'))
      ));
      if (focusData.kind === 'answer-note' && activeAnswerNote && control instanceof HTMLTextAreaElement) {
        control.replaceWith(activeAnswerNote);
        const answerDraftKeyValue = answerDraftKey(focusData.sessionId, focusData.decisionId);
        const decision = findDecision(focusData.sessionId, focusData.decisionId);
        const answerDraft = answerDraftFor(decision, { session_id: focusData.sessionId });
        if (answerDraft.note !== activeAnswerNote.value) {
          answerDrafts.set(answerDraftKeyValue, { ...answerDraft, note: activeAnswerNote.value });
        }
        updateAnswerSubmit(activeAnswerNote.closest('.decision-answer'));
        activeAnswerNote.focus({ preventScroll: true });
        activeAnswerNote.setSelectionRange(focusData.start, focusData.end, focusData.direction);
        return;
      }
      control?.focus({ preventScroll: true });
      if (focusData.kind === 'answer-note' && control instanceof HTMLTextAreaElement) {
        control.setSelectionRange(focusData.start, focusData.end);
      }
      return;
    }
    const buttons = [...document.querySelectorAll('button')];
    const button = buttons.find((item) => {
      if (focusData.kind === 'toggle') return item.getAttribute(focusData.attribute) === focusData.value;
      if (focusData.kind === 'filter') return item.dataset.filter === focusData.key;
      if (focusData.kind === 'show-all') return item.hasAttribute('data-show-all');
      if (focusData.kind === 'clear-hidden') return item.hasAttribute('data-clear-hidden-sessions');
      return item.dataset.productAction === focusData.action && item.dataset.productKey === focusData.key && (item.dataset.direction || '') === focusData.direction;
    });
    const fallback = focusData.kind === 'product' && focusData.action === 'move' && button?.disabled
      ? buttons.find((item) => item.dataset.productAction === 'move' && item.dataset.productKey === focusData.key && item.dataset.direction === String(-Number(focusData.direction)))
      : focusData.kind === 'toggle' && focusData.attribute === 'data-hide-session' && !button
        ? buttons.find((item) => item.hasAttribute('data-clear-hidden-sessions'))
      : button;
    fallback?.focus({ preventScroll: true });
  }
}

function renderDeferredState() {
  if (!deferredRenderPending || answerNoteComposing) return;
  deferredRenderPending = false;
  if (lastState) render(lastState);
}

function findDecision(sessionId, decisionId) {
  const session = lastState?.sessions.find((item) => item.session_id === sessionId);
  return session?.decisions.find((item) => item.id === decisionId) || null;
}

function answerDraftKey(sessionId, decisionId) {
  return `${sessionId}\0${decisionId}`;
}

function updateAnswerSubmit(card) {
  const sessionId = card.dataset.sessionId;
  const decisionId = card.dataset.decisionId;
  const decision = findDecision(sessionId, decisionId);
  const button = card.querySelector('[data-send-answer]');
  if (!decision || !button) return;
  const draft = answerDraftFor(decision, { session_id: sessionId });
  const changed = !decision.answer?.sentAt || draft.choice !== (decision.answer?.choice ?? null) || draft.note !== (decision.answer?.note || '');
  button.disabled = (!draft.choice && !draft.note.trim()) || !changed;
}

function showAnswerError(sessionId, decisionId, message) {
  const card = [...root.querySelectorAll('.decision-answer')].find((item) => (
    item.dataset.sessionId === sessionId && item.dataset.decisionId === decisionId
  ));
  const error = card?.querySelector('.answer-error');
  if (error) error.textContent = message;
}

async function sendDecisionAnswer(button) {
  const sessionId = button.dataset.sessionId;
  const decisionId = button.dataset.sendAnswer;
  const decision = findDecision(sessionId, decisionId);
  if (!decision) return;
  const draft = answerDraftFor(decision, { session_id: sessionId });
  button.disabled = true;
  try {
    const response = await postUiAction(`/api/decisions/${encodeURIComponent(decisionId)}/answer`, {
      session_id: sessionId,
      choice: draft.choice,
      note: draft.note,
    });
    if (response.status === 409 || response.status === 404) {
      await refresh();
      showAnswerError(sessionId, decisionId, '判断事項の状態が変わりました。表示を確認してください。');
      return;
    }
    if (response.status === 400) {
      showAnswerError(sessionId, decisionId, '推奨案が無い質問には「推奨案で OK」を送れません。');
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    answerDrafts.delete(answerDraftKey(sessionId, decisionId));
    await refresh();
    liveStatus.textContent = '回答を送信しました。';
  } catch {
    showAnswerError(sessionId, decisionId, '回答を送信できませんでした。');
    showWriteError('回答を送信できませんでした');
  } finally {
    if (button.isConnected) updateAnswerSubmit(button.closest('.decision-answer'));
  }
}

document.addEventListener('change', (event) => {
  const choice = event.target.closest('[data-answer-choice]');
  if (!choice || choice.disabled) return;
  const key = answerDraftKey(choice.dataset.sessionId, choice.dataset.decisionId);
  const card = choice.closest('.decision-answer');
  const decision = findDecision(choice.dataset.sessionId, choice.dataset.decisionId);
  const current = decision ? answerDraftFor(decision, { session_id: choice.dataset.sessionId }) : { choice: null, note: '' };
  const next = { ...current, choice: choice.checked ? choice.dataset.answerChoice : null };
  answerDrafts.set(key, next);
  for (const input of card.querySelectorAll('[data-answer-choice]')) {
    input.checked = next.choice === input.dataset.answerChoice;
  }
  card.querySelector('.answer-error').textContent = '';
  updateAnswerSubmit(card);
});

document.addEventListener('input', (event) => {
  const note = event.target.closest('[data-answer-note]');
  if (!note) return;
  const key = answerDraftKey(note.dataset.sessionId, note.dataset.decisionId);
  const decision = findDecision(note.dataset.sessionId, note.dataset.decisionId);
  const current = decision ? answerDraftFor(decision, { session_id: note.dataset.sessionId }) : { choice: null, note: '' };
  answerDrafts.set(key, { ...current, note: note.value });
  const card = note.closest('.decision-answer');
  card.querySelector('.answer-error').textContent = '';
  updateAnswerSubmit(card);
});

document.addEventListener('compositionstart', (event) => {
  if (event.target.matches?.('[data-answer-note]')) answerNoteComposing = true;
}, true);

document.addEventListener('compositionend', (event) => {
  if (!event.target.matches?.('[data-answer-note]')) return;
  answerNoteComposing = false;
  renderDeferredState();
}, true);

async function runSessionAction(button, url, body, errorMessage, focusExcludedNote = false) {
  button.disabled = true;
  try {
    const requests = body.action === 'hide' && Array.isArray(body.session_ids)
      ? Array.from({ length: Math.ceil(body.session_ids.length / 50) }, (_, index) => ({
        action: 'hide', session_ids: body.session_ids.slice(index * 50, (index + 1) * 50),
      }))
      : [body];
    let hiddenAny = false;
    for (const requestBody of requests) {
      const response = await postUiAction(url, requestBody);
      // 押した直後にイベントが届いて状態が分かった場合は、失敗と出さずに表示を取り直す。
      if (response.status === 404 || response.status === 409) continue;
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      hiddenAny = true;
    }
    await refresh();
    if (!hiddenAny) return;
    if (focusExcludedNote) document.querySelector('[data-clear-hidden-sessions]')?.focus({ preventScroll: true });
    else if (button.dataset.estimateSession) {
      [...document.querySelectorAll('[data-estimate-session]')]
        .find((item) => item.dataset.estimateSession === button.dataset.estimateSession)
        ?.focus({ preventScroll: true });
    } else if (body.action === 'clear') {
      (root.querySelector('[data-estimate-session]') || root.querySelector('button'))?.focus({ preventScroll: true });
    }
  } catch {
    liveStatus.textContent = errorMessage;
    showWriteError('セッションの操作に失敗しました');
  } finally {
    if (button.isConnected) button.disabled = false;
  }
}

document.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.sendAnswer) {
    void sendDecisionAnswer(button);
    return;
  }
  if (button.dataset.estimateSession) {
    void runSessionAction(
      button,
      `/api/sessions/${encodeURIComponent(button.dataset.estimateSession)}/estimate`,
      {},
      '状態を推定できませんでした',
    );
    return;
  }
  if (button.dataset.hideSession) {
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'hide', session_id: button.dataset.hideSession },
      'セッションを一覧から外せませんでした',
      true,
    );
    return;
  }
  if (button.dataset.clearHiddenSessions) {
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'clear' },
      '外したセッションを表示できませんでした',
    );
    return;
  }
  if (button.dataset.filter) {
    const key = button.dataset.filter;
    displayPreferences.hidden = isFilterShown(key)
      ? [...displayPreferences.hidden, key]
      : displayPreferences.hidden.filter((hidden) => hidden !== key);
    saveDisplayPreferences();
    if (lastState) render(lastState);
    return;
  }
  if (button.dataset.productAction === 'close') {
    const product = productGroups(lastState.sessions.filter((session) => session.hidden !== true))
      .find((item) => item.key === button.dataset.productKey);
    if (!product?.sessions.length) return;
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'hide', session_ids: product.sessions.map((session) => session.session_id) },
      'プロダクトのセッションを一覧から外せませんでした',
      true,
    );
    return;
  }
  if (button.dataset.productAction) {
    const key = button.dataset.productKey;
    if (button.dataset.productAction === 'collapse') {
      displayPreferences.collapsed = displayPreferences.collapsed.includes(key)
        ? displayPreferences.collapsed.filter((item) => item !== key)
        : [...displayPreferences.collapsed, key];
    } else if (button.dataset.productAction === 'pin') {
      displayPreferences.pinned = displayPreferences.pinned.includes(key)
        ? displayPreferences.pinned.filter((item) => item !== key)
        : [...displayPreferences.pinned, key];
    } else {
      const products = orderedProducts(lastState.sessions);
      const index = products.findIndex((product) => product.key === key);
      const pinnedCount = products.filter((product) => displayPreferences.pinned.includes(product.key)).length;
      const direction = Number(button.dataset.direction);
      const targetIndex = index + direction;
      const pinned = displayPreferences.pinned.includes(key);
      const canMove = pinned
        ? targetIndex >= 0 && targetIndex < pinnedCount
        : targetIndex >= pinnedCount && targetIndex < products.length;
      if (!canMove) return;
      const currentKey = products[index].key;
      const targetKey = products[targetIndex].key;
      const currentOrderIndex = displayPreferences.order.indexOf(currentKey);
      const targetOrderIndex = displayPreferences.order.indexOf(targetKey);
      [displayPreferences.order[currentOrderIndex], displayPreferences.order[targetOrderIndex]] =
        [displayPreferences.order[targetOrderIndex], displayPreferences.order[currentOrderIndex]];
    }
    saveDisplayPreferences();
    if (lastState) render(lastState);
  }
});

async function refresh() {
  try {
    const response = await fetch('/api/state', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const state = await response.json();
    lastStateAt = new Date();
    connectionLost = false;
    updateConnectionNote();
    lastState = state;
    applyAwayState(state.away);
    if (state.version !== lastVersion) {
      render(state);
      lastVersion = state.version;
      hasRenderedState = true;
      const visibleSessions = state.sessions.filter((session) => session.hidden !== true);
      const permissions = visibleSessions.reduce((total, session) => total + session.permissionWaits.length, 0);
      const decisions = visibleSessions.reduce((total, session) => total + session.decisions.filter(isPendingDecision).length, 0);
      liveStatus.textContent = `状態を更新しました。セッション ${visibleSessions.length} 件、許可待ち ${permissions} 件、判断待ち ${decisions} 件。`;
    }
  } catch {
    connectionLost = true;
    updateConnectionNote();
    liveStatus.textContent = '常駐サーバーに接続できません。';
    if (!hasRenderedState) root.replaceChildren(element('div', 'error-box', '状態を取得できません。常駐サーバーが起動しているか確認してください。'));
  }
}

refresh();
setInterval(refresh, POLL_INTERVAL_MS);
setInterval(() => { if (lastState) render(lastState); }, WAIT_REFRESH_INTERVAL_MS);
</script>
</body>
</html>
