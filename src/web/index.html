    const merge = element('button', `merge-btn ${conditionMet ? '' : 'outline'}`.trim(), 'マージする');
    merge.type = 'button';
    merge.dataset.openMerge = mergeKey;
    merge.dataset.mergeKey = mergeKey;
    merge.disabled = Boolean(confirmation) || pullRequestMergeInFlight.has(mergeKey);
    line.append(merge);
    // 方式が取れないときに塞ぐのは新しい予約だけにする。既存の予約は方式が分からなくても取り消せる必要がある。
    const reservationDisabled = pullRequestMergeInFlight.has(mergeKey) || (!reservation && !(group.mergeMethods || []).length);
    const reservationChoice = element('label', `reservation-toggle ${reservationDisabled ? 'disabled' : ''}`.trim());
    const reservationToggle = element('input');
    reservationToggle.type = 'checkbox';
    reservationToggle.checked = pullRequestReservationPending.has(mergeKey)
      ? pullRequestReservationPending.get(mergeKey)
      : Boolean(reservation);
    reservationToggle.disabled = reservationDisabled;
    reservationToggle.dataset.reservationToggle = mergeKey;
    reservationToggle.dataset.mergeKey = mergeKey;
    reservationToggle.setAttribute('aria-label', `PR #${pullRequest.number} のレビュー収束後マージを予約`);
    reservationChoice.append(reservationToggle, document.createTextNode('レビュー収束後マージ'));
    line.append(reservationChoice);
  }
  item.append(line);
  const branch = element('div', 'branch');
  branch.append(element('code', '', pullRequest.headRefName), document.createTextNode(' → '), element('code', '', pullRequest.effectiveBase));
  item.append(branch);
  const badges = element('div', 'badges');
  appendPullRequestBadges(badges, pullRequest);
  if (reservation) {
    const reservedText = `レビュー収束後にマージ予約中 (${MERGE_METHOD_LABELS[reservation.method] || reservation.method}、予約時 ${reservation.createdAt ? absoluteTimeLabel(reservation.createdAt) : '時刻不明'}、${pullRequestReservationWaits(pullRequest, group, reservation.method).join('、')})`;
    badges.append(badge(reservedText, 'accent long'));
  }
  item.append(badges);
  if (pullRequest.crossReview !== undefined) item.append(crossReviewLine(pullRequest));
  if (!reservation && !pullRequest.canMerge && pullRequest.blocker) item.append(element('div', 'why-not', `マージできない理由: ${pullRequest.blocker}`));
  else if (!reservation && waiting.length) item.append(element('div', 'why-not merge-wait', `待ち: ${waiting.join('、')}`));
  if (pullRequest.conflict) appendPullRequestConflictControls(line, item, group, pullRequest);
  if (mergeKey && confirmation && !mergeIntent) appendPullRequestMergeConfirmation(item, group, pullRequest);
  const mergeMessage = mergeKey ? pullRequestMergeMessages.get(mergeKey) : null;
  if (mergeMessage && !pullRequestTransientNoticeExpired(mergeMessage.shownAt)) {
    const message = element('div', 'merge-error', mergeMessage.message);
    message.setAttribute('role', 'status');
    item.append(message);
  }
  if (pullRequest.children.length) {
    const children = element('div', 'stack-level');
    for (const child of pullRequest.children) appendPullRequestTree(children, group, child);
    item.append(children);
  }
  target.append(item);
}

function pullRequestMergeResultLine(result) {
  const details = result.automaticResult ? { ...result, ...result.automaticResult } : result;
  const parts = [
    `${MERGE_METHOD_LABELS[details.method] || details.method} でマージしました`,
    details.autoDeleteBranch ? 'ブランチの削除は GitHub の自動削除の設定に任せた (結果は未確認)'
      : details.branchDeleted ? 'ブランチを削除しました' : 'ブランチは削除していません',
  ];
  if (details.retargetedBase) {
    const numbers = Array.isArray(details.retargetedNumbers) && details.retargetedNumbers.length
      ? `${details.retargetedNumbers.map((number) => `#${number}`).join('、')} の `
      : '';
    parts.push(`${numbers}base を ${details.retargetedBase} に付け替えました`);
  }
  if (details.warning) parts.push(details.warning);
  return parts.join('。') + '。';
}

function appendPullRequestMergeResults(content, group) {
  const results = pullRequestMergeResults.get(pullRequestRepositoryKey(group)) || [];
  const serverResults = (group.mergeHistory || []).filter((result) => result.automatic === true && result.automaticResult && pullRequestMergeResultVisible(result, result.mergedAt));
  const visibleLocalResults = results.filter((result) => pullRequestMergeResultVisible(result, result.recordedAt));
  for (const result of [...serverResults, ...visibleLocalResults]) {
    const row = element('div', 'merge-result');
    row.setAttribute('role', 'status');
    row.append(element('span', '', `PR #${result.number}: ${pullRequestMergeResultLine(result)}`));
    const close = element('button', 'link-btn', '閉じる');
    close.type = 'button';
    if (result.id) {
      close.dataset.closeMergeResult = result.id;
    } else {
      close.dataset.closeAutomaticMergeResult = `${group.owner}/${group.repo}#${result.number}`;
      close.dataset.closeMergeResult = close.dataset.closeAutomaticMergeResult;
      close.dataset.owner = group.owner;
      close.dataset.repo = group.repo;
      close.dataset.number = String(result.number);
    }
    row.append(close);
    content.append(row);
  }
}

function appendPullRequestBlock(target, group, withTag = false) {
  if (!group) return;
  const section = element('section', 'group-frame pr-repo-group');
  const head = element('header', 'prs-head');
  const heading = element(withTag ? 'h3' : 'h4', 'pr-repo-title');
  heading.append(element('strong', '', `${group.owner}/${group.repo}`));
  head.append(heading);
  if (withTag) head.append(element('span', 'prod-tag', group.product.name));
  if (Number.isSafeInteger(group.mergeableCount) && group.mergeableCount > 0) {
    head.append(element('span', 'chip ok', `マージできる PR (${group.mergeableCount} 件)`));
  }
  head.append(element('span', 'meta', `GitHub から ${durationAgoLabel(group.fetchedAt || group.checkedAt)}に取得`));
  section.append(head);
  const content = element('div', 'pr-repo-content');
  if (group.error) content.append(element('div', 'error-box', group.error));
  for (const notice of group.reservationNotices || []) {
    if (pullRequestTransientNoticeExpired(notice.at)) continue;
    const row = element('div', 'merge-result');
    row.setAttribute('role', 'status');
    const link = element('a', '', `PR #${notice.number}`);
    link.href = notice.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    row.append(link, document.createTextNode(`: ${notice.message}`));
    content.append(row);
  }
  for (const tree of group.trees) {
    const stack = element('div', 'stack');
    const base = element('div', 'stack-base');
    base.append(element('code', '', tree.effectiveBase));
    if (tree.children.length) base.append(element('span', '', `スタック ${tree.stackPosition.total} 段`));
    stack.append(base);
    appendPullRequestTree(stack, group, tree);
    content.append(stack);
  }
  const appendFoldedPrLine = (kind, heading, label, items, appendItem) => {
    const visibleItems = displayPreferences.hideFinished && kind === 'merged'
      ? items.filter((item) => item.headMismatch === true)
      : displayPreferences.hideFinished ? [] : items;
    if (!visibleItems.length) return;
    const line = element('div', 'merged-list');
    line.append(document.createTextNode(`${heading}: `));
    const repositoryKey = `${group.owner}/${group.repo}`.toLowerCase();
    const key = `${kind}:${repositoryKey}`;
    const expanded = expandedPrLines.has(key);
    const olderCount = Math.max(0, visibleItems.length - MERGED_VISIBLE_COUNT);
    for (const item of expanded ? visibleItems : visibleItems.slice(0, MERGED_VISIBLE_COUNT)) appendItem(line, item);
    if (olderCount) {
      appendExpandToggle(line, expandedPrLines, key,
        (isExpanded, count) => `${isExpanded ? `古い${label}を隠す` : `古い${label}を表示`} (${count} 件)`,
        olderCount, 'data-older-pr-line');
    }
    content.append(line);
  };
  if (!group.trees.length && !group.error) {
    if (group.loading) {
      content.append(element('div', 'empty', 'GitHub から取得しています'));
    } else if (group.merged.length || group.mergeHistory?.length || group.registeredCount) {
      content.append(element('div', 'empty', 'オープンの PR はありません'));
    }
  }
  if (Array.isArray(group.mergeHistory) && group.mergeHistory.length) {
    appendFoldedPrLine('merged', 'マージ済み (24 時間)', 'マージ済み', group.mergeHistory, (line, record) => {
      const item = element('span', record.headMismatch === true ? 'badge long warn' : 'badge long mute');
      const link = element('a', '', `#${record.number}`);
      link.href = record.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = record.title;
      const parts = [absoluteTimeLabel(record.mergedAt)];
      if (record.method) parts.push(MERGE_METHOD_LABELS[record.method] || record.method);
      if (record.automatic) parts.push('予約で自動');
      item.append(link, document.createTextNode(` (${parts.join('、')}`));
      if (record.headMismatch === true) {
        item.append(document.createTextNode('、警告: 予約時に確認した '), shortShaElement(record.reservedHeadRefOid),
          document.createTextNode(' とは異なる '), shortShaElement(record.mergedHeadRefOid), document.createTextNode(' がマージされました'));
      }
      item.append(document.createTextNode(')'));
      line.append(item);
    });
  }
  const closed = group.merged.filter((pullRequest) => pullRequest.state === 'closed')
    .sort((a, b) => b.number - a.number);
  appendFoldedPrLine('closed', 'クローズ済み', 'クローズ済み', closed, (line, pullRequest) => {
    const link = element('a', 'badge mute', `#${pullRequest.number}`);
    link.href = pullRequest.url;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.setAttribute('aria-label', `GitHub で PR #${pullRequest.number} を開く`);
    link.title = pullRequest.title;
    line.append(link);
  });
  appendPullRequestMergeResults(content, group);
  section.append(content);
  target.append(section);
}

function productGroups(sessions, pullRequestGroups = []) {
  const groups = new Map();
  for (const session of sessions) {
    const product = session.product || {};
    const key = product.key || product.name || 'product-unknown';
    let group = groups.get(key);
    if (!group) {
      group = { key, name: product.name || 'プロダクト不明', branches: new Set(), sessions: [] };
      groups.set(key, group);
    }
    if (product.branch) group.branches.add(product.branch);
    group.sessions.push(session);
  }
  for (const pullRequestGroup of pullRequestGroups) {
    const product = pullRequestGroup.product || {};
    const key = product.key || `repo:${pullRequestGroup.owner}/${pullRequestGroup.repo}`;
    let group = groups.get(key);
    if (!group) {
      group = { key, name: product.name || `${pullRequestGroup.owner}/${pullRequestGroup.repo}`, branches: new Set(), sessions: [], pullRequestGroups: [] };
      groups.set(key, group);
    }
    group.pullRequestGroups ||= [];
    group.pullRequestGroups.push(pullRequestGroup);
  }
  return [...groups.values()];
}

// セッションを外すか終えて PR もマージかクローズを終えたプロダクトは、未読の変化を既読にした時点でカードを消す。
// オープンの PR を数えきれていない PR 群は、openCount が 0 でもオープンの PR が無いとは扱わない。
// PR を非表示にしている間は、PR だけで残るカードの本文が空になるので、PR を理由に残さない。
function hasProductContent(product, sinceSeen) {
  const pullRequestGroups = isFilterShown('prs') ? visiblePullRequestGroups(product.pullRequestGroups || []) : [];
  return product.sessions.length > 0
    || pullRequestGroups.some(pullRequestGroupHasVisibleContent)
    || sinceSeen.some((entry) => entry.product?.key === product.key && entry.items?.length > 0);
}

function sessionActivityTime(session) {
  const mainTool = session.tools.filter((tool) => !tool.agent_id).reduce((latest, tool) => {
    const time = Date.parse(tool.startedAt);
    return Number.isFinite(time) ? Math.max(latest, time) : latest;
  }, -Infinity);
  const lastActivity = Date.parse(session.lastActivityAt);
  return Math.max(mainTool, Number.isFinite(lastActivity) ? lastActivity : -Infinity);
}

function orderedProducts(sessions, pullRequestGroups = [], sinceSeen = []) {
  const idleFilteredSessions = sessionsAfterIdleFilter(sessions);
  const visibleSessions = displayPreferences.hideFinished
    ? idleFilteredSessions.filter((session) => !isFinishedSession(session))
    : idleFilteredSessions;
  const grouped = productGroups(visibleSessions, pullRequestGroups);
  for (const entry of sinceSeen) {
    if (!entry.product?.key || grouped.some((product) => product.key === entry.product.key)) continue;
    grouped.push({ key: entry.product.key, name: entry.product.name, branches: new Set(), sessions: [], pullRequestGroups: [] });
  }
  const products = grouped.filter((product) => hasProductContent(product, sinceSeen));
  const ids = products.map((product) => product.key);
  const visibleKeys = new Set(ids);
  const nextOrder = [...displayPreferences.order];
  for (const key of ids) if (!nextOrder.includes(key)) nextOrder.push(key);
  if (nextOrder.length > 200) {
    let excess = nextOrder.length - 200;
    const retained = nextOrder.filter((key) => {
      if (excess > 0 && !visibleKeys.has(key)) {
        excess -= 1;
        return false;
      }
      return true;
    });
    nextOrder.length = 0;
    for (const key of retained) nextOrder.push(key);
  }
  if (nextOrder.length !== displayPreferences.order.length || nextOrder.some((key, index) => key !== displayPreferences.order[index])) {
    saveDisplayPreferences({ order: nextOrder });
  }
  const orderIndex = new Map(nextOrder.map((key, index) => [key, index]));
  return products
    .map((product) => ({
      ...product,
      sessions: [...product.sessions].sort((left, right) => sessionActivityTime(right) - sessionActivityTime(left)),
      pullRequestGroups: visiblePullRequestGroups(product.pullRequestGroups || []),
    }))
    .sort((left, right) => {
      const leftPinned = displayPreferences.pinned.includes(left.key);
      const rightPinned = displayPreferences.pinned.includes(right.key);
      if (leftPinned !== rightPinned) return leftPinned ? -1 : 1;
      return orderIndex.get(left.key) - orderIndex.get(right.key);
    });
}

function activityStatus(session) {
  if (session.status === '作業中') return { label: '作業中', tone: 'busy' };
  if (session.status === '不明') return { label: '状態不明', tone: 'unknown' };
  return { label: '待機中', tone: 'wait' };
}

function isFinishedSession(session) {
  return activityStatus(session).tone === 'wait'
    && session.tasks.every((task) => task.state === 'done')
    && session.decisions.every(isEndedDecision)
    && session.permissionWaits.length === 0
    && !session.agents.some((agent) => !isEndedAgent(agent))
    && (session.instructions || []).every(isFinishedInstruction)
    && (session.commonQuestions || []).every(isFinishedCommonQuestion);
}

function mainRow(session, product, withTags = false, multipleSessions = false) {
  const status = activityStatus(session);
  const isUnknown = status.tone === 'unknown';
  const hasEstimate = isUnknown && session.estimate?.canEstimate;
  const mainTool = hasEstimate ? null : newestFirst(session.tools.filter((tool) => !tool.agent_id))[0];
  const doingTask = session.tasks.find((task) => task.state === 'doing');
  const row = element('div', 'now-row main-row');
  const who = element('div', 'who');
  who.append(element('span', `dot ${status.tone}`), document.createTextNode('メイン'));
  appendContextTags(who, product, session, withTags, multipleSessions);
  who.append(element('strong', '', isUnknown && !hasEstimate ? `${status.label} (${durationAgoLabel(session.lastActivityAt)})` : status.label));
  const detail = element('div', 'detail');
  if (doingTask) detail.append(element('div', 'activity-title', doingTask.title));
  if (mainTool) appendToolLine(detail, mainTool);
  row.append(who);
  if (!isUnknown) {
    const elapsedAt = mainTool?.startedAt || session.lastActivityAt;
    row.append(relativeTimeElement(elapsedAt, 'since', durationAgoLabel(elapsedAt)));
  }
  if (detail.childNodes.length) row.append(detail);
  appendUnknownSessionControls(row, session);
  return row;
}

function appendAgents(body, session, product, withTags = false, multipleSessions = false, showEnded = expandedEndedSessions.has(session.session_id), includeToggle = true) {
  if (!session.agents.length) {
    if (!isFilterShown('agents')) return;
    body.append(element('h3', 'sub', 'サブエージェント'));
    body.append(element('div', 'empty', 'サブエージェントはありません。'));
    return;
  }
  const agents = newestFirst(session.agents);
  const runningAgents = agents.filter((agent) => !isEndedAgent(agent) && (!agent.active || isFilterShown('agents')));
  const endedAgents = displayPreferences.hideFinished ? [] : agents.filter(isEndedAgent);
  const visibleAgents = showEnded && !displayPreferences.hideFinished ? [...runningAgents, ...endedAgents] : runningAgents;
  const hiddenRunningAgents = agents.some((agent) => agent.active && !isFilterShown('agents'));
  if (!visibleAgents.length && !endedAgents.length && !isFilterShown('agents')) return;
  body.append(element('h3', 'sub', 'サブエージェント'));
  if (!visibleAgents.length && !hiddenRunningAgents) body.append(element('div', 'empty', '稼働中のサブエージェントはありません。'));
  const list = element('div', 'agent-list');
  for (const agent of visibleAgents) {
    const row = element('div', 'agent-row');
    row.dataset.startedAt = agent.startedAt || '';
    const who = element('div', 'who');
    const agentState = agent.active ? ['稼働中', 'busy'] : agent.unconfirmed ? ['終了未確認', 'wait'] : ['終了', 'done'];
    who.append(element('span', `dot ${agent.unconfirmed ? 'wait' : agentState[1]}`));
    appendContextTags(who, product, session, withTags, multipleSessions);
    const name = element('span', 'agent-name');
    name.append(badge(agentState[0], agentState[1]), element('strong', '', agent.agent_type || agent.agent_id));
    if (agent.closable) {
      const close = element('button', 'link-btn close-agent', '終了にする');
      close.type = 'button';
      close.dataset.closeAgent = `${session.session_id}::${agent.agent_id}`;
      name.append(close);
    }
    who.append(name);
    const detail = element('div', 'detail');
    if (agent.description) detail.append(element('div', 'agent-description', agent.description));
    else if (agent.lastTool) appendToolLine(detail, agent.lastTool);
    appendModelLine(detail, agent);
    row.append(who, relativeTimeElement(agent.startedAt, 'since', agent.startedAt ? durationAgoLabel(agent.startedAt) : ''));
    if (detail.childNodes.length) row.append(detail);
    list.append(row);
  }
  if (visibleAgents.length) body.append(list);
  if (endedAgents.length && includeToggle) {
    appendExpandToggle(body, expandedEndedSessions, session.session_id,
      (expanded, count) => `${expanded ? '終了済みを隠す' : '終了済みを表示'} (${count} 件)`,
      endedAgents.length, 'data-ended-toggle');
  }
}

// 「終了未確認」はまだ動いている可能性があるので、終了済みに含めない。
function isEndedAgent(agent) {
  return !agent.active && !agent.unconfirmed;
}

function itemTimestamp(item) {
  const timestamp = Date.parse(item.createdAt || item.startedAt || item.updatedAt);
  return Number.isFinite(timestamp) ? timestamp : -Infinity;
}

function newestFirst(items) {
  return [...items].sort((a, b) => itemTimestamp(b) - itemTimestamp(a));
}

function sessionDisplayName(session) {
  return session.title || session.session_id;
}

function appendContextTags(target, product, session, withTags, multipleSessions) {
  if (!withTags) return;
  target.append(element('span', 'prod-tag', product.name));
  if (multipleSessions) target.append(element('span', 'session-tag', sessionDisplayName(session)));
}

function appendPermissionWaits(body, session, product, withTags = false, multipleSessions = false) {
  const waits = shownPermissions(session);
  if (!waits.length) return;
  const list = element('div', 'permission-list');
  for (const wait of newestFirst(waits)) {
    const age = Date.now() - Date.parse(wait.startedAt);
    const duration = durationLabel(wait.startedAt);
    const isLong = isLongWait(age);
    const card = element('article', `permission ${isLong ? 'long-wait' : ''}`.trim());
    const header = element('div', 'permission-head');
    appendContextTags(header, product, session, withTags, multipleSessions);
    const agent = session.agents.find((item) => item.agent_id === wait.agent_id);
    const who = wait.agent_id ? (agent?.agent_type || 'サブエージェント') : 'メイン';
    header.append(element('strong', '', `${who}がツールの実行許可を待っている`));
    header.append(badge('許可待ち', 'permission-chip'));
    header.append(element('span', `wait ${isLong ? 'stale' : ''}`.trim(), duration === '時刻不明' ? duration : `${duration}待機中`));
    card.append(header);
    if (wait.tool_name || wait.summary) {
      const context = element('div', 'decision-context permission-tool');
      if (wait.tool_name) context.append(document.createTextNode(wait.tool_name));
      if (wait.summary && wait.summary !== wait.tool_name) {
        context.append(document.createTextNode(wait.tool_name ? ': ' : ''));
        context.append(element('code', '', wait.summary));
      }
      card.append(context);
    }
    card.append(element('div', 'meta', `${product.name} 「${sessionDisplayName(session)}」`));
    list.append(card);
  }
  body.append(list);
}

function decisionStateLabel(state) {
  return {
    waiting: '止めて待っている',
    provisional: '仮に推奨案で進行中',
    resolved: '解決済み',
    withdrawn: '取り下げ',
  }[state] || state;
}

function answerDraftFor(decision, session) {
  const key = `${session.session_id}\0${decision.id}`;
  const saved = answerDrafts.get(key);
  const answer = saved || decision.answer || {};
  return {
    choice: ['ok', 'pick'].includes(answer.choice) ? answer.choice : null,
    picks: copyAnswerPicks(answer.picks, (decision.questions || []).length),
    note: answer.note || '',
  };
}

function emptyAnswerPicks(decision) {
  return (decision.questions || []).map(() => []);
}

function copyAnswerPicks(picks, questionCount) {
  return Array.from({ length: questionCount }, (_, index) => (
    Array.isArray(picks?.[index]) ? [...picks[index]] : []
  ));
}

function sameAnswerPicks(left, right) {
  return left.length === right.length && left.every((labels, index) => (
    labels.length === right[index].length && labels.every((label, labelIndex) => label === right[index][labelIndex])
  ));
}

function sameAnswerDraft(left, right) {
  return left.choice === right.choice && left.note === right.note && sameAnswerPicks(left.picks, right.picks);
}

function answerDraftChanged(decision, draft, ignoreEmptyUnsent = false) {
  const answer = decision.answer?.sentAt ? decision.answer : {};
  if (ignoreEmptyUnsent && (draft.choice ?? null) === null && (draft.note || '') === (answer.note || '')) return false;
  const questionCount = (decision.questions || []).length;
  return !decision.answer?.sentAt || (draft.choice ?? null) !== (answer.choice ?? null) ||
    (draft.note || '') !== (answer.note || '') ||
    !sameAnswerPicks(copyAnswerPicks(draft.picks, questionCount), copyAnswerPicks(answer.picks, questionCount));
}

function clearAnswerErrorWhenDraftChanges(key, previous, next, card) {
  if (sameAnswerDraft(previous, next)) return;
  answerErrors.delete(key);
  const error = card?.querySelector('.answer-error');
  if (error) error.textContent = '';
}

function decisionAnswerAvailability(decision) {
  const questions = decision.questions || [];
  const duplicateQuestions = new Set(questions.map((question) => question.question)).size !== questions.length;
  const waitingForAnswer = decision.state === 'waiting' && Boolean(decision.awaitingAnswerUntil);
  const hasSentAnswer = Boolean(decision.answer?.sentAt);
  return {
    active: !duplicateQuestions && (decision.state === 'provisional' || waitingForAnswer || (decision.state === 'waiting' && hasSentAnswer)),
    viaDialog: duplicateQuestions || (decision.state === 'waiting' && !waitingForAnswer && !hasSentAnswer),
  };
}

function displayRecommendedLabel(label) {
  return label.replace(/(?:\(推奨\)|（推奨）|\(recommended\)|（recommended）)/ig, '').replace(/\s+/g, ' ').trim();
}

function recommendedOptionsForQuestions(questions) {
  return questions.map((question) => {
    if (question.multiSelect) return null;
    const options = question.options.filter((option) => option.recommended === true);
    return options.length === 1 ? options[0] : null;
  });
}

function selectedAnswerLabels(decision, picks) {
  return (decision.questions || []).flatMap((question, index) => {
    const selected = new Set(picks[index] || []);
    return question.options
      .filter((option) => selected.has(option.label))
      .map((option) => displayRecommendedLabel(option.label));
  });
}

function answerMetaText(decision, draft) {
  const picked = selectedAnswerLabels(decision, draft.picks);
  if (picked.length) return `送る答え: ${picked.join('、')}`;
  const recommendations = recommendedOptionsForQuestions(decision.questions || []);
  if (recommendations.length && recommendations.every(Boolean)) {
    return `OK で送る答え: ${recommendations.map((option) => displayRecommendedLabel(option.label)).join('、')}`;
  }
  return '';
}

function canSendDecisionAnswer(decision, draft) {
  if (draft.choice === 'pick') {
    const hasPick = draft.picks.some((labels) => labels.length > 0);
    if (!hasPick) return false;
    const recommendations = recommendedOptionsForQuestions(decision.questions || []);
    return draft.picks.every((labels, index) => labels.length > 0 || recommendations[index] || draft.note.trim());
  }
  if (draft.choice === 'ok') return recommendedOptionsForQuestions(decision.questions || []).every(Boolean);
  return Boolean(draft.note.trim());
}

function answerStatusText(answer, decision) {
  if (!answer?.sentAt) return '未送信';
  const label = answer.choice === 'ok' ? '推奨案で OK'
    : answer.choice === 'pick' ? `${selectedAnswerLabels(decision, answer.picks || []).map((item) => `「${item}」`).join('')}を選択`
      : '指示のみ';
  const status = [`${absoluteTimeLabel(answer.sentAt, Date.now(), '')} に送信済み: ${label}${answer.note ? ' (指示あり)' : ''}`];
  if (answer.deliveredAt) status.push(`${absoluteTimeLabel(answer.deliveredAt, Date.now(), '')} に渡した`);
  if (answer.reflectedAt) status.push(`${absoluteTimeLabel(answer.reflectedAt, Date.now(), '')} に反映された`);
  return status.join('、');
}

function appendDecisionAnswer(card, decision, product, session, summary) {
  const key = answerDraftKey(session.session_id, decision.id);
  const savedError = answerErrors.get(key) || '';
  const questions = decision.questions || [];
  const { active, viaDialog } = decisionAnswerAvailability(decision);
  if (viaDialog) {
    card.append(element('div', 'meta', `${product.name} 「${sessionDisplayName(session)}」`));
    if (savedError) {
      const error = element('div', 'answer-error', savedError);
      error.setAttribute('role', 'alert');
      card.append(error);
    }
    return;
  }
  if (!active) {
    if (decision.answer?.sentAt) summary.append(element('span', 'answer-status', answerStatusText(decision.answer, decision)));
    if (savedError) {
      const error = element('div', 'answer-error', savedError);
      error.setAttribute('role', 'alert');
      card.append(error);
    }
    return;
  }

  const draft = answerDraftFor(decision, session);
  const answer = decision.answer;
  const dirty = answerDraftChanged(decision, draft);
  const recommendations = recommendedOptionsForQuestions(questions);
  const canUseRecommendation = recommendations.length > 0 && recommendations.every(Boolean);
  const answerBox = element('div', 'decision-answer');
  answerBox.dataset.decisionId = decision.id;
  answerBox.dataset.sessionId = session.session_id;
  const choices = element('div', 'answer-choices');
  const control = document.createElement('label');
  control.className = 'answer-choice ok';
  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.dataset.answerChoice = 'ok';
  checkbox.dataset.sessionId = session.session_id;
  checkbox.dataset.decisionId = decision.id;
  checkbox.checked = draft.choice === 'ok';
  checkbox.disabled = !canUseRecommendation;
  control.append(checkbox, document.createTextNode('推奨案で OK'));
  choices.append(control);
  answerBox.append(choices);
  const answerMeta = element('div', 'meta', answerMetaText(decision, draft));
  answerMeta.dataset.answerMeta = 'true';
  answerMeta.hidden = !answerMeta.textContent;
  answerBox.append(answerMeta);
  const note = document.createElement('textarea');
  note.dataset.answerNote = 'true';
  note.dataset.sessionId = session.session_id;
  note.dataset.decisionId = decision.id;
  note.maxLength = 2000;
  note.setAttribute('aria-label', '指示');
  note.placeholder = '指示があれば書く (例: 2 番目の案で。理由は…)';
  note.value = draft.note;
  answerBox.append(note);
  const foot = element('div', 'answer-foot');
  const send = element('button', 'primary', '回答を送る');
  send.type = 'button';
  send.dataset.sendAnswer = decision.id;
  send.dataset.sessionId = session.session_id;
  send.disabled = !canSendDecisionAnswer(decision, draft) || !dirty;
  foot.append(send, element('span', 'answer-status', dirty && answer?.sentAt ? '変更は未送信' : answerStatusText(answer, decision)));
  const error = element('div', 'answer-error', savedError);
  error.setAttribute('role', 'alert');
  answerBox.append(foot, error);
  card.append(answerBox);
}

function appendDecisionCard(list, decision, product, session, withTags = false, multipleSessions = false) {
  const elapsed = decisionElapsedLabel(decision);
  const longWait = elapsed?.stale === true;
  const card = element('article', `decision-card ${decision.state} ${longWait ? 'long-wait' : ''}`.trim());
  const answerActive = decisionAnswerAvailability(decision).active;
  const optionDraft = answerActive ? answerDraftFor(decision, session) : null;
  const header = element('div', 'decision-head');
  if (decision.isNew) header.append(badge('新着', 'new-mark'));
  appendContextTags(header, product, session, withTags, multipleSessions);
  header.append(
    element('span', 'decision-title', decision.title),
    badge(decisionStateLabel(decision.state), decision.state === 'waiting' ? 'permission' : decision.state === 'provisional' ? 'wait' : decision.state === 'resolved' ? 'done' : ''),
  );
  if (elapsed) header.append(relativeTimeElement(
    decision.state === 'waiting' ? decision.createdAt : decision.updatedAt,
    elapsed.className,
    elapsed.label,
  ));
  if (decision.state === 'waiting' && decision.awaitingAnswerUntil) {
    const remaining = Math.max(0, Math.ceil((Date.parse(decision.awaitingAnswerUntil) - Date.now()) / 60_000));
    header.append(element('span', 'wait awaiting-min', `あと ${remaining} 分で推奨に進む`));
  }
  // id はモデルが cockpit_update_decision で使う値なので、本文に出さずマウスを重ねたときだけ出す。
  card.title = `id: ${decision.id}`;
  card.append(header);
  if (decision.context) card.append(element('p', 'decision-context', decision.context));

  for (const [questionIndex, question] of (decision.questions || []).entries()) {
    const questionBox = element('section', 'decision-question');
    if (question.header) questionBox.append(element('div', 'meta', question.header));
    if (question.question !== decision.title) questionBox.append(element('div', 'decision-question-title', question.question));
    if (question.multiSelect) questionBox.append(element('div', 'meta', '複数選択できます。'));
    if (question.options?.length) {
      const options = element('ul', 'decision-options');
      for (const [optionIndex, option] of question.options.entries()) {
        const row = element('li', `decision-option ${option.recommended ? 'recommended' : ''}`.trim());
        const displayLabel = option.recommended ? displayRecommendedLabel(option.label) : option.label;
        const body = element('span', 'answer-pick-body');
        if (option.recommended) body.append(badge('推奨', 'busy'));
        body.append(element('span', '', displayLabel));
        if (option.description) body.append(element('span', 'decision-option-description', option.description));
        if (answerActive) {
          row.classList.add('pickable');
          const control = document.createElement('label');
          control.className = 'answer-pick';
          const input = document.createElement('input');
          input.type = question.multiSelect ? 'checkbox' : 'radio';
          input.name = `decision-answer:${encodeURIComponent(session.session_id)}:${encodeURIComponent(decision.id)}:${questionIndex}`;
          input.value = option.label;
          input.checked = optionDraft.picks[questionIndex].includes(option.label);
          input.dataset.answerPick = 'true';
          input.dataset.answerQuestion = String(questionIndex);
          input.dataset.answerOption = String(optionIndex);
          input.dataset.sessionId = session.session_id;
          input.dataset.decisionId = decision.id;
          input.setAttribute('aria-label', `${question.question}: ${displayLabel}${option.description ? `。${option.description}` : ''}`);
          control.append(input, body);
          row.append(control);
        } else {
          body.classList.remove('answer-pick-body');
          row.append(body);
        }
        options.append(row);
      }
      questionBox.append(options);
    }
    card.append(questionBox);
  }

  const summary = element('div', 'decision-summary');
  if (decision.resolution) {
    const choices = Array.isArray(decision.resolution.chosen)
      ? decision.resolution.chosen.join('、')
      : decision.resolution.chosen;
    if (choices) summary.append(element('span', 'meta', `選択: ${choices}`));
    if (decision.resolution.note) summary.append(element('span', 'meta', decision.resolution.note));
  }
  appendDecisionAnswer(card, decision, product, session, summary);
  if (summary.children.length) card.append(summary);
  list.append(card);
}

function appendExpandToggle(target, set, key, label, count, attr) {
  const expanded = set.has(key);
  const [attribute, value] = typeof attr === 'string' ? [attr, key] : [attr.name, attr.value];
  const datasetKey = attribute.slice(5).replace(/-([a-z])/g, (_, letter) => letter.toUpperCase());
  const toggle = element('button', 'ended-toggle', label(expanded, count));
  toggle.type = 'button';
  toggle.setAttribute('aria-expanded', String(expanded));
  toggle.dataset[datasetKey] = value;
  toggle.addEventListener('click', () => {
    if (expanded) set.delete(key);
    else set.add(key);
    if (lastState) render(lastState);
    [...root.querySelectorAll(`[${attribute}]`)]
      .find((button) => button.dataset[datasetKey] === value)?.focus({ preventScroll: true });
  });
  target.append(toggle);
}

function appendPlanToggle(body, kind, sessionId, count, label, expandedSet) {
  const key = `${kind}:${sessionId}`;
  appendExpandToggle(body, expandedSet, sessionId,
    (expanded, itemCount) => `${expanded ? `${label}を隠す` : `${label}を表示`} (${itemCount} 件)`,
    count, { name: 'data-plan-toggle', value: key });
}

function kindToggleLabel(label, expanded, count) {
  return expanded ? `${label}を畳む` : `${label}を表示 (${count} 件)`;
}

function appendKindToggle(body, sectionKey, expanded, count, label) {
  appendExpandToggle(body, expandedKindSections, sectionKey,
    (isExpanded, itemCount) => kindToggleLabel(label, isExpanded, itemCount), count, 'data-kind-toggle');
}

function appendDecisions(body, session, product, withTags = false, multipleSessions = false) {
  const decisions = newestFirst(session.decisions);
  const active = newestFirst(shownActiveDecisions(session));
  const ended = displayPreferences.hideFinished ? [] : decisions.filter(isEndedDecision);
  const expanded = !displayPreferences.hideFinished && expandedEndedDecisions.has(session.session_id);
  const visible = expanded ? newestFirst([...active, ...ended]) : active;
  if (visible.length) {
    const list = element('div', 'decision-list');
    for (const decision of visible) appendDecisionCard(list, decision, product, session, withTags, multipleSessions);
    body.append(list);
  } else if (!shownPermissions(session).length && !shownCommonQuestions(session).length && !hasHiddenJudgmentItems(session)) body.append(element('div', 'empty', ended.length ? '未解決の判断事項はありません。' : 'ありません'));
  if (ended.length) appendPlanToggle(body, 'decisions', session.session_id, ended.length, '解決済みと取り下げ', expandedEndedDecisions);
}

function commonQuestionSelectedLabels(question) {
  const selected = new Map((question.selectedOptionIds || []).map((answer) => [answer.questionId, new Set(answer.optionIds)]));
  return question.questions.flatMap((item) => item.options.filter((option) => selected.get(item.id)?.has(option.id))
    .map((option) => option.label));
}

function sameCommonQuestionAnswers(left, right) {
  return left.length === right.length && left.every((answer, index) => answer.questionId === right[index].questionId
    && answer.freeText === right[index].freeText
    && answer.optionIds.length === right[index].optionIds.length
    && answer.optionIds.every((id) => right[index].optionIds.includes(id)));
}

function commonQuestionAnswersValid(questions, answers) {
  return questions.every((question) => {
    const answer = answers.find((item) => item.questionId === question.id);
    const count = answer?.optionIds.length || 0;
    const hasFreeText = Boolean(answer?.freeText.trim());
    if (!question.options.length) return hasFreeText;
    if (question.mode === 'single' && count > 1) return false;
    return count > 0 || hasFreeText;
  });
}

function readCommonQuestionDraft(card) {
  const answers = (lastState?.sessions || [])
    .find((session) => session.session_id === card.dataset.sessionId)?.commonQuestions
    ?.find((question) => question.internalQuestionId === card.dataset.internalQuestionId)?.questions || [];
  return answers.map((question) => ({
    questionId: question.id,
    optionIds: [...card.querySelectorAll('[data-common-option]')]
      .filter((input) => input.dataset.questionId === question.id && input.checked)
      .map((input) => input.dataset.optionId),
    freeText: [...card.querySelectorAll('[data-common-free-text]')].find((input) => input.dataset.commonFreeText === question.id)?.value || '',
  }));
}

function updateCommonQuestionSubmit(card) {
  const question = (lastState?.sessions || [])
    .find((session) => session.session_id === card.dataset.sessionId)?.commonQuestions
    ?.find((item) => item.internalQuestionId === card.dataset.internalQuestionId);
  const button = card.querySelector('[data-common-submit]');
  if (!question || !button) return;
  const answers = readCommonQuestionDraft(card);
  commonQuestionDrafts.set(commonQuestionKey(question), answers.map((answer) => ({ ...answer, optionIds: [...answer.optionIds] })));
  const submittedLate = commonQuestionSubmittedDrafts.get(commonQuestionKey(question));
  button.disabled = commonQuestionInFlight.has(commonQuestionKey(question)) || !commonQuestionAnswersValid(question.questions, answers)
    || Boolean(submittedLate && sameCommonQuestionAnswers(answers, submittedLate));
}

function appendCommonQuestions(body, session, product, withTags = false, multipleSessions = false) {
  const questions = shownCommonQuestions(session);
  if (!questions.length) return;
  body.append(element('h3', 'sub', '共通質問'));
  const list = element('div', 'common-question-list');
  for (const question of questions) {
    const key = commonQuestionKey(question);
    const card = element('article', 'common-question');
    card.dataset.sessionId = session.session_id;
    card.dataset.internalQuestionId = question.internalQuestionId;
    const head = element('div', 'common-question-head');
    head.append(element('h4', '', question.questionId));
    appendContextTags(head, product, session, withTags, multipleSessions);
    card.append(head);
    card.append(element('p', 'common-question-status', commonQuestionDeliveryText(question)));
    if (!question.selectionSource && !question.cancelled) {
      const deadline = absoluteTimeLabel(question.deadlineAt);
      card.append(element('p', 'common-question-note', question.held
        ? `保留中です。回答期限 ${deadline}。保留を解除するまで自動選択しません。`
        : `回答期限 ${deadline}。離席中は期限後、すべての質問が単一選択で推奨案を持つ場合だけ仮選択します。`));
    }
    if (question.selectionSource) {
      const labels = commonQuestionSelectedLabels(question);
      card.append(element('p', 'common-question-selection', labels.length
        ? question.selectionSource === 'away-default' ? `離席時の推奨で仮選択: ${labels.join('、')}` : `保存した選択: ${labels.join('、')}`
        : '自由記入を含む回答を保存しました。'));
    }
    if (question.externalResolution) card.append(element('p', 'common-question-note', '元の質問は外部で解決済みです。ここで保存する回答は後続の指示として記録します。'));
    if (question.lateAnswerCount > 0) card.append(element('p', 'common-question-note', `後続の回答を ${question.lateAnswerCount} 件保存しました。配送は保留しています。`));
    for (const ref of question.lateAnswerRefs || []) {
      const target = instructionTargetFor(lastState, question.launchRef);
      const mode = target?.status === 'working' && target.nativeTurnId ? 'steer'
        : target?.status === 'stopped' && target.origin === 'standalone' ? 'start' : null;
      card.append(element('p', 'common-question-note', `保存した後続回答 ${absoluteTimeLabel(ref.submittedAt)}。回答内容は状態画面に表示しません。`));
      if (mode) {
        const lateKey = `late:${question.internalQuestionId}:${ref.index}:${ref.digest}`;
        const convert = element('button', 'secondary', 'この保存済み回答から後続の指示を作る');
        convert.type = 'button';
        convert.dataset.lateInstruction = 'true';
        convert.dataset.lateQuestionId = question.internalQuestionId;
        convert.dataset.lateIndex = String(ref.index);
        convert.dataset.lateDigest = ref.digest;
        convert.dataset.lateMode = mode;
        convert.dataset.lateExpectedTurn = mode === 'steer' ? target.nativeTurnId : '';
        convert.dataset.sessionId = session.session_id;
        convert.dataset.instructionExecution = question.executionId;
        convert.disabled = instructionInFlight.has(lateKey);
        card.append(convert);
        const error = element('p', 'instruction-reason', instructionErrors.get(lateKey) || '');
        error.hidden = !error.textContent;
        error.setAttribute('role', 'alert');
        card.append(error);
      } else {
        card.append(element('p', 'instruction-reason', '保存済み回答の指示化は、送信先を確認できるまで保留しています。'));
      }
    }
    const formAvailable = !question.cancelled
      && !(question.deliveryState === 'applied' && question.selectionSource !== 'away-default');
    if (formAvailable) {
      const draft = commonQuestionDraft(question);
      const form = element('div', 'common-question-form');
      for (const item of question.questions) {
        const fieldset = element('fieldset', 'common-question-fieldset');
        fieldset.append(element('legend', '', item.text));
        if (item.options.length) {
          const choiceHelp = item.allowFreeText
            ? item.mode === 'multi' ? '複数選択するか、自由記入で回答してください。' : '1つ選択するか、自由記入で回答してください。'
            : item.mode === 'multi' ? '複数選択できます。' : '1つ選択してください。';
          fieldset.append(element('small', 'common-question-help', choiceHelp));
        }
        const answer = draft.find((entry) => entry.questionId === item.id);
        for (const option of item.options) {
          const label = element('label', 'common-question-option');
          const input = element('input');
          input.type = item.mode === 'single' ? 'radio' : 'checkbox';
          input.name = `${question.internalQuestionId}-${item.id}`;
          input.dataset.commonOption = 'true';
          input.dataset.questionId = item.id;
          input.dataset.optionId = option.id;
          input.checked = answer.optionIds.includes(option.id);
          input.disabled = commonQuestionInFlight.has(key);
          label.append(input, element('span', '', option.label));
          if (option.description) label.append(element('small', '', option.description));
          if (option.id === item.recommendedOptionId) label.append(element('small', 'common-question-recommended', '推奨'));
          fieldset.append(label);
        }
        if (item.allowFreeText) {
          const freeLabel = element('label', 'common-question-free-label', '自由記入');
          const textarea = element('textarea', 'common-question-free');
          textarea.rows = 2;
          textarea.maxLength = 2000;
          textarea.dataset.commonFreeText = item.id;
          textarea.setAttribute('aria-label', `${item.text}の自由記入`);
          textarea.value = answer.freeText;
          textarea.disabled = commonQuestionInFlight.has(key);
          freeLabel.append(textarea);
          fieldset.append(freeLabel, element('small', 'common-question-help', '下書きはこのページを開いている間だけ保持します。'));
        }
        form.append(fieldset);
      }
      const error = element('p', 'common-question-error', commonQuestionErrors.get(key) || '');
      error.hidden = !error.textContent;
      error.setAttribute('role', 'alert');
      const notice = element('p', 'common-question-note', commonQuestionNotices.get(key) || '');
      notice.hidden = !notice.textContent;
      const actions = element('div', 'common-question-actions');
      const submit = element('button', 'primary', question.selectionSource ? '後続の回答を保存' : '回答を保存');
      submit.type = 'button';
      submit.dataset.commonSubmit = question.internalQuestionId;
      submit.dataset.sessionId = session.session_id;
      const submittedLate = commonQuestionSubmittedDrafts.get(key);
      submit.disabled = commonQuestionInFlight.has(key) || !commonQuestionAnswersValid(question.questions, draft)
        || Boolean(submittedLate && sameCommonQuestionAnswers(draft, submittedLate));
      actions.append(submit);
      if (!question.selectionSource) {
        const hold = element('button', 'secondary', question.held ? '保留を解除' : '質問を保留');
        hold.type = 'button';
        hold.dataset.commonHold = question.internalQuestionId;
        hold.dataset.sessionId = session.session_id;
        hold.dataset.held = String(!question.held);
        hold.disabled = commonQuestionInFlight.has(key);
        actions.append(hold);
      }
      let cancelConfirmation = null;
      if (!question.cancelled && question.deliveryState !== 'applied') {
        if (commonQuestionCancelConfirmations.has(key)) {
          const sent = ['sending', 'accepted', 'unknown', 'applied'].includes(question.deliveryState);
          const topics = question.questions.map((item) => item.text).join(' / ');
          cancelConfirmation = element('div', 'common-question-confirmation');
          cancelConfirmation.setAttribute('role', 'group');
          cancelConfirmation.setAttribute('aria-label', '質問の取り下げ確認');
          cancelConfirmation.append(element('p', '', '質問「' + question.questionId + '」を取り下げますか。'));
          cancelConfirmation.append(element('p', '', '対象: ' + topics + '。質問履歴は削除しません。'));
          cancelConfirmation.append(element('p', '', sent
            ? '送信開始後のため配送を止められず、取消要求のみを記録します。'
            : '送信前のため、未送信回答の配送を止めます。'));
          const confirmActions = element('div', 'common-question-confirm-actions');
          const confirm = element('button', 'confirm', '取り下げる');
          confirm.type = 'button';
          confirm.dataset.commonCancelConfirm = question.internalQuestionId;
          confirm.dataset.sessionId = session.session_id;
          confirm.disabled = commonQuestionInFlight.has(key);
          const dismiss = element('button', 'secondary', '戻る');
          dismiss.type = 'button';
          dismiss.dataset.commonCancelDismiss = question.internalQuestionId;
          dismiss.dataset.sessionId = session.session_id;
          dismiss.disabled = commonQuestionInFlight.has(key);
          confirmActions.append(confirm, dismiss);
          cancelConfirmation.append(confirmActions);
        } else {
          const cancel = element('button', 'secondary', question.cancelRequested ? '取消要求済み' : '質問を取り下げる');
          cancel.type = 'button';
          cancel.dataset.commonCancel = question.internalQuestionId;
          cancel.dataset.sessionId = session.session_id;
          cancel.disabled = commonQuestionInFlight.has(key);
          actions.append(cancel);
        }
      }
      form.append(element('small', 'common-question-help', 'すべての質問に回答すると保存できます。'), error, notice, actions);
      if (cancelConfirmation) form.append(cancelConfirmation);
      card.append(form);
    }
    list.append(card);
  }
  body.append(list);
}

function instructionTargetFor(state, launchRef) {
  return (state?.instructionTargets || []).find((target) => target.launchRef === launchRef) || null;
}

function instructionTargetsForSession(state, sessionId) {
  return (state?.instructionTargets || []).filter((target) => target.sessionId === sessionId);
}

function instructionTargetName(target) {
  const origin = target.origin === 'standalone' ? '独立実行' : target.origin === 'delegated' ? '委譲実行' : '確認対象';
  return `${target.identity?.nativeId || target.launchRef} · ${origin}`;
}

function findInstructionRecord(state, id) {
  return (state?.sessions || []).flatMap((session) => (session.instructions || []).map((instruction) => ({
    ...instruction, ownerSessionId: session.session_id,
  }))).find((instruction) => instruction.deliveryAttemptId === id) || null;
}

function sameInstructionIdentity(left, right) {
  return Boolean(left && right && ['provider', 'nativeIdKind', 'hostId', 'homeScopeId', 'nativeId']
    .every((key) => left[key] === right[key]));
}

function instructionAlternativeRetryState(state, request) {
  const diagnostics = state?.instructionDiagnostics;
  const target = instructionTargetFor(state, request.launchRef);
  const old = findInstructionRecord(state, request.oldDeliveryAttemptId);
  const created = findInstructionRecord(state, request.newDeliveryAttemptId);
  const targetMatches = Boolean(target && target.sessionId === request.sessionId &&
    target.executionId === request.registrationExecutionId && target.origin === 'standalone');
  const oldMatches = Boolean(old && old.ownerSessionId === request.sessionId && old.launchRef === request.launchRef &&
    old.executionId === request.executionId && old.registrationExecutionId === request.registrationExecutionId &&
    old.logicalMessageId === request.logicalMessageId && old.origin === 'standalone' && old.revision + 1 === request.revision &&
    ['available', 'claimed', 'superseded_before_send'].includes(old.state) &&
    sameInstructionIdentity(old.identity, target?.identity));
  const createdScopeMatches = Boolean(created && created.ownerSessionId === request.sessionId &&
    created.launchRef === request.launchRef && created.executionId === request.executionId &&
    created.registrationExecutionId === request.registrationExecutionId &&
    created.logicalMessageId === request.logicalMessageId && created.revision === request.revision &&
    created.origin === 'standalone' && created.mode === 'next-user-input' &&
    sameInstructionIdentity(created.identity, target?.identity));
  const createdAvailable = createdScopeMatches && ['available', 'claimed'].includes(created.state);
  const createdMissing = createdScopeMatches && created.state === 'unavailable' &&
    created.heldReason === 'instruction_delivery_missing';
  const createdMatches = !created || createdAvailable || createdMissing;
  const commonMatches = diagnostics?.targets === 'available' && targetMatches && target?.status === 'stopped' &&
    instructionTargetMode(target, 'next-user-input') && oldMatches && createdMatches;
  const readyRetry = diagnostics?.service === 'ready' && diagnostics.blocked !== true &&
    (!created || createdAvailable);
  const missingDeliveryRecovery = diagnostics?.service === 'blocked' && diagnostics.blocked === true &&
    diagnostics.errorCode === 'instruction_delivery_missing' && old?.state === 'superseded_before_send' && createdMissing;
  const allowed = commonMatches && (readyRetry || missingDeliveryRecovery);
  let reason = null;
  if (!targetMatches && diagnostics?.targets !== 'available') {
    reason = '実行先の状態を確認できません。内容はこの画面に保持しています。';
  } else if (!targetMatches || !oldMatches || !createdMatches) {
    reason = '対象の状態が変わったため、保存結果を確認できません。内容はこの画面に保持しています。';
  } else if (!allowed) {
    reason = diagnostics?.service !== 'ready' || diagnostics?.blocked === true
      ? '保存機能の復旧後に、同じ内容で結果を確認できます。'
      : '対象の実行が確認待ちです。状態が戻るまで、内容をこの画面に保持しています。';
  }
  return { allowed, reason, target };
}

function instructionPreviewRecoveryPanel(state) {
  const pending = [...instructionPreviewSavePending.entries()]
    .filter(([, record]) => record?.phase === 'pending');
  if (!pending.length) return null;
  const panel = element('section', 'instruction-composer instruction-recovery');
  panel.setAttribute('aria-label', '指示本文の保存を確認');
  const heading = element('h2', '', 'このタブへの本文保存を確認');
  heading.dataset.instructionPreviewRecoveryHeading = 'true';
  heading.tabIndex = -1;
  panel.append(heading);
  panel.append(element('p', 'instruction-reason',
    'サーバーへの保存は確認済みです。本文をこのタブに保存するまで、タブを閉じると内容を復元できません。'));
  for (const [id, record] of pending) {
    const instruction = record.instruction;
    const target = instructionTargetFor(state, instruction.launchRef);
    const targetName = target ? instructionTargetName(target) : '実行先を確認できません';
    const createdAt = Number.isSafeInteger(instruction.createdAt) ? absoluteTimeLabel(instruction.createdAt) : '作成時刻不明';
    const item = element('article', 'instruction-card');
    const itemHeading = element('h3', '', instructionModeLabel(instruction.mode) + ' · ' + targetName + ' · ' + createdAt);
    itemHeading.dataset.instructionPreviewTitle = id;
    itemHeading.tabIndex = -1;
    item.append(itemHeading);
    const preview = element('section', 'instruction-preview');
    preview.append(element('strong', '', '保存済みの指示本文'));
    const text = element('textarea');
    text.value = record.text;
    text.readOnly = true;
    text.rows = 4;
    text.dataset.instructionPreviewRecoveryText = id;
    text.setAttribute('aria-label', '保存済みの指示本文');
    preview.append(text);
    item.append(preview);
    const errorMessage = instructionErrors.get('preview:' + id);
    if (errorMessage) {
      const error = element('p', 'instruction-reason', errorMessage);
      error.setAttribute('role', 'alert');
      item.append(error);
    }
    const retry = element('button', '', 'このタブに本文を保存する');
    retry.type = 'button';
    retry.dataset.instructionPreviewRetry = id;
    item.append(retry);
    panel.append(item);
  }
  return panel;
}

function instructionAlternativeRecoveryPanel(state) {
  const pending = [...instructionAlternatives.entries()]
    .filter(([, draft]) => draft?.pendingRequest);
  if (!pending.length) return null;
  const panel = element('section', 'instruction-composer instruction-recovery');
  panel.setAttribute('aria-label', '保存結果を確認する指示');
  const panelHeading = element('h2', '', '差し替えの保存結果を確認');
  panelHeading.dataset.instructionRecoveryHeading = 'true';
  panelHeading.tabIndex = -1;
  panel.append(panelHeading);
  panel.append(element('p', 'instruction-reason', '保存結果が返らなかった指示です。同じ内容の保存を明示して結果を確認できます。自動送信はしません。'));
  for (const [oldId, draft] of pending) {
    const request = draft.pendingRequest;
    const retry = instructionAlternativeRetryState(state, request);
    const item = element('article', 'instruction-card');
    const targetName = retry.target ? instructionTargetName(retry.target) : '実行先を確認できません';
    const heading = element('h3', '', `${targetName} · 次の入力へ差し替え`);
    heading.dataset.instructionAlternativeTitle = oldId;
    heading.tabIndex = -1;
    item.append(heading);
    const preview = element('section', 'instruction-preview');
    preview.append(element('strong', '', '保存要求に固定した内容'));
    const fixedText = element('textarea');
    fixedText.value = request.text;
    fixedText.readOnly = true;
    fixedText.rows = 4;
    fixedText.dataset.instructionRecoveryText = oldId;
    fixedText.setAttribute('aria-label', '保存要求に固定した内容');
    preview.append(fixedText);
    item.append(preview);
    const errorMessage = instructionErrors.get('alternative:' + oldId);
    if (errorMessage) {
      const error = element('p', 'instruction-reason', errorMessage);
      error.setAttribute('role', 'alert');
      item.append(error);
    }
    if (retry.reason) item.append(element('p', 'instruction-reason', retry.reason));
    const actions = element('div', 'instruction-actions');
    const retryButton = element('button', '', '同じ内容で保存結果を確認する');
    retryButton.type = 'button';
    retryButton.dataset.instructionAlternativeRetry = oldId;
    retryButton.disabled = !retry.allowed;
    if (instructionAlternativeInFlight.has(oldId)) retryButton.textContent = '保存結果を確認中…';
    actions.append(retryButton);
    if (instructionAlternativeDiscardConfirmations.has(oldId)) {
      const confirmation = element('p', 'instruction-reason', 'この要求内容だけをこの画面から破棄します。サーバーの履歴は削除されません。');
      const discard = element('button', '', '要求内容を破棄する');
      discard.type = 'button';
      discard.dataset.instructionAlternativeDiscard = oldId;
      const keep = element('button', '', '戻る');
      keep.type = 'button';
      keep.dataset.instructionAlternativeDiscardDismiss = oldId;
      actions.append(confirmation, discard, keep);
    } else {
      const askDiscard = element('button', '', 'この要求内容を破棄');
      askDiscard.type = 'button';
      askDiscard.dataset.instructionAlternativeDiscardAsk = oldId;
      actions.append(askDiscard);
    }
    item.append(actions);
    panel.append(item);
  }
  return panel;
}

function instructionCard(session, state, instruction) {
  const card = element('article', 'instruction-card');
  const target = instructionTargetFor(state, instruction.launchRef);
  const serviceReady = state?.instructionDiagnostics?.service === 'ready' && state?.instructionDiagnostics?.blocked !== true;
  const targetReady = target && instruction.executionState === 'active' && instructionTargetMode(target, instruction.mode);
  const preview = instructionPreviewFor(instruction);
  const targetLabel = target ? instructionTargetName(target) : '実行先を確認できません';
  const createdAt = Number.isSafeInteger(instruction.createdAt) ? absoluteTimeLabel(instruction.createdAt) : '作成時刻不明';
  const alternativeDraft = instructionAlternatives.get(instruction.deliveryAttemptId);
  const alternativePending = Boolean(alternativeDraft?.pendingRequest);
  const title = element('h4', '', `${instructionModeLabel(instruction.mode)} · ${targetLabel} · ${createdAt}`);
  title.dataset.instructionPreviewTitle = instruction.deliveryAttemptId;
  title.tabIndex = -1;
  card.append(title);
  card.append(element('p', 'instruction-status', instructionStateLabel(instruction)));
  if (!isFinishedInstruction(instruction)) {
    const previewPanel = element('section', 'instruction-preview');
    previewPanel.append(element('strong', '', '送信内容'));
    if (preview) previewPanel.append(element('pre', '', preview));
    else previewPanel.append(element('p', 'instruction-reason', 'このタブで内容を確認できないため送信できません。作成したタブで開いてください。'));
    card.append(previewPanel);
  }
  if (target?.status === 'waiting' && ['available', 'claimed'].includes(instruction.state)) {
    card.append(element('p', 'instruction-reason', instructionTargetWaitingNotice(target)));
  }
  if (instruction.heldReason) card.append(element('p', 'instruction-reason', instructionReasonLabel(instruction.heldReason)));
  else if (!targetReady && target?.status !== 'waiting' && ['available', 'claimed'].includes(instruction.state)) {
    card.append(element('p', 'instruction-reason', '実行先の状態を確認できないため、送信を保留しています。'));
  }
  const actionError = instructionErrors.get(`action:${instruction.deliveryAttemptId}`);
  if (actionError) card.append(element('p', 'instruction-reason', actionError));
  const actions = element('div', 'instruction-actions');
  const operationKey = instruction.deliveryAttemptId;
  const busy = instructionInFlight.has(operationKey) || instructionAlternativeInFlight.has(operationKey) || alternativePending;
  if (['available', 'claimed'].includes(instruction.state)) {
    const send = element('button', '', preview
      ? instruction.mode === 'start' ? '同じ実行で次の入力を開始' : 'この実行へ送る'
      : '内容を確認できないため送信できません');
    send.type = 'button';
    send.dataset.instructionAction = 'send';
    send.dataset.instructionId = instruction.deliveryAttemptId;
    send.dataset.instructionSession = session.session_id;
    send.dataset.instructionExecution = instruction.registrationExecutionId;
    send.disabled = busy || !serviceReady || !targetReady || !preview;
    actions.append(send);
    const cancel = element('button', '', '保存した指示を取り下げる');
    cancel.type = 'button';
    cancel.dataset.instructionAction = 'cancel';
    cancel.dataset.instructionId = instruction.deliveryAttemptId;
    cancel.dataset.instructionSession = session.session_id;
    cancel.dataset.instructionExecution = instruction.registrationExecutionId;
    cancel.disabled = busy || !serviceReady;
    actions.append(cancel);
    if (!alternativePending && instruction.origin === 'standalone' && instruction.executionState === 'active' && target?.status === 'stopped' && serviceReady) {
      const alternative = element('button', '', '次の入力へ差し替える');
      alternative.type = 'button';
      alternative.dataset.instructionAlternativeOpen = instruction.deliveryAttemptId;
      alternative.dataset.instructionSession = session.session_id;
      alternative.dataset.instructionExecution = instruction.registrationExecutionId;
      alternative.setAttribute('aria-expanded', String(instructionAlternatives.get(operationKey)?.open === true));
      actions.append(alternative);
    }
  }
  if (actions.childNodes.length) card.append(actions);
  const alternativeTargetMatches = Boolean(target && target.sessionId === session.session_id &&
    target.executionId === instruction.registrationExecutionId && target.origin === 'standalone');
  const alternativeCanSubmit = serviceReady && state?.instructionDiagnostics?.targets === 'available' &&
    alternativeTargetMatches && target?.status === 'stopped' && instructionTargetMode(target, 'next-user-input');
  if (alternativeDraft?.open && !alternativePending && ['available', 'claimed'].includes(instruction.state) &&
      instruction.origin === 'standalone' && instruction.executionState === 'active' && alternativeTargetMatches) {
    const form = element('form', 'instruction-form');
    form.dataset.instructionAlternativeForm = instruction.deliveryAttemptId;
    form.dataset.instructionSession = session.session_id;
    form.dataset.instructionExecution = instruction.registrationExecutionId;
    const label = element('label', '', '次に送る指示');
    const textarea = element('textarea');
    textarea.name = 'text';
    textarea.maxLength = 65536;
    textarea.required = true;
    textarea.dataset.instructionField = 'alternative-text';
    textarea.dataset.instructionSession = session.session_id;
    textarea.dataset.instructionId = instruction.deliveryAttemptId;
    textarea.value = alternativeDraft.text;
    textarea.readOnly = instructionAlternativeInFlight.has(operationKey);
    label.append(textarea);
    form.append(label);
    if (!alternativeCanSubmit) {
      form.append(element('p', 'instruction-reason', state?.instructionDiagnostics?.service !== 'ready' || state?.instructionDiagnostics?.blocked === true
        ? '保存機能の復旧後に続けられます。入力内容は保持しています。'
        : '対象の実行が確認待ちです。状態が戻るまで入力内容を保持しています。'));
    }
    const error = element('p', 'instruction-reason', instructionErrors.get('alternative:' + operationKey) || '');
    error.hidden = !error.textContent;
    error.setAttribute('role', 'alert');
    const submit = element('button', '', '差し替えを保存する');
    submit.type = 'submit';
    submit.disabled = instructionAlternativeInFlight.has(operationKey) || !alternativeCanSubmit || !alternativeDraft.text.trim();
    form.append(error, submit);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      void runInstructionAlternative(form);
    });
    card.append(form);
  }
  return card;
}

function instructionComposer(session, state) {
  const targets = instructionTargetsForSession(state, session.session_id);
  const instructions = Array.isArray(session.instructions) ? session.instructions : [];
  const serviceReady = state?.instructionDiagnostics?.service === 'ready' && state?.instructionDiagnostics?.blocked !== true;
  if (!targets.length && !instructions.length) return null;
  const panel = element('section', 'instruction-composer');
  panel.setAttribute('aria-label', '指示の保存と送信');
  panel.append(element('h4', '', '指示を保存して届ける'));
  if (!serviceReady) {
    const reason = state?.instructionDiagnostics?.errorCode || state?.instructionDiagnostics?.service || 'instruction_dispatch_unavailable';
    panel.append(element('p', 'instruction-reason', instructionReasonLabel(reason)));
  } else if (state?.instructionDiagnostics?.targets !== 'available') {
    panel.append(element('p', 'instruction-reason', '実行先を確認できないため、指示を保存できません。'));
  }
  for (const instruction of instructions) panel.append(instructionCard(session, state, instruction));
  if (serviceReady && state?.instructionDiagnostics?.targets === 'available') {
    const draft = instructionDraftFor(session.session_id);
    const form = element('form', 'instruction-form');
    form.dataset.instructionCreateForm = 'true';
    form.dataset.instructionSession = session.session_id;
    const targetLabel = element('label', '', '対象の実行');
    const targetSelect = element('select');
    targetSelect.name = 'launch_ref';
    targetSelect.dataset.instructionField = 'target';
    targetSelect.dataset.instructionSession = session.session_id;
    targetSelect.disabled = instructionInFlight.has(session.session_id);
    const placeholder = element('option', '', '実行を選択してください');
    placeholder.value = '';
    targetSelect.append(placeholder);
    for (const target of targets) {
      const option = element('option', '', `${instructionTargetName(target)} · ${instructionTargetStatusText(target)}`);
      option.value = target.launchRef;
      targetSelect.append(option);
    }
    if (draft.targetLaunchRef && !targets.some((target) => target.launchRef === draft.targetLaunchRef)) {
      const stale = element('option', '', '以前の実行 (現在選択できません)');
      stale.value = draft.targetLaunchRef;
      stale.disabled = true;
      targetSelect.append(stale);
    }
    targetSelect.value = draft.targetLaunchRef || '';
    targetLabel.append(targetSelect);
    form.append(targetLabel);
    const target = targets.find((candidate) => candidate.launchRef === draft.targetLaunchRef) || null;
    const modeLabel = element('label', '', '指示の種類');
    const modeSelect = element('select');
    modeSelect.name = 'mode';
    modeSelect.dataset.instructionField = 'mode';
    modeSelect.dataset.instructionSession = session.session_id;
    modeSelect.disabled = instructionInFlight.has(session.session_id);
    const modePlaceholder = element('option', '', '種類を選択してください');
    modePlaceholder.value = '';
    modeSelect.append(modePlaceholder);
    const modes = target?.status === 'working' ? ['steer']
      : target?.status === 'stopped' && target.origin === 'standalone' ? ['start'] : [];
    for (const mode of modes) {
      const option = element('option', '', instructionModeLabel(mode));
      option.value = mode;
      modeSelect.append(option);
    }
    modeSelect.value = modes.includes(draft.mode) ? draft.mode : '';
    modeLabel.append(modeSelect);
    form.append(modeLabel);
    const textareaLabel = element('label', '', '指示の内容');
    const textarea = element('textarea');
    textarea.name = 'text';
    textarea.maxLength = 65536;
    textarea.required = true;
    textarea.dataset.instructionField = 'text';
    textarea.dataset.instructionSession = session.session_id;
    textarea.value = draft.text;
    textarea.disabled = instructionInFlight.has(session.session_id);
    textareaLabel.append(textarea);
    form.append(textareaLabel);
    const expected = target?.status === 'waiting'
      ? instructionTargetWaitingNotice(target)
      : target?.status === 'unverified'
        ? '実行状態を確認できないため、追加の指示は保留されています。入力内容は保持されます。'
      : target && draft.mode === 'steer' && target.nativeTurnId
        ? '選択した実行が作業中の場合に送信します。'
        : target?.reason || '実行先と指示の種類を選んでください。';
    const targetReason = element('p', 'instruction-reason', expected);
    if (target?.status === 'waiting') {
      targetReason.id = `instruction-target-waiting-${encodeURIComponent(session.session_id)}`;
      for (const control of [targetSelect, modeSelect, textarea]) {
        control.setAttribute('aria-describedby', targetReason.id);
      }
    }
    form.append(targetReason);
    const error = element('p', 'instruction-reason', instructionErrors.get(session.session_id) || '');
    error.hidden = !error.textContent;
    error.setAttribute('role', 'alert');
    const notice = element('p', 'instruction-status', instructionNotices.get(session.session_id) || '');
    notice.hidden = !notice.textContent;
    const actions = element('div', 'instruction-actions');
    const save = element('button', '', '指示を保存する');
    save.type = 'submit';
    save.disabled = instructionInFlight.has(session.session_id) || !serviceReady || !target ||
      !instructionTargetMode(target, draft.mode) || !draft.text.trim();
    actions.append(save);
    form.append(error, notice, actions);
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      void runInstructionCreate(form);
    });
    panel.append(form);
  }
  return panel;
}

function setInstructionDraftField(sessionId, field, value) {
  const draft = instructionDraftFor(sessionId);
  if (draft[field] === value) return draft;
  draft[field] = value;
  draft.deliveryAttemptId = null;
  draft.logicalMessageId = null;
  instructionErrors.delete(sessionId);
  instructionNotices.delete(sessionId);
  return draft;
}

function updateInstructionSave(form) {
  const sessionId = form.dataset.instructionSession;
  const draft = instructionDraftFor(sessionId);
  const target = instructionTargetFor(lastState, draft.targetLaunchRef);
  const submit = form.querySelector('[type="submit"]');
  if (submit) submit.disabled = instructionInFlight.has(sessionId) || !target ||
    !instructionTargetMode(target, draft.mode) || !draft.text.trim();
}
function appendTaskItem(list, task, product, session, withTags = false, multipleSessions = false) {
  const labels = { todo: '未着手', doing: '作業中', done: '完了' };
  const item = element('li', `task-item ${task.state}`);
  const header = element('div', 'task-head');
  header.append(badge(labels[task.state] || task.state, task.state === 'done' ? 'done' : task.state === 'doing' ? 'busy' : ''));
  appendContextTags(header, product, session, withTags, multipleSessions);
  header.append(element('span', 'task-title', task.title));
  const met = task.criteria.filter((criterion) => criterion.met).length;
  header.append(element('span', 'meta', `完了条件 ${met}/${task.criteria.length}${task.closedByUser ? '、画面で完了にした' : ''}`));
  if (task.state !== 'done') {
    const closeKey = `${session.session_id}::${task.title}`;
    const pending = pendingTaskCloseActions.has(closeKey);
    const sending = taskCloseActionsInFlight.has(closeKey);
    const close = element('button', 'link-btn close-task', pending ? '取り消す' : sending ? '送信中…' : '完了にする');
    close.type = 'button';
    close.disabled = sending;
    if (pending) close.dataset.cancelCloseTask = closeKey;
    else if (!sending) close.dataset.closeTask = closeKey;
    header.append(close);
    if (pending) header.append(element('span', 'meta', '5 秒後に完了にします。'));
  }
  item.append(header);
  if (task.criteria.length) {
    const criteria = element('ul', 'criteria-list');
    for (const criterion of task.criteria) {
      const row = element('li', criterion.met ? 'met' : '', criterion.text);
      criteria.append(row);
    }
    item.append(criteria);
  }
  list.append(item);
}

function appendTasks(body, session, product, withTags = false, multipleSessions = false) {
  const tasks = session.tasks;
  const heading = element('h3', 'sub', 'タスクと完了条件 ');
  if (session.tasksUpdatedAt) heading.append(element('span', 'meta', `最終更新 ${durationAgoLabel(session.tasksUpdatedAt)}`));
  body.append(heading);
  if (!tasks.length) {
    body.append(element('div', 'empty', 'タスクはありません。'));
    return;
  }
  const showTodo = expandedTodoTasks.has(session.session_id);
  const showDone = expandedDoneTasks.has(session.session_id);
  const { todoCount, doneCount, visible } = taskVisibility(session, showTodo, showDone);
  if (!visible.length) body.append(element('div', 'empty', '未完了のタスクはありません。'));
  else {
    const list = element('ul', 'task-list');
    for (const task of visible) appendTaskItem(list, task, product, session, withTags, multipleSessions);
    body.append(list);
  }
  if (todoCount) appendPlanToggle(body, 'todoTasks', session.session_id, todoCount, '未着手のタスク', expandedTodoTasks);
  if (doneCount) appendPlanToggle(body, 'tasks', session.session_id, doneCount, '完了したタスク', expandedDoneTasks);
}

// 作業中のタスクがあるときは未着手を畳み、今やっていることを先に見せる。未着手しか無ければ畳まない。
function taskVisibility(session, showTodo, showDone) {
  const doing = session.tasks.some((task) => task.state === 'doing');
  const todo = doing ? session.tasks.filter((task) => task.state === 'todo') : [];
  const done = session.tasks.filter((task) => task.state === 'done');
  const visible = session.tasks.filter((task) => (
    task.state === 'done' ? showDone : task.state === 'todo' && doing ? showTodo : true
  ));
  return { todoCount: todo.length, doneCount: done.length, visible };
}

function kindDoneTaskCount(references) {
  return references.reduce((count, { session }) => count + taskVisibility(session, true, true).doneCount, 0);
}

function kindTodoTaskCount(references) {
  return references.reduce((count, { session }) => count + taskVisibility(session, true, true).todoCount, 0);
}

function appendKindTaskSession(body, reference, showTodo, showDone) {
  const { product, session, multipleSessions } = reference;
  const { visible } = taskVisibility(session, showTodo, showDone);
  const group = element('section', 'kind-session-tasks group-frame');
  const heading = element('h3', 'kind-task-head');
  appendContextTags(heading, product, session, true, true);
  heading.append(element('span', 'meta', `最終更新 ${session.tasksUpdatedAt ? durationAgoLabel(session.tasksUpdatedAt) : '時刻不明'}`));
  group.append(heading);
  if (!visible.length) group.append(element('div', 'empty', session.tasks.length ? '未完了のタスクはありません。' : 'タスクはありません。'));
  else {
    const list = element('ul', 'task-list');
    for (const task of visible) appendTaskItem(list, task, product, session, false, multipleSessions);
    group.append(list);
  }
  body.append(group);
}

function unknownSessionControls(session) {
  if (session.status !== '不明') return null;
  const extra = element('div', 'session-extra');
  const actions = element('div', 'session-actions');
  const estimateButton = element('button', 'ended-toggle', '状態を推定');
  estimateButton.type = 'button';
  estimateButton.dataset.estimateSession = session.session_id;
  const hideButton = element('button', 'ended-toggle', '一覧から外す');
  hideButton.type = 'button';
  hideButton.dataset.hideSession = session.session_id;
  actions.append(estimateButton, hideButton);
  extra.append(actions);

  if (!session.estimate) return extra;
  const panel = element('div', 'estimate');
  if (!session.estimate.canEstimate) {
    panel.textContent = '推定できませんでした';
  } else {
    const timestamp = Date.parse(session.estimate.recordedAt);
    const recordedAt = Number.isFinite(timestamp) ? absoluteTimeLabel(new Date(timestamp)) : '時刻不明';
    panel.append(element('p', '', `最後の記録: ${recordedAt}、最後のツール: ${session.estimate.lastTool ?? 'なし'}`));
    const waiting = session.estimate.state === 'input'
      ? 'はい'
      : session.estimate.state === 'tool'
        ? 'いいえ (許可待ちかツールの実行中)'
        : 'いいえ (応答の生成中)';
    panel.append(element('p', '', `入力待ちらしい: ${waiting}`));
  }
  extra.append(panel);
  return extra;
}

function appendUnknownSessionControls(row, session) {
  const controls = unknownSessionControls(session);
  if (controls) row.append(controls);
}

function sessionBlock(product, session, multipleSessions) {
  const block = element(multipleSessions ? 'section' : 'div', `session-group ${multipleSessions ? '' : 'single'}`.trim());
  if (multipleSessions) {
    const head = element('div', 'session-head');
    head.append(element('h3', '', session.title || session.session_id));
    if (!sharedBranch(product) && session.product?.branch) head.append(element('span', 'meta branch', session.product.branch));
    block.append(head);
  }

  const body = element('div', 'session-body');
  if (!multipleSessions) body.append(element('div', 'session-tag session-context', sessionDisplayName(session)));
  const judgmentCount = shownPermissions(session).length + shownActiveDecisions(session).length + shownCommonQuestions(session).length;
  const hasEndedDecisions = !displayPreferences.hideFinished && session.decisions.some(isEndedDecision);
  const showJudgment = judgmentCount > 0 || hasEndedDecisions || !hasHiddenJudgmentItems(session);
  const sections = { judgment: [], tasks: [], now: [] };
  if (showJudgment) {
    const judgmentHeading = element('h3', 'sub', 'あなたの判断が必要なこと');
    judgmentHeading.append(element('span', 'count', `(${judgmentCount} 件)`));
    sections.judgment.push(judgmentHeading);
    const judgmentContent = element('div');
    appendPermissionWaits(judgmentContent, session, product);
    appendCommonQuestions(judgmentContent, session, product);
    appendDecisions(judgmentContent, session, product);
    sections.judgment.push(...judgmentContent.childNodes);
  }
  const taskContent = element('div');
  appendTasks(taskContent, session, product);
  sections.tasks.push(...taskContent.childNodes);
  const nowContent = element('div');
  nowContent.append(element('h3', 'sub', '今やっていること'));
  const now = element('div', 'now');
  now.append(mainRow(session, product));
  nowContent.append(now);
  const instructions = instructionComposer(session, lastState);
  if (instructions) nowContent.append(instructions);
  appendAgents(nowContent, session, product);
  sections.now.push(...nowContent.childNodes);
  for (const key of orderedSectionKeys(['judgment', 'tasks', 'now'])) body.append(...sections[key]);
  block.append(body);
  return block;
}

function productControls(product, index, total, pinnedCount, headingId) {
  const pinned = displayPreferences.pinned.includes(product.key);
  const collapsed = displayPreferences.collapsed.includes(product.key);
  const controls = element('div', 'order');
  const collapse = element('button', 'icon-btn', collapsed ? '開く' : '畳む');
  collapse.type = 'button';
  collapse.dataset.productAction = 'collapse';
  collapse.dataset.productKey = product.key;
  collapse.setAttribute('aria-expanded', String(!collapsed));
  collapse.setAttribute('aria-label', `${product.name}を${collapsed ? '開く' : '畳む'}`);
  const pin = element('button', 'icon-btn', pinned ? '固定中' : '固定');
  pin.type = 'button';
  pin.dataset.productAction = 'pin';
  pin.dataset.productKey = product.key;
  pin.setAttribute('aria-pressed', String(pinned));
  pin.title = pinned ? '固定を解除' : '最上部に固定';
  const moveUp = element('button', 'icon-btn', '↑');
  moveUp.type = 'button';
  moveUp.dataset.productAction = 'move';
  moveUp.dataset.productKey = product.key;
  moveUp.dataset.direction = '-1';
  moveUp.disabled = pinned ? index === 0 : index === pinnedCount;
  moveUp.setAttribute('aria-label', `${product.name}を上へ`);
  const moveDown = element('button', 'icon-btn', '↓');
  moveDown.type = 'button';
  moveDown.dataset.productAction = 'move';
  moveDown.dataset.productKey = product.key;
  moveDown.dataset.direction = '1';
  moveDown.disabled = pinned ? index === pinnedCount - 1 : index === total - 1;
  moveDown.setAttribute('aria-label', `${product.name}を下へ`);
  controls.append(collapse, pin, moveUp, moveDown);
  return controls;
}
