<title>Agent Cockpit</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --border: #dfe2e8;
  --text: #1d2129;
  --text-2: #5b6372;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --warn: #b35c00;
  --warn-soft: #fff1df;
  --danger: #c92a2a;
  --danger-soft: #ffe8e8;
  --ok: #2b8a3e;
  --ok-soft: #e3f6e8;
  --hold: #6741d9;
  --hold-soft: #efe9ff;
  --on-accent: #ffffff;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
    --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
    --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
    --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
  --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
  --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
  --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
.top { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--border); }
.top[data-away="true"] { background: var(--warn-soft); border-bottom-color: var(--warn); }
.top-inner { position: relative; max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
/* 設定のボタンは右上に重ねて置くので、その分の余白はタイトルの行だけに取り、2 行目からは全幅を使う。 */
.top h1 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 0; }
.title-row { flex: 1 1 100%; display: flex; align-items: center; gap: 8px 12px; min-height: 40px; padding-right: 48px; }
.title-row .away-toggle { margin-left: auto; }
.mode-row { margin: 0 0 12px; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.control-row { flex: 1 1 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.routing { display: grid; gap: 8px; min-width: 0; flex: 1 1 auto; }
.routing[hidden], .control-row:has(> .routing[hidden]) { display: none; }
.routing .rgroup { display: grid; grid-template-columns: max-content max-content; gap: 8px 10px; align-items: center; }
.routing .rgroup .rrow { display: contents; }
.routing .rrow { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.routing .rlabel { font-size: 13px; font-weight: 600; justify-self: start; }
.routing .seg button { padding: 4px 10px; font-size: 13px; min-height: 32px; }
.top-inner .routing { min-width: 0; margin: 0; padding: 0; border: 0; background: none; }
.top-inner .routing .seg button { padding: 3px 7px; font-size: 12px; min-height: 30px; }
.route-tag { display: inline-flex; align-items: center; min-height: 20px; padding: 0 6px; border: 1px solid var(--border); border-radius: 6px; color: var(--text-2); font-size: 11px; white-space: nowrap; }
.route-tag.stale { border-style: dashed; color: var(--warn); }
.chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.chip strong { color: var(--text); font-size: 13px; margin-left: 4px; }
.chip.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.hold { background: var(--hold-soft); border-color: transparent; color: var(--hold); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.meta { color: var(--text-2); font-size: 12px; }
#connection-note { color: var(--danger); }

function readDisplayPreferences() {
  try {
    const value = JSON.parse(localStorage.getItem(DISPLAY_STORAGE_KEY) || '{}');
    const uniqueStrings = (items) => [...new Set(Array.isArray(items) ? items.filter((item) => typeof item === 'string').slice(0, 200) : [])];
    return {
      mode: value.mode === 'kind' ? 'kind' : 'product',
      order: uniqueStrings(value.order),
      pinned: uniqueStrings(value.pinned),
      collapsed: uniqueStrings(value.collapsed),
      hidden: [...new Set(Array.isArray(value.hidden) ? value.hidden.filter((item) => FILTERS.some((filter) => filter.key === item)) : [])],
    };
  } catch {
    return { mode: 'product', order: [], pinned: [], collapsed: [], hidden: [] };
  }
}

function normalizeDisplayPreferences(value) {
  const uniqueStrings = (items) => [...new Set(Array.isArray(items) ? items.filter((item) => typeof item === 'string').slice(0, 200) : [])];
  return {
    mode: value?.mode === 'kind' ? 'kind' : 'product',
    order: uniqueStrings(value?.order),
    pinned: uniqueStrings(value?.pinned),
    collapsed: uniqueStrings(value?.collapsed),
    hidden: [...new Set(Array.isArray(value?.hidden) ? value.hidden.filter((item) => FILTERS.some((filter) => filter.key === item)) : [])],
  };
}

let displayPreferences = normalizeDisplayPreferences(null);
let displayPreferencesReady = false;
let displayMigrationPending = false;
let displayMigrationData = null;
let pendingDisplayChanges = {};
let pendingDisplayRequests = 0;
let displayWriteTail = Promise.resolve();

async function sendDisplayPatch(changes) {
  try {
    const response = await postUiAction('/api/display', changes);
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return true;
  } catch {
    showWriteError('表示の設定を保存できませんでした');
    return false;
  }
}

function enqueueDisplayPatch(changes) {
  pendingDisplayRequests += 1;
  const run = displayWriteTail.then(() => sendDisplayPatch(changes)).finally(() => { pendingDisplayRequests -= 1; });
  displayWriteTail = run.catch(() => false);
  return run;
}

function saveDisplayPreferences(changes) {
  Object.assign(displayPreferences, changes);
  if (!displayPreferencesReady) {
    Object.assign(pendingDisplayChanges, changes);
    return;
  }
  void enqueueDisplayPatch(changes);
}

function clearLegacyDisplayPreferences() {
  try {
    localStorage.removeItem(DISPLAY_STORAGE_KEY);
  } catch {
  }
}

async function syncDisplayPreferences(serverDisplay) {
  if (!displayPreferencesReady) {
    const current = serverDisplay === null
      ? readDisplayPreferences()
      : normalizeDisplayPreferences(serverDisplay);
    displayPreferences = { ...current, ...pendingDisplayChanges };
    displayPreferencesReady = true;
    const patch = serverDisplay === null ? displayPreferences : pendingDisplayChanges;
    pendingDisplayChanges = {};
    if (Object.keys(patch).length) {
      const saved = await enqueueDisplayPatch(patch);
      if (serverDisplay === null) {
        displayMigrationPending = !saved;
        displayMigrationData = displayPreferences;
        if (saved) clearLegacyDisplayPreferences();
      }
    } else if (serverDisplay !== null) {
      clearLegacyDisplayPreferences();
    }
    return;
  }
  if (serverDisplay === null && displayMigrationPending) {
    const saved = await enqueueDisplayPatch(displayMigrationData);
    displayMigrationPending = !saved;
    if (saved) clearLegacyDisplayPreferences();
    return;
  }
  if (serverDisplay !== null && pendingDisplayRequests === 0) {
    displayPreferences = normalizeDisplayPreferences(serverDisplay);
    displayMigrationPending = false;
    displayMigrationData = null;
    clearLegacyDisplayPreferences();
  }
}

function applyTheme(theme) {
  const selectedTheme = ['light', 'dark', 'system'].includes(theme) ? theme : 'dark';
  if (selectedTheme === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = selectedTheme;
  themeSelect.value = selectedTheme;
  return selectedTheme;
}

function storedTheme() {
  try {
    const theme = localStorage.getItem(THEME_STORAGE_KEY);
    if (['light', 'dark', 'system'].includes(theme)) return theme;
  } catch {
  }
  return 'dark';
}

applyTheme(storedTheme());
themeSelect.addEventListener('change', () => {
  const theme = applyTheme(themeSelect.value);
  try {
    localStorage.setItem(THEME_STORAGE_KEY, theme);
  } catch {
  }
});

function updateConnectionNote() {
  if (connectionLost) {
    const time = `${String(lastStateAt.getHours()).padStart(2, '0')}:${String(lastStateAt.getMinutes()).padStart(2, '0')}`;
    connectionNote.textContent = `常駐サーバーに接続できません。表示は ${time} 時点のものです。`;
    connectionNote.hidden = false;
  } else if (Date.now() < writeErrorUntil) {
    connectionNote.textContent = writeErrorMessage;
    connectionNote.hidden = false;
  } else {
    connectionNote.textContent = '';
    connectionNote.hidden = true;
  }
}

function showWriteError(message) {
  writeErrorMessage = message;
  writeErrorUntil = Date.now() + 10_000;
  clearTimeout(writeErrorTimer);
  writeErrorTimer = setTimeout(updateConnectionNote, 10_000);
  updateConnectionNote();
}

async function postUiAction(url, body) {
  const send = () => fetch(url, {
    method: 'POST',
    cache: 'no-store',
    headers: {
      'Content-Type': 'application/json',
      'X-Cockpit-Secret': document.querySelector('meta[name="cockpit-secret"]').content,
    },
    body: JSON.stringify(body),
  });
  let response = await send();
  if (response.status === 401) {
    await refreshUiSecret();
    response = await send();
  }
  return response;
}

function postAway(enabled) {
  return postUiAction('/api/away', { enabled });
}

function routeName(key, value) {
  return ROUTE[key].opts.find((option) => option.v === value)?.t || ROUTE[key].opts[0].t;
}

function renderRouting(settings = {}, integrations = {}) {
  routing = {
    agents: ROUTE_VALUES.has(settings.agents) ? settings.agents : 'default',
    review: ROUTE_VALUES.has(settings.review) ? settings.review : 'default',
  };
  codexAgentAvailable = integrations.codexAgent === true;
  const root = document.getElementById('routing');
  root.hidden = !codexAgentAvailable;
  if (root.hidden) {
    root.innerHTML = '';
    return;
  }
  if (!root.querySelector('.rgroup')) {
    const row = (key) => `<div class="rrow"><span class="rlabel">${ROUTE[key].label}</span><div class="seg" role="group" aria-label="${ROUTE[key].label}の経路">${ROUTE[key].opts.map((option) => `<button type="button" data-route="${key}" data-v="${option.v}" aria-pressed="false">${option.t}</button>`).join('')}</div></div>`;
    root.innerHTML = `<div class="rgroup">${row('agents')}</div>`;
  }
  for (const button of root.querySelectorAll('[data-route]')) {
    button.setAttribute('aria-pressed', String(button.dataset.v === routing[button.dataset.route]));
  }
}

renderRouting(routing);

async function updateRouting(button) {
  const { route: key, v: value } = button.dataset;
  if (key === 'review') return;
  button.disabled = true;
  try {
    const response = await postUiAction('/api/routing', { key, value });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const updated = await response.json();
    renderRouting(updated, { codexAgent: codexAgentAvailable });
    if (lastState) {
      lastState.routing = updated;
      render(lastState);
    }
    liveStatus.textContent = '経路の設定を保存しました。';
  } catch {
    showWriteError('経路の設定を保存できませんでした。');
  } finally {
    button.disabled = false;
  }
}

async function refreshUiSecret() {
  const response = await fetch('/', { cache: 'no-store' });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  const page = new DOMParser().parseFromString(await response.text(), 'text/html');
  const secret = page.querySelector('meta[name="cockpit-secret"]')?.content;
  if (!secret) throw new Error('secret unavailable');
  document.querySelector('meta[name="cockpit-secret"]').content = secret;
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function badge(text, className = '') {
  return element('span', `badge ${className}`.trim(), text);
}

function durationLabel(startedAt, now = Date.now()) {
  const start = Date.parse(startedAt);
  if (!Number.isFinite(start)) return '時刻不明';
  const minutes = Math.max(0, Math.floor((now - start) / 60_000));
  if (minutes < 1) return '1 分以内';
  if (minutes < 60) return `${minutes} 分`;
  const hours = Math.floor(minutes / 60);
  const remainder = minutes % 60;
  return remainder ? `${hours} 時間 ${remainder} 分` : `${hours} 時間`;
}

function durationAgoLabel(startedAt, now = Date.now()) {
  const label = durationLabel(startedAt, now);
  return ['時刻不明', '1 分以内'].includes(label) ? label : `${label}前`;
}

function appendModelLine(target, agent) {
  const claudeModel = !agent.isCodex && agent.model ? (agent.modelName || agent.model) : '';
  const gpt = agent.isCodex
    ? { model: agent.model, effort: agent.effort, codex_home: agent.codex_home, unavailable: agent.unavailable }
    : agent.gpt;

  if (gpt?.model || gpt?.unavailable) {

    models.append(gptBadge);
  }

function updateTitle(sessions) {
  const permissionCount = sessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  const decisionCount = sessions.reduce((total, session) => total + session.decisions.filter(isPendingDecision).length, 0);
  const pendingCount = permissionCount + decisionCount;
  document.title = pendingCount ? `(${pendingCount}) Agent Cockpit` : 'Agent Cockpit';
}

function isPendingDecision(decision) {
  return decision.state === 'waiting' && !hasEffectiveAnswer(decision);
}

function isHeldDecision(decision) {
  return ['waiting', 'provisional'].includes(decision.state) && decision.answer?.choice === 'hold' && !decision.answer.ignoredAt;
}

function renderSummary(sessions, pullRequestGroups = []) {
  const permissionCount = sessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  const decisions = sessions.flatMap((session) => session.decisions);
  const blockingCount = decisions.filter(isPendingDecision).length;
  const provisionalCount = decisions.filter((decision) => decision.state === 'provisional' && !hasEffectiveAnswer(decision)).length;
  const heldCount = decisions.filter(isHeldDecision).length;
  const agentCount = sessions.reduce((total, session) => total + session.agents.filter((agent) => agent.active).length, 0);
  const counts = {
    permission: permissionCount,
    blocking: blockingCount,
    provisional: provisionalCount,
    held: heldCount,
    agents: agentCount,
    prs: pullRequestMergeableCount(pullRequestGroups),
  };
  summary.replaceChildren(...FILTERS.map(({ key, label, color }) => {
    const button = element('button', `chip ${color}`.trim());
    button.type = 'button';
    button.dataset.filter = key;
    button.setAttribute('aria-pressed', String(!displayPreferences.hidden.includes(key)));
    button.title = displayPreferences.hidden.includes(key) ? '押すと表示に戻す' : '押すと非表示にする';
    const count = String(counts[key]);
    button.append(document.createTextNode(`${label} `), element('strong', '', count));
    return button;
  }));

  const hiddenKinds = FILTERS.filter(({ key }) => displayPreferences.hidden.includes(key));
  const hiddenCount = hiddenKinds.reduce((total, { key }) => total + counts[key], 0);
  const note = document.getElementById('filter-note');
  note.hidden = hiddenKinds.length === 0;
  if (hiddenKinds.length) {
    const showAll = element('button', 'link-btn', 'すべて表示する');
    showAll.type = 'button';
    showAll.dataset.showAll = 'true';
    showAll.addEventListener('click', () => {
      saveDisplayPreferences({ hidden: [] });
      render(lastState);
    });
    note.replaceChildren(
      element('span', '', `非表示: ${hiddenKinds.map(({ label }) => label).join('、')} (${hiddenCount} 件)`),
      showAll,
    );
  } else {
    note.replaceChildren();
  }
}

function renderExcludedNote(sessions) {
  const note = document.getElementById('excluded-note');
  const hiddenSessions = sessions.filter((session) => session.hidden === true);
  const hiddenCount = hiddenSessions.length;
  note.hidden = hiddenCount === 0;
  if (!hiddenCount) {
    note.replaceChildren();
    return;
  }
  const showAll = element('button', 'link-btn', 'すべて表示する');
  showAll.type = 'button';
  showAll.dataset.clearHiddenSessions = 'true';
  const permissionCount = hiddenSessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  const decisionCount = hiddenSessions.reduce((total, session) => total + session.decisions.filter(isPendingDecision).length, 0);
  const pendingCounts = [
    permissionCount ? `許可待ち ${permissionCount} 件` : '',
    decisionCount ? `止めて待っている ${decisionCount} 件` : '',
  ].filter(Boolean);
  const countNote = pendingCounts.length ? `、うち${pendingCounts.join('、')}` : '';
  note.replaceChildren(element('span', '', `外したセッション (${hiddenCount} 件)${countNote}`), showAll);
}

function isFilterShown(key) {
  return !displayPreferences.hidden.includes(key);
}

function toggleFilter(key) {
  const hidden = isFilterShown(key)
    ? [...displayPreferences.hidden, key]
    : displayPreferences.hidden.filter((item) => item !== key);
  saveDisplayPreferences({ hidden });
  if (lastState) render(lastState);
}

function hasEffectiveAnswer(decision) {
  return Boolean(decision.answer?.sentAt && !decision.answer.ignoredAt);
}

function shownPermissions(session) {
  return isFilterShown('permission') ? session.permissionWaits : [];
}

function shownActiveDecisions(session) {
  return session.decisions.filter((decision) => {
    if (!['waiting', 'provisional'].includes(decision.state)) return false;
    if (decision.answer?.choice === 'hold' && !decision.answer.ignoredAt) return isFilterShown('held');
    if (hasEffectiveAnswer(decision)) return true;
    return decision.state === 'waiting' ? isFilterShown('blocking') : isFilterShown('provisional');
  });
}

function hasHiddenJudgmentItems(session) {
  return (!isFilterShown('permission') && session.permissionWaits.length > 0)
    || session.decisions.some((decision) => (
      ['waiting', 'provisional'].includes(decision.state) && !shownActiveDecisions(session).includes(decision)
    ));
}

function pullRequestOpenCount(groups) {
  return groups.reduce((total, group) => total + (group.openCount || 0), 0);
}

function pullRequestMergeableCount(groups) {
  return groups.reduce((total, group) => total + (group.mergeableCount || 0), 0);
}

}

const MERGE_METHOD_LABELS = { merge: 'マージコミット', squash: 'スカッシュ', rebase: 'リベース' };

function isFullCommitSha(value) {
  return typeof value === 'string' && /^[0-9a-f]{40}$/i.test(value);
}

function isCompleteCommitSha(value) {
  return typeof value === 'string' && /^(?:[0-9a-f]{40}|[0-9a-f]{64})$/i.test(value);
}

// 「レビュー済み」は、主セッションが記録した結論が converged で、その SHA が今の head のときだけ言う。
// 結論の記録が無いか往復の数が合わなければ、最後にレビューに回した head との比較だけを出す。
function crossReviewState(pullRequest) {
  const review = pullRequest.crossReview;
  if (review === undefined) return { cls: 'mute', text: '', warn: null };
  if (!review) return { cls: 'mute', text: 'レビュー未実施', warn: 'クロスレビューの記録が無い' };
  const triage = review.triage && review.triage.round <= review.round ? review.triage : null;
  if (triage && review.round > triage.round) return { cls: 'warn', text: `${review.round} 往復目の結論待ち`, warn: `クロスレビューの ${review.round} 往復目の結論がまだ出ていない` };
  if (triage && triage.outcome === 'fixing') return { cls: 'warn', text: '指摘の対応中', warn: `クロスレビューの ${triage.round} 往復目の指摘に対応している途中` };
  if (triage && triage.outcome === 'halted') return { cls: 'warn', text: '開発者の判断待ち', warn: 'クロスレビューは開発者の判断を待って止まっている' };
  if (triage && triage.outcome === 'converged') {
    if (!isCompleteCommitSha(pullRequest.headRefOid)) return { cls: 'mute', text: 'head を確かめられない', warn: 'head を確かめられない' };
    const triageSha = triage.sha.toLowerCase();
    const headSha = pullRequest.headRefOid.toLowerCase();
    if (triageSha === headSha) return { cls: 'ok', text: 'レビュー済み', warn: null, note: `クロスレビューはこの head で収束した (${triage.round} 往復目)` };
    const triageShortSha = triageSha.slice(0, 7);
    return {
      cls: 'warn',
      text: `収束の後に変更あり (収束 ${triageShortSha})`,
      warn: `head ${headSha.slice(0, 7)} はクロスレビューの収束の後に変更されている (収束は ${triageShortSha})`,
    };
  }
  if (!isFullCommitSha(review.reviewedSha) || !isFullCommitSha(pullRequest.headRefOid)) {
    return { cls: 'mute', text: 'head を確かめられない', warn: 'head を確かめられない' };
  }
  const reviewedSha = review.reviewedSha.toLowerCase();
  const headSha = pullRequest.headRefOid.toLowerCase();
  if (reviewedSha !== headSha) {
    const reviewedShortSha = reviewedSha.slice(0, 7);
    return {
      cls: 'warn',
      text: `レビューの後に変更あり (レビュー済み ${reviewedShortSha})`,
      warn: `head ${headSha.slice(0, 7)} はクロスレビューの後に変更されている (レビュー済みは ${reviewedShortSha})`,
    };
  }
  return { cls: 'mute', text: 'この head をレビューに回した', warn: null, note: 'クロスレビューはこの head で回した。指摘が残っていないかは PR のコメントで確かめる。' };
}

function crossReviewLine(pullRequest) {
  const review = pullRequest.crossReview;
  if (review === undefined) return null;
  const state = crossReviewState(pullRequest);
  const line = element('div', 'xr');
  line.append(document.createTextNode('クロスレビュー '));
  if (!review) {
    line.append(badge(state.text, state.cls));
    return line;
  }
  const rounds = element('span', 'rounds');
  rounds.setAttribute('aria-hidden', 'true');
  for (let index = 0; index < review.max; index += 1) {
    rounds.append(element('span', index < review.round ? 'used' : ''));
  }
  line.append(
    rounds,
    element('span', '', `${review.round} / ${review.max} 往復、非対応 ${review.dismissed}`),
    document.createTextNode(' '),
    badge(state.text, state.cls),
  );
  return line;
}

function pullRequestMergeKey(pullRequest) {
  return pullRequest.mergeRecordKey || '';
}

function pullRequestMergeOptionsFor(group, pullRequest) {
  const key = pullRequestMergeKey(pullRequest);
  const methods = Array.isArray(group.mergeMethods) ? group.mergeMethods : [];
  const previous = pullRequestMergeOptions.get(key);
  const method = methods.includes(previous?.method) ? previous.method
    : methods.includes(group.lastMethod) ? group.lastMethod
      : methods[0] || '';
  return {
    method,
    deleteBranch: pullRequest.isCrossRepository || group.autoDeleteBranch === true ? false : previous?.deleteBranch ?? true,
  };
}

function appendPullRequestMergeConfirmation(target, group, pullRequest, automatic) {
  const key = pullRequestMergeKey(pullRequest);
  const options = pullRequestMergeOptionsFor(group, pullRequest);
  const panel = element('section', `merge-confirm ${automatic ? 'auto' : ''}`.trim());
  panel.dataset.mergeConfirm = key;
  panel.setAttribute('aria-label', `PR #${pullRequest.number} のマージ確認`);
  const heading = element('div');
  heading.append(element('strong', '', `#${pullRequest.number}`), document.createTextNode(` を `), element('code', '', group.defaultBranch || ''), document.createTextNode(` へ${automatic ? '、CI が通ったら自動で' : ''}マージする`));
  panel.append(heading);

  const methods = element('div', 'methods');
  methods.setAttribute('role', 'radiogroup');
  methods.setAttribute('aria-label', 'マージの方式');
  for (const method of group.mergeMethods || []) {
    const label = element('label');
    const input = element('input');
    input.type = 'radio';
    input.name = `merge-${key}`;
    input.value = method;
    input.checked = options.method === method;
    input.dataset.mergeMethod = method;
    input.dataset.mergeKey = key;
    label.append(input, document.createTextNode(MERGE_METHOD_LABELS[method] || method));
    methods.append(label);
  }
  if ((group.mergeMethods || []).length === 1) methods.append(element('span', 'meta', 'リポジトリで許可されている方式です'));
  panel.append(methods);

  if (group.autoDeleteBranch !== true) {
    const branchChoice = element('label', 'opt');
    const deleteBranch = element('input');
    deleteBranch.type = 'checkbox';
    deleteBranch.checked = pullRequest.isCrossRepository ? false : options.deleteBranch;
    deleteBranch.disabled = pullRequest.isCrossRepository === true;
    deleteBranch.dataset.mergeDelete = 'true';
    deleteBranch.dataset.mergeKey = key;
    branchChoice.append(deleteBranch, document.createTextNode('マージ後にリモートブランチを削除する'));
    if (pullRequest.isCrossRepository) branchChoice.append(element('span', 'meta', 'fork のブランチは登録先から削除できません'));
    panel.append(branchChoice);
  }

  const effects = element('ul', 'effects');
  const review = crossReviewState(pullRequest);
  const effectItems = [
    review.warn ? { text: review.warn, warn: true } : review.note ? { text: review.note } : null,
    { text: `head が ${pullRequest.headRefOid} のときだけマージする。表示後に push されていたら中止する。` },
    pullRequest.children.length ? { text: `先に ${pullRequest.children.map((child) => `#${child.number}`).join('、')} の base を ${group.defaultBranch} に付け替える。` } : null,
    group.autoDeleteBranch === true && !pullRequest.isCrossRepository
      ? { text: `リモートのブランチ ${pullRequest.headRefName} は GitHub が自動で削除する (リポジトリの設定)` }
      : options.deleteBranch ? { text: `リモートの ${pullRequest.headRefName} を削除する。手元の worktree には触れない。` } : null,
    pullRequest.isCrossRepository ? { text: 'fork の head ブランチは登録先リポジトリから削除しない。', warn: true } : null,
    pullRequest.children.length && ['squash', 'rebase'].includes(options.method)
      ? { text: 'スカッシュまたはリベースでは上の PR に元のコミットが残るため、セッションに積み直しを依頼する。', warn: true } : null,
    { text: '結果を PR を作ったセッションへ知らせる。' },
    automatic ? { text: '予約後に head が変わったら予約を取り消して知らせる。' } : null,
  ].filter(Boolean);
  for (const effect of effectItems) effects.append(element('li', effect.warn ? 'warn' : '', effect.text));
  panel.append(effects);

  const row = element('div', 'row');
  const go = element('button', 'merge-go', automatic ? '予約する' : 'マージを実行');
  go.type = 'button';
  go.dataset[automatic ? 'reserveGo' : 'mergeGo'] = key;
  go.dataset.mergeKey = key;
  go.disabled = pullRequestMergeInFlight.has(key) || !(group.mergeMethods || []).length;
  const cancel = element('button', 'ghost', 'やめる');
  cancel.type = 'button';
  cancel.dataset.mergeCancel = key;
  cancel.dataset.mergeKey = key;
  row.append(go, cancel);
  panel.append(row);
  target.append(panel);
}

function appendPullRequestTree(target, group, pullRequest) {
  const reservation = pullRequest.reservation || null;
  const mergeIntent = pullRequest.mergeIntent || null;
  const item = element('div', `pr ${reservation ? 'reserved' : pullRequest.canMerge ? 'can-merge' : ''}`.trim());
  const line = element('div', 'pline');
  if (pullRequest.stackPosition?.total > 1) {
    const position = element('span', 'pos', `${pullRequest.stackPosition.depth}/${pullRequest.stackPosition.total}`);
    position.title = '下から数えた位置';
    line.append(position);
  }
  const link = element('a', 'num', `#${pullRequest.number}`);
  link.href = pullRequest.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.setAttribute('aria-label', `GitHub で PR #${pullRequest.number} を開く`);
  line.append(link, element('span', '', pullRequest.title));
  if (pullRequest.canMerge && !mergeIntent) line.append(badge('マージできます', 'ok'));
  const mergeKey = pullRequest.mergeSessionId ? pullRequestMergeKey(pullRequest) : '';
  const confirmation = mergeKey ? pullRequestMergeConfirmations.get(mergeKey) : null;
  const reserveAllowed = pullRequest.blocker === 'CI 実行中' && ['approved', 'none'].includes(pullRequest.review);
  if (mergeKey && reservation) {
    const cancel = element('button', 'link-btn', '予約を取り消す');
    cancel.type = 'button';
    cancel.dataset.cancelReservation = mergeKey;
    cancel.dataset.mergeKey = mergeKey;
    cancel.disabled = pullRequestMergeInFlight.has(mergeKey);
    line.append(cancel);
  } else if (mergeKey && mergeIntent) {
    line.append(badge('マージキューに追加済み', 'accent'));
  } else if (mergeKey && pullRequest.canMerge) {
    const merge = element('button', 'merge-btn', 'マージする');
    merge.type = 'button';
    merge.dataset.openMerge = mergeKey;
    merge.dataset.mergeKey = mergeKey;
    merge.disabled = Boolean(confirmation) || pullRequestMergeInFlight.has(mergeKey);
    line.append(merge);
  } else if (mergeKey && reserveAllowed) {
    const reserve = element('button', 'auto-btn', 'CI が通ったらマージ');
    reserve.type = 'button';
    reserve.dataset.openReserve = mergeKey;
    reserve.dataset.mergeKey = mergeKey;
    reserve.disabled = Boolean(confirmation) || pullRequestMergeInFlight.has(mergeKey);
    line.append(reserve);
  }
  item.append(line);
  const branch = element('div', 'branch');
  branch.append(element('code', '', pullRequest.headRefName), document.createTextNode(' → '), element('code', '', pullRequest.effectiveBase));
  item.append(branch);
  const badges = element('div', 'badges');
  appendPullRequestBadges(badges, pullRequest);
  if (reservation) {
    const reservedText = `マージ予約中 (${MERGE_METHOD_LABELS[reservation.method] || reservation.method}、head ${reservation.headRefOid})`;
    badges.append(badge(reservedText, 'accent'));
  }
  if (mergeIntent) item.append(element('div', 'why-not', 'GitHub のマージキューに追加済みです。まだマージされていません。'));
  item.append(badges);
  if (pullRequest.crossReview !== undefined) item.append(crossReviewLine(pullRequest));
  if (pullRequest.blocker) item.append(element('div', 'why-not', `マージできない理由: ${pullRequest.blocker}`));
  if (mergeKey && confirmation && !reservation && !mergeIntent) appendPullRequestMergeConfirmation(item, group, pullRequest, confirmation === 'reserve');
  if (mergeKey && pullRequestMergeMessages.has(mergeKey)) {
    const message = element('div', 'merge-error', pullRequestMergeMessages.get(mergeKey));
    message.setAttribute('role', 'status');
    item.append(message);
  }
  if (reservation) {
    const cancelRow = element('div', 'why-not');
    cancelRow.append(document.createTextNode(`予約時 ${reservation.createdAt ? pullRequestTimeLabel(reservation.createdAt) : '時刻不明'}。head SHA ${reservation.headRefOid}。`));
    item.append(cancelRow);
  }
  if (pullRequest.children.length) {
    const children = element('div', 'stack-level');
    for (const child of pullRequest.children) appendPullRequestTree(children, group, child);
    item.append(children);
  }
  target.append(item);
}

function appendPullRequestBlock(target, group, withTag = false) {
  if (!group) {
    target.append(element('div', 'empty', 'このセッションが作った PR はありません'));
    return;
  }
  const head = element('div', 'prs-head meta');
  if (withTag) head.append(element('span', 'prod-tag', group.product.name));
  head.append(
    element('span', '', `${group.owner}/${group.repo}`),
    element('span', '', `GitHub から ${pullRequestTimeLabel(group.fetchedAt || group.checkedAt)} に取得`),
  );
  target.append(head);
  if (group.error) target.append(element('div', 'error-box', group.error));
  for (const tree of group.trees) {
    const stack = element('div', 'stack');
    const base = element('div', 'stack-base');
    base.append(element('code', '', tree.effectiveBase));
    if (tree.children.length) base.append(element('span', '', `スタック ${tree.stackPosition.total} 段`));
    const level = element('div', 'stack-level');
    appendPullRequestTree(level, group, tree);
    stack.append(base, level);
    target.append(stack);
  }
  if (Array.isArray(group.mergeHistory) && group.mergeHistory.length) {
    const merged = element('div', 'merged-list');
    merged.append(document.createTextNode('マージ済み (24 時間): '));
    for (const record of group.mergeHistory) {
      const item = element('span', record.headMismatch === true ? 'badge warn' : 'badge mute');
      const link = element('a', '', `#${record.number}`);
      link.href = record.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = record.title;
      const parts = [pullRequestTimeLabel(record.mergedAt)];
      if (record.method) parts.push(MERGE_METHOD_LABELS[record.method] || record.method);
      if (record.automatic) parts.push('予約で自動');
      if (record.headMismatch === true) {
        parts.push(`警告: 予約時に確認した ${record.reservedHeadRefOid || '不明な SHA'} とは異なる ${record.mergedHeadRefOid || '不明な SHA'} がマージされました`);
      }
      item.append(link, document.createTextNode(` (${parts.join('、')})`));
      merged.append(item);
    }
    target.append(merged);
  }
  const closed = group.merged.filter((pullRequest) => pullRequest.state === 'closed');
  if (closed.length) {
    const merged = element('div', 'merged-list');
    merged.append(document.createTextNode('クローズ済み: '));
    for (const pullRequest of closed) {
      const link = element('a', 'badge mute', `#${pullRequest.number}`);
      link.href = pullRequest.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.title = pullRequest.title;
      merged.append(link);
    }
    target.append(merged);
  }
  if (!group.trees.length && !group.merged.length && !group.mergeHistory?.length && !group.error) {
    target.append(element('div', 'empty', group.registeredCount ? 'オープンの PR はありません' : 'このセッションが作った PR はありません'));
  }
}

function productGroups(sessions, pullRequestGroups = []) {
  const groups = new Map();
  for (const session of sessions) {
    const product = session.product || {};
    const key = product.key || product.name || 'product-unknown';
    let group = groups.get(key);
    if (!group) {
      group = { key, name: product.name || 'プロダクト不明', branches: new Set(), sessions: [] };
      groups.set(key, group);
    }
    if (product.branch) group.branches.add(product.branch);
    group.sessions.push(session);
  }
  for (const pullRequestGroup of pullRequestGroups) {
    const product = pullRequestGroup.product || {};
    const key = product.key || `repo:${pullRequestGroup.owner}/${pullRequestGroup.repo}`;
    let group = groups.get(key);
    if (!group) {
      group = { key, name: product.name || `${pullRequestGroup.owner}/${pullRequestGroup.repo}`, branches: new Set(), sessions: [], pullRequestGroups: [] };
      groups.set(key, group);
    }
    group.pullRequestGroups ||= [];
    group.pullRequestGroups.push(pullRequestGroup);
  }
  return [...groups.values()];
}

function sessionActivityTime(session) {
  const mainTool = session.tools.filter((tool) => !tool.agent_id).reduce((latest, tool) => {
    const time = Date.parse(tool.startedAt);
    return Number.isFinite(time) ? Math.max(latest, time) : latest;
  }, -Infinity);
  const lastActivity = Date.parse(session.lastActivityAt);
  return Math.max(mainTool, Number.isFinite(lastActivity) ? lastActivity : -Infinity);
}

function orderedProducts(sessions, pullRequestGroups = [], sinceSeen = []) {
  const products = productGroups(sessions, pullRequestGroups);
  for (const entry of sinceSeen) {
    if (!entry.product?.key || products.some((product) => product.key === entry.product.key)) continue;
    products.push({ key: entry.product.key, name: entry.product.name, branches: new Set(), sessions: [], pullRequestGroups: [] });
  }
  const ids = products.map((product) => product.key);
  const visibleKeys = new Set(ids);
  const nextOrder = [...displayPreferences.order];
  for (const key of ids) if (!nextOrder.includes(key)) nextOrder.push(key);
  if (nextOrder.length > 200) {
    let excess = nextOrder.length - 200;
    const retained = nextOrder.filter((key) => {
      if (excess > 0 && !visibleKeys.has(key)) {
        excess -= 1;
        return false;
      }
      return true;
    });
    nextOrder.length = 0;
    for (const key of retained) nextOrder.push(key);
  }
  if (nextOrder.length !== displayPreferences.order.length || nextOrder.some((key, index) => key !== displayPreferences.order[index])) {
    saveDisplayPreferences({ order: nextOrder });
  }
  const orderIndex = new Map(nextOrder.map((key, index) => [key, index]));
  return products
    .map((product) => ({
      ...product,
      sessions: [...product.sessions].sort((left, right) => sessionActivityTime(right) - sessionActivityTime(left)),
      pullRequestGroups: product.pullRequestGroups || [],
    }))
    .sort((left, right) => {
      const leftPinned = displayPreferences.pinned.includes(left.key);
      const rightPinned = displayPreferences.pinned.includes(right.key);
      if (leftPinned !== rightPinned) return leftPinned ? -1 : 1;
      return orderIndex.get(left.key) - orderIndex.get(right.key);
    });
}

function activityStatus(session) {
  if (session.status === '作業中') return { label: '作業中', tone: 'busy' };
  if (session.status === '不明') return { label: '状態不明', tone: 'unknown' };
  return { label: '待機中', tone: 'wait' };
}

function mainRow(session, product, withTags = false, multipleSessions = false) {
  const status = activityStatus(session);
  const mainTool = newestFirst(session.tools.filter((tool) => !tool.agent_id))[0];
  const doingTask = session.tasks.find((task) => task.state === 'doing');
  const row = element('div', 'now-row main-row');
  const who = element('div', 'who');
  who.append(element('span', `dot ${status.tone}`), document.createTextNode('メイン'));
  appendContextTags(who, product, session, withTags, multipleSessions);
  who.append(element('strong', '', status.label));
  const detail = element('div', 'detail');
  if (doingTask) detail.append(element('div', 'activity-title', doingTask.title));
  if (mainTool) appendToolLine(detail, mainTool);
  const elapsedAt = mainTool?.startedAt || session.lastActivityAt;
  const elapsed = element('time', 'since', durationAgoLabel(elapsedAt));
  row.append(who, detail, elapsed);
  return row;
}

function appendAgents(body, session, product, withTags = false, multipleSessions = false, showEnded = expandedEndedSessions.has(session.session_id), includeToggle = true) {
  if (!session.agents.length) {
    if (!isFilterShown('agents')) return;
    body.append(element('h3', 'sub', 'サブエージェント'));
    body.append(element('div', 'empty', 'サブエージェントはありません。'));
    return;
  }
  const agents = newestFirst(session.agents);
  const runningAgents = agents.filter((agent) => !isEndedAgent(agent) && (!agent.active || isFilterShown('agents')));
  const endedAgents = agents.filter(isEndedAgent);
  const visibleAgents = showEnded ? [...runningAgents, ...endedAgents] : runningAgents;
  const hiddenRunningAgents = agents.some((agent) => agent.active && !isFilterShown('agents'));
  if (!visibleAgents.length && !endedAgents.length && !isFilterShown('agents')) return;
  body.append(element('h3', 'sub', 'サブエージェント'));
  if (!visibleAgents.length && !hiddenRunningAgents) body.append(element('div', 'empty', '稼働中のサブエージェントはありません。'));
  const list = element('div', 'agent-list');
  for (const agent of visibleAgents) {
    const row = element('div', 'agent-row');
    row.dataset.startedAt = agent.startedAt || '';
    const who = element('div', 'who');
    const agentState = agent.active ? ['稼働中', 'busy'] : agent.unconfirmed ? ['終了未確認', 'wait'] : ['終了', 'done'];
    who.append(element('span', `dot ${agent.unconfirmed ? 'wait' : agentState[1]}`));
    appendContextTags(who, product, session, withTags, multipleSessions);
    const name = element('span', 'agent-name');
    name.append(badge(agentState[0], agentState[1]), element('strong', '', agent.agent_type || agent.agent_id));
    if (agent.unconfirmed && !agent.active) {
      const close = element('button', 'link-btn close-agent', '終了にする');
      close.type = 'button';
      close.dataset.closeAgent = `${session.session_id}::${agent.agent_id}`;
      who.append(name, close);
    } else {
      who.append(name);
    }
    const detail = element('div', 'detail');
    if (agent.description) detail.append(element('div', 'agent-description', agent.description));
    else if (agent.lastTool) appendToolLine(detail, agent.lastTool);
    appendModelLine(detail, agent);
    row.append(who, detail, element('time', 'since', agent.startedAt ? durationLabel(agent.startedAt) : ''));
    list.append(row);
  }
  if (visibleAgents.length) body.append(list);
  if (endedAgents.length && includeToggle) {
    const toggle = element('button', 'ended-toggle', showEnded ? `終了済みを隠す (${endedAgents.length} 件)` : `終了済みを表示 (${endedAgents.length} 件)`);
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(showEnded));
    toggle.addEventListener('click', () => {
      if (showEnded) expandedEndedSessions.delete(session.session_id);
      else expandedEndedSessions.add(session.session_id);
      if (lastState) render(lastState);
      root.querySelector(`[data-ended-toggle="${CSS.escape(session.session_id)}"]`)?.focus({ preventScroll: true });
    });
    toggle.dataset.endedToggle = session.session_id;
    body.append(toggle);
  }
}

// 「終了未確認」はまだ動いている可能性があるので、終了済みに含めない。
function isEndedAgent(agent) {
  return !agent.active && !agent.unconfirmed;
}

function itemTimestamp(item) {
  const timestamp = Date.parse(item.createdAt || item.startedAt || item.updatedAt);
  return Number.isFinite(timestamp) ? timestamp : -Infinity;
}

function newestFirst(items) {
  return [...items].sort((a, b) => itemTimestamp(b) - itemTimestamp(a));
}

function appendContextTags(target, product, session, withTags, multipleSessions) {
  if (!withTags) return;
  target.append(element('span', 'prod-tag', product.name));
  if (multipleSessions) target.append(element('span', 'session-tag', session.title || session.session_id));
}

function appendPermissionWaits(body, session, product, withTags = false, multipleSessions = false) {
  const waits = shownPermissions(session);
  if (!waits.length) return;
  const list = element('div', 'permission-list');
  for (const wait of newestFirst(waits)) {
    const age = Date.now() - Date.parse(wait.startedAt);
    const minutes = Number.isFinite(age) ? Math.max(0, Math.floor(age / 60_000)) : null;
    const isLong = Number.isFinite(age) && age > LONG_WAIT_MS;
    const card = element('article', `permission ${age > LONG_WAIT_MS ? 'long-wait' : ''}`.trim());
    const header = element('div', 'permission-head');
    appendContextTags(header, product, session, withTags, multipleSessions);
    const agent = session.agents.find((item) => item.agent_id === wait.agent_id);
    const who = wait.agent_id ? (agent?.agent_type || 'サブエージェント') : 'メイン';
    header.append(element('strong', '', `${who}がツールの実行許可を待っている`));
    header.append(badge('許可待ち', 'permission-chip'));
    header.append(element('span', `wait ${isLong ? 'stale' : ''}`.trim(), minutes === null ? '時刻不明' : `${minutes} 分待機中`));
    card.append(header);
    if (wait.tool_name || wait.summary) {
      const context = element('div', 'decision-context permission-tool');
      if (wait.tool_name) context.append(document.createTextNode(wait.tool_name));
      if (wait.summary && wait.summary !== wait.tool_name) {
        context.append(document.createTextNode(wait.tool_name ? ': ' : ''));
        context.append(element('code', '', wait.summary));
      }
      card.append(context);
    }
    card.append(element('div', 'meta', `許可はデスクトップアプリの ${product.name} のセッションで出す。ダッシュボードからは出せない。`));
    list.append(card);
  }
  body.append(list);
}

function decisionStateLabel(state) {
  return {
    waiting: '止めて待っている',
    provisional: '推奨で仮に進行中',
    resolved: '解決済み',
    withdrawn: '取り下げ',
  }[state] || state;
}

function answerDraftFor(decision, session) {
  const key = `${session.session_id}\0${decision.id}`;
  const saved = answerDrafts.get(key);
  const answer = saved || decision.answer || {};
  return {
    choice: answer.choice ?? null,
    picks: copyAnswerPicks(answer.picks, (decision.questions || []).length),
    note: answer.note || '',
  };
}

function emptyAnswerPicks(decision) {
  return (decision.questions || []).map(() => []);
}

function copyAnswerPicks(picks, questionCount) {
  return Array.from({ length: questionCount }, (_, index) => (
    Array.isArray(picks?.[index]) ? [...picks[index]] : []
  ));
}

function sameAnswerPicks(left, right) {
  return left.length === right.length && left.every((labels, index) => (
    labels.length === right[index].length && labels.every((label, labelIndex) => label === right[index][labelIndex])
  ));
}

function decisionAnswerAvailability(decision) {
  const questions = decision.questions || [];
  const duplicateQuestions = new Set(questions.map((question) => question.question)).size !== questions.length;
  const waitingForAnswer = decision.state === 'waiting' && Boolean(decision.awaitingAnswerUntil);
  const hasSentAnswer = Boolean(decision.answer?.sentAt);
  return {
    active: !duplicateQuestions && (decision.state === 'provisional' || waitingForAnswer || (decision.state === 'waiting' && hasSentAnswer)),
    viaDialog: duplicateQuestions || (decision.state === 'waiting' && !waitingForAnswer && !hasSentAnswer),
  };
}

function displayRecommendedLabel(label) {
  return label.replace(/(?:\(推奨\)|（推奨）|\(recommended\)|（recommended）)/ig, '').replace(/\s+/g, ' ').trim();
}

function recommendedOptionsForQuestions(questions) {
  return questions.map((question) => {
    if (question.multiSelect) return null;
    const options = question.options.filter((option) => option.recommended === true);
    return options.length === 1 ? options[0] : null;
  });
}

function selectedAnswerLabels(decision, picks) {
  return (decision.questions || []).flatMap((question, index) => {
    const selected = new Set(picks[index] || []);
    return question.options
      .filter((option) => selected.has(option.label))
      .map((option) => displayRecommendedLabel(option.label));
  });
}

function answerMetaText(decision, draft) {
  const picked = selectedAnswerLabels(decision, draft.picks);
  if (picked.length) return `送る答え: ${picked.join('、')}`;
  const recommendations = recommendedOptionsForQuestions(decision.questions || []);
  if (recommendations.length && recommendations.every(Boolean)) {
    return `OK で送る答え: ${recommendations.map((option) => displayRecommendedLabel(option.label)).join('、')}。ほかの案は押して選べる`;
  }
  return '推奨が無いので、選択肢を押して選ぶか、指示の欄に答えを書く';
}

function canSendDecisionAnswer(decision, draft) {
  if (draft.choice === 'pick') {
    const hasPick = draft.picks.some((labels) => labels.length > 0);
    if (!hasPick) return false;
    const recommendations = recommendedOptionsForQuestions(decision.questions || []);
    return draft.picks.every((labels, index) => labels.length > 0 || recommendations[index] || draft.note.trim());
  }
  if (draft.choice === 'ok') return recommendedOptionsForQuestions(decision.questions || []).every(Boolean);
  if (draft.choice === 'hold') return true;
  return Boolean(draft.note.trim());
}

function answerTimeLabel(value) {
  const date = new Date(value);
  if (!Number.isFinite(date.getTime())) return '';
  return date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function answerStatusText(answer, decision) {
  if (!answer?.sentAt) return '未送信';
  const label = answer.choice === 'ok' ? '推奨案で OK'
    : answer.choice === 'hold' ? '判断を保留'
      : answer.choice === 'pick' ? `${selectedAnswerLabels(decision, answer.picks || []).map((item) => `「${item}」`).join('')}を選択`
        : '指示のみ';
  const status = [`${answerTimeLabel(answer.sentAt)} に送信済み: ${label}${answer.note ? ' (指示あり)' : ''}`];
  if (answer.deliveredAt) status.push(`${answerTimeLabel(answer.deliveredAt)} に渡した`);
  if (answer.reflectedAt) status.push(`${answerTimeLabel(answer.reflectedAt)} に反映された`);
  return status.join('、');
}

function appendDecisionAnswer(card, decision, product, session) {
  const questions = decision.questions || [];
  const { active, viaDialog } = decisionAnswerAvailability(decision);
  if (viaDialog) {
    card.append(element('div', 'meta dialog-note', `質問はデスクトップアプリの ${product.name} のセッションで答える。`));
    return;
  }
  if (!active) {
    if (decision.answer?.sentAt) card.append(element('div', 'answer-status', answerStatusText(decision.answer, decision)));
    return;
  }

  const answer = decision.answer;
  const draft = answerDraftFor(decision, session);
  const originalChoice = answer?.choice ?? null;
  const originalNote = answer?.note || '';
  const dirty = !answer?.sentAt || draft.choice !== originalChoice || draft.note !== originalNote || !sameAnswerPicks(draft.picks, copyAnswerPicks(answer?.picks, questions.length));
  const recommendations = recommendedOptionsForQuestions(questions);
  const canUseRecommendation = recommendations.length > 0 && recommendations.every(Boolean);
  const answerBox = element('div', 'decision-answer');
  answerBox.dataset.decisionId = decision.id;
  answerBox.dataset.sessionId = session.session_id;
  const choices = element('div', 'answer-choices');
  for (const [choice, label, disabled] of [
    ['ok', '推奨案で OK', !canUseRecommendation],
    ['hold', '判断を保留する', false],
  ]) {
    const control = document.createElement('label');
    control.className = `answer-choice ${choice}`;
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.dataset.answerChoice = choice;
    checkbox.dataset.sessionId = session.session_id;
    checkbox.dataset.decisionId = decision.id;
    checkbox.checked = draft.choice === choice;
    checkbox.disabled = disabled;
    control.append(checkbox, document.createTextNode(label));
    choices.append(control);
  }
  answerBox.append(choices);
  const answerMeta = element('div', 'meta', answerMetaText(decision, draft));
  answerMeta.dataset.answerMeta = 'true';
  answerBox.append(answerMeta);
  const note = document.createElement('textarea');
  note.dataset.answerNote = 'true';
  note.dataset.sessionId = session.session_id;
  note.dataset.decisionId = decision.id;
  note.maxLength = 2000;
  note.setAttribute('aria-label', '指示');
  note.placeholder = '指示があれば書く (例: 2 番目の案で。理由は…)';
  note.value = draft.note;
  answerBox.append(note);
  const foot = element('div', 'answer-foot');
  const send = element('button', 'primary', '回答を送る');
  send.type = 'button';
  send.dataset.sendAnswer = decision.id;
  send.dataset.sessionId = session.session_id;
  send.disabled = !canSendDecisionAnswer(decision, draft) || !dirty;
  foot.append(send, element('span', 'answer-status', answerStatusText(answer, decision)));
  const error = element('div', 'answer-error');
  error.setAttribute('role', 'alert');
  answerBox.append(foot, error);
  card.append(answerBox);
}

function appendDecisionCard(list, decision, product, session, withTags = false, multipleSessions = false) {
  const age = Date.now() - Date.parse(decision.createdAt);
  const longWait = decision.state === 'waiting' && age > LONG_WAIT_MS && !hasEffectiveAnswer(decision);
  const card = element('article', `decision-card ${decision.state} ${longWait ? 'long-wait' : ''}`.trim());
  const answerActive = decisionAnswerAvailability(decision).active;
  const optionDraft = answerActive ? answerDraftFor(decision, session) : null;
  const header = element('div', 'decision-head');
  if (decision.isNew) header.append(badge('新着', 'new-mark'));
  appendContextTags(header, product, session, withTags, multipleSessions);
  header.append(
    element('span', 'decision-title', decision.title),
    badge(decisionStateLabel(decision.state), decision.state === 'waiting' ? 'permission' : decision.state === 'provisional' ? 'wait' : decision.state === 'resolved' ? 'done' : ''),
  );
  const elapsed = decision.state === 'waiting'
    ? `待ち時間 ${durationLabel(decision.createdAt)}`
    : decision.state === 'provisional'
      ? `仮適用から ${durationLabel(decision.updatedAt)}`
      : `更新 ${durationLabel(decision.updatedAt)}`;
  header.append(element('time', 'since', elapsed));
  if (decision.state === 'waiting' && decision.awaitingAnswerUntil) {
    const remaining = Math.max(0, Math.ceil((Date.parse(decision.awaitingAnswerUntil) - Date.now()) / 60_000));
    header.append(element('span', 'wait awaiting-min', `あと ${remaining} 分で推奨に進む`));
  }
  // id はモデルが cockpit_update_decision で使う値なので、本文に出さずマウスを重ねたときだけ出す。
  card.title = `id: ${decision.id}`;
  card.append(header);
  if (decision.context) card.append(element('p', 'decision-context', decision.context));

  for (const [questionIndex, question] of (decision.questions || []).entries()) {
    const questionBox = element('section', 'decision-question');
    if (question.header) questionBox.append(element('div', 'meta', question.header));
    if (question.question !== decision.title) questionBox.append(element('div', 'decision-question-title', question.question));
    if (question.multiSelect) questionBox.append(element('div', 'meta', '複数選択できます。'));
    if (question.options?.length) {
      const options = element('ul', 'decision-options');
      for (const [optionIndex, option] of question.options.entries()) {
        const row = element('li', `decision-option ${option.recommended ? 'recommended' : ''}`.trim());
        const displayLabel = option.recommended ? displayRecommendedLabel(option.label) : option.label;
        const body = element('span', 'answer-pick-body');
        body.append(element('span', '', displayLabel));
        if (option.recommended) body.append(badge('推奨', 'busy'));
        if (option.description) body.append(element('span', 'decision-option-description', option.description));
        if (answerActive) {
          row.classList.add('pickable');
          const control = document.createElement('label');
          control.className = 'answer-pick';
          const input = document.createElement('input');
          input.type = question.multiSelect ? 'checkbox' : 'radio';
          input.name = `decision-answer:${encodeURIComponent(session.session_id)}:${encodeURIComponent(decision.id)}:${questionIndex}`;
          input.value = option.label;
          input.checked = optionDraft.picks[questionIndex].includes(option.label);
          input.dataset.answerPick = 'true';
          input.dataset.answerQuestion = String(questionIndex);
          input.dataset.answerOption = String(optionIndex);
          input.dataset.sessionId = session.session_id;
          input.dataset.decisionId = decision.id;
          input.setAttribute('aria-label', `${question.question}: ${displayLabel}${option.description ? `。${option.description}` : ''}`);
          control.append(input, body);
          row.append(control);
        } else {
          body.classList.remove('answer-pick-body');
          row.append(body);
        }
        options.append(row);
      }
      questionBox.append(options);
    }
    card.append(questionBox);
  }

  if (decision.resolution) {
    const choices = Array.isArray(decision.resolution.chosen)
      ? decision.resolution.chosen.join('、')
      : decision.resolution.chosen;
    if (choices) card.append(element('div', 'meta', `選択: ${choices}`));
    if (decision.resolution.note) card.append(element('div', 'meta', decision.resolution.note));
  }
  appendDecisionAnswer(card, decision, product, session);
  list.append(card);
}

function appendPlanToggle(body, kind, sessionId, expanded, count, label, expandedSet) {
  const key = `${kind}:${sessionId}`;
  const toggle = element('button', 'ended-toggle', `${expanded ? `${label}を隠す` : `${label}を表示`} (${count} 件)`);
  toggle.type = 'button';
  toggle.setAttribute('aria-expanded', String(expanded));
  toggle.dataset.planToggle = key;
  toggle.addEventListener('click', () => {
    if (expanded) expandedSet.delete(sessionId);
    else expandedSet.add(sessionId);
    if (lastState) render(lastState);
    [...root.querySelectorAll('[data-plan-toggle]')].find((button) => button.dataset.planToggle === key)?.focus({ preventScroll: true });
  });
  body.append(toggle);
}

function kindToggleLabel(label, expanded, count) {
  return expanded ? `${label}を畳む` : `${label}を表示 (${count} 件)`;
}

function appendKindToggle(body, sectionKey, expanded, count, label) {
  const toggle = element('button', 'ended-toggle', kindToggleLabel(label, expanded, count));
  toggle.type = 'button';
  toggle.setAttribute('aria-expanded', String(expanded));
  toggle.dataset.kindToggle = sectionKey;
  toggle.addEventListener('click', () => {
    if (expandedKindSections.has(sectionKey)) expandedKindSections.delete(sectionKey);
    else expandedKindSections.add(sectionKey);
    if (lastState) render(lastState);
    [...root.querySelectorAll('[data-kind-toggle]')].find((button) => button.dataset.kindToggle === sectionKey)?.focus({ preventScroll: true });
  });
  body.append(toggle);
}

function appendDecisions(body, session, product, withTags = false, multipleSessions = false) {
  const decisions = newestFirst(session.decisions);
  const active = newestFirst(shownActiveDecisions(session));
  const ended = decisions.filter((decision) => ['resolved', 'withdrawn'].includes(decision.state));
  const expanded = expandedEndedDecisions.has(session.session_id);
  const visible = expanded ? newestFirst([...active, ...ended]) : active;
  if (visible.length) {
    const list = element('div', 'decision-list');
    for (const decision of visible) appendDecisionCard(list, decision, product, session, withTags, multipleSessions);
    body.append(list);
  } else if (!shownPermissions(session).length && !hasHiddenJudgmentItems(session)) body.append(element('div', 'empty', ended.length ? '未解決の判断事項はありません。' : 'ありません'));
  if (ended.length) appendPlanToggle(body, 'decisions', session.session_id, expanded, ended.length, '解決済みと取り下げ', expandedEndedDecisions);
}

function appendTaskItem(list, task, product, session, withTags = false, multipleSessions = false) {
  const labels = { todo: '未着手', doing: '作業中', done: '完了' };
  const item = element('li', `task-item ${task.state}`);
  const header = element('div', 'task-head');
  appendContextTags(header, product, session, withTags, multipleSessions);
  header.append(element('span', 'task-title', task.title), badge(labels[task.state] || task.state, task.state === 'done' ? 'done' : task.state === 'doing' ? 'busy' : ''));
  const met = task.criteria.filter((criterion) => criterion.met).length;
  header.append(element('span', 'meta', `完了条件 ${met}/${task.criteria.length}`));
  if (task.closedByUser) header.append(element('span', 'meta', '画面で完了にした'));
  if (task.state !== 'done') {
    const close = element('button', 'link-btn close-task', '完了にする');
    close.type = 'button';
    close.dataset.closeTask = `${session.session_id}::${task.title}`;
    header.append(close);
  }
  item.append(header);
  if (task.criteria.length) {
    const criteria = element('ul', 'criteria-list');
    for (const criterion of task.criteria) {
      const row = element('li', criterion.met ? 'met' : '', criterion.text);
      criteria.append(row);
    }
    item.append(criteria);
  }
  list.append(item);
}

function appendTasks(body, session, product, withTags = false, multipleSessions = false) {
  const tasks = session.tasks;
  const heading = element('h3', 'sub', 'タスクと完了条件 ');
  if (session.tasksUpdatedAt) heading.append(element('span', 'meta', `最終更新 ${durationAgoLabel(session.tasksUpdatedAt)}`));
  body.append(heading);
  if (!tasks.length) {
    body.append(element('div', 'empty', 'タスクはありません。'));
    return;
  }
  const showTodo = expandedTodoTasks.has(session.session_id);
  const showDone = expandedDoneTasks.has(session.session_id);
  const { todoCount, doneCount, visible } = taskVisibility(session, showTodo, showDone);
  if (!visible.length) body.append(element('div', 'empty', '未完了のタスクはありません。'));
  else {
    const list = element('ul', 'task-list');
    for (const task of visible) appendTaskItem(list, task, product, session, withTags, multipleSessions);
    body.append(list);
  }
  if (todoCount) appendPlanToggle(body, 'todoTasks', session.session_id, showTodo, todoCount, '未着手のタスク', expandedTodoTasks);
  if (doneCount) appendPlanToggle(body, 'tasks', session.session_id, showDone, doneCount, '完了したタスク', expandedDoneTasks);
}

// 作業中のタスクがあるときは未着手を畳み、今やっていることを先に見せる。未着手しか無ければ畳まない。
function taskVisibility(session, showTodo, showDone) {
  const doing = session.tasks.some((task) => task.state === 'doing');
  const todo = doing ? session.tasks.filter((task) => task.state === 'todo') : [];
  const done = session.tasks.filter((task) => task.state === 'done');
  const visible = session.tasks.filter((task) => (
    task.state === 'done' ? showDone : task.state === 'todo' && doing ? showTodo : true
  ));
  return { todoCount: todo.length, doneCount: done.length, visible };
}

function kindDoneTaskCount(references) {
  return references.reduce((count, { session }) => count + taskVisibility(session, true, true).doneCount, 0);
}

function kindTodoTaskCount(references) {
  return references.reduce((count, { session }) => count + taskVisibility(session, true, true).todoCount, 0);
}

function appendKindTaskSession(body, reference, showTodo, showDone) {
  const { product, session, multipleSessions } = reference;
  const { visible } = taskVisibility(session, showTodo, showDone);
  const group = element('div', 'kind-session-tasks');
  const heading = element('div', 'kind-task-head');
  appendContextTags(heading, product, session, true, true);
  heading.append(element('span', 'meta', `最終更新 ${session.tasksUpdatedAt ? durationAgoLabel(session.tasksUpdatedAt) : '時刻不明'}`));
  group.append(heading);
  if (!visible.length) group.append(element('div', 'empty', session.tasks.length ? '未完了のタスクはありません。' : 'タスクはありません。'));
  else {
    const list = element('ul', 'task-list');
    for (const task of visible) appendTaskItem(list, task, product, session, false, multipleSessions);
    group.append(list);
  }
  body.append(group);
}

// 状態不明のセッションは古い記録を持つことが多いので、今日でなければ日付も出す。
function estimateTimeLabel(date) {
  const time = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
  return date.toDateString() === new Date().toDateString() ? time : `${date.getMonth() + 1}/${date.getDate()} ${time}`;
}

function appendUnknownSessionControls(body, session) {
  if (session.status !== '不明') return;
  const actions = element('div', 'session-actions');
  const estimateButton = element('button', 'ended-toggle', '状態を推定');
  estimateButton.type = 'button';
  estimateButton.dataset.estimateSession = session.session_id;
  const hideButton = element('button', 'ended-toggle', '一覧から外す');
  hideButton.type = 'button';
  hideButton.dataset.hideSession = session.session_id;
  actions.append(estimateButton, hideButton);
  body.append(actions);

  if (!session.estimate) return;
  const panel = element('div', 'estimate');
  if (!session.estimate.canEstimate) {
    panel.textContent = '推定できませんでした';
  } else {
    const timestamp = Date.parse(session.estimate.recordedAt);
    const recordedAt = Number.isFinite(timestamp) ? estimateTimeLabel(new Date(timestamp)) : '時刻不明';
    panel.append(element('p', '', `最後の記録: ${recordedAt}、最後のツール: ${session.estimate.lastTool ?? 'なし'}`));
    const waiting = session.estimate.state === 'input'
      ? 'はい'
      : session.estimate.state === 'tool'
        ? 'いいえ (許可待ちかツールの実行中)'
        : 'いいえ (応答の生成中)';
    panel.append(element('p', '', `入力待ちらしい: ${waiting}`));
  }
  body.append(panel);
}

function unknownSessionControls(session, product, multipleSessions) {
  if (session.status !== '不明') return null;
  const block = element('div', 'kind-unknown');
  const tags = element('div', 'meta');
  appendContextTags(tags, product, session, true, multipleSessions);
  block.append(tags);
  appendUnknownSessionControls(block, session);
  return block;
}

function productStatusBadge(session) {
  const status = activityStatus(session);
  return badge(status.label, status.tone);
}

function sessionBlock(product, session, multipleSessions) {
  const block = element('div', `session-group ${multipleSessions ? '' : 'single'}`.trim());
  if (multipleSessions) {
    const head = element('div', 'session-head');
    head.append(element('h3', '', session.title || session.session_id));
    if (!sharedBranch(product) && session.product?.branch) head.append(element('span', 'meta branch', session.product.branch));
    head.append(productStatusBadge(session));
    block.append(head);
  }

  const body = element('div', 'session-body');
  const judgmentCount = shownPermissions(session).length + shownActiveDecisions(session).length;
  const hasEndedDecisions = session.decisions.some((decision) => ['resolved', 'withdrawn'].includes(decision.state));
  const showJudgment = judgmentCount > 0 || hasEndedDecisions || !hasHiddenJudgmentItems(session);
  if (showJudgment) {
    const judgmentHeading = element('h3', 'sub', 'あなたの判断が必要なこと');
    judgmentHeading.append(element('span', 'count', `(${judgmentCount} 件)`));
    body.append(judgmentHeading);
    appendPermissionWaits(body, session, product);
    appendDecisions(body, session, product);
  }
  appendTasks(body, session, product);
  body.append(element('h3', 'sub', '今やっていること'));
  const now = element('div', 'now');
  now.append(mainRow(session, product));
  body.append(now);
  appendAgents(body, session, product);
  appendUnknownSessionControls(body, session);
  block.append(body);
  return block;
}

function productControls(product, index, total, pinnedCount, headingId) {
  const pinned = displayPreferences.pinned.includes(product.key);
  const collapsed = displayPreferences.collapsed.includes(product.key);
  const controls = element('div', 'order');
  const collapse = element('button', 'icon-btn', collapsed ? '開く' : '畳む');
  collapse.type = 'button';
  collapse.dataset.productAction = 'collapse';
  collapse.dataset.productKey = product.key;
  collapse.setAttribute('aria-expanded', String(!collapsed));
  collapse.setAttribute('aria-label', `${product.name}を${collapsed ? '開く' : '畳む'}`);
  const pin = element('button', 'icon-btn', pinned ? '固定中' : '固定');
  pin.type = 'button';
  pin.dataset.productAction = 'pin';
  pin.dataset.productKey = product.key;
  pin.setAttribute('aria-pressed', String(pinned));
  pin.title = pinned ? '固定を解除' : '最上部に固定';
  const moveUp = element('button', 'icon-btn', '↑');
  moveUp.type = 'button';
  moveUp.dataset.productAction = 'move';
  moveUp.dataset.productKey = product.key;
  moveUp.dataset.direction = '-1';
  moveUp.disabled = pinned ? index === 0 : index === pinnedCount;
  moveUp.setAttribute('aria-label', `${product.name}を上へ`);
  const moveDown = element('button', 'icon-btn', '↓');
  moveDown.type = 'button';
  moveDown.dataset.productAction = 'move';
  moveDown.dataset.productKey = product.key;
  moveDown.dataset.direction = '1';
  moveDown.disabled = pinned ? index === pinnedCount - 1 : index === total - 1;
  moveDown.setAttribute('aria-label', `${product.name}を下へ`);
  const close = productCloseButton(product, headingId);
  controls.append(collapse, pin, moveUp, moveDown, close);
  return controls;
}

function productCloseButton(product, describedById) {
  const close = element('button', 'icon-btn', '×');
  close.type = 'button';
  close.dataset.productAction = 'close';
  close.dataset.productKey = product.key;
  close.setAttribute('aria-label', 'このプロダクトを閉じる');
  if (describedById) close.setAttribute('aria-describedby', describedById);
  close.title = 'このプロダクトを閉じる';
  return close;
}

// セッションが全部同じブランチならプロダクトの見出しに出し、分かれていればセッションの頭に出す。
function sharedBranch(product) {
  return product.branches.size === 1 ? [...product.branches][0] : '';
}

function productSection(product, index, products, pinnedCount) {
  const pinned = displayPreferences.pinned.includes(product.key);
  const section = element('section', `section ${pinned ? 'pinned' : ''}`.trim());
  const head = element('div', 'head');
  const heading = element('h2', '', product.name);
  heading.id = `product-heading-${index}`;
  head.append(heading);
  const branch = sharedBranch(product);
  if (branch) head.append(element('span', 'meta branch', branch));

  const permissionCount = product.sessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  const decisionCount = product.sessions.reduce((total, session) => total + session.decisions.filter((decision) => ['waiting', 'provisional'].includes(decision.state)).length, 0);
  const pullRequestGroups = product.pullRequestGroups || [];
  if (permissionCount) head.append(element('span', 'chip danger', `許可待ち (${permissionCount} 件)`));
  if (decisionCount) head.append(element('span', 'chip danger', `判断待ち (${decisionCount} 件)`));
  const mergeableCount = pullRequestMergeableCount(pullRequestGroups);
  if (mergeableCount) head.append(element('span', 'chip ok', `マージできる PR (${mergeableCount} 件)`));
  head.append(productControls(product, index, products.length, pinnedCount, heading.id));
  section.append(head);

  const body = element('div', 'body');
  body.hidden = displayPreferences.collapsed.includes(product.key);
  const news = sinceSeenBox(product, false);
  if (news) body.append(news);
  const multipleSessions = product.sessions.length > 1;
  for (const session of product.sessions) body.append(sessionBlock(product, session, multipleSessions));
  if (isFilterShown('prs')) {
    const openCount = pullRequestOpenCount(pullRequestGroups);
    const prsHeading = element('h3', 'sub', 'プルリクエスト');
    prsHeading.append(element('span', 'count', `(${openCount} 件)`));
    body.append(prsHeading);
    if (pullRequestGroups.length) {
      for (const group of pullRequestGroups) appendPullRequestBlock(body, group);
    } else {
      appendPullRequestBlock(body, null);
    }
  }
  section.append(body);
  return section;
}

function kindSection(title, content, extra) {
  const section = element('section', 'section kind-section');
  const head = element('div', 'head');
  head.append(element('h2', '', title));
  if (extra) head.append(extra);
  section.append(head, content);
  content.classList.add('body');
  return section;
}

function sinceSeenBox(product, withProductTag) {
  const entry = (lastState?.sinceSeen || []).find((item) => item.product?.key === product.key);
  if (!entry?.items?.length) return null;
  const box = element('div', 'news');
  const header = element('div', 'news-head');
  if (withProductTag) header.append(element('span', 'prod-tag', product.name));
  header.append(document.createTextNode(`前回見てから (${entry.items.length} 件)`));
  const seen = element('button', 'link-btn', '既読にする');
  seen.type = 'button';
  seen.dataset.seen = product.key;
  header.append(seen);
  const list = element('ul');
  for (const item of entry.items) list.append(element('li', '', item.text));
  box.append(header, list);
  return box;
}

function sessionReferences(products) {
  return products.flatMap((product) => product.sessions.map((session) => ({
    product,
    session,
    multipleSessions: product.sessions.length > 1,
  })));
}

function kindProductOrder(products) {
  const productOrder = element('div', 'order product-order kind-order');
  products.forEach((product, index) => {
    const item = element('div', 'product-order-item');
    const tag = element('span', 'prod-tag', `${index + 1}. ${product.name}`);
    tag.id = `kind-product-order-${index}`;
    tag.title = product.name;
    item.append(tag, productCloseButton(product, tag.id));
    productOrder.append(item);
  });
  return productOrder;
}

function kindEndedDecisionEntries(references) {
  const entries = references.flatMap((reference) => reference.session.decisions
    .filter((decision) => ['resolved', 'withdrawn'].includes(decision.state))
    .map((decision) => ({ ...reference, decision })));
  return entries.sort((left, right) => itemTimestamp(right.decision) - itemTimestamp(left.decision));
}

function kindEndedAgentCount(references) {
  return references.reduce((count, reference) => count + reference.session.agents.filter(isEndedAgent).length, 0);
}

function renderKindSections(products) {
  const references = sessionReferences(products);
  const waitingItems = [];
  const endedDecisions = element('div', 'kind-ended');
  for (const { product, session, multipleSessions } of references) {
    for (const wait of shownPermissions(session)) {
      const holder = element('div');
      appendPermissionWaits(holder, { ...session, permissionWaits: [wait] }, product, true, multipleSessions);
      const card = holder.firstElementChild?.firstElementChild;
      if (card) waitingItems.push({ age: Date.now() - Date.parse(wait.startedAt), card });
    }
    for (const decision of shownActiveDecisions(session)) {
      const list = element('div', 'decision-list');
      appendDecisionCard(list, decision, product, session, true, multipleSessions);
      waitingItems.push({
        age: Date.now() - Date.parse(decision.state === 'waiting' ? decision.createdAt : decision.updatedAt),
        card: list.firstElementChild,
      });
    }

  }
  const endedDecisionItems = kindEndedDecisionEntries(references);
  const showEndedDecisions = expandedKindSections.has('decisions');
  if (showEndedDecisions && endedDecisionItems.length) {
    const list = element('div', 'decision-list');
    for (const item of endedDecisionItems) {
      appendDecisionCard(list, item.decision, item.product, item.session, true, item.multipleSessions);
    }
    endedDecisions.append(list);
  }
  if (endedDecisionItems.length) {
    appendKindToggle(endedDecisions, 'decisions', showEndedDecisions, endedDecisionItems.length, '解決済みと取り下げ');
  }
  waitingItems.sort((left, right) => right.age - left.age);
  const judgment = element('div', 'body');
  for (const item of waitingItems) if (item.card) judgment.append(item.card);
  const hasHiddenJudgments = references.some(({ session }) => hasHiddenJudgmentItems(session));
  if (!waitingItems.length && !endedDecisionItems.length && !hasHiddenJudgments) judgment.append(element('div', 'empty', 'ありません'));
  if (endedDecisionItems.length) judgment.append(endedDecisions);
  const productOrder = kindProductOrder(products);

  const activityItems = [];
  const showEndedAgents = expandedKindSections.has('agents');
  const endedAgentCount = kindEndedAgentCount(references);
  for (const { product, session, multipleSessions } of references) {
    activityItems.push({ age: sessionActivityTime(session), row: mainRow(session, product, true, multipleSessions) });
    const holder = element('div');
    appendAgents(holder, session, product, true, multipleSessions, showEndedAgents, false);
    const list = holder.querySelector('.agent-list');
    if (list) for (const row of [...list.children]) {
      const startedAt = Date.parse(row.dataset.startedAt);
      activityItems.push({ age: Number.isFinite(startedAt) ? startedAt : -Infinity, row });
    }
  }
  activityItems.sort((left, right) => right.age - left.age);
  const activity = element('div', 'body');
  const activityList = element('div', 'now');
  for (const item of activityItems) activityList.append(item.row);
  activity.append(activityList);
  for (const { product, session, multipleSessions } of references) {
    const controls = unknownSessionControls(session, product, multipleSessions);
    if (controls) activity.append(controls);
  }
  if (endedAgentCount) {
    appendKindToggle(activity, 'agents', showEndedAgents, endedAgentCount, '終了済み');
  }

  const tasks = element('div', 'body');
  const showDoneTasks = expandedKindSections.has('tasks');
  const showTodoTasks = expandedKindSections.has('todoTasks');
  const todoTaskCount = kindTodoTaskCount(references);
  const doneTaskCount = kindDoneTaskCount(references);
  for (const { product, session, multipleSessions } of references) {
    if (!session.tasks.length) continue;
    appendKindTaskSession(tasks, { product, session, multipleSessions }, showTodoTasks, showDoneTasks);
  }
  if (!tasks.children.length) tasks.append(element('div', 'empty', 'ありません'));
  if (todoTaskCount) appendKindToggle(tasks, 'todoTasks', showTodoTasks, todoTaskCount, '未着手のタスク');
  if (doneTaskCount) appendKindToggle(tasks, 'tasks', showDoneTasks, doneTaskCount, '完了したタスク');

  const sections = [productOrder];
  const sinceSeenContent = element('div', 'body');
  for (const product of products) {
    const news = sinceSeenBox(product, true);
    if (news) sinceSeenContent.append(news);
  }
  if (sinceSeenContent.children.length) sections.push(kindSection('前回見てから', sinceSeenContent));
  if (waitingItems.length || endedDecisionItems.length || !hasHiddenJudgments) {
    sections.push(kindSection('あなたの判断が必要なこと', judgment));
  }
  sections.push(
    kindSection('タスクと完了条件', tasks),
    kindSection('今やっていること', activity),
  );
  const pullRequestGroups = products.flatMap((product) => product.pullRequestGroups.map((group) => ({ product, group })));
  if (isFilterShown('prs')) {
    const pullRequests = element('div', 'body');
    for (const { group } of pullRequestGroups) appendPullRequestBlock(pullRequests, group, true);
    if (!pullRequestGroups.length) pullRequests.append(element('div', 'empty', 'ありません'));
    sections.push(kindSection('プルリクエスト', pullRequests));
  }
  return sections;
}

function render(state) {
  if (answerNoteComposing) {
    deferredRenderPending = true;
    return;
  }
  deferredRenderPending = false;
  renderRouting(state.routing, state.integrations);
  const allSessions = Array.isArray(state.sessions) ? state.sessions : [];
  const sessions = allSessions.filter((session) => session.hidden !== true);
  const pullRequestGroups = Array.isArray(state.pullRequests) ? state.pullRequests : [];
  const active = document.activeElement;
  const activeAnswerNote = active instanceof HTMLTextAreaElement && active.hasAttribute('data-answer-note') ? active : null;
  const toggleAttribute = ['data-ended-toggle', 'data-plan-toggle', 'data-kind-toggle', 'data-estimate-session', 'data-hide-session'].find((attribute) => active?.hasAttribute(attribute));
  const focusData = toggleAttribute ? { kind: 'toggle', attribute: toggleAttribute, value: active.getAttribute(toggleAttribute) }
    : active?.dataset?.filter ? { kind: 'filter', key: active.dataset.filter }
      : active?.dataset?.mergeMethod ? { kind: 'merge-method', key: active.dataset.mergeKey, method: active.dataset.mergeMethod }
        : active?.dataset?.mergeDelete ? { kind: 'merge-delete', key: active.dataset.mergeKey }
          : active?.dataset?.mergeCancel ? { kind: 'merge-cancel', key: active.dataset.mergeCancel }
            : active?.dataset?.openMerge ? { kind: 'merge-open', key: active.dataset.openMerge }
              : active?.dataset?.openReserve ? { kind: 'merge-open-reserve', key: active.dataset.openReserve }
                : active?.dataset?.mergeGo ? { kind: 'merge-go', key: active.dataset.mergeGo }
                  : active?.dataset?.reserveGo ? { kind: 'merge-reserve-go', key: active.dataset.reserveGo }
                    : active?.dataset?.cancelReservation ? { kind: 'merge-cancel-reservation', key: active.dataset.cancelReservation }
      : active?.dataset?.productAction ? { kind: 'product', action: active.dataset.productAction, key: active.dataset.productKey, direction: active.dataset.direction || '' }
        : active?.dataset?.answerPick ? { kind: 'answer-pick', sessionId: active.dataset.sessionId, decisionId: active.dataset.decisionId, questionIndex: active.dataset.answerQuestion, optionIndex: active.dataset.answerOption }
          : active?.dataset?.answerChoice ? { kind: 'answer-choice', sessionId: active.dataset.sessionId, decisionId: active.dataset.decisionId, choice: active.dataset.answerChoice }
            : activeAnswerNote ? { kind: 'answer-note', sessionId: activeAnswerNote.dataset.sessionId, decisionId: activeAnswerNote.dataset.decisionId, start: activeAnswerNote.selectionStart, end: activeAnswerNote.selectionEnd, direction: activeAnswerNote.selectionDirection }
              : active?.dataset?.sendAnswer ? { kind: 'answer-submit', sessionId: active.dataset.sessionId, decisionId: active.dataset.sendAnswer }
        : active?.hasAttribute('data-show-all') ? { kind: 'show-all' }
          : active?.hasAttribute('data-clear-hidden-sessions') ? { kind: 'clear-hidden' } : null;
  renderSummary(sessions, pullRequestGroups);
  renderExcludedNote(allSessions);
  updateTitle(sessions);
