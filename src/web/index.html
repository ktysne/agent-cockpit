  document.querySelectorAll('[data-action="mode"]').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.dataset.mode === displayPreferences.mode));
  });
  const sinceSeen = Array.isArray(state.sinceSeen) ? state.sinceSeen : [];
  if (!sessions.length && !pullRequestGroups.length && !sinceSeen.length) {
    root.replaceChildren(element('section', 'section empty', '表示するセッションがありません。Claude Code でセッションを開始すると、ここに表示されます。'));
    return;
  }

  const products = orderedProducts(sessions, pullRequestGroups, sinceSeen);
  if (displayPreferences.mode === 'product') {
    const pinnedCount = products.filter((product) => displayPreferences.pinned.includes(product.key)).length;
    root.replaceChildren(...products.map((product, index) => productSection(product, index, products, pinnedCount)));
  } else {
    root.replaceChildren(...renderKindSections(products));
  }

  if (focusData?.kind?.startsWith('merge-')) {
    const controls = [...root.querySelectorAll('[data-merge-method], [data-merge-delete], [data-merge-cancel], [data-open-merge], [data-open-reserve], [data-merge-go], [data-reserve-go], [data-cancel-reservation]')];
    let control = controls.find((item) => item.dataset.mergeKey === focusData.key && (
      focusData.kind === 'merge-method' ? item.dataset.mergeMethod === focusData.method
        : focusData.kind === 'merge-delete' ? item.hasAttribute('data-merge-delete')
          : focusData.kind === 'merge-cancel' ? item.hasAttribute('data-merge-cancel')
            : focusData.kind === 'merge-go' ? item.dataset.mergeGo === focusData.key
              : focusData.kind === 'merge-reserve-go' ? item.dataset.reserveGo === focusData.key
                : focusData.kind === 'merge-cancel-reservation' ? item.dataset.cancelReservation === focusData.key
                  : focusData.kind === 'merge-open' ? item.dataset.openMerge === focusData.key
                    : focusData.kind === 'merge-open-reserve' ? item.dataset.openReserve === focusData.key
                      : false
    ));
    if (!control && ['merge-open', 'merge-open-reserve'].includes(focusData.kind)) {
      control = controls.find((item) => item.dataset.mergeKey === focusData.key && item.hasAttribute('data-merge-method'));
    }
    control?.focus({ preventScroll: true });
    return;
  }

  if (focusData) {
    if (['answer-pick', 'answer-choice', 'answer-note', 'answer-submit'].includes(focusData.kind)) {
      const control = [...root.querySelectorAll('[data-answer-pick], [data-answer-choice], [data-answer-note], [data-send-answer]')].find((item) => (
        item.dataset.sessionId === focusData.sessionId &&
        (item.dataset.decisionId || item.dataset.sendAnswer) === focusData.decisionId &&
        (focusData.kind !== 'answer-pick' || (item.dataset.answerQuestion === focusData.questionIndex && item.dataset.answerOption === focusData.optionIndex)) &&
        (focusData.kind !== 'answer-choice' || item.dataset.answerChoice === focusData.choice) &&
        (focusData.kind !== 'answer-note' || item.hasAttribute('data-answer-note')) &&
        (focusData.kind !== 'answer-submit' || item.hasAttribute('data-send-answer'))
      ));
      if (focusData.kind === 'answer-note' && activeAnswerNote && control instanceof HTMLTextAreaElement) {
        control.replaceWith(activeAnswerNote);
        const answerDraftKeyValue = answerDraftKey(focusData.sessionId, focusData.decisionId);
        const decision = findDecision(focusData.sessionId, focusData.decisionId);
        const answerDraft = answerDraftFor(decision, { session_id: focusData.sessionId });
        if (answerDraft.note !== activeAnswerNote.value) {
          answerDrafts.set(answerDraftKeyValue, { ...answerDraft, note: activeAnswerNote.value });
        }
        updateAnswerSubmit(activeAnswerNote.closest('.decision-answer'));
        activeAnswerNote.focus({ preventScroll: true });
        activeAnswerNote.setSelectionRange(focusData.start, focusData.end, focusData.direction);
        return;
      }
      control?.focus({ preventScroll: true });
      if (focusData.kind === 'answer-note' && control instanceof HTMLTextAreaElement) {
        control.setSelectionRange(focusData.start, focusData.end);
      }
      return;
    }
    const buttons = [...document.querySelectorAll('button')];
    const button = buttons.find((item) => {
      if (focusData.kind === 'toggle') return item.getAttribute(focusData.attribute) === focusData.value;
      if (focusData.kind === 'filter') return item.dataset.filter === focusData.key;
      if (focusData.kind === 'show-all') return item.hasAttribute('data-show-all');
      if (focusData.kind === 'clear-hidden') return item.hasAttribute('data-clear-hidden-sessions');
      return item.dataset.productAction === focusData.action && item.dataset.productKey === focusData.key && (item.dataset.direction || '') === focusData.direction;
    });
    const fallback = focusData.kind === 'product' && focusData.action === 'move' && button?.disabled
      ? buttons.find((item) => item.dataset.productAction === 'move' && item.dataset.productKey === focusData.key && item.dataset.direction === String(-Number(focusData.direction)))
      : focusData.kind === 'toggle' && focusData.attribute === 'data-hide-session' && !button
        ? buttons.find((item) => item.hasAttribute('data-clear-hidden-sessions'))
      : button;
    fallback?.focus({ preventScroll: true });
  }
}

function renderDeferredState() {
  if (!deferredRenderPending || answerNoteComposing) return;
  deferredRenderPending = false;
  if (lastState) render(lastState);
}

function findDecision(sessionId, decisionId) {
  const session = lastState?.sessions.find((item) => item.session_id === sessionId);
  return session?.decisions.find((item) => item.id === decisionId) || null;
}

function answerDraftKey(sessionId, decisionId) {
  return `${sessionId}\0${decisionId}`;
}

function updateAnswerSubmit(card) {
  const sessionId = card.dataset.sessionId;
  const decisionId = card.dataset.decisionId;
  const decision = findDecision(sessionId, decisionId);
  const button = card.querySelector('[data-send-answer]');
  if (!decision || !button) return;
  const draft = answerDraftFor(decision, { session_id: sessionId });
  const answer = decision.answer;
  const changed = !answer?.sentAt || draft.choice !== (answer?.choice ?? null) || draft.note !== (answer?.note || '') || !sameAnswerPicks(draft.picks, copyAnswerPicks(answer?.picks, (decision.questions || []).length));
  const meta = card.querySelector('[data-answer-meta]');
  if (meta) meta.textContent = answerMetaText(decision, draft);
  button.disabled = !canSendDecisionAnswer(decision, draft) || !changed;
}

function showAnswerError(sessionId, decisionId, message) {
  const card = [...root.querySelectorAll('.decision-answer')].find((item) => (
    item.dataset.sessionId === sessionId && item.dataset.decisionId === decisionId
  ));
  const error = card?.querySelector('.answer-error');
  if (error) error.textContent = message;
}

async function sendDecisionAnswer(button) {
  const sessionId = button.dataset.sessionId;
  const decisionId = button.dataset.sendAnswer;
  const decision = findDecision(sessionId, decisionId);
  if (!decision) return;
  const draft = answerDraftFor(decision, { session_id: sessionId });
  button.disabled = true;
  try {
    const response = await postUiAction(`/api/decisions/${encodeURIComponent(decisionId)}/answer`, {
      session_id: sessionId,
      choice: draft.choice,
      note: draft.note,
      ...(draft.choice === 'pick' ? { picks: draft.picks } : {}),
    });
    if (response.status === 409 || response.status === 404) {
      await refresh();
      showAnswerError(sessionId, decisionId, '判断事項の状態が変わりました。表示を確認してください。');
      return;
    }
    if (response.status === 400) {
      showAnswerError(sessionId, decisionId, '回答の選択内容と指示を確認してください。');
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    answerDrafts.delete(answerDraftKey(sessionId, decisionId));
    await refresh();
    liveStatus.textContent = '回答を送信しました。';
  } catch {
    showAnswerError(sessionId, decisionId, '回答を送信できませんでした。');
    showWriteError('回答を送信できませんでした');
  } finally {
    if (button.isConnected) updateAnswerSubmit(button.closest('.decision-answer'));
  }
}

document.addEventListener('change', (event) => {
  const choice = event.target.closest('[data-answer-choice]');
  if (choice) {
    if (choice.disabled) return;
    const key = answerDraftKey(choice.dataset.sessionId, choice.dataset.decisionId);
    const card = choice.closest('.decision-answer');
    const decision = findDecision(choice.dataset.sessionId, choice.dataset.decisionId);
    if (!decision) return;
    const current = answerDraftFor(decision, { session_id: choice.dataset.sessionId });
    const next = { ...current, choice: choice.checked ? choice.dataset.answerChoice : null, picks: emptyAnswerPicks(decision) };
    answerDrafts.set(key, next);
    for (const input of card.querySelectorAll('[data-answer-choice]')) {
      input.checked = next.choice === input.dataset.answerChoice;
    }
    for (const input of choice.closest('.decision-card')?.querySelectorAll('[data-answer-pick]') || []) input.checked = false;
    card.querySelector('.answer-error').textContent = '';
    updateAnswerSubmit(card);
    return;
  }

  const pick = event.target.closest('[data-answer-pick]');
  if (!pick) return;
  const sessionId = pick.dataset.sessionId;
  const decisionId = pick.dataset.decisionId;
  const decision = findDecision(sessionId, decisionId);
  if (!decision) return;
  const questionIndex = Number(pick.dataset.answerQuestion);
  const optionIndex = Number(pick.dataset.answerOption);
  const question = decision.questions?.[questionIndex];
  const option = question?.options?.[optionIndex];
  if (!option) return;
  const current = answerDraftFor(decision, { session_id: sessionId });
  const picks = copyAnswerPicks(current.picks, (decision.questions || []).length);
  const selectedLabels = new Set(question.multiSelect ? picks[questionIndex] : []);
  if (pick.checked) selectedLabels.add(option.label);
  else selectedLabels.delete(option.label);
  picks[questionIndex] = [...new Set(question.options.map((item) => item.label).filter((label) => selectedLabels.has(label)))];
  const choiceValue = picks.some((labels) => labels.length) ? 'pick' : null;
  answerDrafts.set(answerDraftKey(sessionId, decisionId), { ...current, choice: choiceValue, picks });
  // 選択肢は回答欄の外(質問の区画)にあるので、判断事項のカードから回答欄を引く。
  const card = pick.closest('.decision-card')?.querySelector('.decision-answer');
  if (!card) return;
  for (const input of card.querySelectorAll('[data-answer-choice]')) input.checked = false;
  card.querySelector('.answer-error').textContent = '';
  updateAnswerSubmit(card);
});

document.addEventListener('input', (event) => {
  const note = event.target.closest('[data-answer-note]');
  if (!note) return;
  const key = answerDraftKey(note.dataset.sessionId, note.dataset.decisionId);
  const decision = findDecision(note.dataset.sessionId, note.dataset.decisionId);
  const current = decision ? answerDraftFor(decision, { session_id: note.dataset.sessionId }) : { choice: null, note: '' };
  answerDrafts.set(key, { ...current, note: note.value });
  const card = note.closest('.decision-answer');
  card.querySelector('.answer-error').textContent = '';
  updateAnswerSubmit(card);
});

document.addEventListener('compositionstart', (event) => {
  if (event.target.matches?.('[data-answer-note]')) answerNoteComposing = true;
}, true);

document.addEventListener('compositionend', (event) => {
  if (!event.target.matches?.('[data-answer-note]')) return;
  answerNoteComposing = false;
  renderDeferredState();
}, true);

async function runCloseAction(button, url, body, errorMessage) {
  button.disabled = true;
  try {
    const response = await postUiAction(url, body);
    if (response.status === 404 || response.status === 409) {
      await refresh();
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    await refresh();
    liveStatus.textContent = '状態を更新しました。';
  } catch {
    liveStatus.textContent = errorMessage;
    showWriteError(errorMessage);
  } finally {
    if (button.isConnected) button.disabled = false;
  }
}

function closeTaskButton(button) {
  const key = button.dataset.closeTask || '';
  const separator = key.indexOf('::');
  if (separator < 1) return;
  void runCloseAction(button, '/api/closed-tasks', {
    session_id: key.slice(0, separator),
    title: key.slice(separator + 2),
  }, 'タスクを完了にできませんでした');
}

async function markProductSeen(button) {
  const productKey = button.dataset.seen;
  button.disabled = true;
  try {
    const response = await postUiAction('/api/seen', { productKey, generatedAt: lastState?.generatedAt });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    await refresh();
    liveStatus.textContent = '前回見てからの項目を既読にしました。';
  } catch {
    liveStatus.textContent = '項目を既読にできませんでした';
    showWriteError('項目を既読にできませんでした');
  } finally {
    if (button.isConnected) button.disabled = false;
  }
}

function closeAgentButton(button) {
  const key = button.dataset.closeAgent || '';
  const separator = key.indexOf('::');
  if (separator < 1) return;
  void runCloseAction(button, '/api/closed-agents', {
    session_id: key.slice(0, separator),
    agent_id: key.slice(separator + 2),
  }, 'サブエージェントを終了にできませんでした');
}

function findPullRequestMergeTarget(key) {
  if (!/^[a-f0-9]{64}$/i.test(key)) return null;
  const find = (items) => {
    for (const pullRequest of items || []) {
      if (pullRequest.mergeRecordKey === key && pullRequest.mergeSessionId && Number.isSafeInteger(pullRequest.number)) return pullRequest;
      const nested = find(pullRequest.children);
      if (nested) return nested;
    }
    return null;
  };
  for (const group of lastState?.pullRequests || []) {
    const pullRequest = find(group.trees);
    if (pullRequest) return { group, pullRequest, number: pullRequest.number };
  }
  return null;
}

async function runPullRequestMergeAction(button, action) {
  const key = button.dataset.mergeGo || button.dataset.reserveGo || button.dataset.cancelReservation;
  const target = findPullRequestMergeTarget(key || '');
  if (!target || pullRequestMergeInFlight.has(key)) return;
  const { group, pullRequest, number } = target;
  const options = pullRequestMergeOptionsFor(group, pullRequest);
  const endpoint = action === 'merge' ? '/api/pull-requests/merge'
    : action === 'reserve' ? '/api/pull-requests/reserve'
      : '/api/pull-requests/cancel-reservation';
  const body = { number, registration_key: pullRequest.mergeRecordKey };
  if (action !== 'cancel') Object.assign(body, {
    headRefOid: pullRequest.headRefOid,
    method: options.method,
    deleteBranch: options.deleteBranch,
  });
  pullRequestMergeInFlight.add(key);
  pullRequestMergeMessages.delete(key);
  button.disabled = true;
  liveStatus.textContent = action === 'merge' ? `PR #${number} の状態を確認してマージしています。`
    : action === 'reserve' ? `PR #${number} のマージを予約しています。`
      : `PR #${number} のマージ予約を取り消しています。`;
  if (lastState) render(lastState);
  try {
    const response = await postUiAction(endpoint, body);
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      pullRequestMergeMessages.set(key, result.error || 'PR の状態が変わりました。表示を確認してください。');
      await refresh();
      if (lastState) render(lastState);
      liveStatus.textContent = pullRequestMergeMessages.get(key);
      return;
    }
    pullRequestMergeConfirmations.delete(key);
    const queuedMessage = action === 'merge' && result.queued
      ? result.message || `PR #${number} はマージキューに入りました。まだマージされていません`
      : null;
    if (queuedMessage) pullRequestMergeMessages.set(key, queuedMessage);
    else pullRequestMergeMessages.delete(key);
    await refresh();
    liveStatus.textContent = queuedMessage || (action === 'merge' ? `PR #${number} をマージしました。`
      : action === 'reserve' ? `PR #${number} のマージを予約しました。`
        : `PR #${number} のマージ予約を取り消しました。`);
  } catch {
    pullRequestMergeMessages.set(key, '操作結果を取得できませんでした。PR の状態を取り直してください。');
    if (lastState) render(lastState);
    liveStatus.textContent = pullRequestMergeMessages.get(key);
  } finally {
    pullRequestMergeInFlight.delete(key);
    if (lastState) render(lastState);
  }
}

async function runSessionAction(button, url, body, errorMessage, focusExcludedNote = false) {
  button.disabled = true;
  try {
    const requests = body.action === 'hide' && Array.isArray(body.session_ids)
      ? Array.from({ length: Math.ceil(body.session_ids.length / 50) }, (_, index) => ({
        action: 'hide', session_ids: body.session_ids.slice(index * 50, (index + 1) * 50),
      }))
      : [body];
    let hiddenAny = false;
    for (const requestBody of requests) {
      const response = await postUiAction(url, requestBody);
      // 押した直後にイベントが届いて状態が分かった場合は、失敗と出さずに表示を取り直す。
      if (response.status === 404 || response.status === 409) continue;
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      hiddenAny = true;
    }
    await refresh();
    if (!hiddenAny) return;
    if (focusExcludedNote) document.querySelector('[data-clear-hidden-sessions]')?.focus({ preventScroll: true });
    else if (button.dataset.estimateSession) {
      [...document.querySelectorAll('[data-estimate-session]')]
        .find((item) => item.dataset.estimateSession === button.dataset.estimateSession)
        ?.focus({ preventScroll: true });
    } else if (body.action === 'clear') {
      (root.querySelector('[data-estimate-session]') || root.querySelector('button'))?.focus({ preventScroll: true });
    }
  } catch {
    liveStatus.textContent = errorMessage;
    showWriteError('セッションの操作に失敗しました');
  } finally {
    if (button.isConnected) button.disabled = false;
  }
}

document.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.route) {
    void updateRouting(button);
    return;
  }
  if (button.dataset.seen) {
    void markProductSeen(button);
    return;
  }
  if (button.dataset.openMerge || button.dataset.openReserve) {
    const key = button.dataset.openMerge || button.dataset.openReserve;
    pullRequestMergeConfirmations.set(key, button.dataset.openReserve ? 'reserve' : 'merge');
    pullRequestMergeMessages.delete(key);
    if (lastState) render(lastState);
    return;
  }
  if (button.dataset.mergeCancel) {
    pullRequestMergeConfirmations.delete(button.dataset.mergeCancel);
    pullRequestMergeMessages.delete(button.dataset.mergeCancel);
    if (lastState) render(lastState);
    return;
  }
  if (button.dataset.mergeGo) {
    void runPullRequestMergeAction(button, 'merge');
    return;
  }
  if (button.dataset.reserveGo) {
    void runPullRequestMergeAction(button, 'reserve');
    return;
  }
  if (button.dataset.cancelReservation) {
    void runPullRequestMergeAction(button, 'cancel');
    return;
  }
  if (button.dataset.closeTask) {
    closeTaskButton(button);
    return;
  }
  if (button.dataset.closeAgent) {
    closeAgentButton(button);
    return;
  }
  if (button.dataset.sendAnswer) {
    void sendDecisionAnswer(button);
    return;
  }
  if (button.dataset.estimateSession) {
    void runSessionAction(
      button,
      `/api/sessions/${encodeURIComponent(button.dataset.estimateSession)}/estimate`,
      {},
      '状態を推定できませんでした',
    );
    return;
  }
  if (button.dataset.hideSession) {
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'hide', session_id: button.dataset.hideSession },
      'セッションを一覧から外せませんでした',
      true,
    );
    return;
  }
  if (button.dataset.clearHiddenSessions) {
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'clear' },
      '外したセッションを表示できませんでした',
    );
    return;
  }
  if (button.dataset.filter) {
    toggleFilter(button.dataset.filter);
    return;
  }
  if (button.dataset.productAction === 'close') {
    const product = productGroups(lastState.sessions.filter((session) => session.hidden !== true))
      .find((item) => item.key === button.dataset.productKey);
    if (!product?.sessions.length) return;
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'hide', session_ids: product.sessions.map((session) => session.session_id) },
      'プロダクトのセッションを一覧から外せませんでした',
      true,
    );
    return;
  }
  if (button.dataset.productAction) {
    const key = button.dataset.productKey;
    let changedKey;
    if (button.dataset.productAction === 'collapse') {
      displayPreferences.collapsed = displayPreferences.collapsed.includes(key)
        ? displayPreferences.collapsed.filter((item) => item !== key)
        : [...displayPreferences.collapsed, key];
      changedKey = 'collapsed';
    } else if (button.dataset.productAction === 'pin') {
      displayPreferences.pinned = displayPreferences.pinned.includes(key)
        ? displayPreferences.pinned.filter((item) => item !== key)
        : [...displayPreferences.pinned, key];
      changedKey = 'pinned';
    } else {
      const state = lastState || {};
      const sessions = (Array.isArray(state.sessions) ? state.sessions : []).filter((session) => session.hidden !== true);
      const pullRequests = Array.isArray(state.pullRequests) ? state.pullRequests : [];
      const sinceSeen = Array.isArray(state.sinceSeen) ? state.sinceSeen : [];
      const products = orderedProducts(sessions, pullRequests, sinceSeen);
      const index = products.findIndex((product) => product.key === key);
      if (index < 0) return;
      const pinnedCount = products.filter((product) => displayPreferences.pinned.includes(product.key)).length;
      const direction = Number(button.dataset.direction);
      const targetIndex = index + direction;
      const pinned = displayPreferences.pinned.includes(key);
      const canMove = pinned
        ? targetIndex >= 0 && targetIndex < pinnedCount
        : targetIndex >= pinnedCount && targetIndex < products.length;
      if (!canMove) return;
      const currentKey = products[index].key;
      const targetKey = products[targetIndex].key;
      const currentOrderIndex = displayPreferences.order.indexOf(currentKey);
      const targetOrderIndex = displayPreferences.order.indexOf(targetKey);
      [displayPreferences.order[currentOrderIndex], displayPreferences.order[targetOrderIndex]] =
        [displayPreferences.order[targetOrderIndex], displayPreferences.order[currentOrderIndex]];
      changedKey = 'order';
    }
    saveDisplayPreferences({ [changedKey]: displayPreferences[changedKey] });
    if (lastState) render(lastState);
  }
});

document.addEventListener('change', (event) => {
  const method = event.target.closest('[data-merge-method]');
  const deleteBranch = event.target.closest('[data-merge-delete]');
  const control = method || deleteBranch;
  if (!control) return;
  const target = findPullRequestMergeTarget(control.dataset.mergeKey || '');
  if (!target) return;
  const options = pullRequestMergeOptionsFor(target.group, target.pullRequest);
  if (method) options.method = method.dataset.mergeMethod;
  if (deleteBranch) options.deleteBranch = deleteBranch.checked;
  pullRequestMergeOptions.set(control.dataset.mergeKey, options);
  if (lastState) render(lastState);
});

function renderReloadNote(pending) {
  reloadNote.hidden = !pending;
  reloadNote.innerHTML = pending
    ? '<span>画面が新しくなりました。書きかけの回答を送るか消すと、読み込み直します。</span><button type="button" class="link-btn" data-reload-now>今すぐ読み込み直す</button>'
    : '';
}

// 下書きは送信の成功でしか消えないので、選んで戻したものや回答できなくなった判断事項のものは書きかけと数えない。
function hasUnsentAnswerDraft(state) {
  for (const [key, draft] of answerDrafts) {
    const [sessionId, decisionId] = key.split('\0');
    const session = state.sessions?.find((item) => item.session_id === sessionId);
    const decision = session?.decisions?.find((item) => item.id === decisionId);
    if (!decision || !decisionAnswerAvailability(decision).active) continue;
    const questionCount = (decision.questions || []).length;
    const sent = decision.answer?.sentAt ? decision.answer : {};
    const cannotSend = (draft.choice ?? null) === null && (draft.note || '') === (sent.note || '');
    if (cannotSend) continue;
    if ((draft.choice ?? null) !== (sent.choice ?? null) || (draft.note || '') !== (sent.note || '')
      || !sameAnswerPicks(copyAnswerPicks(draft.picks, questionCount), copyAnswerPicks(sent.picks, questionCount))) return true;
  }
  return false;
}

function checkUiVersion(state) {
  if (!initialUiVersion || state.uiVersion == null) return false;
  if (state.uiVersion === initialUiVersion) {
    if (uiUpdatePending) renderReloadNote(false);
    uiUpdatePending = false;
    return false;
  }
  if (!hasUnsentAnswerDraft(state)) {
    location.reload();
    return true;
  }
  if (!uiUpdatePending) renderReloadNote(true);
  uiUpdatePending = true;
  return false;
}

function reloadNow(event) {
  if (event.target.closest('[data-reload-now]')) location.reload();
}

reloadNote.addEventListener('click', reloadNow);

async function refresh() {
  try {
    const response = await fetch('/api/state', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const state = await response.json();
    if (checkUiVersion(state)) return;
    await syncDisplayPreferences(state.display);
    lastStateAt = new Date();
    connectionLost = false;
    updateConnectionNote();
    lastState = state;
    applyAwayState(state.away);
    if (state.version !== lastVersion) {
      render(state);
      lastVersion = state.version;
      hasRenderedState = true;
      const visibleSessions = state.sessions.filter((session) => session.hidden !== true);
      const permissions = visibleSessions.reduce((total, session) => total + session.permissionWaits.length, 0);
      const decisions = visibleSessions.reduce((total, session) => total + session.decisions.filter(isPendingDecision).length, 0);
      liveStatus.textContent = `状態を更新しました。セッション (${visibleSessions.length} 件)、許可待ち (${permissions} 件)、判断待ち (${decisions} 件)。`;
    }
  } catch {
    connectionLost = true;
    updateConnectionNote();
    liveStatus.textContent = '常駐サーバーに接続できません。';
    if (!hasRenderedState) root.replaceChildren(element('div', 'error-box', '状態を取得できません。常駐サーバーが起動しているか確認してください。'));
  }
}

refresh();
setInterval(refresh, POLL_INTERVAL_MS);
setInterval(() => { if (lastState) render(lastState); }, WAIT_REFRESH_INTERVAL_MS);
</script>
