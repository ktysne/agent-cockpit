// 「×」は外すセッションがあるときだけ出す。セッションの無いカードは、PR が閉じるか未読を既読にすれば消える。
function productCloseButton(product, describedById) {
  if (!product.sessions.length) return null;
  const close = element('button', 'icon-btn', '×');
  close.type = 'button';
  close.dataset.productAction = 'close';
  close.dataset.productKey = product.key;
  close.setAttribute('aria-label', 'このプロダクトのセッションを一覧から外す');
  if (describedById) close.setAttribute('aria-describedby', describedById);
  close.title = 'このプロダクトのセッションを一覧から外す';
  return close;
}

// セッションが全部同じブランチならプロダクトの見出しに出し、分かれていればセッションの頭に出す。
function sharedBranch(product) {
  return product.branches.size === 1 ? [...product.branches][0] : '';
}

function productSection(product, index, products, pinnedCount) {
  const pinned = displayPreferences.pinned.includes(product.key);
  const section = element('section', `section ${pinned ? 'pinned' : ''}`.trim());
  const head = element('div', 'head');
  const heading = element('h2', '', product.name);
  heading.id = `product-heading-${index}`;
  heading.tabIndex = -1;
  head.append(heading);
  const branch = sharedBranch(product);
  if (branch) head.append(element('span', 'meta branch', branch));

  const judgmentCounts = countJudgments(product.sessions);
  const awaitingDecisions = product.sessions.flatMap((session) => session.decisions).filter(isAwaitingDecision);
  const decisionCount = judgmentCounts.decisions;
  const pullRequestGroups = product.pullRequestGroups || [];
  if (judgmentCounts.permission) head.append(element('span', 'chip danger', `許可待ち (${judgmentCounts.permission} 件)`));
  if (judgmentCounts.questions) head.append(element('span', 'chip warn', `質問対応 (${judgmentCounts.questions} 件)`));
  if (judgmentCounts.questionProvisional) head.append(element('span', 'chip warn', `仮に推奨案で進行中 (${judgmentCounts.questionProvisional} 件)`));
  if (decisionCount) {
    const decisionChip = element('span', 'chip danger', `判断待ち (${decisionCount} 件)`);
    decisionChip.title = decisionCountTitle(awaitingDecisions);
    head.append(decisionChip);
  }
  const mergeableCount = pullRequestMergeableCount(pullRequestGroups);
  if (mergeableCount) head.append(element('span', 'chip ok', `マージできる PR (${mergeableCount} 件)`));
  head.append(productControls(product, index, products.length, pinnedCount, heading.id));
  const close = productCloseButton(product, heading.id);
  if (close) {
    const remove = element('div', 'product-remove');
    remove.append(close);
    head.append(remove);
  }
  section.append(head);

  const body = element('div', 'body');
  body.hidden = displayPreferences.collapsed.includes(product.key);
  const news = sinceSeenBox(product, false);
  if (news) body.append(news);
  const multipleSessions = product.sessions.length > 1;
  for (const session of product.sessions) body.append(sessionBlock(product, session, multipleSessions));
  if (isFilterShown('prs')) {
    body.append(element('div', 'product-pr-divider'));
    const openCount = pullRequestOpenCount(pullRequestGroups);
    const prsHeading = element('h3', 'sub', 'プルリクエスト');
    prsHeading.append(element('span', 'count', `(${openCount} 件)`));
    body.append(prsHeading);
    if (pullRequestGroups.length) {
      for (const group of pullRequestGroups) appendPullRequestBlock(body, group);
    } else {
      body.append(element('div', 'empty', 'オープンの PR はありません'));
    }
  }
  section.append(body);
  return section;
}

function kindSection(title, content, extra, emptyCount = 0) {
  if (!content.children.length) {
    const row = element('section', 'kind-empty');
    const heading = element('h2');
    heading.append(document.createTextNode(title));
    heading.append(element('span', 'count', emptyCount ? `(${emptyCount} 件)` : '（なし）'));
    row.append(heading);
    if (extra) row.append(extra);
    return row;
  }
  const section = element('section', 'section kind-section');
  const head = element('div', 'head');
  head.append(element('h2', '', title));
  if (extra) head.append(extra);
  section.append(head, content);
  content.classList.add('body');
  return section;
}

function sinceSeenBox(product, withProductTag) {
  const entry = visibleSinceSeen(lastState).find((item) => item.product?.key === product.key);
  if (!entry?.items?.length) return null;
  const box = element('div', 'news');
  const header = element('div', 'news-head');
  if (withProductTag) header.append(element('span', 'prod-tag', product.name));
  header.append(document.createTextNode(`前回見てから (${entry.items.length} 件)`));
  const seen = element('button', 'link-btn', '既読にする');
  seen.type = 'button';
  seen.dataset.seen = product.key;
  header.append(seen);
  const list = element('ul');
  for (const item of entry.items) list.append(element('li', '', item.text));
  box.append(header, list);
  return box;
}

function sessionReferences(products) {
  return products.flatMap((product) => product.sessions.map((session) => ({
    product,
    session,
    multipleSessions: product.sessions.length > 1,
  })));
}

function kindEndedDecisionEntries(references) {
  if (displayPreferences.hideFinished) return [];
  const entries = references.flatMap((reference) => reference.session.decisions
    .filter(isEndedDecision)
    .map((decision) => ({ ...reference, decision })));
  return entries.sort((left, right) => itemTimestamp(right.decision) - itemTimestamp(left.decision));
}

function kindWaitTimestamp(value) {
  return typeof value === 'number' ? value : Date.parse(value || '');
}

function kindDecisionWaitAge(decision) {
  if (hasEffectiveAnswer(decision)) return -1;
  const timestamp = kindWaitTimestamp(decision.state === 'waiting' ? decision.createdAt : decision.updatedAt);
  return Number.isFinite(timestamp) ? Math.max(0, Date.now() - timestamp) : 0;
}

function kindEndedAgentCount(references) {
  if (displayPreferences.hideFinished) return 0;
  return references.reduce((count, reference) => count + reference.session.agents.filter(isEndedAgent).length, 0);
}

function renderKindSections(products) {
  const references = sessionReferences(products);
  const waitingItems = [];
  const endedDecisions = element('div', 'kind-ended');
  for (const { product, session, multipleSessions } of references) {
    for (const wait of shownPermissions(session)) {
      const holder = element('div');
      appendPermissionWaits(holder, { ...session, permissionWaits: [wait] }, product, true, multipleSessions);
      const card = holder.firstElementChild?.firstElementChild;
      const timestamp = kindWaitTimestamp(wait.startedAt);
      if (card) waitingItems.push({ age: Number.isFinite(timestamp) ? Date.now() - timestamp : 0, card });
    }
    for (const decision of shownActiveDecisions(session)) {
      const list = element('div', 'decision-list');
      appendDecisionCard(list, decision, product, session, true, multipleSessions);
      waitingItems.push({ age: kindDecisionWaitAge(decision), card: list.firstElementChild });
    }
    for (const question of shownCommonQuestions(session)) {
      const holder = element('div');
      appendCommonQuestions(holder, { ...session, commonQuestions: [question] }, product, true, multipleSessions);
      const timestamp = kindWaitTimestamp(question.createdAt);
      waitingItems.push({ age: Number.isFinite(timestamp) ? Date.now() - timestamp : 0, card: holder.querySelector('.common-question') });
    }

  }
  const endedDecisionItems = kindEndedDecisionEntries(references);
  const showEndedDecisions = expandedKindSections.has('decisions');
  if (showEndedDecisions && endedDecisionItems.length) {
    const list = element('div', 'decision-list');
    for (const item of endedDecisionItems) {
      appendDecisionCard(list, item.decision, item.product, item.session, true, item.multipleSessions);
    }
    endedDecisions.append(list);
  }
  const endedDecisionControls = element('div', 'kind-section-controls');
  if (endedDecisionItems.length) {
    appendKindToggle(endedDecisionControls, 'decisions', showEndedDecisions, endedDecisionItems.length, '解決済みと取り下げ');
  }
  waitingItems.sort((left, right) => right.age - left.age);
  const judgment = element('div', 'body');
  for (const item of waitingItems) if (item.card) judgment.append(item.card);
  const hasHiddenJudgments = references.some(({ session }) => hasHiddenJudgmentItems(session));
  if (endedDecisionItems.length) judgment.append(endedDecisions);

  const activityItems = [];
  const showEndedAgents = expandedKindSections.has('agents');
  const endedAgentCount = kindEndedAgentCount(references);
  for (const { product, session, multipleSessions } of references) {
    activityItems.push({ age: sessionActivityTime(session), row: mainRow(session, product, true, multipleSessions) });
    const instructions = instructionComposer(session, lastState);
    if (instructions) {
      const createdAt = Math.max(...(session.instructions || []).map((item) => item.createdAt).filter(Number.isFinite), 0);
      activityItems.push({ age: createdAt, row: instructions });
    }
    const holder = element('div');
    appendAgents(holder, session, product, true, multipleSessions, showEndedAgents, false);
    const list = holder.querySelector('.agent-list');
    if (list) for (const row of [...list.children]) {
      const startedAt = Date.parse(row.dataset.startedAt);
      activityItems.push({ age: Number.isFinite(startedAt) ? startedAt : -Infinity, row });
    }
  }
  activityItems.sort((left, right) => right.age - left.age);
  const activity = element('div', 'body now');
  for (const item of activityItems) activity.append(item.row);
  const activityControls = element('div', 'kind-section-controls');
  if (endedAgentCount) appendKindToggle(activityControls, 'agents', showEndedAgents, endedAgentCount, '終了済み');

  const tasks = element('div', 'body');
  const showDoneTasks = expandedKindSections.has('tasks');
  const showTodoTasks = expandedKindSections.has('todoTasks');
  const todoTaskCount = kindTodoTaskCount(references);
  const doneTaskCount = kindDoneTaskCount(references);
  for (const { product, session, multipleSessions } of references) {
    if (!session.tasks.length) continue;
    appendKindTaskSession(tasks, { product, session, multipleSessions }, showTodoTasks, showDoneTasks);
  }
  const taskControls = element('div', 'kind-section-controls');
  if (todoTaskCount) appendKindToggle(taskControls, 'todoTasks', showTodoTasks, todoTaskCount, '未着手のタスク');
  if (doneTaskCount) appendKindToggle(taskControls, 'tasks', showDoneTasks, doneTaskCount, '完了したタスク');

  const sinceSeenContent = element('div', 'body');
  for (const product of products) {
    const news = sinceSeenBox(product, true);
    if (news) sinceSeenContent.append(news);
  }
  const sections = {
    sinceSeen: sinceSeenContent.children.length ? kindSection('前回見てから', sinceSeenContent) : null,
    judgment: waitingItems.length || endedDecisionItems.length || !hasHiddenJudgments
      ? kindSection('あなたの判断が必要なこと', judgment, endedDecisionItems.length ? endedDecisionControls : null, waitingItems.length + endedDecisionItems.length)
      : null,
    tasks: kindSection('タスクと完了条件', tasks, taskControls.children.length ? taskControls : null, todoTaskCount + doneTaskCount),
    now: kindSection('今やっていること', activity, endedAgentCount ? activityControls : null, activityItems.length + endedAgentCount),
    prs: null,
  };
  const pullRequestGroups = products.flatMap((product) => visiblePullRequestGroups(product.pullRequestGroups)
    .map((group) => ({ product, group })));
  if (isFilterShown('prs')) {
    const pullRequests = element('div', 'body');
    for (const { group } of pullRequestGroups) appendPullRequestBlock(pullRequests, group, true);
    sections.prs = kindSection('プルリクエスト', pullRequests, null, pullRequestGroups.length);
  }
  return orderedSectionKeys(DEFAULT_SECTION_ORDER).map((key) => sections[key]).filter(Boolean);
}

function commonQuestionDiagnosticsNotice(diagnostics) {
  if (!diagnostics) return null;
  const orphanCount = Array.isArray(diagnostics.orphanedQuestions) ? diagnostics.orphanedQuestions.length : 0;
  if (!diagnostics.recovery && !orphanCount) return null;
  const notice = element('section', 'common-question-diagnostics');
  notice.setAttribute('role', 'status');
  notice.append(element('strong', '', '質問の状態を確認できません。'));
  notice.append(element('span', '', orphanCount
    ? `保存済み質問 ${orphanCount} 件の復旧確認が必要です。新しい送信は保留されています。`
    : '保存済み質問の復旧確認が必要です。新しい送信は保留されています。'));
  return notice;
}

function instructionDiagnosticsNotice(diagnostics) {
  if (!diagnostics || (diagnostics.service === 'ready' && diagnostics.blocked !== true &&
      diagnostics.targets === 'available' && !diagnostics.errorCode && !diagnostics.unmatchedCount)) return null;
  const notice = element('section', 'instruction-diagnostics');
  notice.setAttribute('role', 'status');
  notice.append(element('strong', '', '指示の復旧状態を確認してください。'));
  const reasons = [];
  if (diagnostics.service !== 'ready') reasons.push('保存サービスに接続できません');
  if (diagnostics.targets !== 'available') reasons.push('実行先を確認できません');
  if (diagnostics.errorCode) reasons.push('復旧確認が必要です');
  if (diagnostics.unmatchedCount) reasons.push(`照合できない指示 ${diagnostics.unmatchedCount} 件`);
  notice.append(element('span', '', `${reasons.join('。')}。不明な指示は自動再送しません。`));
  return notice;
}

function observeInstructionStates(state) {
  const current = new Map();
  let announcement = null;
  const notices = {
    sending: '指示の送信を開始しました。結果を確認しています。',
    accepted: '指示は受付済みです。入力への反映は未確認です。',
    applied: '指示が入力へ反映されたことを確認しました。',
    unknown: '送信結果が不明です。安全のため自動再送しません。',
    unavailable: '保存済みの指示を確認できません。再送を保留しています。',
    cancelled_before_send: '指示を送信前に取り下げました。',
    superseded_before_send: '指示を新しい内容へ差し替えました。',
  };
  for (const session of state?.sessions || []) {
    for (const instruction of session.instructions || []) {
      const id = instruction.deliveryAttemptId;
      current.set(id, instruction.state);
      if (isFinishedInstruction(instruction)) forgetInstructionPreview(id);
      const previous = observedInstructionStates.get(id);
      if (previous && previous !== instruction.state && notices[instruction.state]) {
        announcement = notices[instruction.state];
        instructionNotices.set(session.session_id, announcement);
      }
    }
  }
  const currentTargets = new Map();
  for (const target of state?.instructionTargets || []) {
    if (typeof target?.launchRef !== 'string') continue;
    const summary = target.status === 'waiting' ? instructionTargetWaitingSummary(target) : null;
    const signature = target.status === 'waiting' ? `waiting:${summary || 'unknown'}` : String(target.status || 'unknown');
    const previous = observedInstructionTargetStates.get(target.launchRef);
    currentTargets.set(target.launchRef, signature);
    if (previous !== undefined && previous !== signature && target.status === 'waiting' && !announcement) {
      announcement = instructionTargetWaitingNotice(target);
    } else if (previous?.startsWith('waiting:') && previous !== signature && !announcement) {
      if (target.status === 'working') {
        announcement = 'Codex の質問待ちまたは許可待ちがなくなりました。追加指示の送信条件を再確認してください。';
      } else if (target.status === 'unverified') {
        announcement = 'Codex の質問待ちまたは許可待ちが解消したか確認できません。追加の指示は保留されています。';
      }
    }
  }
  observedInstructionTargetStates = currentTargets;
  observedInstructionStates = current;
  return announcement;
}

function instructionProjectionSignature(state) {
  return JSON.stringify({
    sessions: (state?.sessions || []).map((session) => [session.session_id, session.instructions || []]),
    targets: state?.instructionTargets || [],
    diagnostics: state?.instructionDiagnostics || null,
  });
}

function restoreInstructionPreviewRecoveryFocus(focusData, activeTextarea = null) {
  const escapedId = CSS.escape(focusData.id);
  const title = root.querySelector('[data-instruction-preview-title="' + escapedId + '"]');
  const recoveryHeading = root.querySelector('[data-instruction-preview-recovery-heading]');
  const stableControl = document.querySelector('[data-action="mode"][data-mode="' + displayPreferences.mode + '"]');
  if (focusData.kind === 'instruction-preview-text') {
    const control = root.querySelector('[data-instruction-preview-recovery-text="' + escapedId + '"]');
    if (activeTextarea && control) {
      control.replaceWith(activeTextarea);
      activeTextarea.focus({ preventScroll: true });
      activeTextarea.setSelectionRange(focusData.start, focusData.end);
    } else if (control) control.focus({ preventScroll: true });
    else (title || recoveryHeading || stableControl)?.focus({ preventScroll: true });
    return;
  }
  const retry = focusData.kind === 'instruction-preview-retry'
    ? root.querySelector('[data-instruction-preview-retry="' + escapedId + '"]')
    : null;
  (retry || title || recoveryHeading || stableControl)?.focus({ preventScroll: true });
}

function restoreInstructionAlternativeFocus(focusData) {
  const id = focusData.id;
  const escapedId = CSS.escape(id);
  const selectors = focusData.kind === 'instruction-alt-retry'
    ? [`[data-instruction-alternative-retry="${escapedId}"]`]
    : focusData.kind === 'instruction-alt-discard-ask'
      ? [`[data-instruction-alternative-discard-ask="${escapedId}"]`, `[data-instruction-alternative-discard="${escapedId}"]`]
      : focusData.kind === 'instruction-alt-discard-dismiss'
        ? [`[data-instruction-alternative-discard-dismiss="${escapedId}"]`, `[data-instruction-alternative-discard-ask="${escapedId}"]`]
        : focusData.kind === 'instruction-alt-discard'
          ? [`[data-instruction-alternative-discard="${escapedId}"]`]
          : [];
  const control = selectors.map((selector) => root.querySelector(selector)).find((item) => item && !item.disabled);
  if (control) control.focus({ preventScroll: true });
  else root.querySelector(`[data-instruction-alternative-title="${escapedId}"]`)?.focus({ preventScroll: true });
}

function render(state) {
  if (answerNoteComposing || commonQuestionComposing || instructionComposing) {
    deferredRenderPending = true;
    return;
  }
  deferredRenderPending = false;
  renderRouting(state.routing, state.integrations);
  const allSessions = Array.isArray(state.sessions) ? state.sessions : [];
  const sessions = allSessions.filter((session) => session.hidden !== true);
  const idleHiddenCount = idleHiddenSessions(sessions).length;
  const displayedSessions = sessionsAfterIdleFilter(sessions);
  const pullRequestGroups = Array.isArray(state.pullRequests) ? state.pullRequests : [];
  const active = document.activeElement;
  const activeAnswerNote = active instanceof HTMLTextAreaElement && active.hasAttribute('data-answer-note') ? active : null;
  const activeCommonField = active instanceof HTMLElement && active.matches('[data-common-option], [data-common-free-text]') ? active : null;
  const activeInstructionField = active instanceof HTMLElement && active.matches('[data-instruction-field]') ? active : null;
  const activeInstructionRecoveryText = active instanceof HTMLTextAreaElement && active.dataset.instructionRecoveryText ? active : null;
  const activeInstructionPreviewRecoveryText = active instanceof HTMLTextAreaElement && active.dataset.instructionPreviewRecoveryText ? active : null;
  const toggleAttribute = ['data-ended-toggle', 'data-plan-toggle', 'data-kind-toggle', 'data-estimate-session', 'data-hide-session', 'data-older-pr-line'].find((attribute) => active?.hasAttribute(attribute));
  const focusData = toggleAttribute ? { kind: 'toggle', attribute: toggleAttribute, value: active.getAttribute(toggleAttribute) }
    : active?.dataset?.reviewSkip ? { kind: 'review-skip', key: active.dataset.mergeKey, action: active.dataset.reviewSkip }
    : active?.dataset?.filter ? { kind: 'filter', key: active.dataset.filter }
         : active?.dataset?.mergeMethod ? { kind: 'merge-method', key: active.dataset.mergeKey, method: active.dataset.mergeMethod }
        : active?.dataset?.reservationToggle ? { kind: 'merge-reservation-toggle', key: active.dataset.mergeKey }
         : active?.dataset?.mergeDelete ? { kind: 'merge-delete', key: active.dataset.mergeKey }
          : active?.dataset?.mergeCancel ? { kind: 'merge-cancel', key: active.dataset.mergeCancel }
            : active?.dataset?.openMerge ? { kind: 'merge-open', key: active.dataset.openMerge }
              : active?.dataset?.conflictOpen ? { kind: 'merge-conflict-open', key: active.dataset.conflictOpen }
                  : active?.dataset?.conflictGo ? { kind: 'merge-conflict-go', key: active.dataset.conflictGo }
                    : active?.dataset?.conflictCancel ? { kind: 'merge-conflict-cancel', key: active.dataset.conflictCancel }
        : active?.dataset?.mergeGo ? { kind: 'merge-go', key: active.dataset.mergeGo }
      : active?.dataset?.productAction ? { kind: 'product', action: active.dataset.productAction, key: active.dataset.productKey, direction: active.dataset.direction || '' }
        : active?.dataset?.answerPick ? { kind: 'answer-pick', sessionId: active.dataset.sessionId, decisionId: active.dataset.decisionId, questionIndex: active.dataset.answerQuestion, optionIndex: active.dataset.answerOption }
        : active?.dataset?.answerChoice ? { kind: 'answer-choice', sessionId: active.dataset.sessionId, decisionId: active.dataset.decisionId, choice: active.dataset.answerChoice }
         : activeInstructionField ? { kind: 'instruction-input', sessionId: activeInstructionField.dataset.instructionSession,
           field: activeInstructionField.dataset.instructionField, id: activeInstructionField.dataset.instructionId || '',
           start: activeInstructionField instanceof HTMLTextAreaElement ? activeInstructionField.selectionStart : 0,
           end: activeInstructionField instanceof HTMLTextAreaElement ? activeInstructionField.selectionEnd : 0 }
         : activeInstructionRecoveryText ? { kind: 'instruction-alt-preview', id: activeInstructionRecoveryText.dataset.instructionRecoveryText,
           start: activeInstructionRecoveryText.selectionStart, end: activeInstructionRecoveryText.selectionEnd }
         : activeInstructionPreviewRecoveryText ? { kind: 'instruction-preview-text', id: activeInstructionPreviewRecoveryText.dataset.instructionPreviewRecoveryText, start: activeInstructionPreviewRecoveryText.selectionStart, end: activeInstructionPreviewRecoveryText.selectionEnd }
          : active?.dataset?.instructionPreviewRetry ? { kind: 'instruction-preview-retry', id: active.dataset.instructionPreviewRetry }
          : active?.dataset?.instructionAlternativeRetry ? { kind: 'instruction-alt-retry', id: active.dataset.instructionAlternativeRetry }
         : active?.dataset?.instructionAlternativeDiscardAsk ? { kind: 'instruction-alt-discard-ask', id: active.dataset.instructionAlternativeDiscardAsk }
         : active?.dataset?.instructionAlternativeDiscard ? { kind: 'instruction-alt-discard', id: active.dataset.instructionAlternativeDiscard }
         : active?.dataset?.instructionAlternativeDiscardDismiss ? { kind: 'instruction-alt-discard-dismiss', id: active.dataset.instructionAlternativeDiscardDismiss }
         : activeCommonField ? { kind: 'common-input', sessionId: activeCommonField.closest('.common-question')?.dataset.sessionId, internalQuestionId: activeCommonField.closest('.common-question')?.dataset.internalQuestionId, questionId: activeCommonField.dataset.questionId || activeCommonField.dataset.commonFreeText, optionId: activeCommonField.dataset.optionId || '', start: activeCommonField instanceof HTMLTextAreaElement ? activeCommonField.selectionStart : 0, end: activeCommonField instanceof HTMLTextAreaElement ? activeCommonField.selectionEnd : 0 }
         : active?.dataset?.showFinished ? { kind: 'show-finished' }
         : active?.dataset?.showIdle ? { kind: 'show-idle' }
           : active?.dataset?.closeMergeResult ? { kind: 'merge-result-close', id: active.dataset.closeMergeResult }
             : active?.dataset?.closeTask ? { kind: 'close-task', key: active.dataset.closeTask }
               : active?.dataset?.cancelCloseTask ? { kind: 'cancel-close-task', key: active.dataset.cancelCloseTask }
                 : activeAnswerNote ? { kind: 'answer-note', sessionId: activeAnswerNote.dataset.sessionId, decisionId: activeAnswerNote.dataset.decisionId, start: activeAnswerNote.selectionStart, end: activeAnswerNote.selectionEnd, direction: activeAnswerNote.selectionDirection }
              : active?.dataset?.sendAnswer ? { kind: 'answer-submit', sessionId: active.dataset.sessionId, decisionId: active.dataset.sendAnswer }
        : active?.hasAttribute('data-show-all') ? { kind: 'show-all' }
          : active?.hasAttribute('data-clear-hidden-sessions') ? { kind: 'clear-hidden' }
            : active?.hasAttribute('data-undo-hidden-sessions') ? { kind: 'undo-hidden' } : null;
  renderSummary(displayedSessions, pullRequestGroups);
  renderExcludedNote(allSessions);
  const hiddenFinished = finishedHiddenCounts(sessions, pullRequestGroups);
  renderFinishedNote(hiddenFinished);
  renderIdleNote(idleHiddenCount);
  updateTitle(displayedSessions);
  document.querySelectorAll('[data-action="mode"]').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.dataset.mode === displayPreferences.mode));
  });
  const sinceSeen = visibleSinceSeen(state);
  const products = orderedProducts(displayedSessions, pullRequestGroups, sinceSeen);
  if (!products.length) {
    const emptyText = hiddenFinished.sessions || hiddenFinished.pullRequests
      ? '終わったものを隠しています。下の「表示する」から表示できます。'
      : idleHiddenCount
        ? '更新の無いセッションを隠しています。下の「表示する」から表示できます。'
      : '表示するセッションがありません。Claude Code でセッションを開始すると、ここに表示されます。';
    root.replaceChildren(element('section', 'section empty', emptyText));
    const questionNotice = commonQuestionDiagnosticsNotice(state.commonQuestionDiagnostics);
    if (questionNotice) root.prepend(questionNotice);
    const instructionNotice = instructionDiagnosticsNotice(state.instructionDiagnostics);
    if (instructionNotice) root.prepend(instructionNotice);
    const alternativeRecovery = instructionAlternativeRecoveryPanel(state);
    if (alternativeRecovery) root.prepend(alternativeRecovery);
    const previewRecovery = instructionPreviewRecoveryPanel(state);
    if (previewRecovery) root.prepend(previewRecovery);
    const topFocusAttribute = { 'show-all': 'data-show-all', 'clear-hidden': 'data-clear-hidden-sessions', 'undo-hidden': 'data-undo-hidden-sessions' }[focusData?.kind];
    if (topFocusAttribute) document.querySelector(`[${topFocusAttribute}]`)?.focus({ preventScroll: true });
    else if (focusData?.kind === 'instruction-alt-preview') {
      const control = root.querySelector(`[data-instruction-recovery-text="${CSS.escape(focusData.id)}"]`);
      if (control) {
        control.replaceWith(activeInstructionRecoveryText);
        activeInstructionRecoveryText.focus({ preventScroll: true });
        activeInstructionRecoveryText.setSelectionRange(focusData.start, focusData.end);
      }
    }
    else if (focusData?.kind?.startsWith('instruction-preview-')) restoreInstructionPreviewRecoveryFocus(focusData, activeInstructionPreviewRecoveryText);
    else if (focusData?.kind?.startsWith('instruction-alt-')) restoreInstructionAlternativeFocus(focusData);
    else if (['show-finished', 'show-idle', 'merge-result-close'].includes(focusData?.kind)) {
      document.querySelector('[data-action="mode"][data-mode="' + displayPreferences.mode + '"]')?.focus({ preventScroll: true });
    }
    return;
  }

  if (displayPreferences.mode === 'product') {
    const pinnedCount = products.filter((product) => displayPreferences.pinned.includes(product.key)).length;
    root.replaceChildren(...products.map((product, index) => productSection(product, index, products, pinnedCount)));
  } else {
    root.replaceChildren(...renderKindSections(products));
  }
  const questionNotice = commonQuestionDiagnosticsNotice(state.commonQuestionDiagnostics);
  if (questionNotice) root.prepend(questionNotice);
  const instructionNotice = instructionDiagnosticsNotice(state.instructionDiagnostics);
  if (instructionNotice) root.prepend(instructionNotice);
  const alternativeRecovery = instructionAlternativeRecoveryPanel(state);
  if (alternativeRecovery) root.prepend(alternativeRecovery);
  const previewRecovery = instructionPreviewRecoveryPanel(state);
  if (previewRecovery) root.prepend(previewRecovery);

  if (focusData?.kind?.startsWith('merge-')) {
    const controls = [...root.querySelectorAll('[data-merge-method], [data-reservation-toggle], [data-merge-delete], [data-merge-cancel], [data-open-merge], [data-merge-go], [data-conflict-open], [data-conflict-go], [data-conflict-cancel]')];
    // 「やめる」から「依頼を送る」へ移ると、取り消すつもりの Enter で依頼が送られるため、同じ操作のボタンへ戻す。
    const conflictFocusOrder = {
      'merge-conflict-open': ['conflictGo', 'conflictOpen'],
      'merge-conflict-go': ['conflictGo', 'conflictOpen'],
      'merge-conflict-cancel': ['conflictCancel', 'conflictOpen'],
    }[focusData.kind];
    let control = conflictFocusOrder
      ? conflictFocusOrder.map((name) => controls.find((item) => item.dataset[name] === focusData.key)).find(Boolean)
      : controls.find((item) => item.dataset.mergeKey === focusData.key && (
      focusData.kind === 'merge-method' ? item.dataset.mergeMethod === focusData.method
        : focusData.kind === 'merge-reservation-toggle' ? item.hasAttribute('data-reservation-toggle')
        : focusData.kind === 'merge-delete' ? item.hasAttribute('data-merge-delete')
          : focusData.kind === 'merge-cancel' ? item.hasAttribute('data-merge-cancel')
            : focusData.kind === 'merge-go' ? item.dataset.mergeGo === focusData.key
                  : focusData.kind === 'merge-open' ? item.dataset.openMerge === focusData.key
                      : false
    ));
    if (!control && focusData.kind === 'merge-open') {
      control = controls.find((item) => item.dataset.mergeKey === focusData.key && item.hasAttribute('data-merge-method'));
    }
    control?.focus({ preventScroll: true });
    return;
  }

  if (focusData) {
    if (focusData.kind === 'instruction-alt-preview') {
      const control = root.querySelector(`[data-instruction-recovery-text="${CSS.escape(focusData.id)}"]`);
      if (activeInstructionRecoveryText && control) {
        control.replaceWith(activeInstructionRecoveryText);
        activeInstructionRecoveryText.focus({ preventScroll: true });
        activeInstructionRecoveryText.setSelectionRange(focusData.start, focusData.end);
      } else control?.focus({ preventScroll: true });
      return;
    }
    if (focusData.kind.startsWith('instruction-preview-')) {
      restoreInstructionPreviewRecoveryFocus(focusData, activeInstructionPreviewRecoveryText);
      return;
    }
    if (focusData.kind.startsWith('instruction-alt-')) {
      restoreInstructionAlternativeFocus(focusData);
      return;
    }
    if (focusData.kind === 'instruction-input') {
      const control = [...root.querySelectorAll('[data-instruction-field]')].find((item) =>
        item.dataset.instructionSession === focusData.sessionId &&
        item.dataset.instructionField === focusData.field && (item.dataset.instructionId || '') === focusData.id);
      if (activeInstructionField && control && activeInstructionField.tagName === control.tagName) {
        if (activeInstructionField instanceof HTMLTextAreaElement) {
          control.replaceWith(activeInstructionField);
          activeInstructionField.focus({ preventScroll: true });
          activeInstructionField.setSelectionRange(focusData.start, focusData.end);
        } else control.focus({ preventScroll: true });
      } else control?.focus({ preventScroll: true });
      return;
    }
    if (focusData.kind === 'common-input') {
      const control = [...root.querySelectorAll('[data-common-option], [data-common-free-text]')].find((item) => {
        const card = item.closest('.common-question');
        return card?.dataset.sessionId === focusData.sessionId
          && card.dataset.internalQuestionId === focusData.internalQuestionId
          && (item.dataset.questionId || item.dataset.commonFreeText) === focusData.questionId
          && (item.dataset.optionId || '') === focusData.optionId;
      });
      if (activeCommonField instanceof HTMLTextAreaElement && control instanceof HTMLTextAreaElement) {
        control.replaceWith(activeCommonField);
        updateCommonQuestionSubmit(activeCommonField.closest('.common-question'));
        activeCommonField.focus({ preventScroll: true });
        activeCommonField.setSelectionRange(focusData.start, focusData.end);
      } else control?.focus({ preventScroll: true });
      return;
    }
    if (['answer-pick', 'answer-choice', 'answer-note', 'answer-submit'].includes(focusData.kind)) {
      const control = [...root.querySelectorAll('[data-answer-pick], [data-answer-choice], [data-answer-note], [data-send-answer]')].find((item) => (
        item.dataset.sessionId === focusData.sessionId &&
        (item.dataset.decisionId || item.dataset.sendAnswer) === focusData.decisionId &&
        (focusData.kind !== 'answer-pick' || (item.dataset.answerQuestion === focusData.questionIndex && item.dataset.answerOption === focusData.optionIndex)) &&
        (focusData.kind !== 'answer-choice' || item.dataset.answerChoice === focusData.choice) &&
        (focusData.kind !== 'answer-note' || item.hasAttribute('data-answer-note')) &&
        (focusData.kind !== 'answer-submit' || item.hasAttribute('data-send-answer'))
      ));
      if (focusData.kind === 'answer-note' && activeAnswerNote && control instanceof HTMLTextAreaElement) {
        control.replaceWith(activeAnswerNote);
        const answerDraftKeyValue = answerDraftKey(focusData.sessionId, focusData.decisionId);
        const decision = findDecision(focusData.sessionId, focusData.decisionId);
        const answerDraft = answerDraftFor(decision, { session_id: focusData.sessionId });
        if (answerDraft.note !== activeAnswerNote.value) {
          answerDrafts.set(answerDraftKeyValue, { ...answerDraft, note: activeAnswerNote.value });
        }
        updateAnswerSubmit(activeAnswerNote.closest('.decision-answer'));
        activeAnswerNote.focus({ preventScroll: true });
        activeAnswerNote.setSelectionRange(focusData.start, focusData.end, focusData.direction);
        return;
      }
      control?.focus({ preventScroll: true });
      if (focusData.kind === 'answer-note' && control instanceof HTMLTextAreaElement) {
        control.setSelectionRange(focusData.start, focusData.end);
      }
      return;
    }
    const buttons = [...document.querySelectorAll('button')];
    const button = buttons.find((item) => {
      if (focusData.kind === 'toggle') return item.getAttribute(focusData.attribute) === focusData.value;
      if (focusData.kind === 'filter') return item.dataset.filter === focusData.key;
      if (focusData.kind === 'show-all') return item.hasAttribute('data-show-all');
      if (focusData.kind === 'clear-hidden') return item.hasAttribute('data-clear-hidden-sessions');
      if (focusData.kind === 'undo-hidden') return item.hasAttribute('data-undo-hidden-sessions');
      if (focusData.kind === 'show-finished') return item.hasAttribute('data-show-finished');
      if (focusData.kind === 'show-idle') return item.hasAttribute('data-show-idle');
      if (focusData.kind === 'merge-result-close') return item.dataset.closeMergeResult === focusData.id;
      if (focusData.kind === 'review-skip') return item.dataset.mergeKey === focusData.key && item.dataset.reviewSkip === focusData.action;
      if (['close-task', 'cancel-close-task'].includes(focusData.kind)) {
        return item.dataset.closeTask === focusData.key || item.dataset.cancelCloseTask === focusData.key;
      }
      return item.dataset.productAction === focusData.action && item.dataset.productKey === focusData.key && (item.dataset.direction || '') === focusData.direction;
    });
    const fallback = focusData.kind === 'product' && focusData.action === 'move' && button?.disabled
      ? buttons.find((item) => item.dataset.productAction === 'move' && item.dataset.productKey === focusData.key && item.dataset.direction === String(-Number(focusData.direction)))
      : ['show-finished', 'show-idle', 'merge-result-close'].includes(focusData.kind) && !button
        ? document.querySelector('[data-close-merge-result]') || document.querySelector('[data-action="mode"][data-mode="' + displayPreferences.mode + '"]')
      : focusData.kind === 'toggle' && focusData.attribute === 'data-hide-session' && !button
        ? buttons.find((item) => item.hasAttribute('data-clear-hidden-sessions'))
      : focusData.kind === 'review-skip' && !button
        ? buttons.find((item) => item.dataset.mergeKey === focusData.key && item.dataset.reviewSkip !== focusData.action)
      : button;
    fallback?.focus({ preventScroll: true });
  }
}

function renderDeferredState() {
  if (!deferredRenderPending || answerNoteComposing || commonQuestionComposing || instructionComposing) return;
  deferredRenderPending = false;
  if (lastState) render(lastState);
}

function findDecision(sessionId, decisionId) {
  const session = lastState?.sessions.find((item) => item.session_id === sessionId);
  return session?.decisions.find((item) => item.id === decisionId) || null;
}

function answerDraftKey(sessionId, decisionId) {
  return `${sessionId}\0${decisionId}`;
}

function updateAnswerSubmit(card) {
  const sessionId = card.dataset.sessionId;
  const decisionId = card.dataset.decisionId;
  const decision = findDecision(sessionId, decisionId);
  const button = card.querySelector('[data-send-answer]');
  if (!decision || !button) return;
  const draft = answerDraftFor(decision, { session_id: sessionId });
  const answer = decision.answer;
  const changed = answerDraftChanged(decision, draft);
  const meta = card.querySelector('[data-answer-meta]');
  if (meta) {
    meta.textContent = answerMetaText(decision, draft);
    meta.hidden = !meta.textContent;
  }
  const status = card.querySelector('.answer-foot .answer-status');
  if (status) status.textContent = answer?.sentAt && changed ? '変更は未送信' : answerStatusText(answer, decision);
  button.disabled = !canSendDecisionAnswer(decision, draft) || !changed;
}

function showAnswerError(sessionId, decisionId, message) {
  answerErrors.set(answerDraftKey(sessionId, decisionId), message);
  const card = [...root.querySelectorAll('.decision-answer')].find((item) => (
    item.dataset.sessionId === sessionId && item.dataset.decisionId === decisionId
  ));
  const error = card?.querySelector('.answer-error');
  if (error) error.textContent = message;
}

async function sendDecisionAnswer(button) {
  const sessionId = button.dataset.sessionId;
  const decisionId = button.dataset.sendAnswer;
  const decision = findDecision(sessionId, decisionId);
  if (!decision) return;
  const draft = answerDraftFor(decision, { session_id: sessionId });
  button.disabled = true;
  try {
    const response = await postUiAction(`/api/decisions/${encodeURIComponent(decisionId)}/answer`, {
      session_id: sessionId,
      choice: draft.choice,
      note: draft.note,
      ...(draft.choice === 'pick' ? { picks: draft.picks } : {}),
    });
    if (response.status === 409 || response.status === 404) {
      await refresh();
      showAnswerError(sessionId, decisionId, '判断事項の状態が変わりました。表示を確認してください。');
      return;
    }
    if (response.status === 400) {
      showAnswerError(sessionId, decisionId, '回答の選択内容と指示を確認してください。');
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    answerErrors.delete(answerDraftKey(sessionId, decisionId));
    answerDrafts.delete(answerDraftKey(sessionId, decisionId));
    await refresh();
    liveStatus.textContent = '回答を送信しました。';
  } catch {
    showAnswerError(sessionId, decisionId, '回答を送信できませんでした。');
    showWriteError('回答を送信できませんでした');
  } finally {
    if (button.isConnected) updateAnswerSubmit(button.closest('.decision-answer'));
  }
}

document.addEventListener('change', (event) => {
  const instructionField = event.target.closest('[data-instruction-field]');
  if (instructionField && ['target', 'mode'].includes(instructionField.dataset.instructionField)) {
    const fieldName = instructionField.dataset.instructionField === 'target' ? 'targetLaunchRef' : 'mode';
    setInstructionDraftField(instructionField.dataset.instructionSession, fieldName, instructionField.value);
    if (lastState) render(lastState);
    return;
  }
  const commonOption = event.target.closest('[data-common-option]');
  if (commonOption) {
    updateCommonQuestionSubmit(commonOption.closest('.common-question'));
    return;
  }
  const choice = event.target.closest('[data-answer-choice]');
  if (choice) {
    if (choice.disabled) return;
    const key = answerDraftKey(choice.dataset.sessionId, choice.dataset.decisionId);
    const card = choice.closest('.decision-answer');
    const decision = findDecision(choice.dataset.sessionId, choice.dataset.decisionId);
    if (!decision) return;
    const current = answerDraftFor(decision, { session_id: choice.dataset.sessionId });
    const next = { ...current, choice: choice.checked ? choice.dataset.answerChoice : null, picks: emptyAnswerPicks(decision) };
    clearAnswerErrorWhenDraftChanges(key, current, next, card);
    answerDrafts.set(key, next);
    for (const input of card.querySelectorAll('[data-answer-choice]')) {
      input.checked = next.choice === input.dataset.answerChoice;
    }
    for (const input of choice.closest('.decision-card')?.querySelectorAll('[data-answer-pick]') || []) input.checked = false;
    updateAnswerSubmit(card);
    return;
  }

  const pick = event.target.closest('[data-answer-pick]');
  if (!pick) return;
  const sessionId = pick.dataset.sessionId;
  const decisionId = pick.dataset.decisionId;
  const decision = findDecision(sessionId, decisionId);
  if (!decision) return;
  const questionIndex = Number(pick.dataset.answerQuestion);
  const optionIndex = Number(pick.dataset.answerOption);
  const question = decision.questions?.[questionIndex];
  const option = question?.options?.[optionIndex];
  if (!option) return;
  const current = answerDraftFor(decision, { session_id: sessionId });
  const picks = copyAnswerPicks(current.picks, (decision.questions || []).length);
  const selectedLabels = new Set(question.multiSelect ? picks[questionIndex] : []);
  if (pick.checked) selectedLabels.add(option.label);
  else selectedLabels.delete(option.label);
  picks[questionIndex] = [...new Set(question.options.map((item) => item.label).filter((label) => selectedLabels.has(label)))];
  const choiceValue = picks.some((labels) => labels.length) ? 'pick' : null;
  const key = answerDraftKey(sessionId, decisionId);
  const next = { ...current, choice: choiceValue, picks };
  answerDrafts.set(key, next);
  // 選択肢は回答欄の外(質問の区画)にあるので、判断事項のカードから回答欄を引く。
  const card = pick.closest('.decision-card')?.querySelector('.decision-answer');
  if (!card) return;
  for (const input of card.querySelectorAll('[data-answer-choice]')) input.checked = false;
  clearAnswerErrorWhenDraftChanges(key, current, next, card);
  updateAnswerSubmit(card);
});

document.addEventListener('input', (event) => {
  const instructionField = event.target.closest('[data-instruction-field]');
  if (instructionField) {
    const field = instructionField.dataset.instructionField;
    if (field === 'alternative-text') {
      const draft = instructionAlternatives.get(instructionField.dataset.instructionId);
      if (draft && !draft.pendingRequest && draft.text !== instructionField.value) {
        draft.text = instructionField.value;
        draft.deliveryAttemptId = null;
        instructionErrors.delete('alternative:' + instructionField.dataset.instructionId);
        instructionNotices.delete(instructionField.dataset.instructionSession);
      }
      const submit = instructionField.closest('form')?.querySelector('[type="submit"]');
      if (submit) submit.disabled = !draft?.text.trim() || instructionAlternativeInFlight.has(instructionField.dataset.instructionId);
      return;
    }
    const fieldName = field === 'target' ? 'targetLaunchRef' : field;
    setInstructionDraftField(instructionField.dataset.instructionSession, fieldName, instructionField.value);
    updateInstructionSave(instructionField.closest('[data-instruction-create-form]'));
    return;
  }
  const commonText = event.target.closest('[data-common-free-text]');
  if (commonText) {
    updateCommonQuestionSubmit(commonText.closest('.common-question'));
    return;
  }
  const note = event.target.closest('[data-answer-note]');
  if (!note) return;
  const key = answerDraftKey(note.dataset.sessionId, note.dataset.decisionId);
  const decision = findDecision(note.dataset.sessionId, note.dataset.decisionId);
  const current = decision ? answerDraftFor(decision, { session_id: note.dataset.sessionId }) : { choice: null, note: '' };
  const next = { ...current, note: note.value };
  answerDrafts.set(key, next);
  const card = note.closest('.decision-answer');
  clearAnswerErrorWhenDraftChanges(key, current, next, card);
  updateAnswerSubmit(card);
});

document.addEventListener('compositionstart', (event) => {
  if (event.target.matches?.('[data-instruction-field="text"], [data-instruction-field="alternative-text"]')) instructionComposing = true;
  if (event.target.matches?.('[data-common-free-text]')) commonQuestionComposing = true;
  if (event.target.matches?.('[data-answer-note]')) answerNoteComposing = true;
}, true);

document.addEventListener('compositionend', (event) => {
  if (event.target.matches?.('[data-instruction-field="text"], [data-instruction-field="alternative-text"]')) {
    instructionComposing = false;
    renderDeferredState();
  }
  if (event.target.matches?.('[data-common-free-text]')) {
    commonQuestionComposing = false;
    updateCommonQuestionSubmit(event.target.closest('.common-question'));
    renderDeferredState();
  }
  if (!event.target.matches?.('[data-answer-note]')) return;
  answerNoteComposing = false;
  renderDeferredState();
}, true);

async function runCommonQuestionAction(button, action) {
  const sessionId = button.dataset.sessionId;
  const internalQuestionId = button.dataset.commonSubmit || button.dataset.commonHold || button.dataset.commonCancel || button.dataset.commonCancelConfirm || button.dataset.commonCancelDismiss;
  const session = (lastState?.sessions || []).find((item) => item.session_id === sessionId);
  const question = session?.commonQuestions?.find((item) => item.internalQuestionId === internalQuestionId);
  if (!question) return;
  const key = commonQuestionKey(question);
  const card = button.closest('.common-question');
  const error = card?.querySelector('.common-question-error');
  const notice = card?.querySelector('.common-question-note');
  const confirmedCancel = action === 'cancel-confirm';
  const dismissCancel = action === 'cancel-dismiss';
  if (dismissCancel) {
    if (commonQuestionInFlight.has(key)) return;
    commonQuestionCancelConfirmations.delete(key);
    if (lastState) render(lastState);
    [...document.querySelectorAll('[data-common-cancel]')]
      .find((candidate) => candidate.dataset.commonCancel === internalQuestionId && candidate.dataset.sessionId === sessionId)?.focus({ preventScroll: true });
    return;
  }
  if (action === 'cancel' && !confirmedCancel) {
    commonQuestionCancelConfirmations.add(key);
    if (lastState) render(lastState);
    [...document.querySelectorAll('[data-common-cancel-confirm]')]
      .find((candidate) => candidate.dataset.commonCancelConfirm === internalQuestionId && candidate.dataset.sessionId === sessionId)?.focus({ preventScroll: true });
    return;
  }
  if (confirmedCancel) {
    if (!commonQuestionCancelConfirmations.has(key)) return;
    action = 'cancel';
  }
  commonQuestionInFlight.add(key);
  if (action === 'cancel') card?.querySelectorAll('[data-common-cancel-confirm], [data-common-cancel-dismiss]').forEach((control) => { control.disabled = true; });
  commonQuestionErrors.delete(key);
  if (error) { error.textContent = ''; error.hidden = true; }
  button.disabled = true;
  let url = `/api/decisions/${encodeURIComponent(internalQuestionId)}/${action}`;
  let body = { session_id: sessionId, execution_id: question.executionId };
  let submittedDraft = null;
  if (action === 'answer') {
    const answers = readCommonQuestionDraft(card);
    if (!commonQuestionAnswersValid(question.questions, answers)) {
      commonQuestionErrors.set(key, '各質問に選択肢か自由記入を入力してください。');
      if (lastState) render(lastState);
      commonQuestionInFlight.delete(key);
      return;
    }
    submittedDraft = answers.map((answer) => ({ ...answer, optionIds: [...answer.optionIds] }));
    card.querySelectorAll('input, textarea').forEach((control) => { control.disabled = true; });
    body.answers = answers.map((answer) => ({ ...answer, freeText: answer.freeText.trim() ? answer.freeText : null }));
  } else if (action === 'hold') body.held = button.dataset.held === 'true';
  try {
    const response = await postUiAction(url, body);
    if (response.status === 404 || response.status === 409) {
      commonQuestionErrors.set(key, '質問の状態が変わりました。最新の状態を確認してください。');
      await refresh();
      if (lastState) render(lastState);
      return;
    }
    if (response.status === 400) {
      commonQuestionErrors.set(key, '回答内容を確認してください。');
      if (lastState) render(lastState);
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const result = await response.json().catch(() => ({}));
    if (action === 'answer') {
      const lateAnswer = result.outcome === 'late';
      const duplicateAnswer = result.outcome === 'duplicate';
      if (lateAnswer || duplicateAnswer) commonQuestionSubmittedDrafts.set(key, submittedDraft);
      if (result.outcome === 'selected') {
        commonQuestionDrafts.delete(key);
        commonQuestionSubmittedDrafts.delete(key);
      }
      commonQuestionNotices.set(key, lateAnswer
        ? '後続の回答を保存しました。配送は保留しています。'
        : duplicateAnswer ? '同じ回答は保存済みです。追加の回答は保存していません。'
          : '回答を保存しました。配送状態は別に表示します。');
    } else if (action === 'hold') {
      commonQuestionNotices.set(key, body.held ? '質問を保留しました。' : '質問の保留を解除しました。');
    } else {
      commonQuestionCancelConfirmations.delete(key);
      commonQuestionNotices.set(key, result.outcome === 'too_late' && result.question?.cancelRequested === true
        ? '送信開始後のため、取り下げできず取消要求として記録しました。'
        : result.outcome === 'too_late' ? '送信開始後のため、質問を取り下げできませんでした。' : '質問を取り下げました。');
    }
    await refresh();
    liveStatus.textContent = action === 'answer' ? '回答を保存しました。' : action === 'hold' ? '質問の状態を保存しました。' : '取り下げ状態を保存しました。';
  } catch {
    commonQuestionErrors.set(key, '保存できませんでした。入力内容を保持しています。');
    showWriteError('質問の状態を保存できませんでした');
    if (lastState) render(lastState);
  } finally {
    commonQuestionInFlight.delete(key);
    if (lastState) render(lastState);
  }
}

function instructionErrorText(code) {
  if (code === 'instruction_target_unverified' || code === 'instruction_dispatch_unavailable') return '実行先の状態を確認できません。入力は保持しています。';
  if (code === 'instruction_scope_mismatch' || code === 'instruction_launch_unavailable') return '対象の実行が変わりました。最新の状態を確認してください。';
  if (code === 'instruction_idempotency_conflict' || code === 'instruction_attempt_conflict') return '保存内容が既存の指示と一致しません。内容を変更して保存し直してください。';
  return '保存できませんでした。入力内容を保持しています。';
}

async function instructionResponse(response) {
  const result = await response.json().catch(() => ({}));
  if (!response.ok) throw Object.assign(new Error('instruction request failed'), { code: result.error || `http_${response.status}` });
  return result;
}

async function runInstructionCreate(form) {
  const sessionId = form.dataset.instructionSession;
  const draft = instructionDraftFor(sessionId);
  if (!draft.deliveryAttemptId || !draft.logicalMessageId) Object.assign(draft, instructionIds());
  const reservationKey = draft.deliveryAttemptId;
  const existingPreview = instructionPreviewSavePending.get(reservationKey);
  if (existingPreview?.phase === 'pending') {
    await runInstructionPreviewSaveRetry(reservationKey);
    return;
  }
  if (existingPreview?.phase === 'requesting') return;
  const target = instructionTargetFor(lastState, draft.targetLaunchRef);
  if (!target || !instructionTargetMode(target, draft.mode) || !draft.text.trim() || instructionInFlight.has(sessionId)) return;
  const key = sessionId;
  const previewText = draft.text;
  if (!reserveInstructionPreviewSave(reservationKey, previewText)) {
    instructionErrors.set(key, '本文の保存確認は 64 件までです。確認待ちを先に整理してください。入力内容は保持しています。');
    if (lastState) render(lastState);
    return;
  }
  instructionInFlight.add(key);
  instructionErrors.delete(key);
  for (const control of form.elements) control.disabled = true;
  const body = {
    session_id: target.sessionId,
    execution_id: target.executionId,
    launch_ref: target.launchRef,
    delivery_attempt_id: reservationKey,
    logical_message_id: draft.logicalMessageId,
    revision: 0,
    text: previewText,
    mode: draft.mode,
    expected_turn_id: draft.mode === 'steer' ? target.nativeTurnId : null,
  };
  try {
    const result = await instructionResponse(await postUiAction('/api/instructions/create', body));
    const instruction = result?.instruction;
    if (!['created', 'existing'].includes(result?.outcome) || instruction?.deliveryAttemptId !== body.delivery_attempt_id ||
        instruction.launchRef !== body.launch_ref || instruction.mode !== body.mode || instruction.revision !== body.revision) {
      throw Object.assign(new Error('instruction_response_mismatch'), { code: 'instruction_response_mismatch' });
    }
    const pendingId = completeInstructionPreviewSave(reservationKey, instruction, previewText);
    if (!pendingId) throw Object.assign(new Error('instruction_response_mismatch'), { code: 'instruction_response_mismatch' });
    if (draft.deliveryAttemptId === body.delivery_attempt_id) {
      draft.deliveryAttemptId = null;
      draft.logicalMessageId = null;
    }
    if (draft.text === previewText) draft.text = '';
    if (!retryInstructionPreviewSave(pendingId)) {
      const message = 'サーバーへの保存は確認済みですが、このタブへの本文保存が未完了です。';
      instructionErrors.set('preview:' + pendingId, message);
      instructionNotices.set(key, message);
      liveStatus.textContent = message;
      try { await refresh(); } catch {}
      if (lastState) render(lastState);
      return;
    }
    instructionNotices.set(key, result.outcome === 'existing' ? '同じ指示はすでに保存されています。送信は別操作です。' : '指示を保存しました。送信は別操作です。');
    await refresh();
    if (lastState) render(lastState);
    liveStatus.textContent = '指示を保存しました。送信はまだ開始していません。';
  } catch (error) {
    releaseInstructionPreviewSave(reservationKey);
    instructionErrors.set(key, instructionErrorText(error.code));
    showWriteError('指示を保存できませんでした');
    await refresh();
    if (lastState) render(lastState);
  } finally {
    instructionInFlight.delete(key);
    if (lastState) render(lastState);
  }
}

async function runInstructionAction(button) {
  const id = button.dataset.instructionId;
  const action = button.dataset.instructionAction;
  const sessionId = button.dataset.instructionSession;
  const key = id;
  const instruction = (lastState?.sessions || []).flatMap((session) => session.instructions || [])
    .find((item) => item.deliveryAttemptId === id);
  if (!validScopedInstructionId(id) || instructionInFlight.has(key) ||
      (action === 'send' && !instructionPreviewFor(instruction))) return;
  instructionInFlight.add(key);
  button.disabled = true;
  instructionErrors.delete(`action:${key}`);
  try {
    const response = await postUiAction(`/api/instructions/${encodeURIComponent(id)}/${action}`, {
      session_id: sessionId,
      execution_id: button.dataset.instructionExecution,
    });
    const result = await instructionResponse(response);
    const notice = action === 'cancel'
      ? result.instruction.state === 'cancelled_before_send' ? '送信前に取り下げました。' : '取消要求を記録しました。送信済みの内容は戻せません。'
      : result.instruction.state === 'unknown' ? '送信結果が不明です。自動再送しません。'
        : result.instruction.state === 'accepted' ? '受付済みです。入力への反映は未確認です。'
          : '送信を開始しました。状態を確認しています。';
    instructionNotices.set(sessionId, notice);
    liveStatus.textContent = notice;
    await refresh();
    if (lastState) render(lastState);
  } catch (error) {
    instructionErrors.set(`action:${key}`, instructionErrorText(error.code));
    showWriteError('指示の状態を更新できませんでした');
    await refresh();
    if (lastState) render(lastState);
  } finally {
    instructionInFlight.delete(key);
    if (lastState) render(lastState);
  }
}

function validScopedInstructionId(value) {
  return typeof value === 'string' && value.length > 0 && value.length <= 512 && value === value.trim();
}

function instructionAlternativeResultMatches(result, request, target) {
  const instruction = result?.instruction;
  return ['created', 'existing', 'superseded'].includes(result?.outcome) && instruction &&
    instruction.deliveryAttemptId === request.newDeliveryAttemptId &&
    instruction.logicalMessageId === request.logicalMessageId && instruction.revision === request.revision &&
    instruction.launchRef === request.launchRef && instruction.sessionId === request.sessionId &&
    instruction.executionId === request.executionId && instruction.origin === 'standalone' &&
    instruction.mode === 'next-user-input' && ['available', 'claimed'].includes(instruction.state) &&
    Number.isSafeInteger(instruction.createdAt) && sameInstructionIdentity(instruction.identity, target?.identity);
}

async function runInstructionAlternative(formOrId) {
  const oldId = typeof formOrId === 'string' ? formOrId : formOrId?.dataset.instructionAlternativeForm;
  const form = typeof formOrId === 'string' ? null : formOrId;
  const draft = instructionAlternatives.get(oldId);
  if (!draft || instructionAlternativeInFlight.has(oldId)) return;
  let request = draft.pendingRequest;
  if (!request) {
    const instruction = findInstructionRecord(lastState, oldId);
    if (!instruction || !draft.text.trim() || instruction.ownerSessionId !== form?.dataset.instructionSession ||
        instruction.registrationExecutionId !== form?.dataset.instructionExecution) return;
    const textBytes = instructionTextByteLength(draft.text);
    if (textBytes === null || textBytes > MAX_INSTRUCTION_TEXT_BYTES) {
      instructionErrors.set('alternative:' + oldId, '指示は UTF-8 で 64 KiB 以下、正しい文字列で入力してください。内容は入力欄に保持しています。');
      if (lastState) render(lastState);
      return;
    }
    const pendingCount = [...instructionAlternatives.values()].filter((item) => item?.pendingRequest).length;
    if (pendingCount >= MAX_PENDING_INSTRUCTION_ALTERNATIVES) {
      instructionErrors.set('alternative:' + oldId, '保存結果の確認待ちは 64 件までです。先に確認待ちの要求を整理してください。本文は入力欄に保持しています。');
      if (lastState) render(lastState);
      return;
    }
    if (!draft.deliveryAttemptId) draft.deliveryAttemptId = instructionIds().deliveryAttemptId;
    request = normalizeInstructionAlternativeRequest(oldId, {
      oldDeliveryAttemptId: oldId,
      launchRef: instruction.launchRef,
      sessionId: instruction.ownerSessionId,
      executionId: instruction.executionId,
      newDeliveryAttemptId: draft.deliveryAttemptId,
      registrationExecutionId: instruction.registrationExecutionId,
      logicalMessageId: instruction.logicalMessageId,
      revision: instruction.revision + 1,
      text: draft.text,
      mode: 'next-user-input',
      expectedTurnId: null,
      createdAt: Date.now(),
    });
    if (!request) {
      instructionErrors.set('alternative:' + oldId, '指示の保存要求を作れません。入力内容を確認してください。');
      if (lastState) render(lastState);
      return;
    }
    draft.pendingRequest = request;
    if (!persistInstructionAlternativeRequests()) {
      delete draft.pendingRequest;
      instructionErrors.set('alternative:' + oldId, 'このタブに要求内容を保存できないため、送信を開始しませんでした。');
      if (lastState) render(lastState);
      return;
    }
  }
  const retryState = instructionAlternativeRetryState(lastState, request);
  if (!retryState.allowed) {
    instructionErrors.set('alternative:' + oldId, retryState.reason || '対象を確認できません。');
    if (lastState) render(lastState);
    return;
  }
  instructionAlternativeInFlight.add(oldId);
  instructionErrors.delete('alternative:' + oldId);
  if (form) for (const control of form.elements) control.disabled = true;
  try {
    const result = await instructionResponse(await postUiAction(`/api/instructions/${encodeURIComponent(oldId)}/alternative`, {
      session_id: request.sessionId,
      execution_id: request.registrationExecutionId,
      new_delivery_attempt_id: request.newDeliveryAttemptId,
      logical_message_id: request.logicalMessageId,
      revision: request.revision,
      text: request.text,
      mode: request.mode,
      expected_turn_id: request.expectedTurnId,
    }));
    if (!instructionAlternativeResultMatches(result, request, retryState.target)) {
      throw Object.assign(new Error('instruction_response_mismatch'), { code: 'instruction_response_mismatch' });
    }
    if (!rememberInstructionPreview(result.instruction, request.text)) {
      throw Object.assign(new Error('instruction_preview_persistence_failed'), { code: 'instruction_preview_persistence_failed' });
    }
    instructionAlternatives.delete(oldId);
    instructionAlternativeDiscardConfirmations.delete(oldId);
    if (!persistInstructionAlternativeRequests()) {
      instructionAlternatives.set(oldId, draft);
      throw Object.assign(new Error('instruction_local_request_retained'), { code: 'instruction_local_request_retained' });
    }
    draft.pendingRequest = null;
    instructionNotices.set(request.sessionId, '差し替えた指示を保存しました。送信は別操作です。');
    liveStatus.textContent = '差し替えた指示を保存しました。送信は別操作です。';
    await refresh();
    if (lastState) render(lastState);
  } catch (error) {
    const message = error.code === 'instruction_response_mismatch'
      ? '保存応答の対象が一致しないため、内容を保持しています。'
      : error.code === 'instruction_preview_persistence_failed'
        ? 'サーバーへの保存は確認済みですが、このタブへの本文保存が未完了です。固定した内容を保持しています。'
      : error.code === 'instruction_local_request_retained'
        ? '保存結果は確認できましたが、このタブの復旧情報を更新できません。内容を保持しています。'
        : instructionErrorText(error.code);
    instructionErrors.set('alternative:' + oldId, message);
    if (error.code !== 'instruction_preview_persistence_failed') showWriteError('差し替えた指示を保存できませんでした');
    await refresh();
    if (lastState) render(lastState);
  } finally {
    instructionAlternativeInFlight.delete(oldId);
    if (lastState) render(lastState);
  }
}

async function runLateInstruction(button) {
  const key = 'late:' + button.dataset.lateQuestionId + ':' + button.dataset.lateIndex + ':' + button.dataset.lateDigest;
  const existingPreview = pendingInstructionPreviewForLateKey(key);
  if (existingPreview?.pending.phase === 'pending') {
    await runInstructionPreviewSaveRetry(existingPreview.id);
    return;
  }
  if (existingPreview || instructionInFlight.has(key)) return;
  if (instructionPreviewSavePending.size >= MAX_PENDING_INSTRUCTION_PREVIEWS) {
    instructionErrors.set(key, '本文の保存確認は 64 件までです。確認待ちを先に整理してください。質問の配送状態は変わっていません。');
    if (lastState) render(lastState);
    return;
  }
  const question = (lastState?.sessions || []).flatMap((session) => (session.commonQuestions || []).map((item) => ({
    ...item, sessionId: session.session_id,
  }))).find((item) => item.internalQuestionId === button.dataset.lateQuestionId);
  const ref = question?.lateAnswerRefs?.find((item) => item.index === Number(button.dataset.lateIndex) &&
    item.digest === button.dataset.lateDigest);
  const submittedDraft = question ? commonQuestionSubmittedDrafts.get(commonQuestionKey(question)) : null;
  const digest = question && submittedDraft ? await lateAnswerDigest(question, submittedDraft) : null;
  const previewText = question && submittedDraft ? formatLateAnswerPreview(question, submittedDraft) : null;
  if (!ref || !submittedDraft || digest !== ref.digest || !previewText) {
    instructionErrors.set(key, 'このタブで保存した回答内容を確認できないため、後続の指示を作成できません。質問の配送状態は変わっていません。');
    liveStatus.textContent = '回答内容を確認できないため、後続の指示を作成できません。';
    if (lastState) render(lastState);
    return;
  }
  const reservationKey = 'late-preview:' + key;
  if (!reserveInstructionPreviewSave(reservationKey, previewText, key)) {
    instructionErrors.set(key, '本文の保存確認は 64 件までです。確認待ちを先に整理してください。質問の配送状態は変わっていません。');
    if (lastState) render(lastState);
    return;
  }
  instructionInFlight.add(key);
  button.disabled = true;
  try {
    const result = await instructionResponse(await postUiAction(
      `/api/decisions/${encodeURIComponent(button.dataset.lateQuestionId)}/late-instruction`, {
        session_id: button.dataset.sessionId,
        execution_id: button.dataset.instructionExecution,
        index: Number(button.dataset.lateIndex),
        digest: button.dataset.lateDigest,
        mode: button.dataset.lateMode,
        expected_turn_id: button.dataset.lateExpectedTurn || null,
      }));
    const instruction = result?.instruction;
    if (!['created', 'existing'].includes(result?.outcome) || instruction?.mode !== button.dataset.lateMode) {
      throw Object.assign(new Error('instruction_response_mismatch'), { code: 'instruction_response_mismatch' });
    }
    const pendingId = completeInstructionPreviewSave(reservationKey, instruction, previewText, key);
    if (!pendingId) throw Object.assign(new Error('instruction_response_mismatch'), { code: 'instruction_response_mismatch' });
    if (!retryInstructionPreviewSave(pendingId)) {
      const message = 'サーバーへの保存は確認済みですが、このタブへの本文保存が未完了です。';
      instructionErrors.set(key, message);
      instructionErrors.set('preview:' + pendingId, message);
      liveStatus.textContent = message;
      try { await refresh(); } catch {}
      if (lastState) render(lastState);
      return;
    }
    instructionNotices.set(button.dataset.sessionId, result.outcome === 'existing'
      ? 'この保存済み回答から作った指示はすでにあります。送信は別操作です。'
      : '後続の指示を保存しました。送信は別操作です。');
    liveStatus.textContent = instructionNotices.get(button.dataset.sessionId);
    await refresh();
    if (lastState) render(lastState);
  } catch (error) {
    releaseInstructionPreviewSave(reservationKey);
    instructionErrors.set(key, instructionErrorText(error.code));
    showWriteError('後続の指示を保存できませんでした');
    await refresh();
    if (lastState) render(lastState);
  } finally {
    instructionInFlight.delete(key);
    if (lastState) render(lastState);
  }
}

async function sendCloseAction(button, url, body, errorMessage, taskCloseKey = null) {
  button.disabled = true;
  try {
    const response = await postUiAction(url, body);
    if (response.status === 404 || response.status === 409) {
      await refresh();
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    await refresh();
    liveStatus.textContent = '状態を更新しました。';
  } catch {
    liveStatus.textContent = errorMessage;
    showWriteError(errorMessage);
  } finally {
    if (taskCloseKey) {
      taskCloseActionsInFlight.delete(taskCloseKey);
      if (lastState) render(lastState);
    }
    if (button.isConnected) button.disabled = false;
  }
}

async function runCloseAction(button, url, body, errorMessage) {
  if (url === '/api/closed-tasks') {
    const key = button.dataset.closeTask;
    if (!key) return;
    const pending = { timeout: null };
    pending.timeout = setTimeout(() => {
      if (pendingTaskCloseActions.get(key) !== pending) return;
      pendingTaskCloseActions.delete(key);
      taskCloseActionsInFlight.add(key);
      if (lastState) render(lastState);
      void sendCloseAction(button, url, body, errorMessage, key);
    }, 5_000);
    pendingTaskCloseActions.set(key, pending);
    if (lastState) render(lastState);
    return;
  }
  await sendCloseAction(button, url, body, errorMessage);
}

function cancelTaskClose(button) {

  if (!pending) return;

  pendingTaskCloseActions.delete(key);

}

function findPullRequestMergeTarget(key) {
  if (!/^[a-f0-9]{64}$/i.test(key)) return null;
  const find = (items) => {
    for (const pullRequest of items || []) {
      if (pullRequest.mergeRecordKey === key && pullRequest.mergeSessionId && Number.isSafeInteger(pullRequest.number)) return pullRequest;
      const nested = find(pullRequest.children);
      if (nested) return nested;
    }
    return null;
  };
  for (const group of lastState?.pullRequests || []) {
    const pullRequest = find(group.trees);
    if (pullRequest) return { group, pullRequest, number: pullRequest.number };
  }
  return null;
}

async function runPullRequestAction({ button, key, inFlight, messages, startedMessage, request, onSuccess, successMessage }) {
  if (inFlight.has(key)) return;
  inFlight.add(key);
  messages.delete(key);
  button.disabled = true;
  liveStatus.textContent = startedMessage;
  if (lastState) render(lastState);
  try {
    const response = await request();
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      const message = result.error || 'PR の状態が変わりました。表示を確認してください。';
      recordPullRequestTransientMessage(messages, key, message);
      await refresh();
      if (lastState) render(lastState);
      liveStatus.textContent = message;
      return;
    }
    await onSuccess(result);
    messages.delete(key);
    await refresh();
    liveStatus.textContent = successMessage(result);
  } catch {
    const message = '操作結果を取得できませんでした。PR の状態を取り直してください。';
    recordPullRequestTransientMessage(messages, key, message);
    if (lastState) render(lastState);
    liveStatus.textContent = message;
  } finally {
    inFlight.delete(key);
    if (lastState) render(lastState);
  }
}

async function runPullRequestMergeAction(button) {
  const key = button.dataset.mergeGo;
  const target = findPullRequestMergeTarget(key || '');
  if (!target) return;
  const { group, pullRequest, number } = target;
  const options = pullRequestMergeOptionsFor(group, pullRequest);
  const body = {
    number,
    registration_key: pullRequest.mergeRecordKey,
    headRefOid: pullRequest.headRefOid,
    method: options.method,
    deleteBranch: options.deleteBranch,
  };
  return runPullRequestAction({
    button,
    key,
    inFlight: pullRequestMergeInFlight,
    messages: pullRequestMergeMessages,
    startedMessage: `PR #${number} の状態を確認してマージしています。`,
    request: () => postUiAction('/api/pull-requests/merge', body),
    onSuccess: (result) => {
      pullRequestMergeConfirmations.delete(key);
      if (result.queued === true) queuedPullRequestMerges.set(key, { headRefOid: pullRequest.headRefOid || '' });
      if (result.merged === true) {
        const retargetedNumbers = pullRequest.children.map((child) => child.number);
        rememberPullRequestMergeResult(group, {
          number,
          method: options.method,
          branchDeleted: result.branchDeleted === true,
          isCrossRepository: pullRequest.isCrossRepository === true,
          retargetedBase: retargetedNumbers.length ? group.defaultBranch : null,
          retargetedNumbers,
          warning: result.warning || null,
        });
      }
    },
    successMessage: (result) => {
      if (result.queued === true) return `PR #${number} をマージキューに追加しました。`;
      return `PR #${number} をマージしました。`;
    },
  });
}

async function runPullRequestReservationAction(input, reserve) {
  const key = input.dataset.reservationToggle;
  const target = findPullRequestMergeTarget(key || '');
  if (!target) return;
  const { group, pullRequest, number } = target;
  const options = pullRequestMergeOptionsFor(group, pullRequest);
  const operation = reserve ? 'reserve' : 'cancel-reservation';
  const body = { number, registration_key: pullRequest.mergeRecordKey };
  if (reserve) Object.assign(body, {
    headRefOid: pullRequest.headRefOid,
    method: options.method,
    deleteBranch: options.deleteBranch,
  });
  pullRequestReservationPending.set(key, reserve);
  try {
    return await runPullRequestAction({
      button: input,
      key,
      inFlight: pullRequestMergeInFlight,
      messages: pullRequestMergeMessages,
      startedMessage: reserve
        ? `PR #${number} のレビュー収束後マージを予約しています。`
        : `PR #${number} のマージ予約を取り消しています。`,
      request: () => postUiAction(`/api/pull-requests/${operation}`, body),
      // 予約の口でのマージは常駐サーバーが自動マージの結果として記録して配るので、画面の記録には足さない。
      onSuccess: (result) => {
        pullRequestMergeConfirmations.delete(key);
        if (result.queued === true) queuedPullRequestMerges.set(key, { headRefOid: pullRequest.headRefOid || '' });
      },
      successMessage: (result) => {
        if (result.queued === true) return `PR #${number} をマージキューに追加しました。`;
        if (result.merged === true) return `PR #${number} をマージしました。`;
        if (result.cancelled === true) return result.message || `PR #${number} のマージ予約を取り消しました。`;
        return reserve
          ? `PR #${number} のレビュー収束後マージを予約しました。`
          : `PR #${number} のマージ予約を取り消しました。`;
      },
    });
  } finally {
    pullRequestReservationPending.delete(key);
    if (lastState) render(lastState);
  }
}
