<!doctype html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="cockpit-secret" content="">
<title>Agent Cockpit</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --border: #dfe2e8;
  --text: #1d2129;
  --text-2: #5b6372;
  --accent: #3b5bdb;
  --accent-soft: #e7ecff;
  --warn: #b35c00;
  --warn-soft: #fff1df;
  --danger: #c92a2a;
  --danger-soft: #ffe8e8;
  --ok: #2b8a3e;
  --ok-soft: #e3f6e8;
  --hold: #6741d9;
  --hold-soft: #efe9ff;
  --on-accent: #ffffff;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
    --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
    --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
    --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1a1a18; --surface: #252523; --surface-2: #2f2f2c; --border: #3c3c37;
  --text: #faf9f5; --text-2: #b7b5a9; --accent: #d97757; --accent-soft: #452c22;
  --warn: #e3b341; --warn-soft: #3d3220; --danger: #ec6a5e; --danger-soft: #45231f;
  --ok: #8cc391; --ok-soft: #233526; --hold: #b4a5e3; --hold-soft: #332e45;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 "Yu Gothic UI", "Meiryo", system-ui, sans-serif; }
.top { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--border); }
.top[data-away="true"] { background: var(--warn-soft); border-bottom-color: var(--warn); }
.top-inner { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
h1 { font-size: 16px; margin: 0; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 999px; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.chip strong { color: var(--text); font-size: 13px; margin-left: 4px; }
.chip.danger { background: var(--danger-soft); border-color: transparent; color: var(--danger); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.meta { color: var(--text-2); font-size: 12px; }
.spacer { flex: 1; }
.connection { color: var(--text-2); font-size: 12px; }
.connection[data-state="error"] { color: var(--danger); }
.settings-button, .settings-dialog button, .settings-dialog select { min-height: 36px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font: inherit; }
/* 上部のバーが折り返しても右上の端に留めるため、バーの右の余白に置く。 */
.top-inner { position: relative; padding-right: 64px; }
.settings-button { position: absolute; top: 10px; right: 16px; display: inline-flex; align-items: center; justify-content: center; width: 40px; min-height: 40px; padding: 0; cursor: pointer; color: var(--text-2); }
.settings-button:hover { color: var(--text); }
.ended-toggle { margin-top: 6px; min-height: 32px; padding: 2px 10px; border: 1px dashed var(--border); border-radius: 6px; background: transparent; color: var(--text-2); font: inherit; font-size: 12px; cursor: pointer; }
.ended-toggle:hover { color: var(--text); }
.ended-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.away-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); cursor: pointer; white-space: nowrap; }
.away-toggle input { width: 18px; height: 18px; margin: 0; accent-color: var(--warn); }
.away-toggle:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.settings-button:focus-visible, .settings-dialog button:focus-visible, .settings-dialog select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.settings-dialog { width: min(480px, calc(100vw - 32px)); max-width: calc(100vw - 32px); padding: 18px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font: inherit; }
.settings-dialog::backdrop { background: rgb(0 0 0 / 55%); }
.settings-dialog h2 { margin: 0; font-size: 18px; }
.settings-dialog section { margin-top: 16px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); }
.settings-dialog h3 { margin: 0 0 10px; font-size: 14px; }
.settings-theme-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
.settings-theme-row label { color: var(--text-2); }
.settings-dialog select { max-width: 100%; padding: 4px 8px; }
.settings-actions { display: flex; justify-content: flex-end; margin-top: 16px; }
.settings-dialog button { padding: 4px 12px; cursor: pointer; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.intro { color: var(--text-2); font-size: 12px; margin: 0 0 12px; }
.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
.section-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.section-head h2 { font-size: 15px; margin: 0; }
.section-body { padding: 10px 14px 14px; }
.product-key { font-family: ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11px; white-space: nowrap; background: var(--surface-2); color: var(--text-2); }
.badge.busy { background: var(--accent-soft); color: var(--accent); }
.badge.wait { background: var(--warn-soft); color: var(--warn); }
.badge.permission { background: var(--danger-soft); color: var(--danger); }
.badge.done { background: var(--ok-soft); color: var(--ok); }
.badge.unknown { background: var(--surface-2); color: var(--text-2); border: 1px dashed var(--border); }
h3.sub { font-size: 13px; color: var(--text-2); margin: 14px 0 6px; }
.now-list, .agent-list, .permission-list { display: grid; gap: 6px; }
.now-row, .agent-row { display: grid; grid-template-columns: minmax(130px, 180px) minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.who { color: var(--text-2); font-size: 12px; }
.who strong { color: var(--text); display: block; font-size: 13px; font-weight: 600; }
.detail { overflow-wrap: anywhere; }
.since { color: var(--text-2); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.agent-extra { display: flex; gap: 5px 8px; flex-wrap: wrap; margin-top: 3px; }
.model { display: inline-flex; gap: 5px; align-items: baseline; padding: 1px 8px; border-radius: 6px; background: var(--ok-soft); font-size: 12px; }
.model i { color: var(--text-2); font-size: 11px; font-style: normal; }
.permission { border: 1px solid var(--border); border-left: 4px solid var(--danger); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); }
.permission.long-wait { background: var(--danger-soft); }
.permission-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.permission-head strong { font-weight: 600; }
.empty { color: var(--text-2); font-size: 13px; padding: 10px; }
.error-box { border: 1px solid var(--danger); border-radius: var(--radius); padding: 12px 14px; color: var(--danger); background: var(--danger-soft); }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
@media (max-width: 650px) {
  .top-inner { gap: 8px; }
  main { padding: 12px; }
  .now-row, .agent-row { grid-template-columns: 1fr auto; gap: 2px 10px; }
  .now-row .detail, .agent-row .detail { grid-column: 1 / -1; grid-row: 2; }
  .now-row .since, .agent-row .since { grid-column: 2; grid-row: 1; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <h1>Agent Cockpit</h1>
    <div class="summary" id="summary" aria-label="セッションの概要"></div>
    <span class="spacer"></span>
    <span class="connection" id="connection" role="status" aria-live="polite" data-state="loading">状態を読み込み中</span>
    <label class="away-toggle" for="away-toggle"><input id="away-toggle" type="checkbox">離席中</label>
    <button class="settings-button" id="settings-button" type="button" aria-haspopup="dialog" aria-label="設定" title="設定"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
</header>
<dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
  <h2 id="settings-title">設定</h2>
  <section aria-labelledby="settings-display-title">
    <h3 id="settings-display-title">表示</h3>
    <div class="settings-theme-row">
      <label for="settings-theme-select">配色</label>
      <select id="settings-theme-select" name="theme">
        <option value="light">ライト</option>
        <option value="dark">ダーク</option>
        <option value="system">OS に従う</option>
      </select>
    </div>
  </section>
  <div class="settings-actions"><button id="settings-close" type="button" autofocus>閉じる</button></div>
</dialog>
<main>
  <p class="intro">Claude Code のセッション、実行中のツール、サブエージェント、許可待ちを表示します。</p>
  <div id="live-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="root" aria-live="off"><div class="section"><div class="empty">状態を読み込んでいます。</div></div></div>
</main>
<script>
'use strict';

const POLL_INTERVAL_MS = 2000;
const WAIT_REFRESH_INTERVAL_MS = 60_000;
const LONG_WAIT_MS = 15 * 60_000;
const summary = document.getElementById('summary');
const root = document.getElementById('root');
const connection = document.getElementById('connection');
const liveStatus = document.getElementById('live-status');
const themeSelect = document.getElementById('settings-theme-select');
const settingsButton = document.getElementById('settings-button');
const awayToggle = document.getElementById('away-toggle');
const header = document.querySelector('header.top');
const settingsDialog = document.getElementById('settings-dialog');
const settingsClose = document.getElementById('settings-close');
const THEME_STORAGE_KEY = 'agent-cockpit.theme';
let lastVersion = null;
let lastState = null;
let hasRenderedState = false;
// 切り替えの失敗は、この時間だけ接続の表示に残してから通常の表示へ戻す。
const AWAY_ERROR_DISPLAY_MS = 10000;
let awayErrorUntil = 0;
const expandedEndedSessions = new Set();

function applyTheme(theme) {
  const selectedTheme = ['light', 'dark', 'system'].includes(theme) ? theme : 'dark';
  if (selectedTheme === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = selectedTheme;
  themeSelect.value = selectedTheme;
  return selectedTheme;
}

function storedTheme() {
  try {
    const theme = localStorage.getItem(THEME_STORAGE_KEY);
    if (['light', 'dark', 'system'].includes(theme)) return theme;
  } catch {
  }
  return 'dark';
}

applyTheme(storedTheme());
themeSelect.addEventListener('change', () => {
  const theme = applyTheme(themeSelect.value);
  try {
    localStorage.setItem(THEME_STORAGE_KEY, theme);
  } catch {
  }
});

settingsButton.addEventListener('click', () => settingsDialog.showModal());
settingsClose.addEventListener('click', () => settingsDialog.close());
settingsDialog.addEventListener('click', (event) => {
  // 内側の余白を押しても target はダイアログ自身になるので、位置で背景かを判定する。
  const box = settingsDialog.getBoundingClientRect();
  const isOutside = event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom;
  if (event.target === settingsDialog && isOutside) settingsDialog.close();
});
settingsDialog.addEventListener('close', () => settingsButton.focus());

function applyAwayState(away) {
  const enabled = away?.enabled === true;
  if (!awayToggle.disabled) awayToggle.checked = enabled;
  header.dataset.away = String(enabled);
}

awayToggle.addEventListener('change', async () => {
  const requested = awayToggle.checked;
  const previous = lastState?.away?.enabled === true;
  awayToggle.disabled = true;
  try {
    const response = await fetch('/api/away', {
      method: 'POST',
      cache: 'no-store',
      headers: {
        'Content-Type': 'application/json',
        'X-Cockpit-Secret': document.querySelector('meta[name="cockpit-secret"]').content,
      },
      body: JSON.stringify({ enabled: requested }),
    });
    // 常駐サーバーが再起動すると秘密値が変わるので、読み込み直して新しい値を受け取る。
    if (response.status === 401) {
      location.reload();
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const away = await response.json();
    applyAwayState(away);
    awayErrorUntil = 0;
    connection.textContent = '接続中';
    connection.dataset.state = 'ready';
  } catch {
    awayToggle.checked = previous;
    applyAwayState({ enabled: previous });
    awayErrorUntil = Date.now() + AWAY_ERROR_DISPLAY_MS;
    connection.textContent = '離席中を切り替えられませんでした';
    connection.dataset.state = 'error';
  } finally {
    awayToggle.disabled = false;
  }
});

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function badge(text, className = '') {
  return element('span', `badge ${className}`.trim(), text);
}

function durationLabel(startedAt, now = Date.now()) {
  const start = Date.parse(startedAt);
  if (!Number.isFinite(start)) return '時刻不明';
  const minutes = Math.max(0, Math.floor((now - start) / 60_000));
  if (minutes < 1) return '1 分未満';
  if (minutes < 60) return `${minutes} 分`;
  const hours = Math.floor(minutes / 60);
  const remainder = minutes % 60;
  return remainder ? `${hours} 時間 ${remainder} 分` : `${hours} 時間`;
}

function toolDetail(toolName, summary) {
  if (!summary || summary === toolName) return toolName || summary;
  return toolName ? `${toolName}: ${summary}` : summary;
}

function updateTitle(sessions) {
  const permissionCount = sessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  document.title = permissionCount ? `(${permissionCount}) Agent Cockpit` : 'Agent Cockpit';
}

function renderSummary(sessions) {
  const permissionCount = sessions.reduce((total, session) => total + session.permissionWaits.length, 0);
  const activeCount = sessions.filter((session) => session.status === '作業中').length;
  const waitingCount = sessions.filter((session) => session.status.startsWith('待機中')).length;
  const items = [
    ['セッション', sessions.length, ''],
    ['作業中', activeCount, 'ok'],
    ['待機中', waitingCount, 'warn'],
    ['許可待ち', permissionCount, 'danger'],
  ];
  summary.replaceChildren(...items.map(([label, count, color]) => {
    const chip = element('span', `chip ${color}`.trim());
    chip.append(document.createTextNode(`${label} `), element('strong', '', String(count)));
    return chip;
  }));
}

function makeSessionHeader(session) {
  const header = element('div', 'section-head');
  const productName = session.product?.name || 'プロダクト不明';
  header.append(element('h2', '', productName));
  if (session.product?.key) header.append(element('code', 'meta product-key', session.product.key));
  const statusTone = { '許可待ち': 'permission', '作業中': 'busy', '不明': 'unknown' }[session.status] || 'wait';
  header.append(badge(session.status === '不明' ? '状態不明' : session.status, statusTone));
  return header;
}

function appendTools(body, session) {
  const heading = element('h3', 'sub', '今やっていること');
  body.append(heading);
  if (!session.tools.length) {
    body.append(element('div', 'empty', '実行中のツールはありません。'));
    return;
  }
  const list = element('div', 'now-list');
  for (const tool of newestFirst(session.tools)) {
    const row = element('div', 'now-row');
    const who = element('div', 'who');
    who.append(element('strong', '', tool.agent_id ? `サブエージェント ${tool.agent_id}` : 'メインセッション'));
    row.append(who, element('div', 'detail', toolDetail(tool.tool_name, tool.summary)), element('time', 'since', durationLabel(tool.startedAt)));
    list.append(row);
  }
  body.append(list);
}

function appendAgents(body, session) {
  body.append(element('h3', 'sub', 'サブエージェント'));
  if (!session.agents.length) {
    body.append(element('div', 'empty', 'サブエージェントはありません。'));
    return;
  }
  const agents = newestFirst(session.agents);
  const runningAgents = agents.filter((agent) => !isEndedAgent(agent));
  const endedAgents = agents.filter(isEndedAgent);
  const showEnded = expandedEndedSessions.has(session.session_id);
  const visibleAgents = showEnded ? [...runningAgents, ...endedAgents] : runningAgents;
  if (!visibleAgents.length) body.append(element('div', 'empty', '稼働中のサブエージェントはありません。'));
  const list = element('div', 'agent-list');
  for (const agent of visibleAgents) {
    const row = element('div', 'agent-row');
    const who = element('div', 'who');
    who.append(element('strong', '', agent.agent_type || agent.agent_id));
    const agentState = agent.active ? ['稼働中', 'busy'] : agent.unconfirmed ? ['終了未確認', 'wait'] : ['終了', 'done'];
    who.append(badge(agentState[0], agentState[1]));
    const detail = element('div', 'detail', agent.lastTool ? toolDetail(agent.lastTool.tool_name, agent.lastTool.summary) : 'ツール実行情報はありません。');
    const extra = element('div', 'agent-extra');
    if (agent.model) {
      const model = element('span', 'model');
      model.append(document.createTextNode(agent.model));
      if (agent.effort) model.append(element('i', '', agent.effort));
      extra.append(model);
    }
    if (agent.source) extra.append(element('span', 'meta', `取得元: ${agent.source}`));
    detail.append(extra);
    row.append(who, detail, element('time', 'since', agent.startedAt ? durationLabel(agent.startedAt) : ''));
    list.append(row);
  }
  if (visibleAgents.length) body.append(list);
  if (endedAgents.length) {
    const toggle = element('button', 'ended-toggle', showEnded ? `終了済みを隠す(${endedAgents.length} 件)` : `終了済みを表示(${endedAgents.length} 件)`);
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', String(showEnded));
    toggle.addEventListener('click', () => {
      if (showEnded) expandedEndedSessions.delete(session.session_id);
      else expandedEndedSessions.add(session.session_id);
      if (lastState) render(lastState);
      root.querySelector(`[data-ended-toggle="${CSS.escape(session.session_id)}"]`)?.focus();
    });
    toggle.dataset.endedToggle = session.session_id;
    body.append(toggle);
  }
}

// 「終了未確認」はまだ動いている可能性があるので、終了済みに含めない。
function isEndedAgent(agent) {
  return !agent.active && !agent.unconfirmed;
}

function newestFirst(items) {
  const startedAtOf = (item) => {
    const time = Date.parse(item.startedAt);
    return Number.isFinite(time) ? time : -Infinity;
  };
  return [...items].sort((a, b) => startedAtOf(b) - startedAtOf(a));
}

function appendPermissionWaits(body, session) {
  body.append(element('h3', 'sub', `許可待ち ${session.permissionWaits.length}`));
  if (!session.permissionWaits.length) {
    body.append(element('div', 'empty', '許可待ちはありません。'));
    return;
  }
  const list = element('div', 'permission-list');
  for (const wait of newestFirst(session.permissionWaits)) {
    const age = Date.now() - Date.parse(wait.startedAt);
    const card = element('article', `permission ${age > LONG_WAIT_MS ? 'long-wait' : ''}`.trim());
    const header = element('div', 'permission-head');
    header.append(element('strong', '', wait.agent_id ? `${wait.agent_id} が許可を待っています` : 'メインセッションが許可を待っています'));
    header.append(badge('許可待ち', 'permission'));
    header.append(element('time', 'since', durationLabel(wait.startedAt)));
    card.append(header);
    if (wait.tool_name || wait.summary) card.append(element('div', 'detail', toolDetail(wait.tool_name, wait.summary)));
    if (wait.message) card.append(element('div', 'meta', wait.message));
    list.append(card);
  }
  body.append(list);
}

function render(state) {
  const sessions = Array.isArray(state.sessions) ? state.sessions : [];
  renderSummary(sessions);
  updateTitle(sessions);
  if (!sessions.length) {
    root.replaceChildren(element('section', 'section empty', '表示するセッションがありません。Claude Code でセッションを開始すると、ここに表示されます。'));
    return;
  }

  const cards = sessions.map((session) => {
    const card = element('section', 'section');
    card.append(makeSessionHeader(session));
    const body = element('div', 'section-body');
    body.append(element('div', 'meta', session.title || session.session_id));
    appendPermissionWaits(body, session);
    appendTools(body, session);
    appendAgents(body, session);
    card.append(body);
    return card;
  });
  root.replaceChildren(...cards);
}

async function refresh() {
  try {
    const response = await fetch('/api/state', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const state = await response.json();
    lastState = state;
    applyAwayState(state.away);
    if (state.version !== lastVersion) {
      render(state);
      lastVersion = state.version;
      hasRenderedState = true;
      const permissions = state.sessions.reduce((total, session) => total + session.permissionWaits.length, 0);
      liveStatus.textContent = `状態を更新しました。セッション ${state.sessions.length} 件、許可待ち ${permissions} 件。`;
    }
    if (Date.now() >= awayErrorUntil) {
      if (connection.textContent !== '接続中') connection.textContent = '接続中';
      connection.dataset.state = 'ready';
    }
  } catch {
    if (Date.now() >= awayErrorUntil) {
      if (connection.textContent !== 'サーバーに接続できません') connection.textContent = 'サーバーに接続できません';
      connection.dataset.state = 'error';
    }
    if (!hasRenderedState) root.replaceChildren(element('div', 'error-box', '状態を取得できません。常駐サーバーが起動しているか確認してください。'));
  }
}

refresh();
setInterval(refresh, POLL_INTERVAL_MS);
setInterval(() => { if (lastState) render(lastState); }, WAIT_REFRESH_INTERVAL_MS);
</script>
</body>
</html>
