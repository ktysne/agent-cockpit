  const choiceValue = picks.some((labels) => labels.length) ? 'pick' : null;
  const next = { ...current, choice: choiceValue, picks };
  answerDrafts.set(key, next);
  // 選択肢は回答欄の外(質問の区画)にあるので、判断事項のカードから回答欄を引く。
  const card = pick.closest('.decision-card')?.querySelector('.decision-answer');
  if (!card) return;
  clearAnswerErrorWhenDraftChanges(key, current, next, card);
  updateAnswerSubmit(card);
});

document.addEventListener('input', (event) => {
  const note = event.target.closest('[data-answer-note]');
  if (!note) return;
  const key = answerDraftKey(note.dataset.sessionId, note.dataset.decisionId);
  if (decisionAnswerInFlight.has(key)) {
    if (lastState) render(lastState);
    return;
  }
  const decision = findDecision(note.dataset.sessionId, note.dataset.decisionId);
  const current = decision ? answerDraftFor(decision, { session_id: note.dataset.sessionId }) : { choice: null, note: '' };
  const next = { ...current, note: note.value };
  answerDrafts.set(key, next);
  const card = note.closest('.decision-answer');
  clearAnswerErrorWhenDraftChanges(key, current, next, card);
  updateAnswerSubmit(card);
});

document.addEventListener('compositionstart', (event) => {
  if (event.target.matches?.('[data-answer-note]')) answerNoteComposing = true;
}, true);

document.addEventListener('compositionend', (event) => {
  if (!event.target.matches?.('[data-answer-note]')) return;
  answerNoteComposing = false;
  renderDeferredState();
}, true);

async function sendCloseAction(button, url, body, errorMessage, taskCloseKey = null) {
  button.disabled = true;
  try {
    const response = await postUiAction(url, body);
    if (response.status === 404 || response.status === 409) {
      await refresh();
      return;
    }
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    await refresh();
    liveStatus.textContent = '状態を更新しました。';
  } catch {
    liveStatus.textContent = errorMessage;
    showWriteError(errorMessage);
  } finally {
    if (taskCloseKey) {
      taskCloseActionsInFlight.delete(taskCloseKey);
      if (lastState) render(lastState);
    }
    if (button.isConnected) button.disabled = false;
  }
}

async function runCloseAction(button, url, body, errorMessage) {
  if (url === '/api/closed-tasks') {
    const key = button.dataset.closeTask;
    if (!key) return;
    const pending = { timeout: null };
    pending.timeout = setTimeout(() => {
      if (pendingTaskCloseActions.get(key) !== pending) return;
      pendingTaskCloseActions.delete(key);
      taskCloseActionsInFlight.add(key);
      if (lastState) render(lastState);
      void sendCloseAction(button, url, body, errorMessage, key);
    }, 5_000);
    pendingTaskCloseActions.set(key, pending);
    if (lastState) render(lastState);
    return;
  }
  await sendCloseAction(button, url, body, errorMessage);
}

function cancelTaskClose(button) {
  const key = button.dataset.cancelCloseTask;
  const pending = pendingTaskCloseActions.get(key);
  if (!pending) return;
  clearTimeout(pending.timeout);
  pendingTaskCloseActions.delete(key);
  if (lastState) render(lastState);
}

function closeTaskButton(button) {
  const key = button.dataset.closeTask || '';
  const separator = key.indexOf('::');
  if (separator < 1) return;
  void runCloseAction(button, '/api/closed-tasks', {
    session_id: key.slice(0, separator),
    title: key.slice(separator + 2),
  }, 'タスクを完了にできませんでした');
}

async function markProductSeen(button) {
  const productKey = button.dataset.seen;
  button.disabled = true;
  try {
    const response = await postUiAction('/api/seen', { productKey, generatedAt: lastState?.generatedAt });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    await refresh();
    liveStatus.textContent = '前回見てからの項目を既読にしました。';
  } catch {
    liveStatus.textContent = '項目を既読にできませんでした';
    showWriteError('項目を既読にできませんでした');
  } finally {
    if (button.isConnected) button.disabled = false;
  }
}

function closeAgentButton(button) {
  const key = button.dataset.closeAgent || '';
  const separator = key.indexOf('::');
  if (separator < 1) return;
  void runCloseAction(button, '/api/closed-agents', {
    session_id: key.slice(0, separator),
    agent_id: key.slice(separator + 2),
  }, 'サブエージェントを終了にできませんでした');
}

function findPullRequestMergeTarget(key) {
  if (!/^[a-f0-9]{64}$/i.test(key)) return null;
  const find = (items) => {
    for (const pullRequest of items || []) {
      if (pullRequest.mergeRecordKey === key && pullRequest.mergeSessionId && Number.isSafeInteger(pullRequest.number)) return pullRequest;
      const nested = find(pullRequest.children);
      if (nested) return nested;
    }
    return null;
  };
  for (const group of lastState?.pullRequests || []) {
    const pullRequest = find(group.trees);
    if (pullRequest) return { group, pullRequest, number: pullRequest.number };
  }
  return null;
}

async function runPullRequestAction({ button, key, inFlight, messages, startedMessage, request, onSuccess, successMessage }) {
  if (inFlight.has(key)) return;
  inFlight.add(key);
  messages.delete(key);
  button.disabled = true;
  liveStatus.textContent = startedMessage;
  if (lastState) render(lastState);
  try {
    const response = await request();
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      const message = result.error || 'PR の状態が変わりました。表示を確認してください。';
      recordPullRequestTransientMessage(messages, key, message);
      await refresh();
      if (lastState) render(lastState);
      liveStatus.textContent = message;
      return;
    }
    await onSuccess(result);
    messages.delete(key);
    await refresh();
    liveStatus.textContent = successMessage(result);
  } catch {
    const message = '操作結果を取得できませんでした。PR の状態を取り直してください。';
    recordPullRequestTransientMessage(messages, key, message);
    if (lastState) render(lastState);
    liveStatus.textContent = message;
  } finally {
    inFlight.delete(key);
    if (lastState) render(lastState);
  }
}

async function runPullRequestMergeAction(button) {
  const key = button.dataset.mergeGo;
  const target = findPullRequestMergeTarget(key || '');
  if (!target) return;
  const { group, pullRequest, number } = target;
  const options = pullRequestMergeOptionsFor(group, pullRequest);
  const body = {
    number,
    registration_key: pullRequest.mergeRecordKey,
    headRefOid: pullRequest.headRefOid,
    method: options.method,
    deleteBranch: options.deleteBranch,
  };
  return runPullRequestAction({
    button,
    key,
    inFlight: pullRequestMergeInFlight,
    messages: pullRequestMergeMessages,
    startedMessage: `PR #${number} の状態を確認してマージしています。`,
    request: () => postUiAction('/api/pull-requests/merge', body),
    onSuccess: (result) => {
      pullRequestMergeConfirmations.delete(key);
      if (result.queued === true) queuedPullRequestMerges.set(key, { headRefOid: pullRequest.headRefOid || '' });
      if (result.merged === true) {
        const retargetedNumbers = pullRequest.children.map((child) => child.number);
        rememberPullRequestMergeResult(group, {
          number,
          method: options.method,
          branchDeleted: result.branchDeleted === true,
          isCrossRepository: pullRequest.isCrossRepository === true,
          retargetedBase: retargetedNumbers.length ? group.defaultBranch : null,
          retargetedNumbers,
          warning: result.warning || null,
        });
      }
    },
    successMessage: (result) => {
      if (result.queued === true) return `PR #${number} をマージキューに追加しました。`;
      return `PR #${number} をマージしました。`;
    },
  });
}

async function runPullRequestReservationAction(input, reserve) {
  const key = input.dataset.reservationToggle;
  const target = findPullRequestMergeTarget(key || '');
  if (!target) return;
  const { group, pullRequest, number } = target;
  const options = pullRequestMergeOptionsFor(group, pullRequest);
  const operation = reserve ? 'reserve' : 'cancel-reservation';
  const body = { number, registration_key: pullRequest.mergeRecordKey };
  if (reserve) Object.assign(body, {
    headRefOid: pullRequest.headRefOid,
    method: options.method,
    deleteBranch: options.deleteBranch,
  });
  pullRequestReservationPending.set(key, reserve);
  try {
    return await runPullRequestAction({
      button: input,
      key,
      inFlight: pullRequestMergeInFlight,
      messages: pullRequestMergeMessages,
      startedMessage: reserve
        ? `PR #${number} のレビュー収束後マージを予約しています。`
        : `PR #${number} のマージ予約を取り消しています。`,
      request: () => postUiAction(`/api/pull-requests/${operation}`, body),
      // 予約の口でのマージは常駐サーバーが自動マージの結果として記録して配るので、画面の記録には足さない。
      onSuccess: (result) => {
        pullRequestMergeConfirmations.delete(key);
        if (result.queued === true) queuedPullRequestMerges.set(key, { headRefOid: pullRequest.headRefOid || '' });
      },
      successMessage: (result) => {
        if (result.queued === true) return `PR #${number} をマージキューに追加しました。`;
        if (result.merged === true) return `PR #${number} をマージしました。`;
        if (result.cancelled === true) return result.message || `PR #${number} のマージ予約を取り消しました。`;
        return reserve
          ? `PR #${number} のレビュー収束後マージを予約しました。`
          : `PR #${number} のマージ予約を取り消しました。`;
      },
    });
  } finally {
    pullRequestReservationPending.delete(key);
    if (lastState) render(lastState);
  }
}

async function closeAutomaticPullRequestMergeResult(button) {
  const owner = button.dataset.owner || '';
  const repo = button.dataset.repo || '';
  const number = Number(button.dataset.number);
  const key = `${owner}/${repo}#${number}`.toLowerCase();
  if (!owner || !repo || !Number.isSafeInteger(number) || number < 1 || pullRequestMergeResultCloseInFlight.has(key)) return;
  pullRequestMergeResultCloseInFlight.add(key);
  button.disabled = true;
  try {
    const response = await postUiAction('/api/pull-requests/merge-result/close', { owner, repo, number });
    if (!response.ok) {
      showWriteError('マージ結果を閉じられませんでした');
      return;
    }
    await refresh();
    liveStatus.textContent = `PR #${number} のマージ結果を閉じました。`;
  } catch {
    showWriteError('マージ結果を閉じられませんでした');
  } finally {
    pullRequestMergeResultCloseInFlight.delete(key);
    if (lastState) render(lastState);
  }
}

async function runCrossReviewSkipAction(button) {
  const key = button.dataset.mergeKey || '';
  const target = findPullRequestMergeTarget(key);
  if (!target || pullRequestReviewSkipInFlight.has(key)) return;
  const action = button.dataset.reviewSkip;
  if (!['set', 'clear'].includes(action)) return;
  const { pullRequest, number } = target;
  const focusTarget = { key, action };
  pullRequestReviewSkipInFlight.add(key);
  button.disabled = true;
  liveStatus.textContent = action === 'set' ? `PR #${number} のレビュー不要を記録しています。` : `PR #${number} のレビュー不要を取り消しています。`;
  if (lastState) render(lastState);
  try {
    const response = await postUiAction('/api/pull-requests/review-skip', {
      action,
      registration_key: key,
      headRefOid: pullRequest.headRefOid,
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) {
      await refresh();
      liveStatus.textContent = result.error || 'PR の状態が変わりました。表示を確認してください。';
      return;
    }
    await refresh();
    liveStatus.textContent = action === 'set' ? `PR #${number} をレビュー不要として記録しました。` : `PR #${number} のレビュー不要を取り消しました。`;
  } catch {
    showWriteError('レビュー不要の記録を保存できませんでした');
    liveStatus.textContent = 'レビュー不要の記録を保存できませんでした。';
  } finally {
    const active = document.activeElement;
    const shouldRestoreFocus = active === document.body ||
      (active?.dataset?.mergeKey === focusTarget.key && ['set', 'clear'].includes(active.dataset.reviewSkip));
    pullRequestReviewSkipInFlight.delete(key);
    if (lastState) render(lastState);
    if (shouldRestoreFocus) {
      const buttons = [...document.querySelectorAll('button')];
      const focusButton = buttons.find((item) => item.dataset.mergeKey === focusTarget.key && item.dataset.reviewSkip === focusTarget.action) ||
        buttons.find((item) => item.dataset.mergeKey === focusTarget.key && ['set', 'clear'].includes(item.dataset.reviewSkip));
      focusButton?.focus({ preventScroll: true });
    }
  }
}

function findPullRequestConflictTarget(key) {
  const find = (group, items) => {
    for (const pullRequest of items || []) {
      if (pullRequestConflictUiKey(group, pullRequest) === key) return { group, pullRequest };
      const nested = find(group, pullRequest.children);
      if (nested) return nested;
    }
    return null;
  };
  for (const group of lastState?.pullRequests || []) {
    const target = find(group, group.trees);
    if (target) return target;
  }
  return null;
}

async function runPullRequestConflictRequest(button) {
  const uiKey = button.dataset.conflictGo;
  const target = findPullRequestConflictTarget(uiKey || '');
  if (!target) return;
  const { pullRequest } = target;
  if (!pullRequest.conflictRequestKey || !pullRequest.conflict) return;

  const recipients = pullRequestConflictTargetNames(pullRequest, true);
  if (!recipients.length) return;
  return runPullRequestAction({
    button,
    key: uiKey,
    inFlight: pullRequestConflictInFlight,
    messages: pullRequestConflictMessages,
    startedMessage: `PR #${pullRequest.number} の衝突の解消を依頼しています。`,
    request: () => postUiAction('/api/pull-requests/conflict-request', {
      key: pullRequest.conflictRequestKey,
      headRefOid: pullRequest.headRefOid,
    }),
    onSuccess: () => {
      pullRequestConflictConfirmations.delete(uiKey);
    },
    successMessage: () => `PR #${pullRequest.number} の衝突の解消を依頼しました。`,
  });
}

async function runSessionAction(button, url, body, errorMessage, focusExcludedNote = false, undoInfo = null) {
  button.disabled = true;
  try {
    const requests = ['hide', 'unhide'].includes(body.action) && Array.isArray(body.session_ids)
      ? Array.from({ length: Math.ceil(body.session_ids.length / 50) }, (_, index) => ({
        action: body.action, session_ids: body.session_ids.slice(index * 50, (index + 1) * 50),
      }))
      : [body];
    let actionSucceeded = false;
    for (const requestBody of requests) {
      const response = await postUiAction(url, requestBody);
      // 押した直後にイベントが届いて状態が分かった場合は、失敗と出さずに表示を取り直す。
      if (response.status === 404 || response.status === 409) continue;
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      actionSucceeded = true;
    }
    if (actionSucceeded && body.action === 'hide') hiddenSessionsUndo = undoInfo;
    if (actionSucceeded && ['clear', 'unhide'].includes(body.action)) hiddenSessionsUndo = null;
    await refresh();
    if (!actionSucceeded) return;
    if (focusExcludedNote) {
      (document.querySelector('[data-undo-hidden-sessions]') || document.querySelector('[data-clear-hidden-sessions]'))
        ?.focus({ preventScroll: true });
    }
    else if (button.dataset.estimateSession) {
      [...document.querySelectorAll('[data-estimate-session]')]
        .find((item) => item.dataset.estimateSession === button.dataset.estimateSession)
        ?.focus({ preventScroll: true });
    } else if (body.action === 'clear') {
      (root.querySelector('[data-estimate-session]') || root.querySelector('button'))?.focus({ preventScroll: true });
    } else if (body.action === 'unhide') {
      (document.querySelector('[data-clear-hidden-sessions]') || root.querySelector('.section h2'))
        ?.focus({ preventScroll: true });
    }
  } catch {
    liveStatus.textContent = errorMessage;
    showWriteError('セッションの操作に失敗しました');
  } finally {
    if (button.isConnected) button.disabled = false;
  }
}

document.addEventListener('click', (event) => {
  if (event.button === 0 && handleExternalLink(event)) return;
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.route) {
    void updateRouting(button);
    return;
  }
  if (button.dataset.seen) {
    void markProductSeen(button);
    return;
  }
  if (button.dataset.openMerge) {
    const key = button.dataset.openMerge;
    pullRequestMergeConfirmations.set(key, 'merge');
    pullRequestMergeMessages.delete(key);
    if (lastState) render(lastState);
    return;
  }
  if (button.dataset.conflictOpen) {
    const uiKey = button.dataset.conflictOpen;
    pullRequestConflictConfirmations.add(uiKey);
    pullRequestConflictMessages.delete(uiKey);
    if (lastState) render(lastState);
    return;
  }
  if (button.dataset.conflictCancel) {
    const uiKey = button.dataset.conflictCancel;
    if (pullRequestConflictInFlight.has(uiKey)) return;
    pullRequestConflictConfirmations.delete(uiKey);
    pullRequestConflictMessages.delete(uiKey);
    if (lastState) render(lastState);
    return;
  }
  if (button.dataset.conflictGo) {
    void runPullRequestConflictRequest(button);
    return;
  }
  if (button.dataset.reviewSkip) {
    void runCrossReviewSkipAction(button);
    return;
  }
  if (button.dataset.mergeCancel) {
    // 実行中に確認欄を閉じると、マージが続いているのに処理中の表示が消える。
    if (pullRequestMergeInFlight.has(button.dataset.mergeCancel)) return;
    pullRequestMergeConfirmations.delete(button.dataset.mergeCancel);
    pullRequestMergeMessages.delete(button.dataset.mergeCancel);
    if (lastState) render(lastState);
    return;
  }
  if (button.dataset.mergeGo) {
    void runPullRequestMergeAction(button);
    return;
  }
  if (button.dataset.queueLeft) {
    queuedPullRequestMerges.delete(button.dataset.queueLeft);
    if (lastState) render(lastState);
    return;
  }
  if (button.dataset.closeMergeResult) {
    if (button.dataset.closeAutomaticMergeResult) {
      void closeAutomaticPullRequestMergeResult(button);
      return;
    }
    removePullRequestMergeResult(button.dataset.closeMergeResult);
    if (lastState) render(lastState);
    return;
  }
  if (button.dataset.cancelCloseTask) {
    cancelTaskClose(button);
    return;
  }
  if (button.dataset.closeTask) {
    closeTaskButton(button);
    return;
  }
  if (button.dataset.closeAgent) {
    closeAgentButton(button);
    return;
  }
  if (button.dataset.sendAnswer) {
    void sendDecisionAnswer(button);
    return;
  }
  if (button.dataset.estimateSession) {
    void runSessionAction(
      button,
      `/api/sessions/${encodeURIComponent(button.dataset.estimateSession)}/estimate`,
      {},
      '状態を推定できませんでした',
    );
    return;
  }
  if (button.dataset.hideSession) {
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'hide', session_id: button.dataset.hideSession },
      'セッションを一覧から外せませんでした',
      true,
    );
    return;
  }
  if (button.dataset.clearHiddenSessions) {
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'clear' },
      '外したセッションを表示できませんでした',
    );
    return;
  }
  if (button.dataset.undoHiddenSessions) {
    if (!hiddenSessionsUndo) return;
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'unhide', session_ids: hiddenSessionsUndo.sessionIds },
      '外したセッションを戻せませんでした',
    );
    return;
  }
  if (button.dataset.filter) {
    toggleFilter(button.dataset.filter);
    return;
  }
  if (button.dataset.productAction === 'close') {
    const product = productGroups(lastState.sessions.filter((session) => (session.hidden !== true || isIdleHiddenSession(session))))
      .find((item) => item.key === button.dataset.productKey);
    if (!product) return;
    const sessionIds = product.sessions.filter((session) => session.hidden !== true).map((session) => session.session_id);
    if (!sessionIds.length) return;
    void runSessionAction(
      button,
      '/api/hidden-sessions',
      { action: 'hide', session_ids: sessionIds },
      'プロダクトのセッションを一覧から外せませんでした',
      true,
      { productName: product.name, sessionIds },
    );
    return;
  }
  if (button.dataset.productAction) {
    const key = button.dataset.productKey;
    let changedKey;
    let changedValue;
    if (button.dataset.productAction === 'collapse') {
      changedValue = displayPreferences.collapsed.includes(key)
        ? displayPreferences.collapsed.filter((item) => item !== key)
        : [...displayPreferences.collapsed, key];
      changedKey = 'collapsed';
    } else if (button.dataset.productAction === 'pin') {
      changedValue = displayPreferences.pinned.includes(key)
        ? displayPreferences.pinned.filter((item) => item !== key)
        : [...displayPreferences.pinned, key];
      changedKey = 'pinned';
    } else {
      const state = lastState || {};
      const sessions = (Array.isArray(state.sessions) ? state.sessions : []).filter((session) => (session.hidden !== true || isIdleHiddenSession(session)));
      const pullRequests = Array.isArray(state.pullRequests) ? state.pullRequests : [];
      const sinceSeen = visibleSinceSeen(state);
      const products = orderedProducts(sessions, pullRequests, sinceSeen);
      const index = products.findIndex((product) => product.key === key);
      if (index < 0) return;
      const pinnedCount = products.filter((product) => displayPreferences.pinned.includes(product.key)).length;
      const direction = Number(button.dataset.direction);
      const targetIndex = index + direction;
      const pinned = displayPreferences.pinned.includes(key);
      const canMove = pinned
        ? targetIndex >= 0 && targetIndex < pinnedCount
        : targetIndex >= pinnedCount && targetIndex < products.length;
      if (!canMove) return;
      const currentKey = products[index].key;
      const targetKey = products[targetIndex].key;
      changedValue = [...displayPreferences.order];
      const currentOrderIndex = changedValue.indexOf(currentKey);
      const targetOrderIndex = changedValue.indexOf(targetKey);
      [changedValue[currentOrderIndex], changedValue[targetOrderIndex]] =
        [changedValue[targetOrderIndex], changedValue[currentOrderIndex]];
      changedKey = 'order';
    }
    saveDisplayPreferences({ [changedKey]: changedValue });
    if (lastState) render(lastState);
  }
});

document.addEventListener('click', (event) => {
  const pick = event.target.closest('[data-answer-pick]');
  if (pick?.type === 'radio') clearSelectedAnswerPick(pick);
});

document.addEventListener('keydown', (event) => {
  if (event.key !== ' ' && event.code !== 'Space') return;
  const pick = event.target.closest('[data-answer-pick]');
  if (pick?.type === 'radio' && clearSelectedAnswerPick(pick)) event.preventDefault();
});

document.addEventListener('auxclick', (event) => {
  if (event.button === 1) handleExternalLink(event);
});

document.addEventListener('change', (event) => {
  const reservationToggle = event.target.closest('[data-reservation-toggle]');
  if (reservationToggle) {
    void runPullRequestReservationAction(reservationToggle, reservationToggle.checked);
    return;
  }
  const method = event.target.closest('[data-merge-method]');
  const deleteBranch = event.target.closest('[data-merge-delete]');
  const control = method || deleteBranch;
  if (!control) return;
  if (pullRequestMergeInFlight.has(control.dataset.mergeKey)) {
    if (lastState) render(lastState);
    return;
  }
  const target = findPullRequestMergeTarget(control.dataset.mergeKey || '');
  if (!target) return;
  const options = pullRequestMergeOptionsFor(target.group, target.pullRequest);
  if (method) options.method = method.dataset.mergeMethod;
  if (deleteBranch) options.deleteBranch = deleteBranch.checked;
  pullRequestMergeOptions.set(control.dataset.mergeKey, options);
  if (lastState) render(lastState);
});

function renderReloadNote(pending) {
  reloadNote.hidden = !pending;
  reloadNote.innerHTML = pending
    ? '<span>画面が新しくなりました。書きかけの回答を送るか消すと、読み込み直します。</span><button type="button" class="link-btn" data-reload-now>今すぐ読み込み直す</button>'
    : '';
}

// 下書きは送信の成功でしか消えないので、選んで戻したものや回答できなくなった判断事項のものは書きかけと数えない。
function hasUnsentAnswerDraft(state) {
  for (const [key, draft] of answerDrafts) {
    const [sessionId, decisionId] = key.split('\0');
    const session = state.sessions?.find((item) => item.session_id === sessionId);
    const decision = session?.decisions?.find((item) => item.id === decisionId);
    if (!decision || !decisionAnswerAvailability(decision).active) continue;
    if (answerDraftChanged(decision, draft, true)) return true;
  }
  return false;
}

function checkUiVersion(state) {
  if (!initialUiVersion || state.uiVersion == null) return false;
  if (state.uiVersion === initialUiVersion) {
    if (uiUpdatePending) renderReloadNote(false);
    uiUpdatePending = false;
    return false;
  }
  if (!hasUnsentAnswerDraft(state)) {
    location.reload();
    return true;
  }
  if (!uiUpdatePending) renderReloadNote(true);
  uiUpdatePending = true;
  return false;
}

function reloadNow(event) {
  if (event.target.closest('[data-reload-now]')) location.reload();
}

reloadNote.addEventListener('click', reloadNow);

async function refresh() {
  try {
    const response = await fetch('/api/state', { cache: 'no-store' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const state = await response.json();
    if (checkUiVersion(state)) return;
    await syncDisplayPreferences(state.display);
    lastStateAt = new Date();
    connectionLost = false;
    updateConnectionNote();
    lastState = state;
    const awayBefore = header.dataset.away;
    applyAwayState(state.away);
    // 離席の切り替えでは version が進まないので、「離席中のみ」の表示はここで描き直す。
    const sinceSeenVisibilityChanged = sinceSeenMode === 'away' && header.dataset.away !== awayBefore;
    const pullRequestExpiry = pullRequestExpirySignature(state.pullRequests);
    const pullRequestExpiryChanged = pullRequestExpiry !== renderedPullRequestExpirySignature;
    if (state.version === lastVersion && (sinceSeenVisibilityChanged || pullRequestExpiryChanged)) {
      render(state);
      renderedPullRequestExpirySignature = pullRequestExpiry;
    }
    if (state.version !== lastVersion) {
      render(state);
      renderedPullRequestExpirySignature = pullRequestExpiry;
      lastVersion = state.version;
      hasRenderedState = true;
      const visibleSessions = state.sessions.filter((session) => (session.hidden !== true || isIdleHiddenSession(session)));
      const judgmentCounts = countJudgments(visibleSessions);
      liveStatus.textContent = `状態を更新しました。セッション (${visibleSessions.length} 件)、許可待ち (${judgmentCounts.permission} 件)、判断待ち (${judgmentCounts.decisions} 件)。`;
    }
  } catch {
    connectionLost = true;
    updateConnectionNote();
    liveStatus.textContent = '常駐サーバーに接続できません。';
    if (!hasRenderedState) root.replaceChildren(element('div', 'error-box', '状態を取得できません。常駐サーバーが起動しているか確認してください。'));
  }
}

refresh();
setInterval(refresh, POLL_INTERVAL_MS);
setInterval(() => { if (lastState) render(lastState); }, WAIT_REFRESH_INTERVAL_MS);
</script>
